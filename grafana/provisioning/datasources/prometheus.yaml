# the Prometheus the dashboards read; its uid is what the dashboards'
# DS_PROMETHEUS variable resolves to when provisioned (docs/GRAFANA.md)
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
