# the seven AgentDiff dashboards, loaded from disk into one folder; a
# change to a JSON file is picked up within updateIntervalSeconds
apiVersion: 1

providers:
  - name: agentdiff
    orgId: 1
    folder: AgentDiff
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/agentdiff
      foldersFromFilesStructure: false
