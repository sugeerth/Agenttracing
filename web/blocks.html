<script>
/* AgentDiff blocks — the adjudicated diagnosis.
 *
 * One block that shows the report's competing explanations for what went
 * wrong, ranked as the engine ranked them. The verdict is quoted verbatim —
 * never paraphrased — and when no hypothesis clears the runner-up the block
 * says "contested" plainly instead of manufacturing a winner. Every
 * hypothesis stays visible whatever its fate: merged ones are muted and
 * labelled as part of the leading account, ruled-out ones are struck
 * through, untestable ones show no score rather than an invented one.
 *
 * Details on demand, following the actions block's pattern: each hypothesis
 * row is a button that opens its evidence — the exact spans and metrics the
 * engine scored it on, each with its basis label — and the discriminator:
 * the concrete check that would settle the question.
 */
(function (global) {
  "use strict";

  var AgentDiff = global.AgentDiff;
  if (!AgentDiff || typeof AgentDiff.block !== "function") return;

  // ------------------------------------------------------------------ style

  var STYLE_ID = "agentdiff-diagnosis-css";
  var styled = false;

  function ensureStyle() {
    if (styled) return;
    styled = true;
    try {
      if (document.getElementById(STYLE_ID)) return;
      var node = document.createElement("style");
      node.id = STYLE_ID;
      node.textContent = [
        ".dx-lede{font-size:12px;color:var(--ink-2);margin:0 0 10px;line-height:1.55}",
        ".dx-verdict{border:1px solid var(--rule);border-left:3px solid var(--accent);",
        "border-radius:7px;background:var(--surface-2);padding:8px 10px;margin:0 0 10px;",
        "font-size:13px;line-height:1.55;color:var(--ink)}",
        ".dx-verdict.contested{border-left-color:var(--warn)}",
        ".dx-verdict .k{display:block;font-size:11px;text-transform:uppercase;",
        "letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin-bottom:3px}",
        ".dx-decisive{border:1px solid var(--rule);border-left:3px solid var(--accent);",
        "border-radius:7px;background:var(--surface-2);padding:7px 10px;margin:0 0 10px;",
        "font-size:12.5px;line-height:1.5;color:var(--ink)}",
        ".dx-decisive .k{display:block;font-size:11px;text-transform:uppercase;",
        "letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin-bottom:3px}",
        ".dx-decisive b{color:var(--accent)}",
        ".dx-decisive .dx-crit{display:block;font-size:11px;color:var(--ink-3);",
        "margin-top:2px}",
        ".dx-decisive.abstain{border-left-style:dashed;border-left-color:var(--rule-2);",
        "color:var(--ink-2)}",
        ".dx-list{list-style:none;margin:0;padding:0}",
        ".dx-row{border-top:1px solid var(--rule)}",
        ".dx-row:first-child{border-top:none}",
        ".dx-head{display:flex;width:100%;gap:8px;align-items:baseline;background:none;",
        "border:0;padding:8px 0;cursor:pointer;text-align:left;font:inherit;color:inherit}",
        ".dx-head:hover .dx-statement{color:var(--accent)}",
        ".dx-badge{flex:none}",
        ".tag.dx-lead{color:var(--accent);font-weight:700;",
        "border-color:color-mix(in srgb, var(--accent) 55%, transparent)}",
        ".tag.dx-mute{color:var(--ink-3);border-color:var(--rule)}",
        ".dx-main{flex:1;min-width:0}",
        ".dx-kind{font-family:var(--mono);font-size:11px;color:var(--ink-3)}",
        ".dx-score{font-family:var(--mono);font-size:11px;color:var(--ink-2);",
        "font-variant-numeric:tabular-nums;flex:none}",
        ".dx-statement{display:block;font-size:12.5px;line-height:1.5;color:var(--ink)}",
        ".dx-part{font-size:11px;color:var(--ink-3);font-style:italic}",
        ".dx-row.dim .dx-statement{color:var(--ink-3)}",
        ".dx-row.struck .dx-statement{text-decoration:line-through;color:var(--ink-3)}",
        ".dx-caret{flex:none;color:var(--ink-3);font-size:11px;",
        "transition:transform .12s ease}",
        ".dx-row.open .dx-caret{transform:rotate(90deg)}",
        ".dx-body{display:none;padding:0 0 10px 8px}",
        ".dx-row.open .dx-body{display:block}",
        ".dx-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;",
        "color:var(--ink-3);font-weight:700;margin:6px 0 3px}",
        ".dx-ev{list-style:none;margin:0;padding:0}",
        ".dx-ev li{font-size:11.5px;line-height:1.55;color:var(--ink-2);",
        "padding:2px 0;word-break:break-word}",
        ".dx-quote{font-family:var(--mono);font-size:11px;background:var(--surface-2);",
        "border:1px solid var(--rule);border-radius:5px;padding:0 4px}",
        ".dx-path{font-family:var(--mono);font-size:11px}",
        ".dx-basis{display:inline-block;margin-left:6px;font-size:11px;",
        "text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--rule-2);",
        "border-radius:999px;padding:0 6px;color:var(--ink-3);vertical-align:1px}",
        ".dx-basis.soft{color:var(--warn);",
        "border-color:color-mix(in srgb, var(--warn) 45%, transparent)}",
        ".dx-settle{font-size:11.5px;line-height:1.55;color:var(--ink-2);margin:6px 0 0}",
        ".dx-settle b{color:var(--ink)}",
        ".dx-causal{border-top:1px solid var(--rule);margin-top:4px}",
        ".dx-causal-head{display:flex;width:100%;gap:8px;align-items:baseline;",
        "background:none;border:0;padding:8px 0;cursor:pointer;text-align:left;",
        "font:inherit;color:inherit}",
        ".dx-causal-title{flex:1;font-size:11px;text-transform:uppercase;",
        "letter-spacing:.06em;color:var(--ink-3);font-weight:700}",
        ".dx-causal-head:hover .dx-causal-title{color:var(--accent)}",
        ".dx-causal.open .dx-caret{transform:rotate(90deg)}",
        ".dx-causal-body{display:none;padding:0 0 10px 8px}",
        ".dx-causal.open .dx-causal-body{display:block}",
        ".dx-clist{list-style:none;margin:0;padding:0}",
        ".dx-clist li{padding:4px 0;border-top:1px solid var(--rule)}",
        ".dx-clist li:first-child{border-top:none}",
        ".dx-cstep{display:block;font-size:12px;line-height:1.5;color:var(--ink)}",
        ".dx-cstep .n{font-family:var(--mono);font-size:11px;color:var(--ink-2)}",
        ".dx-mech{display:block;font-size:11px;line-height:1.5;color:var(--ink-3);",
        "margin-top:1px;padding-left:8px;border-left:2px solid var(--rule-2)}",
        ".dx-mech.soft{font-style:italic;border-left-style:dashed}",
        ".dx-ceid{display:block;font-family:var(--mono);font-size:11px;",
        "color:var(--ink-3);margin-top:1px;padding-left:10px}",
        ".dx-tension{border:1px solid var(--rule);border-left:3px solid var(--warn);",
        "border-radius:7px;background:var(--surface-2);padding:7px 10px;margin:10px 0 0}",
        ".dx-tension .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;",
        "color:var(--warn);font-weight:700;margin-bottom:3px}",
        ".dx-tension ul{margin:0;padding-left:16px}",
        ".dx-tension li{font-size:11.5px;line-height:1.55;color:var(--ink-2)}",
        ".dx-conf{font-size:11.5px;color:var(--ink-3);line-height:1.5;",
        "border-top:1px solid var(--rule);margin-top:10px;padding-top:7px}",
      ].join("");
      document.head.appendChild(node);
    } catch (err) { /* styling is a nicety; the list still reads */ }
  }

  // ------------------------------------------------------------------ utils

  function diagnosisOf(report) {
    var diag = report && report.diagnosis;
    if (!diag || typeof diag !== "object") return null;
    if (!Array.isArray(diag.hypotheses) || !diag.hypotheses.length) return null;
    return diag;
  }

  function agentName(report, side) {
    var run = report && report[side];
    var agent = run && run.agent;
    if (agent && agent.name) return agent.name;
    return side ? String(side).toUpperCase() : "?";
  }

  function hasScore(hypothesis) {
    return typeof hypothesis.score === "number" && isFinite(hypothesis.score);
  }

  //: a term of art, wired to the shared glossary tooltip.
  function term(ctx, text, glossaryKey) {
    if (typeof ctx.explain === "function") {
      return ctx.explain(ctx.h("span", { text: text }), { term: glossaryKey });
    }
    return ctx.h("span", { text: text, "data-explain": glossaryKey });
  }

  /* Which visual register each status gets. The wording stays the data's
   * own (underscores aside); only the styling is ours. */
  var STATUS = {
    leading:    { tag: "dx-lead", row: "" },
    plausible:  { tag: "",        row: "" },
    weak:       { tag: "dx-mute", row: "dim" },
    merged:     { tag: "dx-mute", row: "dim" },
    ruled_out:  { tag: "dx-mute", row: "struck" },
    untestable: { tag: "dx-mute", row: "dim" },
  };

  //: open/closed per hypothesis, surviving re-renders within the session.
  var openRows = {};

  // --------------------------------------------------------------- evidence

  function evidenceIndex(diag) {
    var byId = {};
    (Array.isArray(diag.evidence) ? diag.evidence : []).forEach(function (item) {
      if (item && item.id) byId[item.id] = item;
    });
    return byId;
  }

  function basisTag(ctx, basis) {
    if (!basis) return null;
    var soft = basis === "estimated" || basis === "inferred";
    return ctx.h("span", {
      class: "dx-basis" + (soft ? " soft" : ""),
      text: String(basis),
      title: soft
        ? "This item is " + basis + ", not read directly from the trace"
        : "This item is " + basis + " in the trace",
    });
  }

  /* One evidence item, verbatim.
   *   span   → step N (agent) — 'quote'
   *   metric → path = value
   * An id the ledger does not carry is shown as the bare id — a gap in the
   * data is shown as a gap, never papered over. */
  function evidenceLine(ctx, report, item, eid) {
    if (!item) {
      return ctx.h("li", null, [ctx.h("span", { class: "dx-path", text: String(eid) }),
                                " (not in this report's evidence ledger)"]);
    }
    var kids = [];
    if (item.type === "span") {
      kids.push("step " + item.step + " (" + agentName(report, item.agent) + ") — ");
      kids.push(ctx.h("q", { class: "dx-quote", text: String(item.quote === undefined || item.quote === null ? "" : item.quote) }));
    } else if (item.type === "metric") {
      kids.push(ctx.h("span", { class: "dx-path", text: String(item.path) + " = " + String(item.value) }));
    } else {
      kids.push(ctx.h("span", { class: "dx-path", text: String(item.id || eid) }));
    }
    if (item.signal) kids.push(" · " + String(item.signal));
    kids.push(basisTag(ctx, item.basis));
    return ctx.h("li", null, kids);
  }

  function evidenceList(ctx, report, byId, ids) {
    var list = ctx.h("ul", { class: "dx-ev" });
    ids.forEach(function (eid) {
      list.appendChild(evidenceLine(ctx, report, byId[eid], eid));
    });
    return list;
  }

  // ------------------------------------------------------------------- rows

  function hypothesisRow(ctx, report, diag, byId, hypothesis, rowKey) {
    var status = String(hypothesis.status || "");
    var look = STATUS[status] || { tag: "", row: "" };
    var open = !!openRows[rowKey];

    var row = ctx.h("li", {
      class: "dx-row" + (look.row ? " " + look.row : "") + (open ? " open" : ""),
    });

    var badge = term(ctx, status.replace(/_/g, " "), "hypothesis-status");
    badge.className = "tag dx-badge" + (look.tag ? " " + look.tag : "");

    var main = ctx.h("div", { class: "dx-main" }, [
      ctx.h("span", {
        class: "dx-kind",
        text: String(hypothesis.kind || "") +
              (hypothesis.flag ? " (" + hypothesis.flag + ")" : ""),
      }),
      ctx.h("span", { class: "dx-statement" }, [
        String(hypothesis.statement || ""),
        status === "merged"
          ? ctx.h("span", { class: "dx-part", text: " — part of the leading account" })
          : null,
      ]),
    ]);

    var head = ctx.h("button", {
      class: "dx-head", type: "button",
      "aria-expanded": open ? "true" : "false",
      title: open ? "Collapse this hypothesis"
                  : "Expand: the evidence behind it, and how to settle it",
    }, [
      badge,
      main,
      ctx.h("span", {
        class: "dx-score",
        text: hasScore(hypothesis) ? ctx.fmt.num(hypothesis.score, 2) : "—",
        title: hasScore(hypothesis) ? "adjudication score" : "no score — not testable from this trace",
      }),
      ctx.h("span", { class: "dx-caret", text: "▸" }),
    ]);

    var body = ctx.h("div", { class: "dx-body" });
    var supports = Array.isArray(hypothesis.supports) ? hypothesis.supports : [];
    var contradicts = Array.isArray(hypothesis.contradicts) ? hypothesis.contradicts : [];
    if (supports.length) {
      body.appendChild(ctx.h("div", { class: "dx-h", text: "Supported by" }));
      body.appendChild(evidenceList(ctx, report, byId, supports));
    }
    if (contradicts.length) {
      body.appendChild(ctx.h("div", { class: "dx-h", text: "Contradicted by" }));
      body.appendChild(evidenceList(ctx, report, byId, contradicts));
    }
    if (!supports.length && !contradicts.length) {
      body.appendChild(ctx.h("div", {
        class: "dx-settle",
        text: "No evidence items scored for or against this hypothesis.",
      }));
    }
    if (hypothesis.discriminator) {
      var settle = ctx.h("p", { class: "dx-settle" });
      var label = term(ctx, "How to settle it", "discriminator");
      settle.appendChild(ctx.h("b", null, [label, ": "]));
      settle.appendChild(document.createTextNode(String(hypothesis.discriminator)));
      body.appendChild(settle);
    }

    head.addEventListener("click", function (event) {
      // A click on the status term is a glossary lookup, not a toggle.
      if (event.target && event.target.closest &&
          event.target.closest("[data-explain]")) return;
      openRows[rowKey] = !openRows[rowKey];
      row.classList.toggle("open", !!openRows[rowKey]);
      head.setAttribute("aria-expanded", openRows[rowKey] ? "true" : "false");
      head.setAttribute("title", openRows[rowKey]
        ? "Collapse this hypothesis"
        : "Expand: the evidence behind it, and how to settle it");
      ctx.signal("inspect");
    });

    row.appendChild(head);
    row.appendChild(body);
    return row;
  }

  // --------------------------------------------------- the decisive step

  /* The decisive-step call, right under the verdict. A null step is an
   * honest abstention with its reason, not a missing field — it gets a
   * distinct muted-but-visible register instead of being dropped. */
  function decisiveLine(ctx, decisive) {
    var hasStep = decisive.step !== null && decisive.step !== undefined;
    var criterion = decisive.criterion ? String(decisive.criterion) : "";
    var line = ctx.h("div", {
      class: "dx-decisive" + (hasStep ? "" : " abstain"),
      title: criterion || null,
    });
    line.appendChild(ctx.h("span", { class: "k", text: "Decisive step" }));
    if (hasStep) {
      line.appendChild(ctx.h("b", { text: "Step " + decisive.step }));
      if (decisive.basis) {
        line.appendChild(document.createTextNode(" — " + String(decisive.basis)));
      }
      if (criterion) {
        line.appendChild(ctx.h("span", { class: "dx-crit", text: criterion }));
      }
    } else {
      line.appendChild(document.createTextNode(
        "No decisive step: " + String(decisive.reason || "")));
    }
    return line;
  }

  // --------------------------------------------------- the causal account

  /* Is this link's mechanism merely positional — adjacency in the trace —
   * rather than a measured propagation? The wording stays the data's own;
   * only the visual register (italic, dashed accent) is ours. */
  function isPositionalMechanism(mechanism) {
    return /\b(adjacency|positional)\b/i.test(mechanism) &&
           mechanism.indexOf("measured") < 0;
  }

  //: one causal link, verbatim: "step N — happened", mechanism underneath.
  function causalRow(ctx, link) {
    var kids = [
      ctx.h("span", { class: "dx-cstep" }, [
        ctx.h("span", { class: "n", text: "step " + link.step }),
        " — " + String(link.happened || ""),
      ]),
    ];
    if (link.mechanism !== null && link.mechanism !== undefined) {
      var mechanism = String(link.mechanism);
      var soft = isPositionalMechanism(mechanism);
      kids.push(ctx.h("span", {
        class: "dx-mech" + (soft ? " soft" : ""),
        text: mechanism,
        title: soft
          ? "adjacency/positional link — not a measured propagation"
          : null,
      }));
    }
    var eids = Array.isArray(link.evidence) ? link.evidence : [];
    if (eids.length) {
      kids.push(ctx.h("span", { class: "dx-ceid", text: eids.join(" ") }));
    }
    return ctx.h("li", null, kids);
  }

  /* The step-by-step account of how the fault travelled, collapsible in the
   * block's details-on-demand pattern. Every string is the report's own. */
  function causalSection(ctx, account, sectionKey) {
    var open = !!openRows[sectionKey];
    var section = ctx.h("div", { class: "dx-causal" + (open ? " open" : "") });

    var head = ctx.h("button", {
      class: "dx-causal-head", type: "button",
      "aria-expanded": open ? "true" : "false",
      title: open ? "Collapse the causal account"
                  : "Expand: how the fault travelled, step by step",
    }, [
      ctx.h("span", {
        class: "dx-causal-title",
        text: "Causal account — " + account.length + " step" +
              (account.length === 1 ? "" : "s"),
      }),
      ctx.h("span", { class: "dx-caret", text: "▸" }),
    ]);
    head.addEventListener("click", function () {
      openRows[sectionKey] = !openRows[sectionKey];
      section.classList.toggle("open", !!openRows[sectionKey]);
      head.setAttribute("aria-expanded", openRows[sectionKey] ? "true" : "false");
      head.setAttribute("title", openRows[sectionKey]
        ? "Collapse the causal account"
        : "Expand: how the fault travelled, step by step");
      ctx.signal("inspect");
    });

    var body = ctx.h("div", { class: "dx-causal-body" }, [
      ctx.h("ol", { class: "dx-clist" }, account.map(function (link) {
        return causalRow(ctx, link);
      })),
    ]);

    section.appendChild(head);
    section.appendChild(body);
    return section;
  }

  // ============================================================ the block

  AgentDiff.block({
    id: "diagnosis",
    title: "Diagnosis",
    question: "Which explanation best fits the evidence — and what would settle it?",
    group: "outcome",
    size: "normal",

    relevance: function (ctx) {
      return diagnosisOf(ctx.report) ? 0.95 : 0;
    },

    render: function (el, ctx) {
      ensureStyle();
      var report = ctx.report;
      var diag = diagnosisOf(report);
      if (!diag) {
        return ctx.empty(el, "This report carries no adjudicated diagnosis.");
      }

      el.appendChild(ctx.h("p", {
        class: "dx-lede",
        text: "Competing explanations, ranked as the engine scored them " +
              "against this report's own evidence. Nothing below is " +
              "invented: the verdict is quoted verbatim, and every " +
              "hypothesis stays on the list whatever its fate. Click a row " +
              "for its evidence and the check that would settle it.",
      }));

      // 1. The verdict, verbatim — with a clearly marked contested state
      // when the scores refused to pick a single cause.
      var contested = (diag.leading === null || diag.leading === undefined) &&
                      diag.hypotheses.some(hasScore);
      var verdict = ctx.h("div", {
        class: "dx-verdict" + (contested ? " contested" : ""),
      });
      if (contested) {
        var kicker = ctx.h("span", { class: "k" });
        kicker.appendChild(term(ctx, "Contested — no single cause", "contested-diagnosis"));
        verdict.appendChild(kicker);
      } else {
        verdict.appendChild(ctx.h("span", { class: "k", text: "Verdict" }));
      }
      verdict.appendChild(document.createTextNode(String(diag.verdict || "")));
      el.appendChild(verdict);

      // 1b. The decisive step — the earliest correction expected to flip
      // the outcome, or the stated reason there is none.
      var decisive = diag.decisive_step;
      if (decisive && typeof decisive === "object") {
        el.appendChild(decisiveLine(ctx, decisive));
      }

      // 2. The hypotheses, in the order the report ranked them.
      var byId = evidenceIndex(diag);
      var taskKey = (report.task && report.task.id ? report.task.id : "?");
      var list = ctx.h("ol", { class: "dx-list" });
      diag.hypotheses.forEach(function (hypothesis, index) {
        var rowKey = taskKey + ":" + (hypothesis.id || index);
        list.appendChild(hypothesisRow(ctx, report, diag, byId, hypothesis, rowKey));
      });
      el.appendChild(list);

      // 2b. The causal account — how the fault travelled, step by step.
      var account = Array.isArray(diag.causal_account) ? diag.causal_account : [];
      if (account.length) {
        el.appendChild(causalSection(ctx, account, taskKey + ":causal-account"));
      }

      // 3. Cross-signal conflicts, stated plainly whoever wins.
      var tensions = Array.isArray(diag.contradictions) ? diag.contradictions : [];
      if (tensions.length) {
        el.appendChild(ctx.h("div", { class: "dx-tension" }, [
          ctx.h("div", { class: "k", text: "Evidence in tension" }),
          ctx.h("ul", null, tensions.map(function (line) {
            return ctx.h("li", { text: String(line) });
          })),
        ]));
      }

      // 4. Confidence — level and basis, in the report's own words.
      var confidence = diag.confidence || {};
      if (confidence.level || confidence.basis) {
        el.appendChild(ctx.h("div", {
          class: "dx-conf",
          text: "Confidence: " + String(confidence.level || "unstated") +
                (confidence.basis ? " — " + String(confidence.basis) : ""),
        }));
      }
    },
  });

})(typeof window !== "undefined" ? window : this);

</script>

<script>
/* AgentDiff blocks — cross-run diagnosis consolidation.
 *
 * One block over `aggregate.diagnosis_consolidated`, the engine's answer to
 * the question a single pair report cannot ask: does the diagnosis survive
 * repetition? A pair diagnosis is n=1 by construction; when the corpus holds
 * repeated runs, `deepcompare runs` diagnoses every failing run and asks
 * whether the same hypothesis leads each time — and it executes the
 * discriminating checks that are answerable offline (grader consistency,
 * environment reproduction, harness flake rate).
 *
 * The honesty rules match the engine's own: failure reproduction is always
 * shown with its denominator ("fails 2 of 3" is a flake, not a systematic
 * fault); the consolidated statement is quoted verbatim, never paraphrased;
 * a refuted hypothesis is struck through but stays on the page; and an
 * inconclusive check is a result — it stays visible rather than being
 * filtered down to only the checks that found something. Statuses follow
 * the vocabulary the engine enforces: scores can make a hypothesis leading,
 * but only an executed check can make it confirmed or refuted.
 */
(function (global) {
  "use strict";

  var AgentDiff = global.AgentDiff;
  if (!AgentDiff || typeof AgentDiff.block !== "function") return;

  // ------------------------------------------------------------------ style

  var STYLE_ID = "agentdiff-consolidated-css";
  var styled = false;

  function ensureStyle() {
    if (styled) return;
    styled = true;
    try {
      if (document.getElementById(STYLE_ID)) return;
      var node = document.createElement("style");
      node.id = STYLE_ID;
      node.textContent = [
        ".cx-lede{font-size:12px;color:var(--ink-2);margin:0 0 10px;line-height:1.55}",
        ".cx-narrative{border:1px solid var(--rule);border-left:3px solid var(--accent);",
        "border-radius:7px;background:var(--surface-2);padding:8px 10px;margin:0 0 10px;",
        "font-size:13px;line-height:1.55;color:var(--ink)}",
        ".cx-narrative .k{display:block;font-size:11px;text-transform:uppercase;",
        "letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin-bottom:3px}",
        ".cx-list{list-style:none;margin:0;padding:0}",
        ".cx-row{border-top:1px solid var(--rule)}",
        ".cx-row:first-child{border-top:none}",
        ".cx-head{display:flex;width:100%;gap:8px;align-items:baseline;background:none;",
        "border:0;padding:8px 0;cursor:pointer;text-align:left;font:inherit;color:inherit}",
        ".cx-head:hover .cx-statement{color:var(--accent)}",
        ".cx-main{flex:1;min-width:0}",
        ".cx-who{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-bottom:2px}",
        ".cx-task{font-family:var(--mono);font-size:11px;color:var(--ink-3)}",
        ".cx-agent{font-size:11.5px;font-weight:600;color:var(--ink)}",
        ".cx-kn{font-family:var(--mono);font-size:11px;color:var(--ink-2);",
        "font-variant-numeric:tabular-nums}",
        ".cx-statement{display:block;font-size:12.5px;line-height:1.5;color:var(--ink)}",
        // The status register: confirmed is the strongest accent (an executed
        // check settled it), reproducible strong, the shaky statuses warn-muted,
        // refuted struck through — visible, never deleted.
        ".tag.cx-confirmed{color:var(--accent);font-weight:700;",
        "background:color-mix(in srgb, var(--accent) 12%, transparent);",
        "border-color:var(--accent)}",
        ".tag.cx-reproducible{color:var(--accent);font-weight:700;",
        "border-color:color-mix(in srgb, var(--accent) 55%, transparent)}",
        ".tag.cx-shaky{color:var(--warn);",
        "border-color:color-mix(in srgb, var(--warn) 45%, transparent)}",
        ".tag.cx-refuted{color:var(--accent);text-decoration:line-through;",
        "border-color:color-mix(in srgb, var(--accent) 55%, transparent)}",
        ".cx-row.struck .cx-statement{text-decoration:line-through;color:var(--ink-3)}",
        ".cx-caret{flex:none;color:var(--ink-3);font-size:11px;",
        "transition:transform .12s ease}",
        ".cx-row.open .cx-caret{transform:rotate(90deg)}",
        ".cx-body{display:none;padding:0 0 10px 8px}",
        ".cx-row.open .cx-body{display:block}",
        ".cx-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;",
        "color:var(--ink-3);font-weight:700;margin:6px 0 3px}",
        ".cx-checks{list-style:none;margin:0;padding:0}",
        ".cx-checks li{font-size:11.5px;line-height:1.55;color:var(--ink-2);",
        "padding:3px 0;word-break:break-word}",
        ".cx-check-name{font-family:var(--mono);font-size:11px;color:var(--ink)}",
        ".cx-detail{display:block;margin-top:1px}",
        ".cx-runs{font-family:var(--mono);font-size:11px;color:var(--ink-3)}",
        ".cx-basisline{font-size:11px;color:var(--ink-3);font-style:italic;margin:4px 0 0}",
        ".cx-perrun{font-size:11.5px;line-height:1.55;color:var(--ink-2);margin:0;",
        "padding:0;list-style:none}",
        ".cx-perrun .r{font-family:var(--mono);font-size:11px}",
        ".cx-foot{font-size:11.5px;color:var(--ink-3);line-height:1.5;",
        "border-top:1px solid var(--rule);margin-top:10px;padding-top:7px}",
      ].join("");
      document.head.appendChild(node);
    } catch (err) { /* styling is a nicety; the list still reads */ }
  }

  // ------------------------------------------------------------------ utils

  function obj(v) { return v && typeof v === "object" && !Array.isArray(v) ? v : null; }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function str(v) { return typeof v === "string" && v ? v : ""; }

  /* The consolidation lives in the aggregate when the page was rendered by
   * `deepcompare runs`, and on the raw payload when a test page was
   * assembled by hand. `batch` and `compare` never write it, so absence is
   * the normal case and means the block hides. */
  function payloadOf(ctx) {
    var fromAggregate = obj(ctx && ctx.aggregate && ctx.aggregate.diagnosis_consolidated);
    if (fromAggregate) return fromAggregate;
    var raw = obj(global.DEEPCOMPARE_DATA);
    return raw ? obj(raw.diagnosis_consolidated) : null;
  }

  function entriesOf(payload) {
    return arr(payload && payload.per_task_agent).filter(obj);
  }

  function failingEntries(payload) {
    return entriesOf(payload).filter(function (e) { return (e.failures || 0) > 0; });
  }

  /* Which visual register each consolidated status gets. The wording stays
   * the data's own (underscores aside); only the styling is ours. */
  var STATUS = {
    confirmed:     { tag: "cx-confirmed",    row: "" },
    reproducible:  { tag: "cx-reproducible", row: "" },
    refuted:       { tag: "cx-refuted",      row: "struck" },
    unstable:      { tag: "cx-shaky",        row: "" },
    single_run:    { tag: "cx-shaky",        row: "" },
    all_contested: { tag: "cx-shaky",        row: "" },
  };

  /* Failure reproduction verdicts, from the engine's own vocabulary:
   * failing every run is a solid (bad) finding; failing some runs is a
   * flake and gets the caution color; a single run cannot say either. */
  var REPRO_TAG = {
    "reproducible": "bad",
    "flaky": "warn",
    "single run": "",
    "no failures": "good",
  };

  var OUTCOME_TAG = {
    confirms: "cx-confirmed",
    refutes: "bad",
    inconclusive: "",           // visible, just not loud — it is still a result
  };

  //: open/closed per (task, agent) row, surviving re-renders in the session.
  var openRows = {};

  function tag(ctx, cls, text) {
    return ctx.h("span", { class: cls ? "tag " + cls : "tag", text: text });
  }

  // ------------------------------------------------------------------- rows

  function checkLine(ctx, check) {
    var kids = [
      ctx.h("span", { class: "cx-check-name", text: str(check.check) || "check" }),
      " ",
      tag(ctx, OUTCOME_TAG[str(check.outcome)] || "", str(check.outcome) || "?"),
    ];
    if (str(check.hypothesis_kind)) {
      kids.push(" ");
      kids.push(ctx.h("span", { class: "cx-runs", text: "→ " + check.hypothesis_kind }));
    }
    // The detail is the executed check's own sentence — verbatim, because a
    // paraphrased measurement is no longer a measurement.
    kids.push(ctx.h("span", { class: "cx-detail", text: str(check.detail) }));
    var runs = arr(check.runs);
    if (runs.length) {
      kids.push(ctx.h("span", {
        class: "cx-runs",
        text: (str(check.basis) ? check.basis + " · " : "") + runs.join(", "),
      }));
    }
    return ctx.h("li", null, kids);
  }

  function entryRow(ctx, entry) {
    var consolidated = obj(entry.consolidated) || {};
    var status = str(consolidated.status);
    var look = STATUS[status] || { tag: "cx-shaky", row: "" };
    var repro = obj(entry.failure_reproduction) || {};
    var rowKey = str(entry.task) + ":" + str(entry.agent);
    var open = !!openRows[rowKey];

    var row = ctx.h("li", {
      class: "cx-row" + (look.row ? " " + look.row : "") + (open ? " open" : ""),
    });

    var main = ctx.h("div", { class: "cx-main" }, [
      ctx.h("div", { class: "cx-who" }, [
        ctx.h("span", { class: "cx-task", text: str(entry.task) }),
        ctx.h("span", { class: "cx-agent", text: str(entry.agent) }),
        ctx.h("span", {
          class: "cx-kn",
          text: "fails " + entry.failures + " of " + entry.runs + " runs",
          title: "failure reproduction: k of n, denominator always stated",
        }),
        str(repro.verdict)
          ? tag(ctx, REPRO_TAG[repro.verdict] !== undefined
              ? REPRO_TAG[repro.verdict] : "", repro.verdict)
          : null,
      ]),
      // The consolidated statement, in the engine's exact words.
      ctx.h("span", { class: "cx-statement", text: str(consolidated.statement) }),
    ]);

    var checks = arr(entry.checks_run).filter(obj);
    var head = ctx.h("button", {
      class: "cx-head", type: "button",
      "aria-expanded": open ? "true" : "false",
      title: open ? "Collapse this entry"
                  : "Expand: the executed checks and the per-run diagnoses",
    }, [
      status ? ctx.h("span", null, [
        (function () {
          var badge = tag(ctx, look.tag, status.replace(/_/g, " "));
          badge.classList.add("cx-badge");
          return badge;
        })(),
      ]) : null,
      main,
      ctx.h("span", { class: "cx-caret", text: "▸" }),
    ]);

    var body = ctx.h("div", { class: "cx-body" });

    var perRun = arr(entry.per_run).filter(obj);
    if (perRun.length) {
      body.appendChild(ctx.h("div", { class: "cx-h", text: "Per-run diagnoses" }));
      body.appendChild(ctx.h("ul", { class: "cx-perrun" }, perRun.map(function (r) {
        return ctx.h("li", null, [
          ctx.h("span", { class: "r", text: str(r.run) }),
          " — ",
          r.leading === null || r.leading === undefined
            ? ctx.h("span", { text: str(r.note) || "contested" })
            : ctx.h("span", { text: String(r.leading) +
                (typeof r.margin === "number" && isFinite(r.margin)
                  ? " (margin " + ctx.fmt.num(r.margin, 2) + ")" : "") }),
        ]);
      })));
    }

    body.appendChild(ctx.h("div", {
      class: "cx-h",
      text: "Executed checks (" + checks.length + ")",
    }));
    if (checks.length) {
      // Every check that ran is listed, whatever it found: an inconclusive
      // check is the corpus saying it cannot settle the question, and hiding
      // that would overstate what the confirming checks mean.
      body.appendChild(ctx.h("ul", { class: "cx-checks" }, checks.map(function (check) {
        return checkLine(ctx, check);
      })));
    } else {
      body.appendChild(ctx.h("div", {
        class: "cx-basisline",
        text: "No discriminating check was answerable from the runs on disk.",
      }));
    }

    if (str(consolidated.basis)) {
      body.appendChild(ctx.h("p", {
        class: "cx-basisline",
        text: "Basis: " + consolidated.basis,
      }));
    }

    head.addEventListener("click", function () {
      openRows[rowKey] = !openRows[rowKey];
      row.classList.toggle("open", !!openRows[rowKey]);
      head.setAttribute("aria-expanded", openRows[rowKey] ? "true" : "false");
      head.setAttribute("title", openRows[rowKey]
        ? "Collapse this entry"
        : "Expand: the executed checks and the per-run diagnoses");
      ctx.signal("inspect");
    });

    row.appendChild(head);
    row.appendChild(body);
    return row;
  }

  // ============================================================ the block

  AgentDiff.block({
    id: "diagnosis-consolidated",
    title: "Across runs",
    question: "Does the diagnosis survive repetition — and what did executed checks settle?",
    group: "outcome",
    size: "normal",

    relevance: function (ctx) {
      var payload = payloadOf(ctx);
      if (!payload || !entriesOf(payload).length) return 0;
      return failingEntries(payload).length ? 0.9 : 0.3;
    },

    render: function (el, ctx) {
      ensureStyle();
      var payload = payloadOf(ctx);
      if (!payload || !entriesOf(payload).length) {
        return ctx.empty(el, "No cross-run consolidation in this report — it is " +
          "written by `deepcompare runs` over repeated runs of the same tasks.");
      }

      el.appendChild(ctx.h("p", {
        class: "cx-lede",
        text: "Each failing (task, agent) below was diagnosed in every failing " +
              "run, not one representative pair. Scores can make a hypothesis " +
              "leading; only an executed check can make it confirmed or " +
              "refuted. Click a row for the checks that ran — inconclusive " +
              "ones included.",
      }));

      // 1. The summary narrative, in the engine's exact words.
      if (str(payload.narrative)) {
        el.appendChild(ctx.h("div", { class: "cx-narrative" }, [
          ctx.h("span", { class: "k", text: "Across runs" }),
          document.createTextNode(str(payload.narrative)),
        ]));
      }

      // 2. One row per (task, agent) with failures, as the engine ordered them.
      var failing = failingEntries(payload);
      if (failing.length) {
        var list = ctx.h("ol", { class: "cx-list" });
        failing.forEach(function (entry) {
          list.appendChild(entryRow(ctx, entry));
        });
        el.appendChild(list);
      } else {
        el.appendChild(ctx.h("div", {
          class: "empty",
          text: "No failures to diagnose across these runs.",
        }));
      }

      // 3. The clean entries, counted rather than hidden — the denominator
      // for everything above.
      var clean = entriesOf(payload).length - failing.length;
      var summary = obj(payload.summary) || {};
      var footParts = [];
      if (clean > 0) {
        footParts.push(clean + " (task, agent) entr" + (clean === 1 ? "y" : "ies") +
          " had no failures to diagnose");
      }
      if (typeof summary.tasks === "number") {
        footParts.push(summary.tasks + " task(s) in the corpus");
      }
      if (typeof summary.confirmed_by_checks === "number") {
        footParts.push(summary.confirmed_by_checks + " confirmed by executed checks");
      }
      if (footParts.length) {
        el.appendChild(ctx.h("div", { class: "cx-foot", text: footParts.join(" · ") }));
      }
    },
  });

})(typeof window !== "undefined" ? window : this);

</script>

<script>
/* AgentDiff blocks — the reading of one run.
 *
 * The eval reasoning layer, on the page. Each run is understood on its
 * own before it is compared: what happened (phases), what the answer
 * rests on (every typed value with its basis status), why it ended, what
 * it means (findings, each tagged with its evidence class), and what to
 * take forward (located next actions). Everything here is quoted from
 * `report.reading[side]` verbatim — the block composes no sentence of its
 * own — and every step reference is a chip that moves the shared cursor
 * the map, step detail and run lens already follow.
 */
(function (global) {
  "use strict";

  var AgentDiff = global.AgentDiff;
  if (!AgentDiff || typeof AgentDiff.block !== "function") return;

  var STYLE_ID = "agentdiff-reading-css";
  var styled = false;
  var Lens = { side: null };  // the side being read; null = decide from data

  function ensureStyle() {
    if (styled) return;
    styled = true;
    try {
      if (document.getElementById(STYLE_ID)) return;
      var node = document.createElement("style");
      node.id = STYLE_ID;
      node.textContent = [
        ".rd-head{display:flex;align-items:center;gap:8px;margin:0 0 8px;flex-wrap:wrap}",
        ".rd-head .grp{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}",
        ".rd-head .grp button{border:0;background:var(--surface-2);color:var(--ink-2);",
        "font:600 12px/24px inherit;padding:0 10px;cursor:pointer}",
        ".rd-head .grp button[aria-pressed=true]{background:var(--accent);color:#fff}",
        ".rd-status{font-size:12px;color:var(--ink-3)}",
        ".rd-sum{font-size:13px;line-height:1.55;margin:0 0 10px;color:var(--ink)}",
        ".rd-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);",
        "font-weight:700;margin:12px 0 5px}",
        ".rd-phases{margin:0;padding-left:18px;font-size:12.5px;line-height:1.5}",
        ".rd-table{width:100%;border-collapse:collapse;font-size:12.5px}",
        ".rd-table th{text-align:left;font-weight:600;color:var(--ink-3);font-size:11px;",
        "padding:3px 6px;border-bottom:1px solid var(--rule)}",
        ".rd-table td{padding:4px 6px;border-bottom:1px solid var(--rule);vertical-align:top}",
        ".rd-chip{display:inline-block;padding:0 7px;border-radius:999px;border:1px solid var(--rule);",
        "font:600 11px/18px inherit;background:var(--surface-2);color:var(--ink-2)}",
        ".rd-chip.supported{color:var(--good)}.rd-chip.contradicted,.rd-chip.unsupported{color:var(--bad)}",
        ".rd-chip.self_asserted,.rd-chip.stale{color:var(--warn)}",
        ".rd-step{display:inline-block;margin:0 4px 2px 0;padding:0 7px;border-radius:999px;",
        "border:1px solid var(--rule);background:var(--surface-2);font:600 11px/18px ",
        "ui-monospace,monospace;color:var(--accent);cursor:pointer}",
        ".rd-step:focus-visible{outline:2px solid var(--accent);outline-offset:1px}",
        ".rd-list{margin:0;padding-left:0;list-style:none;font-size:12.5px;line-height:1.5}",
        ".rd-list li{padding:4px 0;border-bottom:1px dashed var(--rule)}",
        ".rd-cls{font-size:11px;color:var(--ink-3);margin-right:6px;text-transform:uppercase;",
        "letter-spacing:.05em}",
        ".rd-why{font-size:12.5px;line-height:1.5;margin:0}",
        ".rd-conf{font-size:12px;color:var(--ink-3);margin:10px 0 0}",
        ".rd-validity{border-left:3px solid var(--warn);padding:6px 10px;margin:0 0 10px;",
        "font-size:12.5px;background:var(--surface-2);border-radius:0 7px 7px 0}"
      ].join("");
      document.head.appendChild(node);
    } catch (err) { /* styling is optional */ }
  }

  // ------------------------------------------------------------ data access

  function readingOf(report, side) {
    var box = report && report.reading;
    return box && box[side] ? box[side] : null;
  }

  function failingSide(report) {
    var a = report && report.a && report.a.outcome;
    var b = report && report.b && report.b.outcome;
    if (a && b && a.success === true && b.success === false) return "b";
    if (a && b && b.success === true && a.success === false) return "a";
    return "b";
  }

  function agentName(report, side) {
    var box = report && report[side];
    return (box && box.agent && box.agent.name) || side.toUpperCase();
  }

  function rowFor(report, side, step) {
    var rows = report && Array.isArray(report.alignment) ? report.alignment : [];
    var key = side + "_index";
    for (var i = 0; i < rows.length; i++) {
      if (rows[i] && rows[i][key] === step) return i;
    }
    return -1;
  }

  function stepChip(ctx, report, side, step) {
    return ctx.h("button", {
      class: "rd-step", type: "button", text: "⌖ " + step,
      title: "show step " + step + " in the map, step detail and run lens",
      "data-step": String(step), "data-side": side,
      onclick: function () {
        var row = rowFor(report, side, step);
        try { ctx.signal("inspect"); } catch (e) { /* optional */ }
        if (row < 0) return;
        try {
          document.dispatchEvent(new CustomEvent("agentdiff:select-step",
            { detail: { row: row, side: side } }));
        } catch (e) { /* no CustomEvent: the chip is inert */ }
      }
    });
  }

  function matchWord(r) {
    if (r.matches_expected === true) return "matches expected";
    if (r.status === "contradicted") return "contradicts expected";
    if (r.matches_expected === false) return "not in expected";
    return "no expected value";
  }

  // ---------------------------------------------------------------- render

  function render(el, ctx) {
    ensureStyle();
    var report = ctx.report;
    if (!report || !report.reading) {
      return ctx.empty(el, "This report carries no reading; re-run compare to get one.");
    }
    var side = Lens.side || failingSide(report);
    var reading = readingOf(report, side);
    if (!reading) return ctx.empty(el, "No reading for this side.");
    var H = ctx.h;

    el.appendChild(H("div", { class: "rd-head" }, [
      H("div", { class: "grp", role: "group", "aria-label": "which run to read" }, ["a", "b"].map(function (s) {
        return H("button", {
          text: agentName(report, s), type: "button",
          "aria-pressed": side === s ? "true" : "false",
          onclick: function () { Lens.side = s; try { ctx.signal("inspect"); } catch (e) { /* optional */ } render(clear(el), ctx); }
        });
      })),
      H("span", { class: "rd-status", text: (reading.outcome && reading.outcome.success === false ? "failed" : "succeeded")
        + " · " + (reading.rests_on || []).length + " typed value(s) in the answer" })
    ]));

    el.appendChild(H("p", { class: "rd-sum", text: reading.summary || "" }));

    var validity = reading.validity;
    if (validity && validity.status && validity.status !== "clean") {
      el.appendChild(H("div", { class: "rd-validity", text:
        "Fix the measurement first: " + (validity.reason || validity.status) }));
    }

    if (reading.phases && reading.phases.length) {
      el.appendChild(H("div", { class: "rd-h", text: "What happened" }));
      el.appendChild(H("ol", { class: "rd-phases" }, reading.phases.map(function (ph) {
        var steps = ph.steps || [];
        var kids = [H("b", { text: steps.length ? "steps " + steps[0] + "–" + steps[steps.length - 1] : "no steps" }),
                    H("span", { text: ": " + (ph.summary || "") + " " })];
        if (steps.length) kids.push(stepChip(ctx, report, side, steps[0]));
        return H("li", null, kids);
      })));
    }

    var basis = reading.answer_basis || {};
    if (reading.rests_on && reading.rests_on.length) {

    ".oc-diff{font-size:12.5px;line-height:1.75;max-height:300px;overflow:auto;",

    ".oc-diff ins{background:color-mix(in srgb,var(--b) 20%,transparent);",

    ".oc-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin:7px 0 0}",
    ".oc-swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}",

  function ensureStyles() {

  }

  // ------------------------------------------------------------------ shared

  function side(report, which) {
    return (report && report[which]) || null;
  }

  function agentName(report, which) {
    var s = side(report, which);
    var name = s && s.agent && s.agent.name;
    return name || (which === "a" ? "Agent A" : "Agent B");
  }

  function otherSide(which) { return which === "a" ? "b" : "a"; }

  function sideClass(which) { return which === "a" ? "a" : "b"; }

  }

  /* Downstream keys carry the suffix of the side that spent more, which is
   * not always the side that failed — resolve by looking for the suffix that
   * is actually present rather than assuming `_b`. */
  function downstreamOf(divergence) {
    var ds = (divergence && divergence.downstream) || {};
    var has = function (which) {
      return ds["extra_steps_" + which] !== undefined ||
             ds["extra_tokens_" + which] !== undefined ||
             ds["extra_latency_s_" + which] !== undefined;
    };
    var heavier = has("a") ? "a" : (has("b") ? "b" : null);
    return {
      heavier: heavier,
      steps: heavier ? num(ds["extra_steps_" + heavier]) : null,
      tokens: heavier ? num(ds["extra_tokens_" + heavier]) : null,
      latency: heavier ? num(ds["extra_latency_s_" + heavier]) : null,
      caused: !!ds.caused_failure,
      failed: ds.failed_agent === "a" || ds.failed_agent === "b" ? ds.failed_agent : null,

  }

  /* Divergences carry step indices; the alignment row holding them is what a
   * reader can actually navigate to. One-sided regions only resolve on one
   * of the two columns, so match either. */

    if (!divergence) return null;
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i] || {};
      if (divergence.a_index !== null && divergence.a_index !== undefined &&
          row.a_index === divergence.a_index) return i;
      if (divergence.b_index !== null && divergence.b_index !== undefined &&
          row.b_index === divergence.b_index) return i;

    return null;

    var steps = (s && s.steps) || [];

    if (!step) return "step";
    var type = step.type || "step";

  function ranges(list) {
    if (!Array.isArray(list) || !list.length) return "—";
    var sorted = list.filter(function (n) { return typeof n === "number"; })
                     .slice().sort(function (x, y) { return x - y; });
    if (!sorted.length) return "—";
    var out = [];
    var start = sorted[0];
    var prev = sorted[0];
    for (var i = 1; i <= sorted.length; i++) {
      var value = sorted[i];
      if (value === prev + 1) { prev = value; continue; }

    if (value === null || value === undefined || isNaN(value)) return "—";

    if (verdict === "partial") return "tag warn";
    if (verdict === "mismatch") return "tag bad";

    group: "outcome",
    size: "normal",

    relevance: function (ctx) {

      if (!list.length) return 0;
      var causal = list.some(function (d) { return (d.downstream || {}).caused_failure; });
      return causal ? 1 : Math.min(0.85, 0.55 + 0.1 * list.length);
    },

    render: function (el, ctx) {

          onclick: function () { ctx.signal("inspect"); },

          ctx.h("span", { class: "tag", text: "#" + (divergence.rank === undefined ? "?" : divergence.rank) }),
          ctx.h("span", { class: "tag", text: divergence.kind || "unclassified" }),

            class: "tag bad",

        position.push(row === null ? "alignment row —" : "alignment row " + row);
        position.push("A step " + (divergence.a_index === null || divergence.a_index === undefined ? "—" : divergence.a_index));

          item.appendChild(ctx.h("div", { class: "oc-chips" }, [
            ctx.h("span", { class: "oc-chip", style: { color: ctx.color[sideClass(ds.heavier)] }, text: who + " spent more downstream:" }),
            ds.steps === null ? null : ctx.h("span", { class: "oc-chip", text: signed(ds.steps, "steps") }),
            ds.tokens === null ? null : ctx.h("span", { class: "oc-chip", text: signed(ds.tokens, "tok") }),

  function drawChain(ctx, nodes) {

    var root = ctx.svg("svg", {

      role: "img",

    });

    nodes.forEach(function (node, i) {
      var y = TOP + i * (NH + GAP);
      var accent = node.role === "link" ? ctx.color.axis : ctx.color.bad;
      var strong = node.role !== "link";

      root.appendChild(ctx.svg("rect", {
        x: 6, y: y, width: W - 12, height: NH, rx: 8,
        fill: accent, "fill-opacity": strong ? 0.12 : 0.04,
        stroke: accent, "stroke-width": strong ? 1.4 : 1,
      }));
      root.appendChild(ctx.svg("text", {
        x: 16, y: y + NH / 2 + 4, "font-size": 11.5,
        "font-family": "ui-monospace, Menlo, Consolas, monospace",
        fill: strong ? ctx.color.bad : ctx.color.muted,
        text: node.index === null ? "✗" : "#" + node.index,
      }));
      root.appendChild(ctx.svg("text", {
        x: node.index === null ? 34 : 48, y: y + NH / 2 + 4, "font-size": 11.5,
        fill: ctx.color.ink,
        text: ctx.fmt.truncate(node.label, node.role === "link" ? 30 : 26),
      }));
      if (node.role !== "link") {
        root.appendChild(ctx.svg("text", {
          x: W - 14, y: y + NH / 2 + 4, "font-size": 11, "text-anchor": "end",
          fill: ctx.color.bad,
          text: node.role === "root" ? "root cause" : "outcome",
        }));
      }
      if (node.quality === "bad" || node.quality === "weak") {
        root.appendChild(ctx.svg("circle", {
          cx: W - 20, cy: y + NH - 8, r: 2.5,
          fill: node.quality === "bad" ? ctx.color.bad : ctx.color.warn,
        }));
      }

      if (i < nodes.length - 1) {
        var top = y + NH;
        var bottom = top + GAP;
        root.appendChild(ctx.svg("line", {
          x1: W / 2, y1: top + 1, x2: W / 2, y2: bottom - 5,
          stroke: ctx.color.axis, "stroke-width": 1.2,
        }));
        root.appendChild(ctx.svg("polygon", {
          points: (W / 2 - 4) + "," + (bottom - 6) + " " + (W / 2 + 4) + "," + (bottom - 6) +
                  " " + (W / 2) + "," + bottom,
          fill: ctx.color.axis,
        }));
      }
    });
    return ctx.h("div", { class: "oc-svgwrap" }, [root]);
  }

  AgentDiff.block({
    id: "attribution",
    title: "Attribution",
    question: "What caused the failure?",
    group: "outcome",
    size: "wide",

    relevance: function (ctx) {
      var attribution = (ctx.report && ctx.report.attribution) || null;
      if (!attribution) return 0;
      // The object is always emitted; a null failed_agent means nobody failed.
      if (attribution.failed_agent !== "a" && attribution.failed_agent !== "b") return 0;
      return 1;
    },

    render: function (el, ctx) {
      ensureStyles();
      var report = ctx.report;
      var attribution = (report && report.attribution) || null;
      var failed = attribution && (attribution.failed_agent === "a" || attribution.failed_agent === "b")
        ? attribution.failed_agent : null;

      if (!failed) {
        ctx.empty(el, attribution && attribution.explanation
          ? attribution.explanation
          : "Nothing failed on this task, so there is no failure to attribute.");
        return;
      }

      var failedName = agentName(report, failed);
      var root = num(attribution.root_cause_step);

      el.appendChild(ctx.h("p", { class: "oc-lead" }, [
        ctx.h("b", { text: failedName + " failed." }),
        document.createTextNode(root === null
          ? " No root-cause step was isolated."
          : " Root cause: " + (attribution.category || "unclassified") + " at step " + root + "."),
      ]));

      var tags = ctx.h("div", { class: "oc-row", style: { marginTop: "0" } }, [
        ctx.h("span", { class: "tag " + sideClass(failed), text: failed.toUpperCase() + " · " + failedName }),
        attribution.category ? ctx.h("span", { class: "tag bad", text: attribution.category }) : null,
        ctx.h("span", {
          class: "tag",
          text: (Array.isArray(attribution.chain) ? attribution.chain.length : 0) + " step chain",
        }),
      ].filter(Boolean));
      el.appendChild(tags);

      el.appendChild(drawChain(ctx, chainNodes(report, failed, attribution)));

      if (attribution.explanation) {
        el.appendChild(ctx.h("div", { class: "oc-panel bad" }, [
          ctx.h("p", { class: "oc-quote", text: attribution.explanation }),
        ]));
      }
      el.appendChild(ctx.h("p", {
        class: "caveat",
        text: "The chain is the propagation path through " + failedName +
              "'s own steps: the root divergence, every step that carried its content forward, and the answer that came out. " +
              "A dot marks a step the trace itself annotated — red for bad, amber for weak.",
      }));
    },
  });

  // ------------------------------------------------------ 4. counterfactual

  AgentDiff.block({
    id: "counterfactual",
    title: "Counterfactual",
    question: "What if it had chosen differently?",
    group: "outcome",
    size: "normal",

    relevance: function (ctx) {
      var cf = (ctx.report && ctx.report.counterfactual) || null;
      if (!cf || !cf.estimate) return 0;
      if (cf.confidence === "high") return 0.95;
      if (cf.confidence === "medium") return 0.8;
      return 0.65;
    },

    render: function (el, ctx) {
      ensureStyles();
      var report = ctx.report;
      var cf = (report && report.counterfactual) || null;
      if (!cf || !cf.estimate) {
        ctx.empty(el, "No counterfactual: the engine only splices one when a failure was attributed.");
        return;
      }

      var estimate = cf.estimate || {};
      var splice = cf.splice || {};
      var confidence = cf.confidence || "unknown";
      var confidenceClass = confidence === "high" ? "tag good"
        : (confidence === "medium" ? "tag warn" : "tag bad");

      el.appendChild(ctx.h("div", { class: "oc-row", style: { marginTop: "0" } }, [
        ctx.h("span", { class: "tag", text: "splice of observed steps" }),
        ctx.h("span", { class: confidenceClass, text: "confidence: " + confidence }),
        estimate.outcome ? ctx.h("span", {
          class: estimate.outcome === "success" ? "tag good" : "tag bad",
          text: "estimated outcome: " + estimate.outcome,
        }) : null,
      ].filter(Boolean)));

      if (cf.premise) {
        el.appendChild(ctx.h("div", { class: "oc-panel" }, [
          ctx.h("p", { class: "oc-quote", text: "Premise: " + cf.premise }),
        ]));
      }

      var adopted = splice.adopted_from === "a" || splice.adopted_from === "b" ? splice.adopted_from : null;
      el.appendChild(ctx.h("dl", { class: "kv", style: { marginTop: "9px" } }, [
        ctx.h("dt", { text: "Kept prefix" }),
        ctx.h("dd", { class: "mono", text: "steps " + ranges(splice.prefix_steps) }),
        ctx.h("dt", { text: "Adopted" }),
        ctx.h("dd", { class: "mono", text: "steps " + ranges(splice.adopted_steps) +
          (adopted ? " from " + agentName(report, adopted) : "") }),
      ]));

      var deltas = [
        { label: "Steps", value: num(estimate.steps), delta: num(estimate.steps_delta), text: ctx.fmt.int(estimate.steps), d: signed(estimate.steps_delta) },
        { label: "Tokens", value: num(estimate.tokens), delta: num(estimate.tokens_delta), text: ctx.fmt.tokens(estimate.tokens), d: signed(estimate.tokens_delta, "tok") },
        { label: "Latency", value: num(estimate.latency_s), delta: num(estimate.latency_delta_s), text: ctx.fmt.sec(estimate.latency_s), d: signed(estimate.latency_delta_s, "s", 2) },
        { label: "Cost", value: num(estimate.cost_usd), delta: num(estimate.cost_delta_usd), text: ctx.fmt.usd(estimate.cost_usd), d: signedUsd(estimate.cost_delta_usd) },
      ];
      var table = ctx.h("table", { class: "grid", style: { marginTop: "9px" } }, [
        ctx.h("tr", null, [
          ctx.h("th", { text: "Estimate" }),
          ctx.h("th", { class: "num", text: "Spliced" }),
          ctx.h("th", { class: "num", text: "vs actual" }),
        ]),
      ]);
      deltas.forEach(function (row) {
        if (row.value === null && row.delta === null) return;
        table.appendChild(ctx.h("tr", null, [
          ctx.h("td", { text: row.label }),
          ctx.h("td", { class: "num", text: row.value === null ? "—" : row.text }),
          ctx.h("td", { class: "num", style: { color: deltaColor(ctx, row.delta) }, text: row.delta === null ? "—" : row.d }),
        ]));
      });
      el.appendChild(ctx.h("div", { class: "scroll-x" }, [table]));

      if (cf.narrative) {
        el.appendChild(ctx.h("p", { class: "oc-mini", text: cf.narrative }));
      }

      el.appendChild(ctx.h("p", {
        class: "caveat",
        text: "Not a simulation and not a prediction. The engine never re-runs an agent: this trajectory is assembled from steps that were really recorded — " +
              (adopted ? agentName(report, adopted) + "'s" : "the reference") +
              " suffix pasted onto the failing run's own prefix — and costed at the observed per-step rates. Confidence is \"" +
              confidence + "\", which describes how clean that splice was, not how likely the outcome is.",
      }));
    },
  });

  // ------------------------------------------------------------- 5. shapley

  AgentDiff.block({
    id: "shapley",
    title: "Credit split",
    question: "How is the credit split?",
    group: "outcome",
    size: "normal",

    relevance: function (ctx) {
      var shapley = (ctx.report && ctx.report.shapley) || null;
      if (!shapley || shapley.available === false) return 0;
      var allocations = shapley.allocations || [];
      if (!allocations.length) return 0;
      // Splitting credit only earns its space once there is more than one
      // region to split it between.
      return allocations.length > 1 ? 0.9 : 0.55;
    },

    render: function (el, ctx) {
      ensureStyles();
      var report = ctx.report;
      var shapley = (report && report.shapley) || null;
      if (!shapley) {
        ctx.empty(el, "No credit split: this run has no divergence regions to allocate between.");
        return;
      }
      if (shapley.available === false) {
        ctx.empty(el, shapley.reason || shapley._note ||
          "Credit allocation is marked unavailable for this run.");
        return;
      }
      var allocations = shapley.allocations || [];
      if (!allocations.length) {
        ctx.empty(el, "No allocations recorded for this run.");
        return;
      }

      var metric = shapley.metric || "tokens";
      var total = num(shapley.total_saving);

      el.appendChild(ctx.h("div", { class: "oc-row", style: { marginTop: "0" } }, [
        ctx.h("span", { class: "tag", text: "metric: " + metric }),
        ctx.h("span", {
          class: shapley.method === "exact" ? "tag good" : "tag warn",
          text: shapley.method === "exact" ? "exact enumeration" : (shapley.method || "method n/a"),
        }),
        ctx.h("span", { class: "tag", text: allocations.length + " region" + (allocations.length === 1 ? "" : "s") }),
      ]));

      if (total !== null) {
        el.appendChild(ctx.h("p", {
          class: "oc-lead", style: { marginTop: "9px", marginBottom: "4px" },
        }, [
          ctx.h("b", { text: total >= 0
            ? "Taking the reference path at every divergence saves " + Math.round(total).toLocaleString() + " " + metric + "."
            : "Taking the reference path at every divergence costs " + Math.round(-total).toLocaleString() + " more " + metric + " — the gap runs the other way." }),
        ]));
      }
      if (shapley.loser && shapley.winner) {
        el.appendChild(ctx.h("p", {
          class: "oc-sub",
          text: shapley.loser + "'s spend measured against " + shapley.winner + "'s path.",
        }));
      }

      allocations.forEach(function (allocation) {
        var share = num(allocation.share);
        var value = num(allocation.shapley);
        var causal = !!allocation.caused_failure;
        var fill = causal ? ctx.color.bad : ctx.color.axis;
        var row = ctx.h("div", { class: "oc-alloc" });
        row.appendChild(ctx.h("div", { class: "oc-allochead" }, [
          ctx.h("span", { class: "oc-row", style: { marginTop: "0" } }, [
            ctx.h("span", { class: "tag", text: "region " + (allocation.region === undefined ? "?" : allocation.region) }),
            ctx.h("span", { class: "tag", text: allocation.kind || "unclassified" }),
            causal ? ctx.h("span", { class: "tag bad", text: "causal" }) : null,
          ].filter(Boolean)),
          ctx.h("span", {
            class: "oc-num",
            text: (share === null ? "—" : ctx.fmt.pct(share)) +
                  (value === null ? "" : "  ·  " + Math.round(value).toLocaleString()),
          }),
        ]));
        row.appendChild(bar(ctx, share === null ? 0 : Math.abs(share), fill));
        if (allocation.summary) {
          row.appendChild(ctx.h("p", { class: "oc-sum", text: ctx.fmt.truncate(allocation.summary, 190) }));
        }
        if (Array.isArray(allocation.alignment_rows) && allocation.alignment_rows.length) {
          row.appendChild(chips(ctx, [
            "alignment row" + (allocation.alignment_rows.length === 1 ? " " : "s ") +
            ranges(allocation.alignment_rows),
          ]));
        }
        el.appendChild(row);
      });

      var attributable = shapley.outcome_attributable === true;
      el.appendChild(ctx.h("div", { class: "oc-panel " + (attributable ? "" : "warn") }, [
        ctx.h("div", { class: "oc-row", style: { marginTop: "0" } }, [
          ctx.h("span", {
            class: attributable ? "tag good" : "tag warn",
            text: attributable ? "outcome attributable" : "outcome NOT attributable",
          }),
        ]),
        ctx.h("p", {
          class: "oc-mini",
          text: attributable
            ? "Exactly one divergence was causal, so the pass/fail outcome does belong to it. The shares above still describe " + metric + ", not the outcome."
            : "The shares above split " + metric + " only — the pass/fail outcome is NOT attributable to any single divergence here.",
        }),
        // The engine's own wording, kept verbatim: it is the field that says
        // why credit was declined rather than guessed.
        shapley.outcome_note
          ? ctx.h("p", { class: "oc-mini", style: { fontStyle: "italic" }, text: shapley.outcome_note })
          : null,
      ].filter(Boolean)));

      var footnotes = [];
      if (num(shapley.efficiency_check) !== null) {
        footnotes.push("Efficiency check (Σ allocations − total): " + ctx.fmt.num(shapley.efficiency_check, 2) + ".");
      }
      footnotes.push("Splice-Shapley: exact with respect to the splice surrogate — adopting the reference path yields the steps that side actually took — not with respect to the agent, which would require re-running it.");
      if (shapley._note) footnotes.push(shapley._note);
      el.appendChild(ctx.h("p", { class: "caveat", text: footnotes.join(" ") }));
    },
  });

  // --------------------------------------------------------- 6. answer diff

  var OP_EQUAL = { eq: 1, equal: 1, "=": 1 };
  var OP_DELETE = { del: 1, delete: 1, "-": 1 };
  var OP_INSERT = { ins: 1, insert: 1, "+": 1 };

  function opKind(raw) {
    var op = String(raw);
    if (OP_DELETE[op]) return "del";
    if (OP_INSERT[op]) return "ins";
    if (OP_EQUAL[op]) return "eq";
    return "eq";
  }

  /* The engine emits a token-level diff, so a rewritten clause arrives as
   * del/ins/del/ins alternating around shared spaces — legible to a diff
   * algorithm, unreadable to a person. Coalescing each run back into "what A
   * said" then "what B said" changes no text: the shared separator that is
   * consumed belongs to both sides, and it is re-emitted inside both. */
  function coalesceDiff(pairs) {
    var ops = [];
    (pairs || []).forEach(function (pair) {
      if (!Array.isArray(pair) || pair.length < 2) return;
      var text = pair[1] === null || pair[1] === undefined ? "" : String(pair[1]);
      if (!text) return;
      ops.push({ op: opKind(pair[0]), text: text });
    });

    var out = [];
    var i = 0;
    while (i < ops.length) {
      if (ops[i].op === "eq") { out.push(ops[i]); i++; continue; }
      var dels = [];
      var inss = [];
      var separator = null;
      while (i < ops.length) {
        var op = ops[i];
        if (op.op === "eq") {
          // Only swallow a shared separator once BOTH sides have text to
          // separate — then it can be re-emitted into both and no character
          // of either answer is lost. Anything else ends the run.
          var joins = /^\s+$/.test(op.text) && dels.length && inss.length &&
                      i + 1 < ops.length && ops[i + 1].op !== "eq";
          if (!joins) break;
          separator = op.text;
          i++;
          continue;
        }
        if (separator !== null) {
          dels.push(separator);
          inss.push(separator);
          separator = null;
        }
        (op.op === "del" ? dels : inss).push(op.text);
        i++;
      }
      if (dels.length) out.push({ op: "del", text: dels.join("") });
      if (inss.length) out.push({ op: "ins", text: inss.join("") });
    }
    return out;
  }

  AgentDiff.block({
    id: "answer-diff",
    title: "Answer diff",
    question: "How do the two answers differ?",
    group: "outcome",
    size: "normal",

    relevance: function (ctx) {
      var evaluation = (ctx.report && ctx.report.answer_eval) || null;
      if (!evaluation) return 0;
      var diff = evaluation.diff_ab || [];
      if (!diff.length) return 0;
      var differs = diff.some(function (pair) {
        return pair && !OP_EQUAL[String(pair[0])];
      });
      return differs ? 0.85 : 0.3;
    },

    render: function (el, ctx) {
      ensureStyles();
      var report = ctx.report;
      var evaluation = (report && report.answer_eval) || null;
      if (!evaluation) {
        ctx.empty(el, "This run carries no answer evaluation.");
        return;
      }
      var diff = evaluation.diff_ab || [];
      if (!diff.length) {
        ctx.empty(el, "No answer diff recorded — at least one side emitted no final answer.");
        return;
      }

      var nameA = agentName(report, "a");
      var nameB = agentName(report, "b");

      var body = ctx.h("div", { class: "oc-diff" });
      var identical = true;
      coalesceDiff(diff).forEach(function (segment) {
        if (segment.op === "del") { identical = false; body.appendChild(ctx.h("del", { text: segment.text })); }
        else if (segment.op === "ins") { identical = false; body.appendChild(ctx.h("ins", { text: segment.text })); }
        else { body.appendChild(document.createTextNode(segment.text)); }
      });
      el.appendChild(body);

      el.appendChild(ctx.h("div", { class: "oc-legend" }, [
        ctx.h("span", null, [
          ctx.h("i", { class: "oc-swatch", style: { background: ctx.color.a } }),
          document.createTextNode("only in A · " + nameA),
        ]),
        ctx.h("span", null, [
          ctx.h("i", { class: "oc-swatch", style: { background: ctx.color.b } }),
          document.createTextNode("only in B · " + nameB),
        ]),
        ctx.h("span", { text: "unmarked text is shared wording" }),
      ]));
      el.appendChild(ctx.h("p", {
        class: "oc-mini",
        text: "Token-level diff of A's final answer against B's; within a change A's wording is shown first, then B's.",
      }));

      if (identical) {
        el.appendChild(ctx.h("p", { class: "oc-mini", text: "The two final answers are token-identical." }));
      }

      el.appendChild(ctx.h("div", { class: "oc-hr" }));

      if (evaluation.expected) {
        el.appendChild(ctx.h("dl", { class: "kv" }, [
          ctx.h("dt", { text: "Expected" }),
          ctx.h("dd", { class: "mono", text: ctx.fmt.truncate(evaluation.expected, 240) }),
        ]));
      } else {
        el.appendChild(ctx.h("p", {
          class: "oc-mini",
          text: "No expected answer recorded for this task, so neither side can be scored for coverage.",
        }));
      }

      [["a", nameA], ["b", nameB]].forEach(function (row) {
        var which = row[0];
        var against = evaluation[which + "_vs_expected"] || {};
        if (against.coverage === undefined && !against.verdict) return;
        var block = ctx.h("div", { style: { marginTop: "8px" } });
        block.appendChild(ctx.h("div", { class: "oc-allochead" }, [
          ctx.h("span", { class: "oc-row", style: { marginTop: "0" } }, [
            ctx.h("span", { class: "tag " + sideClass(which), text: which.toUpperCase() + " · " + row[1] }),
            ctx.h("span", { class: verdictClass(against.verdict), text: against.verdict || "unknown" }),
          ]),
          ctx.h("span", {
            class: "oc-num",
            text: num(against.coverage) === null ? "—" : ctx.fmt.pct(against.coverage) + " coverage",
          }),
        ]));
        block.appendChild(bar(ctx, against.coverage, ctx.color[sideClass(which)]));
        el.appendChild(block);
      });

      el.appendChild(ctx.h("p", {
        class: "caveat",
        text: "Coverage is the fraction of expected-answer tokens present in the answer — a lexical check, not a judgement of meaning. A wrong number caps the verdict at \"partial\" even when the wording matches.",
      }));
    },
  });
})(typeof window !== "undefined" ? window : this);

</script>

<script>
/* AgentDiff blocks — trajectory.
 *
 * The trace visualization: five blocks that read the alignment as a picture
 * rather than a table. The governing idea is that a diff between two agent
 * runs is *spatial* — two tracks, one above the other, matched steps in the
 * same column — so divergence is something you see before you read.
 *
 * Everything here is hand-rolled SVG sized from the container, theme-aware
 * through ctx.color, and honest about absence: a one-sided alignment row
 * draws a gap, never a zero.
 */
(function (global) {
  "use strict";

  if (!global.AgentDiff || typeof global.AgentDiff.block !== "function") return;

  // Bound at the top of every draw; the core hands out the same helpers each
  // time, so this is a convenience, not shared state.
  var H = null, S = null, C = null, F = null;

  function bind(ctx) { H = ctx.h; S = ctx.svg; C = ctx.color; F = ctx.fmt; }

  // ------------------------------------------------------------------ style

  var STYLED = false;
  function ensureStyle() {
    if (STYLED) return;
    STYLED = true;
    var css = [
      ".tj-sides{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:11.5px;margin-bottom:6px}",
      ".tj-side{display:inline-flex;align-items:center;gap:5px;min-width:0}",
      ".tj-chip{width:9px;height:9px;border-radius:2px;flex:none}",
      ".tj-side b{font-weight:600;letter-spacing:-.01em}",
      ".tj-legend{display:flex;flex-wrap:wrap;gap:3px 11px;align-items:center;",
      "margin-top:7px;font-size:11px;color:var(--ink-3);line-height:1}",
      ".tj-legend .k{display:inline-flex;align-items:center;gap:4px}",
      ".tj-legend .lab{text-transform:uppercase;letter-spacing:.07em;opacity:.75}",
      ".tj-sw{width:12px;height:8px;border-radius:2px;flex:none;display:inline-block}",
      ".tj-read{margin-top:7px;min-height:15px;font-family:var(--mono);font-size:11px;",
      "color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}",
      ".tj-read i{font-style:normal;color:var(--ink-3)}",
      ".tj-cols{display:flex;flex-wrap:wrap;gap:10px}",
      ".tj-pane{flex:1 1 210px;min-width:0;border:1px solid var(--rule);border-radius:8px;padding:8px 9px}",
      ".tj-pane.absent{border-style:dashed;opacity:.72}",
      ".tj-pane h4{display:flex;align-items:center;gap:6px;font-size:11px;margin:0 0 5px;",
      "text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}",
      ".tj-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:6px 0 2px}",
      ".tj-text{font-family:var(--mono);font-size:11px;line-height:1.45;white-space:pre-wrap;",
      "word-break:break-word;background:var(--surface-2);border:1px solid var(--rule);",
      "border-radius:6px;padding:6px 7px;max-height:132px;overflow:auto}",
      ".tj-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}",
      ".tj-head .sp{flex:1}",

      ".tj-live{animation:tjPulse .9s ease-in-out infinite}",
      "@keyframes tjFlash{0%,100%{opacity:1}50%{opacity:.15}}",

    try {
      var tag = document.createElement("style");
      tag.setAttribute("data-agentdiff", "trajectory");
      tag.appendChild(document.createTextNode(css));
      document.head.appendChild(tag);
    } catch (err) { /* styling is a nicety; the blocks still read without it */ }
  }

  // ------------------------------------------------------------- responsive
  //
  // The core renders a block while its card is still detached, so clientWidth
  // is 0 at paint time. Draw once at a nominal width, then re-measure on the
  // next frame and repaint if the real width differs — layout-driven, not
  // time-driven, so the result is the same on every load.

  var painters = [];
  var resizeTimer = null;

  function measure(el) {
    var w = 0, pad = 24;
    try {
      w = el.clientWidth || 0;
      // the body's real padding: the hero lane pads wider than a column,
      // and a drawing that assumes the column's padding overflows the hero
      var cs = getComputedStyle(el);
      var p = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
      if (p > 0) pad = p;
    } catch (err) { w = 0; }
    if (!w) w = 340;
    return Math.max(220, w - pad);
  }

  function sized(el, ctx, draw) {
    var host = ctx.h("div");
    el.appendChild(host);
    var last = -1;
    function go() {
      var w = measure(el);
      if (w === last) return;
      last = w;
      host.innerHTML = "";
      draw(host, w);
    }
    go();
    if (typeof global.requestAnimationFrame === "function") {
      global.requestAnimationFrame(function () { if (el.isConnected) go(); });
    }
    painters.push({ el: el, go: go });
    if (painters.length > 64) {
      painters = painters.filter(function (p) { return p.el.isConnected; });
    }
    return host;
  }

  try {
    global.addEventListener("resize", function () {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        resizeTimer = null;
        painters = painters.filter(function (p) { return p.el.isConnected; });
        painters.forEach(function (p) {
          try { p.go(); } catch (err) { /* one stale painter must not stop the rest */ }
        });
      }, 140);
    });
  } catch (err) { /* no window: nothing to resize */ }

  // -------------------------------------------------------------- selection
  //
  // One shared cursor across the trajectory blocks: clicking a step in
  // `tracks` is what `step-detail` is looking at. Subscribers are pruned by
  // DOM connectivity, so a re-render of the page cannot leave ghosts behind.

  var Sel = { task: null, row: null, side: null, subs: [] };

  function subscribe(el, fn) { Sel.subs.push({ el: el, fn: fn }); }

  function notify() {
    Sel.subs = Sel.subs.filter(function (s) { return s.el.isConnected; });
    Sel.subs.forEach(function (s) {
      try { s.fn(); } catch (err) { console.warn("AgentDiff trajectory: subscriber failed", err); }
    });
  }

  function syncTask(ctx) {
    var task = ctx.task || (ctx.report && ctx.report.task ? ctx.report.task.id : null);
    if (Sel.task !== task) { Sel.task = task; Sel.row = null; Sel.side = null; }
  }

  function select(row, side, ctx) {
    Sel.row = row;
    Sel.side = side || null;
    if (ctx && ctx.signal) ctx.signal("inspect");
    notify();
  }

  /* The walkthrough's fallback for driving the family cursor is a
   * CustomEvent — documented in 05_walkthrough.js as "any module may
   * listen". Until this listener existed, nothing did: when Tracks was
   * absent or its hit layout unrecognized, the event fired into silence
   * and the walkthrough degraded to a plain scroll. Now the event moves
   * the same cursor a hand click would. */
  try {
    document.addEventListener("agentdiff:select-step", function (event) {
      var d = event && event.detail;
      if (!d || typeof d.row !== "number" || d.row < 0) return;
      select(d.row, d.side === "a" || d.side === "b" ? d.side : null, null);
    });
  } catch (err) { /* no document: nothing to listen on */ }

  // ------------------------------------------------------------ data access

  function rowsOf(report) {
    return report && Array.isArray(report.alignment) ? report.alignment : [];
  }

  function stepsOf(report, side) {
    var box = report && report[side];
    return box && Array.isArray(box.steps) ? box.steps : [];
  }

  function stepAt(report, side, index) {
    if (index === null || index === undefined) return null;
    var steps = stepsOf(report, side);
    for (var i = 0; i < steps.length; i++) {
      if (steps[i] && steps[i].index === index) return steps[i];
    }
    return steps[index] || null;
  }

  function agentName(report, side) {
    var box = report && report[side];
    var name = box && box.agent && box.agent.name;
    return name || side.toUpperCase();
  }

  function sideColor(side) { return side === "a" ? C.a : C.b; }

  /* Divergences carry a_index and b_index that may land in different
   * alignment rows when the region is one-sided, so a column is divergent if
   * it matches either. The rank marker goes on the earliest such column. */
  function divergenceMap(report) {
    var rows = rowsOf(report);
    var map = {};
    (report && Array.isArray(report.divergences) ? report.divergences : []).forEach(function (d) {
      var hits = [];
      rows.forEach(function (row, i) {
        var a = d.a_index !== null && d.a_index !== undefined && row.a_index === d.a_index;
        var b = d.b_index !== null && d.b_index !== undefined && row.b_index === d.b_index;
        if (a || b) hits.push(i);
      });
      hits.forEach(function (i, k) {
        var mark = { div: d, primary: k === 0 };
