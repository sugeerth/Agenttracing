    pane.appendChild(H("dl", { class: "kv" }, [
      H("dt", { text: "tokens" }), H("dd", { text: F.int(step.tokens) }),
      H("dt", { text: "latency" }), H("dd", { text: F.sec(step.latency_s) }),
    ]));

    pane.appendChild(H("div", { class: "tj-lbl", text: "input" }));
    pane.appendChild(H("div", { class: "tj-text", text: textOr(step.input) }));
    pane.appendChild(H("div", { class: "tj-lbl", text: "output" }));
    pane.appendChild(H("div", { class: "tj-text", text: textOr(step.output) }));
    if (step.note) pane.appendChild(H("div", { class: "tj-note", text: step.note }));

    if (ctx && ctx.signal) {
      pane.addEventListener("mouseenter", function () { ctx.signal("hover"); }, { once: true });
    }
    return pane;
  }

  function textOr(value) {
    if (value === null || value === undefined || String(value) === "") return "— nothing recorded —";
    return String(value);
  }

  // ========================================================== semantic-rows

  AgentDiff.block({
    id: "semantic-rows",
    title: "Meaning vs wording",
    question: "Did meaning diverge from wording?",
    group: "trajectory",
    size: "normal",
    relevance: function (ctx) {
      var sem = semanticOf(ctx.report);
      if (!sem || !Array.isArray(sem.rows) || sem.rows.length < 2) return 0;
      var gap = 0;
      sem.rows.forEach(function (r) {
        var d = (Number(r.lexical) || 0) - (Number(r.semantic) || 0);
        if (d > gap) gap = d;
      });
      var broke = sem.first_semantic_break !== null && sem.first_semantic_break !== undefined;
      return Math.min(1, (broke ? 0.66 : 0.36) + gap * 0.4);
    },
    render: function (el, ctx) {
      bind(ctx);
      ensureStyle();
      var report = ctx.report;
      if (!report) return ctx.empty(el, "No report loaded.");
      var sem = semanticOf(report);
      if (!sem) return ctx.empty(el, "This report carries no semantic analysis.");
      if (!Array.isArray(sem.rows) || !sem.rows.length) {
        return ctx.empty(el, "No alignment row pairs both sides, so meaning has nothing to compare.");
      }
      syncTask(ctx);

      var host = sized(el, ctx, function (box, avail) { drawSemantic(box, avail, ctx); });
      subscribe(el, function () { host.innerHTML = ""; drawSemantic(host, measure(el), ctx); });

      el.appendChild(legend([
        { node: swatchLine(C.muted, "3 2"), text: "lexical (wording)" },
        { node: swatchLine(C.ink, null), text: "semantic (meaning)" },
        { fill: C.bad, opacity: 0.35, text: "meaning below wording" },
        { fill: C.good, opacity: 0.35, text: "meaning above wording" },
      ]));
      if (sem.narrative) el.appendChild(H("p", { class: "caveat", text: sem.narrative }));
      el.appendChild(H("p", {
        class: "caveat",
        text: "Semantic similarity is TF-IDF cosine over the paired step texts; a break is the first " +
              "row below 0.5. Rows are alignment rows with both sides present — " +
              (Array.isArray(sem.methods) ? sem.methods.join(" + ") : "tfidf_cosine") + ".",
      }));
    },
  });

  function swatchLine(stroke, dash) {
    var line = tick(1, 5, 15, 5, stroke, 1.6, dash);
    return S("svg", { width: 16, height: 10, viewBox: "0 0 16 10", "aria-hidden": "true" }, [line]);
  }

  function drawSemantic(host, avail, ctx) {
    bind(ctx);
    var report = ctx.report;
    var sem = semanticOf(report);
    var rows = sem.rows.filter(function (r) { return r && typeof r.row === "number"; });
    var n = rows.length;
    var brk = typeof sem.first_semantic_break === "number" ? sem.first_semantic_break : null;

    var gut = 22, padR = 10;
    var colW = Math.max(30, Math.min(84, Math.floor((avail - gut - padR) / Math.max(n, 1))));
    var W = gut + padR + colW * n;
    var top = 16, plotH = 84;
    var axisY = top + plotH + 14;
    var H_ = axisY + 6;

    function colX(i) { return gut + colW * i + colW / 2; }
    function y(v) { return top + plotH - Math.max(0, Math.min(1, Number(v) || 0)) * plotH; }

    var svgEl = S("svg", {
      class: "tj", width: W, height: H_, viewBox: "0 0 " + W + " " + H_,
      role: "img", "aria-label": "Lexical versus semantic similarity per alignment row",
    });

    [0, 0.5, 1].forEach(function (v) {
      svgEl.appendChild(tick(gut, y(v), W - padR, y(v), C.grid, 1, v === 0.5 ? "2 3" : null));
      svgEl.appendChild(label(gut - 3, y(v) + 3, v === 0.5 ? ".5" : String(v), C.muted, 8, "end"));
    });
    // Sits on the left, where the series start high and the space is free.
    svgEl.appendChild(label(gut + 4, y(0.5) - 4, "break threshold", C.muted, 8, "start"));

    // gap bands: the point of the chart
    rows.forEach(function (r, i) {
      var lex = Number(r.lexical) || 0, semv = Number(r.semantic) || 0;
      if (Math.abs(lex - semv) < 0.005) return;
      var down = semv < lex;
      var w = Math.min(9, colW * 0.3);
      svgEl.appendChild(S("rect", {
        x: colX(i) - w / 2, y: Math.min(y(lex), y(semv)), width: w,
        height: Math.abs(y(lex) - y(semv)),
        fill: down ? C.bad : C.good, "fill-opacity": 0.3, rx: 1,
      }));
    });

    function series(key, stroke, dash, marker) {
      var d = "";
      rows.forEach(function (r, i) {
        d += (i ? "L" : "M") + colX(i).toFixed(1) + " " + y(r[key]).toFixed(1);
      });
      var path = S("path", { d: d, fill: "none", stroke: stroke, "stroke-width": 1.3,
                             "stroke-opacity": 0.85, "stroke-linejoin": "round" });
      if (dash) path.setAttribute("stroke-dasharray", dash);
      svgEl.appendChild(path);
      rows.forEach(function (r, i) {
        var v = Number(r[key]) || 0;
        if (marker === "square") {
          svgEl.appendChild(S("rect", { x: colX(i) - 2.6, y: y(v) - 2.6, width: 5.2, height: 5.2,
                                        fill: C.surface, stroke: stroke, "stroke-width": 1.2 }));
        } else {
          svgEl.appendChild(S("circle", { cx: colX(i), cy: y(v), r: 2.8, fill: stroke,
                                          stroke: C.surface, "stroke-width": 0.8 }));
        }
      });
    }
    series("lexical", C.muted, "3 2", "square");
    series("semantic", C.ink, null, "circle");

    rows.forEach(function (r, i) {
      svgEl.appendChild(label(colX(i), axisY, String(r.row), C.muted, 8.5));
      var hit = S("rect", { class: "tj-hit", x: colX(i) - colW / 2, y: 0, width: colW, height: H_,
                            fill: C.ink, "fill-opacity": 0, "pointer-events": "all" });
      hit.appendChild(S("title", {
        text: "row " + r.row + " · A step " + r.a_index + " ↔ B step " + r.b_index +
              " · lexical " + F.num(r.lexical, 2) + " · semantic " + F.num(r.semantic, 2),
      }));
      hit.addEventListener("mouseenter", function () {
        hit.setAttribute("fill-opacity", 0.05);
        if (ctx.signal) ctx.signal("hover");
      });
      hit.addEventListener("mouseleave", function () { hit.setAttribute("fill-opacity", 0); });
      hit.addEventListener("click", function () { select(r.row, null, ctx); });
      svgEl.appendChild(hit);
    });
    svgEl.appendChild(label(gut - 3, axisY, "row", C.muted, 8, "end"));

    if (brk !== null) {
      var at = -1;
      rows.forEach(function (r, i) { if (r.row === brk) at = i; });
      if (at >= 0) {
        svgEl.appendChild(tick(colX(at), top - 10, colX(at), axisY - 9, C.bad, 1.2, "3 3"));
        svgEl.appendChild(S("polygon", {
          points: pts([[colX(at) - 4, top - 14], [colX(at) + 4, top - 14], [colX(at), top - 8]]),
          fill: C.bad,
        }));
        if (colW >= 44) {
          svgEl.appendChild(label(Math.min(colX(at) + 7, W - padR), top - 9, "break", C.bad, 8, "start"));
        }
      }
    }

    var wrap = H("div", { class: W > avail ? "scroll-x" : "" });
    wrap.appendChild(svgEl);
    host.appendChild(wrap);
  }

  // ================================================================ intents

  var INTENTS = ["frame", "acquire", "verify", "transform", "decide", "commit"];
  var INTENT_LETTER = { frame: "F", acquire: "A", verify: "V", transform: "T", decide: "D", commit: "C" };

  AgentDiff.block({
    id: "intents",
    title: "Intent bands",
    question: "What was each agent trying to do?",
    group: "trajectory",
    size: "normal",
    relevance: function (ctx) {
      var sem = semanticOf(ctx.report);
      var it = sem && sem.intents;
      if (!it || (!Array.isArray(it.a) && !Array.isArray(it.b))) return 0;
      if (!(it.a || []).length && !(it.b || []).length) return 0;
      var missing = it.missing || {};
      var count = ((missing.a || []).length + (missing.b || []).length);
      return Math.min(1, 0.46 + 0.25 * count);
    },
    render: function (el, ctx) {
      bind(ctx);
      ensureStyle();
      var report = ctx.report;
      if (!report) return ctx.empty(el, "No report loaded.");
      var sem = semanticOf(report);
      var it = sem && sem.intents;
      if (!it) return ctx.empty(el, "This report carries no intent classification.");
      var a = Array.isArray(it.a) ? it.a : [], b = Array.isArray(it.b) ? it.b : [];
      if (!a.length && !b.length) return ctx.empty(el, "No steps were classified into the process grammar.");
      syncTask(ctx);

      el.appendChild(sideHeader(report));
      var host = sized(el, ctx, function (box, avail) { drawIntents(box, avail, ctx); });
      subscribe(el, function () { host.innerHTML = ""; drawIntents(host, measure(el), ctx); });

      // The two sequences, read as text — the same data, one line per side.
      [["a", a], ["b", b]].forEach(function (pair) {
        var letters = pair[1].map(function (row) {
          return INTENT_LETTER[row.intent] || "?";
        }).join(" ");
        el.appendChild(H("div", { class: "tj-seq" }, [
          H("b", { style: { color: sideColor(pair[0]) }, text: pair[0].toUpperCase() }),
          H("span", { text: letters || "—" }),
        ]));
      });

      var missing = it.missing || {};
      var gaps = H("div", { class: "tj-legend" });
      var any = false;
      ["a", "b"].forEach(function (side) {
        (missing[side] || []).forEach(function (intent) {
          any = true;
          gaps.appendChild(H("span", { class: "tag " + side,
            text: agentName(report, side) + " never " + phrase(intent) }));
        });
      });
      if (any) {
        el.appendChild(gaps);
        el.appendChild(H("p", {
          class: "caveat",
          text: "An intent the other agent used and this one never did — a process-grammar gap, " +
                "not a wording difference.",
        }));
      } else {
        el.appendChild(H("p", {
          class: "caveat",
          text: "Both agents used the same set of intents; they differ, if at all, in order and count.",
        }));
      }
    },
  });

  function phrase(intent) {
    return { frame: "framed the task", acquire: "acquired evidence", verify: "verified",
             transform: "transformed anything", decide: "decided between options",
             commit: "committed an answer" }[intent] || ("used " + intent);
  }

  function drawIntents(host, avail, ctx) {
    bind(ctx);
    var report = ctx.report;
    var sem = semanticOf(report);
    var it = sem.intents;
    var series = { a: Array.isArray(it.a) ? it.a : [], b: Array.isArray(it.b) ? it.b : [] };
    var maxStep = 0;
    ["a", "b"].forEach(function (side) {
      series[side].forEach(function (row) {
        if (typeof row.step === "number" && row.step + 1 > maxStep) maxStep = row.step + 1;
      });
    });
    if (!maxStep) maxStep = 1;

    var gut = 62, padR = 10;
    var colW = Math.max(18, Math.min(46, Math.floor((avail - gut - padR) / maxStep)));
    var W = gut + padR + colW * maxStep;
    var top = 10, laneH = 20;
    var H_ = top + laneH * INTENTS.length + 20;
    var axisY = top + laneH * INTENTS.length + 13;

    function colX(i) { return gut + colW * i + colW / 2; }
    function laneMid(intent) {
      var i = INTENTS.indexOf(intent);
      if (i < 0) i = INTENTS.length - 1;
      return top + laneH * i + laneH / 2;
    }
    // Each lane is split into an A half and a B half: where the two agents do
    // the same thing at the same step their marks sit one above the other
    // instead of one hiding the other.
    function laneY(intent, side) { return laneMid(intent) + (side === "a" ? -4 : 4); }

    var svgEl = S("svg", {
      class: "tj", width: W, height: H_, viewBox: "0 0 " + W + " " + H_,
      role: "img", "aria-label": "Intent sequence per agent over the process grammar",
    });

    var used = { a: {}, b: {} };
    ["a", "b"].forEach(function (side) {
      series[side].forEach(function (row) { used[side][row.intent] = true; });
    });

    INTENTS.forEach(function (intent) {
      var yy = laneMid(intent);
      svgEl.appendChild(tick(gut, yy, W - padR, yy, C.grid, 1));
      var unused = !used.a[intent] && !used.b[intent];
      svgEl.appendChild(S("text", {
        x: gut - 6, y: yy + 3, "text-anchor": "end", "font-size": 9.5,
        fill: unused ? C.grid : C.muted, text: intent,
      }));
    });

    ["a", "b"].forEach(function (side) {
      var list = series[side].slice().sort(function (x, y) { return x.step - y.step; });
      if (!list.length) return;
      var d = "";
      list.forEach(function (row, i) {
        d += (i ? "L" : "M") + colX(row.step).toFixed(1) + " " + laneY(row.intent, side).toFixed(1);
      });
      svgEl.appendChild(S("path", {
        d: d, fill: "none", stroke: sideColor(side), "stroke-width": 1.3,
        "stroke-opacity": 0.5, "stroke-linejoin": "round",
      }));
      list.forEach(function (row) {
        var x = colX(row.step), yy = laneY(row.intent, side);
        var node = side === "a"
          ? S("rect", { x: x - 3.4, y: yy - 3.4, width: 6.8, height: 6.8, rx: 1 })
          : S("circle", { cx: x, cy: yy, r: 3.8 });
        node.setAttribute("fill", sideColor(side));
        node.setAttribute("fill-opacity", 0.85);
        node.setAttribute("stroke", C.surface);
        node.setAttribute("stroke-width", 0.8);
        node.appendChild(S("title", {
          text: side.toUpperCase() + " step " + row.step + " · " + row.intent,
        }));
        svgEl.appendChild(node);
      });
    });

    for (var i = 0; i < maxStep; i++) {
      svgEl.appendChild(label(colX(i), axisY, String(i), C.muted, 8.5));
    }
    svgEl.appendChild(label(gut - 6, axisY, "step", C.muted, 8, "end"));

    var wrap = H("div", { class: W > avail ? "scroll-x" : "" });
    wrap.appendChild(svgEl);
    host.appendChild(wrap);
  }

})(typeof window !== "undefined" ? window : this);

</script>
<!-- 30_cost.js -->
<script>
/* AgentDiff blocks — cost & change.
 *
 * Six blocks answering the two questions that survive the demo: what did the
 * difference between these agents cost, and what should I change because of
 * it? One is per-task (metrics_delta); the other five read the batch
 * aggregate, so they say the same thing whichever task is selected — a
 * recommendation drawn from eight tasks does not become a different
 * recommendation because the picker moved.
 *
 * Direction of "better" is stated per metric rather than assumed. Fewer
 * tokens is better; fewer searches is not obviously anything, and a block
 * that colours it green anyway is inventing a judgement the data did not
 * make.
 */
(function (global) {
  "use strict";

  var AgentDiff = global.AgentDiff;
  if (!AgentDiff || typeof AgentDiff.block !== "function") return;

  // ------------------------------------------------------------------- css
  //
  // The shell is built, not editable from here, so anything it does not
  // already provide is appended once — guarded, because every module load and
  // every re-render would otherwise stack another copy.

  var STYLE_ID = "agentdiff-cost-css";
  var CSS = [
    ".cost-legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}",
    ".cost-note{font-size:11.5px;color:var(--ink-2);margin:0 0 8px;line-height:1.45}",
    ".cost-bars{display:grid;grid-template-columns:minmax(78px,auto) minmax(50px,1fr) auto;",
    "gap:6px 10px;align-items:center;font-size:12px}",
    ".cost-track{height:8px;border-radius:4px;background:var(--surface-2);",
    "border:1px solid var(--rule);overflow:hidden}",
    ".cost-track>i{display:block;height:100%}",
    ".cost-val{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}",
    ".cost-list{display:flex;flex-direction:column;gap:8px}",
    ".cost-card{border:1px solid var(--rule);border-radius:9px;padding:9px 10px;",
    "background:var(--surface);min-width:0}",
    ".cost-card h4{font-size:12.5px;margin:0;line-height:1.35}",
    ".cost-tags{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 0}",
    ".cost-text{font-size:12px;color:var(--ink-2);margin:5px 0 0;line-height:1.45}",
    ".cost-toggle{border:none;background:transparent;color:var(--ink-3);cursor:pointer;",
    "font-size:11.5px;padding:4px 0 0;text-align:left;font-family:inherit}",
    ".cost-toggle:hover{color:var(--accent)}",
    ".cost-detail{margin-top:6px;border-top:1px solid var(--rule);padding-top:6px}",
    ".cost-prehead{display:flex;align-items:center;justify-content:space-between;",
    "gap:8px;margin-top:8px}",
    ".cost-prehead span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;",
    "color:var(--ink-3)}",
    "pre.cost-pre{margin:5px 0 0;padding:8px 9px;background:var(--surface-2);",
    "border:1px solid var(--rule);border-radius:7px;white-space:pre-wrap;",
    "word-break:break-word;line-height:1.5;color:var(--ink-2)}",
    ".cost-mini{font-size:11px;color:var(--ink-3);line-height:1.45}",
    ".cost-strong{font-weight:600}",
  ].join("");

  function ensureStyle() {
    try {
      if (document.getElementById(STYLE_ID)) return;
      var style = document.createElement("style");
      style.id = STYLE_ID;
      style.textContent = CSS;
      (document.head || document.documentElement).appendChild(style);
    } catch (err) { /* styling is a nicety; never take the block with it */ }
  }
  ensureStyle();

  // -------------------------------------------------------------- utilities

  function isNum(value) {
    return typeof value === "number" && isFinite(value);
  }

  function arr(value) { return Array.isArray(value) ? value : []; }

  function agentNames(ctx) {
    var names = (ctx.aggregate && ctx.aggregate.agents) || {};
    var report = ctx.report;
    return {
      a: names.a || (report && report.a && report.a.agent && report.a.agent.name) || "Agent A",
      b: names.b || (report && report.b && report.b.agent && report.b.agent.name) || "Agent B",
    };
  }

  /* The metrics both the per-task delta and the batch means carry, with the
   * one fact neither JSON records: which direction counts as an improvement.
   * `better: "none"` means the data genuinely does not say — more searches
   * can be diligence or thrash — so those rows are shown uncoloured. */
  /* Counts are whole on a single task and fractional as a batch mean. Printing
   * a mean of 0.75 searches as "1" made the table contradict itself — 1 vs 1
   * with a delta of +1 — so a non-integer small count keeps its decimals. */
  function countValue(fmt, value) {
    if (!isNum(value)) return "—";
    if (value === Math.round(value)) return fmt.int(value);
    return Math.abs(value) < 100 ? fmt.num(value, 2) : fmt.int(value);
  }

  var METRICS = [
    { key: "steps", label: "Steps", better: "lower", format: countValue },
    { key: "tokens", label: "Tokens", better: "lower", format: countValue },
    { key: "cost_usd", label: "Cost", better: "lower",
      format: function (fmt, v) { return fmt.usd(v); } },
    { key: "latency_s", label: "Latency", better: "lower",
      format: function (fmt, v) { return fmt.sec(v); } },
    { key: "tool_calls", label: "Tool calls", better: "none", format: countValue },
    { key: "searches", label: "Searches", better: "none", format: countValue },
  ];

  function signed(metric, fmt, value) {
    if (!isNum(value)) return "—";
    if (value === 0) return "0";
    return (value > 0 ? "+" : "−") + metric.format(fmt, Math.abs(value));
  }

  function signedPct(fmt, a, b) {
    if (!isNum(a) || !isNum(b) || a === 0) return "—";
    var change = (b - a) / Math.abs(a);
    if (change === 0) return "0%";
    return (change > 0 ? "+" : "−") + fmt.pct(Math.abs(change), Math.abs(change) < 0.1 ? 1 : 0);
  }

  /* One A/B comparison table, shared by the per-task deltas and the batch
   * means so both read identically. `pick(key)` hands back {a, b} or null for
   * a metric the payload does not carry. */
  function comparisonTable(ctx, pick, options) {
    var fmt = ctx.fmt, h = ctx.h, color = ctx.color;
    var judge = options.judge !== false;
    var table = ctx.h("table", { class: "grid" }, [
      h("tr", null, [
        h("th", { text: "Metric" }),
        h("th", { class: "num", style: { color: color.a }, text: options.aLabel }),
        h("th", { class: "num", style: { color: color.b }, text: options.bLabel }),
        h("th", { class: "num", text: "Δ B−A" }),
        h("th", { class: "num", text: "Change" }),
      ]),
    ]);

    var rows = 0;
    METRICS.forEach(function (metric) {
      var pair = pick(metric.key);
      if (!pair || (!isNum(pair.a) && !isNum(pair.b))) return;
      rows++;
      var delta = isNum(pair.a) && isNum(pair.b) ? pair.b - pair.a : null;
      var tint = color.muted;
      if (judge && metric.better === "lower" && isNum(delta) && delta !== 0) {
        // Lower is better, so B spending more is B doing worse.
        tint = delta > 0 ? color.bad : color.good;
      }
      var label = h("td", null, [
        metric.label,
        metric.better === "none" ? h("span", { class: "cost-mini", text: " ·" }) : null,
      ]);
      table.appendChild(h("tr", null, [
        label,
        h("td", { class: "num", text: metric.format(fmt, pair.a) }),
        h("td", { class: "num", text: metric.format(fmt, pair.b) }),
        h("td", { class: "num", style: { color: tint }, text: signed(metric, fmt, delta) }),
        h("td", { class: "num", style: { color: tint }, text: signedPct(fmt, pair.a, pair.b) }),
      ]));
    });
    return rows ? table : null;
  }

  var DIRECTION_NOTE = "Δ is B minus A. Fewer steps, tokens, dollars and seconds is " +
    "better, so red means B spent more. Rows marked · (tool calls, searches) are " +
    "left uncoloured: the data does not say whether more of them is diligence or thrash.";

  // ------------------------------------------------------------------ copy

  /* Copy without a library and without assuming the clipboard API is
   * reachable — a file:// page in a locked-down browser gets neither the
   * async API nor a permission prompt, and the honest fallback is to select
   * the text and say so rather than to fail silently. */
  function copyToClipboard(text, button, onDone) {
    var restore = button.textContent;
    function finish(label) {
      button.textContent = label;
      setTimeout(function () { button.textContent = restore; }, 1800);
      if (onDone) onDone();
    }
    function legacy() {
      var ok = false;
      try {
        var pad = document.createElement("textarea");
        pad.value = text;
        pad.setAttribute("readonly", "readonly");
        pad.style.position = "fixed";
        pad.style.left = "-9999px";
        pad.style.top = "0";
        document.body.appendChild(pad);
        pad.select();
        ok = document.execCommand("copy");
        document.body.removeChild(pad);
      } catch (err) { ok = false; }
      finish(ok ? "Copied" : "Press ⌘/Ctrl+C");
    }
    try {
      if (global.navigator && global.navigator.clipboard &&
          typeof global.navigator.clipboard.writeText === "function") {
        global.navigator.clipboard.writeText(text).then(
          function () { finish("Copied"); },
          function () { legacy(); }
        );
        return;
      }
    } catch (err) { /* fall through to the synchronous path */ }
    legacy();
  }

  function copyablePrompt(ctx, label, text) {
    var h = ctx.h;
    var button = h("button", { class: "btn", text: "Copy" });
    button.addEventListener("click", function (event) {
      event.stopPropagation();
      ctx.signal("inspect");
      copyToClipboard(text, button);
    });
    return [
      h("div", { class: "cost-prehead" }, [h("span", { text: label }), button]),
      h("pre", { class: "mono cost-pre", text: text }),
    ];
  }

  // -------------------------------------------------------- severity tags

  var SEVERITY_CLASS = {
    critical: "bad", major: "warn", moderate: "warn", minor: "", low: "",
  };

  function severityTag(ctx, severity) {
    var key = String(severity || "").toLowerCase();
    var extra = SEVERITY_CLASS[key];
    return ctx.h("span", {
      class: "tag" + (extra ? " " + extra : ""),
      text: key || "unrated",
    });
  }

  var SEVERITY_RANK = { critical: 3, major: 2, moderate: 2, minor: 1 };

  function rankOf(severity) {
    return SEVERITY_RANK[String(severity || "").toLowerCase()] || 0;
  }

  // ============================================================== 1. deltas

  AgentDiff.block({
    id: "deltas",
    title: "Cost of the difference",
    question: "What did the difference cost?",
    group: "cost",
    size: "normal",

    relevance: function (ctx) {
      var delta = ctx.report && ctx.report.metrics_delta;
      if (!delta) return 0;
      // How much this block has to say = how far apart the two runs actually
      // are on the metrics that carry a direction.
      var worst = 0, seen = 0;
      METRICS.forEach(function (metric) {
        var pair = delta[metric.key];
        if (!pair || !isNum(pair.a) || !isNum(pair.b)) return;
        seen++;
        if (metric.better !== "lower" || pair.a === 0) return;
        worst = Math.max(worst, Math.abs(pair.b - pair.a) / Math.abs(pair.a));
      });
      if (!seen) return 0;
      return Math.min(1, 0.55 + worst);
    },

    render: function (el, ctx) {
      ensureStyle();
      var h = ctx.h;
      var report = ctx.report;
      var delta = report && report.metrics_delta;
      if (!delta) {
        ctx.empty(el, "This report carries no metrics_delta — nothing to compare.");
        return;
      }
      var names = agentNames(ctx);
      var outA = report.a && report.a.outcome;
      var outB = report.b && report.b.outcome;

      el.appendChild(h("div", { class: "cost-legend" }, [
        h("span", { class: "tag a", text: "A · " + names.a }),
        h("span", { class: "tag b", text: "B · " + names.b }),
        report.task && report.task.id
          ? h("span", { class: "cost-mini", text: report.task.id }) : null,
      ]));

      // Outcome first: success is the one comparison where the direction of
      // "better" is not a matter of taste, and it reframes every row below.
      var sameOutcome = null;
      if (outA && typeof outA.success === "boolean" &&
          outB && typeof outB.success === "boolean") {
        sameOutcome = outA.success === outB.success;
        el.appendChild(h("dl", { class: "kv" }, [
          h("dt", { text: "Outcome" }),
          h("dd", null, [
            h("span", {
              class: "tag " + (outA.success ? "good" : "bad"),
              text: "A " + (outA.success ? "succeeded" : "failed"),
            }),
            " ",
            h("span", {
              class: "tag " + (outB.success ? "good" : "bad"),
              text: "B " + (outB.success ? "succeeded" : "failed"),
            }),
          ]),
        ]));
      }

      var table = comparisonTable(ctx, function (key) { return delta[key]; }, {
        aLabel: "A", bLabel: "B", judge: true,
      });
      if (!table) {
        ctx.empty(el, "metrics_delta carries no numbers for this pair.");
        return;
      }
      el.appendChild(h("div", { class: "scroll-x" }, [table]));

      el.appendChild(h("p", { class: "caveat", text: DIRECTION_NOTE }));
      if (sameOutcome === false) {
        el.appendChild(h("p", {
          class: "caveat",
          text: "The two runs did not reach the same outcome, so the cheaper " +
                "run is not automatically the better one — read the spend " +
                "against " + (outA.success ? "A's" : "B's") + " success, not on its own.",
        }));
      }
    },
  });

  // ======================================================= 2. batch-summary

  AgentDiff.block({
    id: "batch-summary",
    title: "Across the batch",
    question: "How do they compare across every task?",
    group: "cost",
    size: "normal",

    relevance: function (ctx) {
      var agg = ctx.aggregate || {};
      var means = agg.means;
      if (!means || !means.a || !means.b) return 0;
      var tasks = isNum(agg.tasks) ? agg.tasks : 0;
      var rate = agg.success_rate || {};
      var gap = isNum(rate.a) && isNum(rate.b) ? Math.abs(rate.a - rate.b) : 0;
      // More tasks and a wider outcome gap both mean more to say here.
      return Math.min(1, 0.5 + Math.min(0.25, tasks / 32) + gap * 0.5);
    },

    render: function (el, ctx) {
      ensureStyle();
      var h = ctx.h, fmt = ctx.fmt, color = ctx.color;
      var agg = ctx.aggregate || {};
      var means = agg.means || {};
      if (!means.a || !means.b) {
        ctx.empty(el, "The batch aggregate carries no per-side means.");
        return;
      }
      var names = agentNames(ctx);
      var tasks = isNum(agg.tasks) ? agg.tasks : (ctx.reports || []).length;
      var rate = agg.success_rate || {};

      el.appendChild(h("div", { class: "cost-legend" }, [
        h("span", { class: "tag a", text: "A · " + names.a }),
        h("span", { class: "tag b", text: "B · " + names.b }),
        h("span", { class: "cost-mini", text: tasks + " task" + (tasks === 1 ? "" : "s") }),
      ]));

      // A rate on its own hides the sample: 87.5% of 8 is seven tasks, and
      // seven-of-eight is the number a reader can actually reason about.
      if (isNum(rate.a) || isNum(rate.b)) {
        var successRow = function (side, label, tint) {
          var value = rate[side];
          if (!isNum(value)) return null;
          var wins = tasks ? Math.round(value * tasks) : null;
          return [
            h("dt", { style: { color: tint }, text: label }),
            h("dd", {
              text: fmt.pct(value, value * 100 % 1 === 0 ? 0 : 1) +
                    (wins === null ? "" : "   (" + wins + " of " + tasks + ")"),
            }),
          ];
        };
        var kids = [];
        [["a", names.a, color.a], ["b", names.b, color.b]].forEach(function (row) {
          var pair = successRow(row[0], row[1], row[2]);
          if (pair) kids = kids.concat(pair);
        });
        if (isNum(rate.a) && isNum(rate.b) && rate.a !== rate.b) {
          var lead = rate.a > rate.b ? names.a : names.b;
          kids.push(h("dt", { text: "Gap" }));
          kids.push(h("dd", {
            style: { color: color.muted },
            text: fmt.num(Math.abs(rate.a - rate.b) * 100, 1) + " pt to " + lead,
          }));
        }
        if (kids.length) el.appendChild(h("dl", { class: "kv" }, kids));
      }

      var table = comparisonTable(ctx, function (key) {
        return { a: means.a[key], b: means.b[key] };
      }, { aLabel: "A mean", bLabel: "B mean", judge: true });
      if (table) {
        el.appendChild(h("div", { class: "scroll-x", style: { marginTop: "8px" } }, [table]));
      }

      var regressions = arr(agg.regressions);
      if (regressions.length) {
        el.appendChild(h("div", { class: "cost-prehead" }, [h("span", { text: "Regressions" })]));
        var list = h("div", { class: "cost-list" });
        regressions.forEach(function (line) {
          list.appendChild(h("div", { class: "cost-text", text: "• " + String(line) }));
        });
        el.appendChild(list);
      }

      el.appendChild(h("p", {
        class: "caveat",
        text: "Means over all " + tasks + " task(s), successes and failures alike. " +
              DIRECTION_NOTE +
              (regressions.length ? "" : " No regressions were flagged for this batch."),
      }));
    },
  });

  // ====================================================== 3. failure-origins

  AgentDiff.block({
    id: "failure-origins",
    title: "Where failures start",
    question: "Where do failures come from?",
    group: "cost",
    size: "normal",

    relevance: function (ctx) {
      var origins = (ctx.aggregate || {}).failure_origins;
      if (!origins) return 0;
      var keys = Object.keys(origins).filter(function (key) { return isNum(origins[key]); });
      if (!keys.length) return 0;
      // A single origin is a clean finding; a wide spread is a busier one.
      return Math.min(1, 0.6 + keys.length * 0.08);
    },

    render: function (el, ctx) {
      ensureStyle();
      var h = ctx.h, fmt = ctx.fmt, color = ctx.color;
      var agg = ctx.aggregate || {};
      var origins = agg.failure_origins || {};
      var rows = Object.keys(origins)
        .filter(function (key) { return isNum(origins[key]); })
        .map(function (key) { return { kind: key, share: origins[key] }; })
        .sort(function (x, y) {
          if (y.share !== x.share) return y.share - x.share;
          return x.kind < y.kind ? -1 : 1;   // ties broken by name, never by order of keys
        });

      if (!rows.length) {
        ctx.empty(el, "No failures were attributed in this batch, so there is no origin mix.");
        return;
      }

      // The denominator: attributed failures, not tasks. Counted from the
      // reports so the block can say "2 of 4" instead of a bare percentage —
      // but only when the fractions actually reconstruct whole runs.
      var failures = 0;
      (ctx.reports || []).forEach(function (report) {
        if (report && report.attribution && report.attribution.failed_agent) failures++;
      });
      var counted = failures > 0;
      if (counted) {
        var total = 0;
        rows.forEach(function (row) {
          var n = row.share * failures;
          if (Math.abs(n - Math.round(n)) > 0.02) counted = false;
          total += Math.round(n);
        });
        if (total !== failures) counted = false;
      }

      var tasks = isNum(agg.tasks) ? agg.tasks : (ctx.reports || []).length;
      el.appendChild(h("p", {
        class: "cost-note",
        text: counted
          ? "Share of the " + failures + " attributed failure(s) across " + tasks + " task(s)."
          : "Share of attributed failures across " + tasks + " task(s); fractions sum to 1.",
      }));

      var max = rows[0].share || 1;
      var chart = h("div", { class: "cost-bars" });
      rows.forEach(function (row) {
        var width = Math.max(2, Math.round((row.share / max) * 100));
        chart.appendChild(h("div", { text: row.kind.replace(/_/g, " ") }));
        chart.appendChild(h("div", { class: "cost-track" }, [
          h("i", { style: { width: width + "%", background: color.bad } }),
        ]));
        chart.appendChild(h("div", {
          class: "cost-val",
          text: fmt.pct(row.share, row.share * 100 % 1 === 0 ? 0 : 1) +
                (counted ? "  ·  " + Math.round(row.share * failures) + " of " + failures : ""),
        }));
      });
      el.appendChild(chart);

      el.appendChild(h("p", {
        class: "caveat",
        text: "Bars are scaled to the largest share, not to 100%. Origin is the " +
              "category of the divergence the engine held responsible — the place " +
              "the run left the path, not the step where it visibly went wrong.",
      }));
    },
  });

  // ============================================================== 4. issues

  AgentDiff.block({
    id: "issues",
    title: "Recurring issues",
    question: "What recurs across tasks?",
    group: "cost",
    size: "normal",

    relevance: function (ctx) {
      var issues = (ctx.aggregate || {}).issues;
      var list = issues && arr(issues.issues);
      if (!list || !list.length) return 0;
      var counts = (issues && issues.counts) || {};
      var critical = isNum(counts.critical) ? counts.critical : 0;
      return Math.min(1, 0.6 + critical * 0.1 + Math.min(0.2, list.length * 0.03));
    },

    render: function (el, ctx) {
      ensureStyle();
      var h = ctx.h, fmt = ctx.fmt;
      var issues = (ctx.aggregate || {}).issues || {};
      var list = arr(issues.issues);
      if (!list.length) {
        ctx.empty(el, "No divergences collapsed into a recurring issue for this batch.");
        return;
      }

      var counts = issues.counts || {};
      var tags = h("div", { class: "cost-legend" });
      ["critical", "major", "minor"].forEach(function (name) {
        if (!isNum(counts[name]) || counts[name] <= 0) return;
        tags.appendChild(h("span", {
          class: "tag" + (SEVERITY_CLASS[name] ? " " + SEVERITY_CLASS[name] : ""),
          text: counts[name] + " " + name,
        }));
      });
      if (isNum(issues.total_divergences)) {
        tags.appendChild(h("span", {
          class: "cost-mini",
          text: issues.total_divergences + " divergence(s) → " +
                (isNum(issues.active) ? issues.active : list.length) + " active issue(s)",
        }));
      }
      if (tags.childNodes.length) el.appendChild(tags);

      if (issues.narrative) {
        el.appendChild(h("p", { class: "cost-note", text: issues.narrative }));
      }

      // Impact order: anything that caused a failure outranks anything that
      // only cost tokens, and within that, the expensive ones come first.
      var sorted = list.slice().sort(function (x, y) {
        var bySeverity = rankOf(y.severity) - rankOf(x.severity);
        if (bySeverity) return bySeverity;
        var byFailures = (y.failures_caused || 0) - (x.failures_caused || 0);
        if (byFailures) return byFailures;
        var byTokens = (y.extra_tokens || 0) - (x.extra_tokens || 0);
        if (byTokens) return byTokens;
        return String(x.id) < String(y.id) ? -1 : 1;
      });

      var container = h("div", { class: "cost-list" });
      sorted.forEach(function (issue) {
        container.appendChild(issueCard(ctx, issue));
      });
      el.appendChild(container);

      var caveats = [];
      if (isNum(issues.suppressed) && issues.suppressed > 0) {
        caveats.push(issues.suppressed + " issue(s) are suppressed by .agentdiffignore — " +
          "still listed and marked, excluded only from the headline counts.");
      }
      caveats.push("Severity is mechanical: critical = caused a failure, " +
        "major = wasted ≥500 tokens, otherwise minor.");
      el.appendChild(h("p", { class: "caveat", text: caveats.join(" ") }));

      function issueCard(ctx, issue) {
        var card = h("div", { class: "cost-card" });
        card.appendChild(h("h4", { text: issue.title || issue.id || "untitled issue" }));

        var row = h("div", { class: "cost-tags" }, [
          severityTag(ctx, issue.severity),
          issue.kind ? h("span", { class: "tag", text: String(issue.kind).replace(/_/g, " ") }) : null,
          issue.recurring ? h("span", { class: "tag warn", text: "recurring" }) : null,
          issue.suppressed ? h("span", { class: "tag", text: "suppressed" }) : null,
        ]);
        arr(issue.agents).forEach(function (agent) {
          row.appendChild(h("span", { class: "tag b", text: agent }));
        });
        card.appendChild(row);

        var facts = [];
        if (isNum(issue.occurrence_count)) {
          facts.push(h("dt", { text: "Occurrences" }));
          facts.push(h("dd", {
            text: issue.occurrence_count + " on " + arr(issue.tasks).length + " task(s)",
          }));
        }
        if (isNum(issue.failures_caused)) {
          facts.push(h("dt", { text: "Failures" }));
          facts.push(h("dd", { text: issue.failures_caused + " caused" }));
        }
        if (isNum(issue.extra_tokens) || isNum(issue.extra_steps)) {
          facts.push(h("dt", { text: "Waste" }));
          facts.push(h("dd", {
            text: [
              isNum(issue.extra_steps) ? "+" + fmt.int(issue.extra_steps) + " steps" : null,
              isNum(issue.extra_tokens) ? "+" + fmt.int(issue.extra_tokens) + " tok" : null,
              isNum(issue.extra_latency_s) ? "+" + fmt.sec(issue.extra_latency_s) : null,
            ].filter(Boolean).join("  ·  "),
          }));
        }
        if (arr(issue.tasks).length) {
          facts.push(h("dt", { text: "Tasks" }));
          facts.push(h("dd", { class: "mono", text: arr(issue.tasks).join(", ") }));
        }
        if (facts.length) card.appendChild(h("dl", { class: "kv" }, facts));

        if (issue.summary) card.appendChild(h("p", { class: "cost-text", text: issue.summary }));

        var occurrences = arr(issue.occurrences);
        if (occurrences.length) {
          var detail = h("div", { class: "cost-detail", style: { display: "none" } });
          occurrences.forEach(function (item) {
            detail.appendChild(h("div", { class: "cost-mini" }, [
              h("span", { class: "mono cost-strong", text: item.task || "?" }),
              item.caused_failure ? h("span", { class: "tag bad", text: "caused failure" }) : null,
              " ",
              String(item.summary || ""),
            ]));
          });
          var toggle = h("button", {
            class: "cost-toggle",
            text: "▸ " + occurrences.length + " occurrence(s)",
          });
          toggle.addEventListener("click", function (event) {
            event.stopPropagation();
            var open = detail.style.display === "none";
            detail.style.display = open ? "block" : "none";
            toggle.textContent = (open ? "▾ " : "▸ ") + occurrences.length + " occurrence(s)";
            if (open) ctx.signal("inspect");
          });
          card.appendChild(toggle);
          card.appendChild(detail);
        }
        return card;
      }
    },
  });

  // ===================================================== 5. recommendations

  AgentDiff.block({
    id: "recommendations",
    title: "What to change",
    question: "What should I change?",
    group: "cost",
    size: "normal",

    relevance: function (ctx) {
      var list = arr((ctx.aggregate || {}).recommendations);
      if (!list.length) return 0;
      var critical = list.filter(function (item) { return rankOf(item.severity) >= 3; }).length;
      return Math.min(1, 0.65 + critical * 0.1 + Math.min(0.15, list.length * 0.03));
    },

    render: function (el, ctx) {
      ensureStyle();
      var h = ctx.h;
      var list = arr((ctx.aggregate || {}).recommendations);
      if (!list.length) {
        ctx.empty(el, "No recommendations were derived from this batch.");
        return;
      }

      var sorted = list.slice().sort(function (x, y) {
        var bySeverity = rankOf(y.severity) - rankOf(x.severity);
        if (bySeverity) return bySeverity;
        var byEvidence = arr(y.evidence_tasks).length - arr(x.evidence_tasks).length;
        if (byEvidence) return byEvidence;
        return String(x.category || "") < String(y.category || "") ? -1 : 1;
      });

      var container = h("div", { class: "cost-list" });
      sorted.forEach(function (rec) {
        var card = h("div", { class: "cost-card" });

        card.appendChild(h("div", { class: "cost-tags" }, [
          severityTag(ctx, rec.severity),
          rec.category
            ? h("span", { class: "tag", text: String(rec.category).replace(/_/g, " ") }) : null,
          rec.agent ? h("span", { class: "tag b", text: rec.agent }) : null,
        ]));

        if (rec.finding) {
          card.appendChild(h("p", { class: "cost-text", text: rec.finding }));
        }

        var facts = [];
        if (rec.expected_gain) {
          facts.push(h("dt", { text: "Expected gain" }));
          facts.push(h("dd", { style: { color: ctx.color.good }, text: rec.expected_gain }));
        }
        if (arr(rec.evidence_tasks).length) {
          facts.push(h("dt", { text: "Evidence" }));
          facts.push(h("dd", { class: "mono", text: arr(rec.evidence_tasks).join(", ") }));
        }
        if (facts.length) card.appendChild(h("dl", { class: "kv" }, facts));

        if (rec.suggested_prompt) {
          copyablePrompt(ctx, "Suggested prompt", rec.suggested_prompt)
            .forEach(function (node) { card.appendChild(node); });
        }
        container.appendChild(card);
      });
      el.appendChild(container);

      el.appendChild(h("p", {
        class: "caveat",
        text: "Expected gain is a ceiling read off the tasks named in the evidence — " +
              "what these runs would have saved had the issue not occurred, not a " +
              "prediction for the next batch.",
      }));
    },
  });

  // ============================================================ 6. playbook

  AgentDiff.block({
    id: "playbook",
    title: "What good looks like",
    question: "What habits are winning?",
    group: "cost",
    size: "normal",

    relevance: function (ctx) {
      var list = arr((ctx.aggregate || {}).playbook);
      if (!list.length) return 0;
      return Math.min(1, 0.6 + Math.min(0.3, list.length * 0.08));
    },

    render: function (el, ctx) {
      ensureStyle();
      var h = ctx.h;
      var list = arr((ctx.aggregate || {}).playbook);
      if (!list.length) {
        ctx.empty(el, "No winning habit generalized across enough tasks to be worth naming.");
        return;
      }

      el.appendChild(h("p", {
        class: "cost-note",
        text: "The mirror of the issue list: decisions that went right often enough, " +
              "and mattered enough, to be worth repeating.",
      }));

      var container = h("div", { class: "cost-list" });
      list.forEach(function (entry) {
        var card = h("div", { class: "cost-card" });
        card.appendChild(h("h4", { text: entry.habit || "unnamed habit" }));

        var tags = h("div", { class: "cost-tags" }, [
          entry.kind ? h("span", { class: "tag good", text: String(entry.kind).replace(/_/g, " ") }) : null,
        ]);
        arr(entry.agents).forEach(function (agent) {
          tags.appendChild(h("span", { class: "tag a", text: agent }));
        });
        card.appendChild(tags);

        var facts = [];
        if (entry.impact) {
          facts.push(h("dt", { text: "Impact" }));
          facts.push(h("dd", { style: { color: ctx.color.good }, text: entry.impact }));
        }
        if (entry.evidence) {
          facts.push(h("dt", { text: "Evidence" }));
          facts.push(h("dd", { text: entry.evidence }));
        }
        if (facts.length) card.appendChild(h("dl", { class: "kv" }, facts));
        container.appendChild(card);
      });
      el.appendChild(container);

      el.appendChild(h("p", {
        class: "caveat",
        text: "Attribution, not endorsement: a habit is listed because it decided " +
              "divergences in this batch's favour, which is evidence it worked here " +
              "rather than proof it generalizes.",
      }));
    },
  });
})(typeof window !== "undefined" ? window : this);

</script>
<!-- 40_signal.js -->
<script>
/* AgentDiff blocks — evidence & uncertainty.
 *
 * Six blocks that answer the questions a diff alone cannot: did the model
 * know it was going wrong, would a confidence gate have caught it, what did
 * each agent actually claim, where did the claim come from, which run
 * attributes travel with failure, and do those attributes survive controlling
 * for each other.
 *
 * Every figure here means something narrower than it looks, so every figure
 * here is rendered with its qualifier attached: synthetic demo telemetry is
 * labelled as such, an entropy floor is not called an estimate, a lift that
 * reverses under within-task stratification is marked as the artifact it is,
 * an unreliable fit says so above its own coefficients, and denominators are
 * always on screen next to the rates computed from them.
 */
(function (global) {
  "use strict";

  var AgentDiff = global.AgentDiff;
  if (!AgentDiff || typeof AgentDiff.block !== "function") return;

  // ------------------------------------------------------------------ style
  // The shell cannot be edited from a module, so the few primitives these
  // blocks need beyond .kv/.tag/.grid are appended once, guarded.

  var styleInjected = false;
  function ensureStyle() {
    if (styleInjected) return;
    styleInjected = true;
    try {
      if (document.getElementById("agentdiff-signal-style")) return;
      var node = document.createElement("style");
      node.id = "agentdiff-signal-style";
      node.textContent = [
        ".sig-note{border:1px solid var(--rule);border-left-width:3px;border-radius:7px;",
        "padding:7px 9px;font-size:12px;line-height:1.45;margin:0 0 9px;",
        "background:var(--surface-2);color:var(--ink-2)}",
        ".sig-note strong{color:var(--ink)}",
        ".sig-note.bad{border-left-color:var(--bad)}",
        ".sig-note.warn{border-left-color:var(--warn)}",
        ".sig-note.good{border-left-color:var(--good)}",
        ".sig-note.info{border-left-color:var(--rule-2)}",
        ".sig-note + .sig-note{margin-top:-3px}",
        ".sig-item{border-top:1px solid var(--rule);padding:7px 0}",
        ".sig-item:first-child{border-top:none;padding-top:2px}",
        ".sig-line{font-size:12.5px;color:var(--ink)}",
        ".sig-sub{font-size:11.5px;color:var(--ink-3);line-height:1.45}",
        ".sig-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}",
        ".sig-legend{display:flex;flex-wrap:wrap;gap:11px;font-size:11px;",
        "color:var(--ink-3);margin-top:7px}",
        ".sig-dot{display:inline-block;width:9px;height:9px;border-radius:50%;",
        "vertical-align:-1px;margin-right:4px}",
        ".sig-ring{display:inline-block;width:9px;height:9px;border-radius:50%;",
        "vertical-align:-1px;margin-right:4px;border:1.5px solid currentColor}",
        ".sig-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;",
        "color:var(--ink-3);margin:11px 0 5px}",
        ".sig-h:first-child{margin-top:0}",
        ".sig-more{margin-top:8px}",
      ].join("");
      document.head.appendChild(node);
    } catch (err) { /* styling is a nicety; the blocks still read without it */ }
  }

  // ------------------------------------------------------------------ utils

  function isNum(v) { return typeof v === "number" && !isNaN(v); }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function obj(v) { return v && typeof v === "object" ? v : null; }

  function agentName(report, side) {
    var run = report && report[side];
    var agent = run && run.agent;
    if (agent && agent.name) return agent.name;
    return side === "a" ? "Agent A" : "Agent B";
  }

  function stepsOf(report, side) {
    var run = report && report[side];
    return run ? arr(run.steps) : [];
  }

  /* What produced these confidences, in the traces' own words.
   *
   * The demo corpus carries source: "synthetic-demo" — numbers invented to
   * exercise the analysis. Presenting those as a measurement is the single
   * most misleading thing this block could do, so the sources are collected
   * from the steps themselves rather than assumed. */
  function telemetryProvenance(report) {
    var sources = [];
    var bases = [];
    var scored = 0;
    ["a", "b"].forEach(function (side) {
      stepsOf(report, side).forEach(function (step) {
        var model = obj(step && step.model);
        if (!model) return;
        scored++;
        var source = model.source;
        if (typeof source === "string" && source && sources.indexOf(source) < 0) {
          sources.push(source);
        }
        var basis = model.entropy_basis;
        if (typeof basis === "string" && basis && bases.indexOf(basis) < 0) {
          bases.push(basis);
        }
      });
    });
    var synthetic = sources.some(function (s) {
      return s.toLowerCase().indexOf("synthetic") >= 0 || s.toLowerCase().indexOf("demo") >= 0;
    });
    return { sources: sources, bases: bases, scored: scored, synthetic: synthetic };
  }

  function note(ctx, kind, kids) {
    return ctx.h("div", { class: "sig-note " + kind }, kids);
  }

  function tag(ctx, cls, text) {
    return ctx.h("span", { class: cls ? "tag " + cls : "tag", text: text });
  }

  function pct(ctx, value, places) {
    return isNum(value) ? ctx.fmt.pct(value, places === undefined ? 1 : places) : "—";
  }

  function points(value) {
    // Confidence differences read as percentage points, not percentages.
    return (Math.abs(value) * 100).toFixed(1) + " points";
  }

  function svgText(ctx, x, y, text, fill, size, anchor, weight) {
    return ctx.svg("text", {
      x: x, y: y, fill: fill, "font-size": size || 9,
      "text-anchor": anchor || "start",
      "font-family": "var(--sans)",
      "font-weight": weight || null,
    }, [text]);
  }

  /* An SVG that fills its card but stops growing.
   *
   * These cards live in a 1-to-3 column layout, so the same chart may get
   * 300px or 1000px. Scaling a 320-unit viewBox to the full width of a
   * one-column layout would blow the labels up to headline size, so the
   * drawing is capped near its natural scale instead. */
  function chart(ctx, width, height) {
    return ctx.svg("svg", {
      viewBox: "0 0 " + width + " " + height,
      preserveAspectRatio: "xMinYMin meet",
      style: "width:100%;max-width:" + Math.round(width * 1.5) +
             "px;height:auto;display:block;overflow:visible",
      role: "img",
    });
  }

  function scale(lo, hi, from, to) {
    var span = hi - lo;
    if (!span) span = 1;
    return function (value) { return from + ((value - lo) / span) * (to - from); };
  }

  function truncate(ctx, text, max) {
    return ctx.fmt.truncate(text === null || text === undefined ? "" : String(text), max);
  }

  // ================================================================= 1. confidence

  AgentDiff.block({
    id: "confidence",
    title: "Model confidence",
    question: "Did the model know it was going wrong?",
    group: "signal",
    size: "wide",

    relevance: function (ctx) {
      var u = obj(ctx.report && ctx.report.uncertainty);
      if (!u || u.available === false) return 0;
      var hasSeries = arr(u.a && u.a.series).length || arr(u.b && u.b.series).length;
      if (!hasSeries) return 0;
      var signal = obj(u.signal);
      if (!signal) return 0.45;
      return signal.verdict === "flagged" ? 0.95 : 0.88;
    },

    render: function (el, ctx) {
      ensureStyle();
      var report = ctx.report;
      var u = obj(report && report.uncertainty);
      if (!u) return ctx.empty(el, "This report carries no model telemetry, so there is no confidence to plot.");
      if (u.available === false) {
        return ctx.empty(el, "Model telemetry unavailable" +
          (typeof u.reason === "string" && u.reason ? ": " + u.reason : "") +
          ". No steps carried per-token probabilities.");
      }
      var seriesA = arr(u.a && u.a.series);
      var seriesB = arr(u.b && u.b.series);
      if (!seriesA.length && !seriesB.length) {
        return ctx.empty(el, "Telemetry is available for this batch but no step on either run was scored.");
      }

      var prov = telemetryProvenance(report);
      var signal = obj(u.signal);

      // ---- the label on the number, before the number ------------------
      if (prov.synthetic) {
        el.appendChild(note(ctx, "warn", [
          ctx.h("strong", { text: "Synthetic demo telemetry — not a measurement. " }),
          ctx.h("span", {
            text: "Every scored step on this run reports source " +
              prov.sources.join(", ") + ". These confidences were generated to " +
              "exercise the analysis; they are not provider logprobs, and no " +
              "conclusion about a real model follows from them. On a real trace " +
              "the same block reads logprobs from the serving stack.",
          }),
        ]));
      } else if (prov.sources.length) {
        el.appendChild(note(ctx, "info", [
          ctx.h("strong", { text: "Telemetry source: " }),
          ctx.h("span", { text: prov.sources.join(", ") + " — mean per-token probability over the text each step generated." }),
        ]));
      }

      // ---- verdict, in plain language ----------------------------------
      if (signal) {
        var failed = signal.failed_agent === "a" ? "a" : "b";
        var who = agentName(report, failed);
        var flagged = signal.verdict === "flagged";
        var drop = isNum(signal.drop) ? signal.drop : null;
        var lead = isNum(signal.lead_steps) ? signal.lead_steps : null;

        var sentence;
        if (flagged) {
          sentence = who + " signalled it. Confidence at the step that caused the " +
            "failure (step " + signal.root_cause_step + ") was " +
            pct(ctx, signal.confidence_at_root) + ", against its own baseline of " +
            pct(ctx, signal.baseline_confidence) +
            (drop !== null ? " — " + points(drop) + " below baseline" : "") + ". " +
            (lead === 0 || lead === null
              ? "The drop appears at the failing step itself."
              : "The drop began " + lead + " step(s) earlier.") +
            " A runtime confidence gate would have caught this run.";
        } else {
          sentence = who + " gave no warning. It was " +
            pct(ctx, signal.confidence_at_root) + " confident at the step that caused " +
            "the failure (step " + signal.root_cause_step + ") — " +
            (drop !== null && drop < 0
              ? points(drop) + " above its own baseline of " + pct(ctx, signal.baseline_confidence)
              : "no lower than its own baseline of " + pct(ctx, signal.baseline_confidence)) +
            ". No threshold on this model's own uncertainty catches this class of failure.";
        }

        el.appendChild(note(ctx, flagged ? "good" : "bad", [
          tag(ctx, flagged ? "good" : "bad", flagged ? "flagged" : "silent"),
          ctx.h("span", { text: "  " + sentence }),
        ]));
        if (typeof signal.mitigation === "string" && signal.mitigation) {
          el.appendChild(ctx.h("div", { class: "sig-sub", text: "Mitigation: " + signal.mitigation }));
        }
      } else {
        el.appendChild(note(ctx, "info", [
          ctx.h("strong", { text: "No verdict for this task. " }),
          ctx.h("span", {
            text: "No failure was attributed to a step carrying telemetry — both runs " +
              "succeeded, both failed, or the failing step is unscored. The lines below " +
              "are each run's confidence and nothing more.",
          }),
        ]));
      }

      // ---- the plot -----------------------------------------------------
      var color = ctx.color;
      var legend = ctx.h("div", { class: "sig-legend" }, [
        ctx.h("span", null, [
          ctx.h("i", { class: "sig-dot", style: { background: color.a } }),
          agentName(report, "a"),
        ]),
        ctx.h("span", null, [
          ctx.h("i", { class: "sig-dot", style: { background: color.b } }),
          agentName(report, "b"),
        ]),
        signal ? ctx.h("span", { style: { color: color.bad }, text: "▎ root cause step " + signal.root_cause_step }) : null,
      ]);

      var W = 320, H = 150;
      var pad = { l: 27, r: 6, t: 9, b: 19 };
      var values = seriesA.concat(seriesB).filter(isNum);
      var lo = Math.max(0, Math.floor((Math.min.apply(null, values) - 0.04) * 20) / 20);
      var hi = Math.min(1, Math.ceil((Math.max.apply(null, values) + 0.04) * 20) / 20);
      if (hi - lo < 0.05) { hi = Math.min(1, lo + 0.1); }
      var lastIndex = Math.max(seriesA.length, seriesB.length) - 1;
      var x = scale(0, lastIndex || 1, pad.l, W - pad.r);
      var y = scale(lo, hi, H - pad.b, pad.t);

      var plot = chart(ctx, W, H);
      [lo, (lo + hi) / 2, hi].forEach(function (value) {
        plot.appendChild(ctx.svg("line", {
          x1: pad.l, x2: W - pad.r, y1: y(value), y2: y(value),
          stroke: color.grid, "stroke-width": 1,
        }));
        plot.appendChild(svgText(ctx, pad.l - 4, y(value) + 3, ctx.fmt.pct(value, 0), color.muted, 8.5, "end"));
      });

      // step-index ticks, thinned so a ten-step run does not become a smear
      var tickEvery = lastIndex > 12 ? Math.ceil(lastIndex / 6) : (lastIndex > 6 ? 2 : 1);
      for (var i = 0; i <= lastIndex; i += tickEvery) {
        plot.appendChild(svgText(ctx, x(i), H - pad.b + 11, String(i), color.muted, 8.5, "middle"));
      }
      plot.appendChild(svgText(ctx, W - pad.r, H - 2, "step index", color.muted, 8.5, "end"));

      if (signal && isNum(signal.root_cause_step) && signal.root_cause_step <= lastIndex) {
        plot.appendChild(ctx.svg("line", {
          x1: x(signal.root_cause_step), x2: x(signal.root_cause_step),
          y1: pad.t - 2, y2: H - pad.b,
          stroke: color.bad, "stroke-width": 1.2, "stroke-dasharray": "3 2",
        }));
      }

      function drawSeries(series, stroke) {
        // Break the line at unscored steps rather than bridging them: a
        // straight segment across a null claims a measurement that was never
        // taken.
        var run = [];
        function flush() {
          if (run.length > 1) {
            plot.appendChild(ctx.svg("polyline", {
              points: run.map(function (p) { return p[0] + "," + p[1]; }).join(" "),
              fill: "none", stroke: stroke, "stroke-width": 1.6,
              "stroke-linejoin": "round", "stroke-linecap": "round",
            }));
          }
          run = [];
        }
        series.forEach(function (value, index) {
          if (!isNum(value)) { flush(); return; }
          run.push([x(index), y(value)]);
          plot.appendChild(ctx.svg("circle", {
            cx: x(index), cy: y(value), r: 2, fill: stroke,
          }));
        });
        flush();
      }
      drawSeries(seriesA, color.a);
      drawSeries(seriesB, color.b);

      if (signal && isNum(signal.confidence_at_root) && isNum(signal.root_cause_step) &&
          signal.root_cause_step <= lastIndex) {
        plot.appendChild(ctx.svg("circle", {
          cx: x(signal.root_cause_step), cy: y(signal.confidence_at_root),
          r: 4.5, fill: "none", stroke: color.bad, "stroke-width": 1.6,
        }));
      }

      el.appendChild(ctx.h("div", { class: "scroll-x" }, [plot]));
      el.appendChild(legend);

      // ---- the numbers, each with its unit -------------------------------
      var basisNote = null;
      if (prov.bases.length) {
        basisNote = prov.bases.indexOf("binary_floor") >= 0
          ? "entropy basis " + prov.bases.join(", ") +
            " — with only the chosen token's logprob, entropy is the binary entropy of that probability: a floor, not an estimate."
          : "entropy basis " + prov.bases.join(", ") +
            " — computed over the returned top-k distribution, so the truncated tail makes it approximate.";
      }

      var kv = ctx.h("dl", { class: "kv" });
      [["a", seriesA], ["b", seriesB]].forEach(function (pair) {
        var side = pair[0];
        var stats = obj(u[side]);
        if (!stats) return;
        kv.appendChild(ctx.h("dt", null, [tag(ctx, side, agentName(report, side))]));
        kv.appendChild(ctx.h("dd", {
          text: "mean " + pct(ctx, stats.mean_confidence) +
            " · low " + pct(ctx, stats.min_confidence) +
            " · worst token " + pct(ctx, stats.min_token_confidence) +
            " · entropy " + (isNum(stats.mean_entropy) ? ctx.fmt.num(stats.mean_entropy, 2) + " nats" : "—") +
            " · " + (isNum(stats.steps_scored) ? stats.steps_scored : 0) + " step(s) scored",
        }));
      });
      el.appendChild(kv);

      if (basisNote) el.appendChild(ctx.h("div", { class: "caveat", text: basisNote }));
      if (typeof u.narrative === "string" && u.narrative) {
        el.appendChild(ctx.h("div", { class: "caveat", text: u.narrative }));
      }
      el.appendChild(ctx.h("div", {
        class: "caveat",
        text: "Confidence is the mean per-token probability of the text a step generated. " +
          "It measures the model's fluency over its own output, not whether the output is true.",
      }));
    },
  });

  // ================================================================ 2. calibration

  AgentDiff.block({
    id: "calibration",
    title: "Confidence when wrong",
    question: "Was it confident when it was wrong — would a gate have caught it?",
    group: "signal",
    size: "normal",

    relevance: function (ctx) {
      var u = obj(ctx.report && ctx.report.uncertainty);
      var local = u ? obj(u.calibration) : null;
      var batch = obj(ctx.aggregate && ctx.aggregate.calibration);
      if (!local && (!batch || batch.available === false)) return 0;
      if (local && local.confident_when_wrong) return 0.9;
      return local ? 0.7 : 0.55;
    },

    render: function (el, ctx) {
      ensureStyle();
      var report = ctx.report;
      var u = obj(report && report.uncertainty);
      var local = u ? obj(u.calibration) : null;
      var signal = u ? obj(u.signal) : null;
      var batch = obj(ctx.aggregate && ctx.aggregate.calibration);
      var hasBatch = batch && batch.available !== false && obj(batch.agents);

      if (!local && !hasBatch) {
        return ctx.empty(el, "No failure on this task was attributed to a step carrying " +
          "telemetry, and the batch has no calibration summary — so there is nothing to " +
          "calibrate against.");
      }

      if (local && signal) {
        var side = signal.failed_agent === "a" ? "a" : "b";
        var who = agentName(report, side);
        var conf = isNum(local.confidence_at_wrong_step)
          ? local.confidence_at_wrong_step : signal.confidence_at_root;

        el.appendChild(note(ctx, local.confident_when_wrong ? "bad" : "good", [
          tag(ctx, local.confident_when_wrong ? "bad" : "good",
            local.confident_when_wrong ? "confident when wrong" : "uncertain when wrong"),
          ctx.h("span", {
            text: "  " + who + " was " + pct(ctx, conf) + " confident at the step that " +
              "caused the failure (step " + signal.root_cause_step + "), against a run " +
              "baseline of " + pct(ctx, signal.baseline_confidence) + ".",
          }),
        ]));

        // Would a gate have caught it? Answered from this run's own series,
        // and only as far as this run's own series can answer it.
        var series = arr(u[side] && u[side].series);
        var others = [];
        series.forEach(function (value, index) {
          if (index !== signal.root_cause_step && isNum(value)) others.push(value);
        });
        var gate = ctx.h("div");
        if (!isNum(conf) || !others.length) {
          gate.appendChild(ctx.h("div", {
            class: "sig-line",
            text: "Too few scored steps on this run to say where a threshold would sit.",
          }));
        } else {
          var minOther = Math.min.apply(null, others);
          var falseAlarms = others.filter(function (v) { return v <= conf; }).length;
          if (conf < minOther) {
            var threshold = (conf + minOther) / 2;
            gate.appendChild(note(ctx, "warn", [
              ctx.h("strong", { text: "A gate at " + ctx.fmt.pct(threshold, 1) + " would have caught this step and fired nowhere else on this run. " }),
              ctx.h("span", {
                text: "That threshold was chosen after seeing which step failed — it is " +
                  "hindsight on one run, not a validated gate. The batch view below is " +
                  "the honest version of the question.",
              }),
            ]));
          } else {
            gate.appendChild(note(ctx, "bad", [
              ctx.h("strong", { text: "No threshold would have caught this. " }),
              ctx.h("span", {
                text: "Any gate low enough to fire at the failing step (" + pct(ctx, conf) +
                  ") would first have fired on " + falseAlarms + " other scored step(s) " +
                  "that were fine — this run went as low as " + ctx.fmt.pct(minOther, 1) +
                  " without failing. Confidence does not separate the failure from the " +
                  "rest of the run; only external verification does.",
              }),
            ]));
          }
        }
        el.appendChild(gate);
      } else if (local) {
        el.appendChild(note(ctx, "info", [
          ctx.h("span", {
            text: "Calibration recorded for this task, but without an attributed failing " +
              "step there is no gate question to answer.",
          }),
        ]));
      } else {
        el.appendChild(note(ctx, "info", [
          ctx.h("span", {
            text: "This task has no attributed failure with telemetry. The batch summary " +
              "below covers every task that does.",
          }),
        ]));
      }

      if (!hasBatch) return;

      el.appendChild(ctx.h("div", { class: "sig-h", text: "Across the batch" }));
      var table = ctx.h("table", { class: "grid" }, [
        ctx.h("tr", null, [
          ctx.h("th", { text: "Agent" }),
          ctx.h("th", { class: "num", text: "Failures scored" }),
          ctx.h("th", { class: "num", text: "Flagged" }),
          ctx.h("th", { class: "num", text: "Silent" }),
          ctx.h("th", { class: "num", text: "Conf. when wrong" }),
          ctx.h("th", { text: "Verdict" }),
        ]),
      ]);
      var thin = [];
      Object.keys(batch.agents).forEach(function (name) {
        var row = obj(batch.agents[name]) || {};
        var supervisable = row.verdict === "supervisable";
        if (isNum(row.failures_with_telemetry) && row.failures_with_telemetry < 5) thin.push(name);
        table.appendChild(ctx.h("tr", null, [
          ctx.h("td", { text: name }),
          ctx.h("td", { class: "num", text: ctx.fmt.int(row.failures_with_telemetry) }),
          ctx.h("td", { class: "num", text: ctx.fmt.int(row.flagged) }),
          ctx.h("td", { class: "num", text: ctx.fmt.int(row.silent) }),
          ctx.h("td", { class: "num", text: pct(ctx, row.mean_confidence_when_wrong) }),
          ctx.h("td", null, [tag(ctx, supervisable ? "good" : "bad", row.verdict || "—")]),
        ]));
      });
      el.appendChild(ctx.h("div", { class: "scroll-x" }, [table]));

      if (thin.length) {
        el.appendChild(ctx.h("div", {
          class: "caveat",
          text: "Fewer than 5 scored failures for " + thin.join(", ") +
            " — a flagged rate on that few failures is a hint, not a rate.",
        }));
      }
      if (typeof batch.narrative === "string" && batch.narrative) {
        el.appendChild(ctx.h("div", { class: "caveat", text: batch.narrative }));
      }
      el.appendChild(ctx.h("div", {
        class: "caveat",
        text: "Only failures whose root-cause step carried telemetry are counted; " +
          "unscored failures are excluded rather than assumed silent.",
      }));
    },
  });

  // ===================================================================== 3. claims

  AgentDiff.block({
    id: "claims",
    title: "Claims",
    question: "What did each agent claim, and does it match?",
    group: "signal",
    size: "tall",

    relevance: function (ctx) {
      var s = obj(ctx.report && ctx.report.semantic);
      if (!s) return 0;
      var claims = arr(s.claims);
      if (!claims.length) return 0;
      if (arr(s.conflicts).length) return 0.92;
      var decided = claims.filter(function (c) { return c.matches_expected !== null && c.matches_expected !== undefined; });
      return decided.length ? 0.75 : 0.5;
    },

    render: function (el, ctx) {
      ensureStyle();
      var report = ctx.report;
      var s = obj(report && report.semantic);
      if (!s) return ctx.empty(el, "No semantic analysis on this report.");
      var claims = arr(s.claims);
      if (!claims.length) {
        return ctx.empty(el, "No typed claims were extracted from either trajectory — " +
          "nothing here carried a money figure, date, version, URL or number to compare.");
      }

      var byId = {};
      claims.forEach(function (claim) { if (claim && claim.id) byId[claim.id] = claim; });

      // ---- conflicts first: they are the reason to read this block ------
      var conflicts = arr(s.conflicts);
      var conflicted = {};
      conflicts.forEach(function (conflict) {
        if (conflict.a_claim) conflicted[conflict.a_claim] = true;
        if (conflict.b_claim) conflicted[conflict.b_claim] = true;
      });

      if (conflicts.length) {
        el.appendChild(ctx.h("div", { class: "sig-h", text: conflicts.length + " conflicting claim(s)" }));
        conflicts.forEach(function (conflict) {
          el.appendChild(note(ctx, "bad", [
            tag(ctx, "bad", conflict.kind || "conflict"),
            ctx.h("span", { text: "  " + (conflict.summary || "the two runs carried different values") }),
          ]));
        });
      } else {
        el.appendChild(note(ctx, "good", [
          ctx.h("span", { text: "No same-kind claim was carried with different values into the two answers." }),
        ]));
      }

      // ---- claims grouped by kind ---------------------------------------
      var kinds = [];
      var groups = {};
      claims.forEach(function (claim) {
        var kind = claim.kind || "other";
        if (!groups[kind]) { groups[kind] = []; kinds.push(kind); }
        groups[kind].push(claim);
      });
      // Kinds that actually decided something — a conflict, or a claim the
      // expected answer can judge — come first; a pile of incidental URLs
      // must not push the money figure below the fold.
      function weight(kind) {
        return groups[kind].filter(function (claim) {
          return conflicted[claim.id] || claim.matches_expected === true ||
            claim.matches_expected === false;
        }).length;
      }
      kinds.sort(function (x, y) {
        return (weight(y) - weight(x)) || (groups[y].length - groups[x].length) ||
          (x < y ? -1 : x > y ? 1 : 0);
      });

      var LIMIT = 8;
      var shown = 0;
      var hiddenCount = 0;
      var body = ctx.h("div");

      function renderClaim(claim) {
        var steps = ctx.h("div", { class: "sig-chips" });
        var aSteps = arr(claim.a_steps);
        var bSteps = arr(claim.b_steps);
        steps.appendChild(tag(ctx, "a", agentName(report, "a") + ": " +
          (aSteps.length ? "step " + aSteps.join(", ") : "never")));
        steps.appendChild(tag(ctx, "b", agentName(report, "b") + ": " +
          (bSteps.length ? "step " + bSteps.join(", ") : "never")));

        if (claim.matches_expected === true) steps.appendChild(tag(ctx, "good", "matches expected"));
        else if (claim.matches_expected === false) steps.appendChild(tag(ctx, "bad", "differs from expected"));
        else steps.appendChild(tag(ctx, "", "no expected value of this kind"));
        if (conflicted[claim.id]) steps.appendChild(tag(ctx, "bad", "in conflict"));

        var origin = obj(claim.origin);
        var originText = origin
          ? "first carried by " + agentName(report, origin.agent === "b" ? "b" : "a") +
            " at step " + origin.step + (origin.source ? " · " + origin.source : "")
          : "no recorded origin step";

        var normalized = claim.normalized !== undefined && claim.normalized !== null &&
          String(claim.normalized) !== String(claim.value)
          ? " (" + claim.normalized + ")" : "";

        return ctx.h("div", { class: "sig-item" }, [
          ctx.h("div", { class: "sig-line" }, [
            ctx.h("strong", { text: truncate(ctx, claim.value, 64) }),
            normalized ? ctx.h("span", { class: "mono", text: normalized }) : null,
          ]),
          ctx.h("div", { class: "sig-sub", text: originText }),
          steps,
        ]);
      }

      kinds.forEach(function (kind) {
        var group = groups[kind];
        var head = ctx.h("div", { class: "sig-h", text: kind + " · " + group.length });
        var wrap = ctx.h("div");
        var any = false;
        group.forEach(function (claim) {
          var important = conflicted[claim.id] ||
            claim.matches_expected === true || claim.matches_expected === false;
          if (shown >= LIMIT && !important) { hiddenCount++; return; }
          shown++;
          any = true;
          wrap.appendChild(renderClaim(claim));
        });
        if (any) { body.appendChild(head); body.appendChild(wrap); }
        else hiddenCount += 0;
      });
      el.appendChild(body);

      if (hiddenCount) {
        var more = ctx.h("button", {
          class: "btn sig-more",
          text: "Show " + hiddenCount + " more claim(s)",
          onclick: function () {
            ctx.signal("expand");
            more.remove();
            var rest = ctx.h("div");
            kinds.forEach(function (kind) {
              var group = groups[kind].filter(function (claim) {
                return !(conflicted[claim.id] || claim.matches_expected === true ||
                  claim.matches_expected === false);
              });
              if (!group.length) return;
              rest.appendChild(ctx.h("div", { class: "sig-h", text: kind + " · remaining" }));
              group.forEach(function (claim) { rest.appendChild(renderClaim(claim)); });
            });
            el.insertBefore(rest, el.lastChild);
          },
        });
        el.appendChild(more);
      }

      var contradictions = arr(s.contradictions);
      if (contradictions.length) {
        el.appendChild(ctx.h("div", { class: "sig-h", text: "Internal contradictions" }));
        contradictions.forEach(function (row) {
          el.appendChild(note(ctx, "bad", [
            tag(ctx, row.agent === "a" ? "a" : "b", agentName(report, row.agent === "a" ? "a" : "b")),
            ctx.h("span", {
              text: "  " + (row.summary || "carried conflicting values within one trajectory") +
                (arr(row.values).length ? " — " + arr(row.values).join(" vs ") : "") +
                (arr(row.steps).length ? " (steps " + arr(row.steps).join(", ") + ")" : ""),
            }),
          ]));
        });
      }

      el.appendChild(ctx.h("div", {
        class: "caveat",
        text: "Claims are typed facts extracted from step text; matches expected is only " +
          "decided when the expected answer contains a comparable claim of the same kind, " +
          "so a blank there means unjudged, not wrong.",
      }));
      if (typeof s.narrative === "string" && s.narrative) {
        el.appendChild(ctx.h("div", { class: "caveat", text: s.narrative }));
      }
    },
  });

  // ================================================================= 4. provenance

  AgentDiff.block({
    id: "provenance",
    title: "Provenance",
    question: "Where did the claims come from — and is the corroboration real?",
    group: "signal",
    size: "normal",

    relevance: function (ctx) {
      var s = obj(ctx.report && ctx.report.semantic);
      if (!s) return 0;
      var independence = arr(s.independence);
      var grounding = obj(s.grounding);
      if (!independence.length && !grounding) return 0;
      var circular = independence.filter(function (row) { return row.circular; }).length;
      if (circular) return 0.94;
      if (independence.length) return 0.6;
      return 0.4;
    },

    render: function (el, ctx) {
      ensureStyle();
      var report = ctx.report;
      var s = obj(report && report.semantic);
      if (!s) return ctx.empty(el, "No semantic analysis on this report.");
      var independence = arr(s.independence);
      var grounding = obj(s.grounding);
