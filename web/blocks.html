  /* The glossary. One entry per term of art the board already uses, written
   * for someone who has never read the docs: `short` is the one-sentence
   * answer, `long` the honest paragraph behind it. The honesty framing of
   * the engine is preserved on purpose — where a number means something
   * narrower than it looks (pass^k, omega squared, the counterfactual),
   * the entry says so rather than smoothing it over. */
  var TERMS = {
    "divergence": {
      label: "divergence",
      short: "The place where the two runs stopped doing the same thing — the first real fork in the road.",
      long: "AgentDiff lays the two runs side by side, step against step. A divergence is a region where that pairing breaks down: one agent takes steps the other never mirrors, or the paired steps stop resembling each other. Each divergence is ranked by how much it mattered downstream — extra steps, extra tokens, and whether the run that took the detour went on to fail. The first-ranked divergence is usually the decision worth reading, because everything after it happened in its shadow.",
    },
    "root-cause": {
      label: "root cause",
      short: "The single step the engine holds responsible for the failure — where the losing run first went wrong.",
      long: "When exactly one run fails, the engine walks back from the wrong answer through the run's own steps to the earliest divergent step that plausibly set it up — a bad source selected, a wrong tool called, a plan that skipped a check. That step is the attributed root cause, and the chain lists the later steps that inherited its mistake. It is an attribution from logged evidence, not a proof: the engine reads what was recorded, it does not re-run the agent to confirm.",
    },
    "propagation": {
      label: "propagation",
      short: "How much of the root mistake's content a later step carries forward.",
      long: "Once a run picks up a wrong fact, the interesting question is whether it ever puts it down. Propagation measures, for each later step, how much of the root divergent step's output shows up again in that step's input — a word-overlap score between the two texts. A high score means the step is still working with the contaminated material; a chain of high scores is a mistake compounding, rather than a mistake made once and recovered from.",
    },
    "alignment-row": {
      label: "alignment row",
      short: "One column of the side-by-side view: a step from run A matched to its counterpart in run B.",
      long: "The two runs rarely have the same number of steps, so before anything is compared they are aligned: each row pairs the A step and the B step that most plausibly correspond, in order. A row can hold both sides (a match, or a drift when they differ), or only one side — when an agent did something the other never did at all. Everything else on this board — the divergences, the tracks picture, the step detail — is indexed by these row numbers.",
    },
    "drift": {
      label: "drift",
      short: "A row where both agents did something comparable, but not the same — the wording or the target slid.",
      long: "Drift sits between a clean match and a full divergence. Both runs have a step in the row and the steps are recognisably the same kind of move, but the similarity is low: the same search with a different query, the same read on a different page. Drift is often where trouble starts — the runs still look parallel from a distance while their contents quietly part — which is why the first drifting rows are worth reading even when the headline divergence comes later.",
    },
    "pass-k": {
      label: "pass^k vs pass@k",
      short: "pass^k asks “does it work every time”; pass@k asks “can it work at all” — reliability versus coverage.",
      long: "With several runs per task, two very different questions hide in the success counts. pass@k rises with k: the chance that at least one of k attempts succeeds — useful when a human will pick the good run, and flattering by construction. pass^k falls with k: the chance that all k attempts succeed — the number that matters when nobody is checking and the agent has to be right three times running. Passing 2 of 3 runs is not “67% reliable”; read strictly, pass^3 there is 0. This board never draws one curve without the other, because quoting pass@k where reliability is at stake overstates the system.",
    },
    "omega-squared": {
      label: "omega squared & the chance floor",
      short: "A bias-corrected share of variance explained, read against the share a factor earns by chance just for having levels.",
      long: "Raw “variance explained” flatters factors with many levels: a 33-level factor explains a chunk of any finite corpus by chance alone, before any real effect exists. That chance floor is drawn on the same axis as the estimate, and omega squared (ω²) is the bias-corrected figure that subtracts the flattery. When ω² sits at or below zero, the honest statement is “indistinguishable from chance”, and the board prints exactly that instead of a bar — a one-pixel positive bar would be a lie about the sign.",
    },
    "confounded": {
      label: "confounded design",
      short: "The corpus cannot tell two factors apart, because they always change together — every model came with its own harness.",
      long: "When each model appears with exactly one harness (or one prompt, or one version), model and harness are the same partition of the data: every difference credited to one could equally be credited to the other. A confounded design does not make the numbers wrong — it makes attribution between the confounded factors meaningless, because any split shown would be an artefact of the order the arithmetic was done in. The fix is in the data, not the math: run at least one model on more than one harness.",
    },
    "residual": {
      label: "residual",
      short: "The variance left over after every measured factor — only safely called “noise” when there are repeated runs.",
      long: "After model, harness and task have taken their shares, what remains is the residual. With repeated runs per configuration it is a measured thing: the same setup coming out differently on a re-run — genuine run-to-run stochasticity. With a single run per cell there is no repeat to measure against, so the residual is interaction and stochasticity fused inseparably: the design cannot say how much is “this combination behaves specially” versus “this run happened to go this way”. The board draws those two cases with different marks rather than letting one impersonate the other.",
    },
    "blind-write": {
      label: "blind write",
      short: "A write to the world before any successful read — acting on state the run never actually looked at.",
      long: "A cancel, a booking, an update is a write; checking what is there first is a read. A blind write is a write that happens before any read has succeeded in that run — the agent changed something whose current state it never established. Three failed lookups followed by the write still count: only a read that worked counts as having looked. Blind writes are invisible to outcome-only grading whenever the guess happens to be right, which is exactly why they are flagged from the trace itself.",
    },
    "false-success": {
      label: "false success",
      short: "The answer claims the job was done while the trace shows nothing was ever written.",
      long: "A run can end with “Done — the booking is cancelled” while its own steps contain no successful write of any kind. The claim and the log disagree, and the log wins. False success is the most dangerous shape of failure, because an outcome oracle that trusts the answer text scores it as a pass. It is detected here by comparing what the final answer asserts against the side effects the trace actually records — a deterministic check, no judge involved.",
    },
    "no-information-step": {
      label: "no-information step",
      short: "A step whose observation is byte-identical to one the run already had — motion without progress.",
      long: "The call was new — a different moment, maybe a different phrasing — but the observation that came back is byte-for-byte something the run had already seen. The step advanced nothing: no new evidence, no changed state, just spend. A few of these are friction; a run of them is a loop in slow motion. They are counted separately from retries, because retrying a failed call is correct behaviour and should not be penalised as churn.",
    },
    "wilson-interval": {
      label: "Wilson interval",
      short: "A confidence interval for a success rate that stays honest at the extremes where small eval suites live.",
      long: "Quoting “2 failures out of 8 tasks” as exactly 25% overstates what 8 tasks can say. The Wilson score interval puts a range around a proportion, and unlike the schoolbook normal approximation it behaves at 0-of-8 and 8-of-8 — precisely where short suites sit. When this board quotes a rate on few tasks, the bracket after it is the Wilson 95% interval: the range of true rates that could plausibly have produced what was observed.",
    },
    "oracle": {
      label: "oracle",
      short: "A ceiling computed with hindsight — what perfect per-task routing would have achieved. A bound, not a policy.",
      long: "The routing oracle assumes you knew, for every task in advance, which agent would succeed, and always picked it. Its coverage and cost are therefore a ceiling: no real router can beat it, and the gap between the best single agent and the oracle is the headroom a router could win — and no more. It is reported to size that headroom, never as a claim that any deployable policy reaches it. The word also names the grader that decides success; a wrong grading oracle is what “failed but clean” runs point at.",
    },
    "passed-but-pathological": {
      label: "passed but pathological",
      short: "The outcome oracle says pass, but the trace shows loops, swallowed errors, or blind writes on the way there.",
      long: "A run can satisfy its success check while doing things nobody would accept on inspection: cycling through the same calls, hitting an error and pressing on as if it had not, writing before reading. A leaderboard that scores outcomes only gives this run the same mark as a clean one — and published measurements put a large share of safety and robustness failures in exactly this blind spot. The verdict exists so a pass with a pathological process is never silently indistinguishable from a pass earned cleanly.",
    },
    "failed-but-clean": {
      label: "failed but clean",
      short: "The run failed with nothing visibly wrong in its process — which is evidence about the grader, not only the agent.",
      long: "When a run fails its success check and the trace shows no loop, no unrecovered error, no blind write and a coherent path to a defensible answer, suspicion should fall on the oracle as much as on the agent: an expected-answer string that is too strict, a check that keys on wording, a gold label that is simply wrong. “Failed but clean” does not assert the agent was right — it flags that the deterministic evidence does not corroborate the failure, and that a human should look at the grading before the agent is blamed.",
    },
    "tokens-basis": {
      label: "tokens: measured vs estimated",
      short: "Whether a token count was reported by the provider (measured) or derived from text length (estimated).",
      long: "Not every runtime reports token usage, so some counts are estimates — typically length-of-text divided by four — and the difference matters the moment costs or deltas are compared. Each step can carry a tokens_basis of “measured” or “estimated”, and the run-level accounting says how much of the total rests on which. The basis is carried through save and load deliberately: an estimate that loses its label becomes indistinguishable from a provider-reported number, and every comparison downstream inherits the confusion. An absent basis stays absent rather than defaulting to “measured”.",
    },
    "splice-counterfactual": {
      label: "splice counterfactual",
      short: "A what-if assembled by splicing steps both runs actually recorded — never a simulation of the agent.",
      long: "“Had the loser made the winner's decision at the divergence” is estimated by grafting the winner's actually-recorded post-divergence steps onto the loser's actually-recorded prefix, then summing the real tokens, latency and cost of those steps. Nothing is simulated: no step in the estimate is invented, no model is re-run. That makes the arithmetic exact but the premise approximate — it assumes the graft point is clean, which is why the estimate carries a confidence level based on how identical the shared prefix really was. A true causal answer would require re-executing the agent, which a tool that only reads logs deliberately does not do.",
    },
    "shapley-share": {
      label: "Shapley share",
      short: "A fair division of the winner–loser gap across the divergences, so overlapping detours are not double-counted.",
      long: "When a run goes wrong in more than one place, summing each divergence's downstream cost double-counts — later detours inherit the extra work earlier ones created. The Shapley allocation treats each divergence region as a player, asks what adopting the other run's path at every subset of regions would have saved, and divides the total gap so the shares sum to it exactly (that efficiency property is checked numerically on every report). The honest name is splice-Shapley: “fixing” a region means adopting the other run's recorded steps there, so the allocation is exact with respect to that splice surrogate — not with respect to re-running the agent, which logged traces cannot support.",
    },
    "hypothesis-status": {
      label: "hypothesis status",
      short: "Where each candidate explanation stands after adjudication: leading, plausible, weak, ruled out, merged into the leading account, or untestable from this trace.",
      long: "The diagnosis scores every candidate explanation against the report's own evidence and then says where each one landed, rather than showing only the winner. “Leading” clears the runner-up by the lead margin; “plausible” scored but did not clear it; “weak” has little support; “ruled out” is contradicted by the evidence and is struck through, not deleted. “Merged” means the hypothesis describes the same mechanism as the leading one and was absorbed into its account — it stays on the list, muted, so the absorption is visible. “Untestable” means the trace lacks the data to score it at all, and it shows no score rather than an invented one.",
    },
    "discriminator": {
      label: "discriminator",
      short: "The concrete check that would confirm or refute this hypothesis — what evidence would change the diagnosis.",
      long: "Every hypothesis carries a discriminator: the specific action — re-grade the answer by hand, check a claim at its origin step, splice the other agent's decision and re-run — that would settle whether it is right. It is there because a diagnosis that cannot say what evidence would change it is a story, not a diagnosis. When the verdict is contested, the discriminators are the way out: run them, and the evidence they produce picks the cause the scores could not.",
    },
    "contested-diagnosis": {
      label: "contested diagnosis",
      short: "No hypothesis clears the runner-up by the lead margin, so the report declines to pick a single cause.",
      long: "When two or more explanations fit the evidence about equally well, the honest verdict is that the comparison cannot adjudicate between them — not whichever happened to score fractionally higher. A contested diagnosis names the hypotheses that are within the lead margin of each other and points at each one's discriminator: the check that would separate them. Treat it as a to-do list for the next run, not as a failure of the analysis.",
    },
    "mast-trail": {
      label: "MAST & TRAIL",
      short: "Two published failure taxonomies this tool maps its findings onto — by method, never as a claimed measurement.",
      long: "MAST (arXiv 2503.13657) and TRAIL (arXiv 2505.08638) are community taxonomies of how agent systems fail, built from expert-annotated trajectories. AgentDiff labels its own deterministic findings with the closest MAST and TRAIL categories so results can be discussed in a shared vocabulary — but the mapping is by definition of method, not a validated measurement in either framework, and some of their categories (multi-agent conversation failures, for instance) are unreachable from a single pairwise trace. The labels situate a finding; they do not certify it.",
    },
  };

  /* The shared tooltip: one element, reused for every term on the page.
   *
   * Hover shows it, keyboard focus shows it (the wiring gives every
   * data-explain element a tabindex), a click pins it so its text can be
   * selected, Escape closes it, and “Show more” expands the one-sentence
   * answer into the paragraph. position: fixed clamps inside the viewport,
   * so it can never widen the page at any width. */
  var Explain = (function () {
    var TIP_CLASS = "explain-tip";
    var TIP_DOM_ID = "agentdiff-explain";
    var tip = null;
    var current = null;
    var pinned = false;
    var hideTimer = null;
    var overrides = typeof WeakMap === "function" ? new WeakMap() : null;
    var overrideList = overrides ? null : [];   // ancient-browser fallback

    function overrideFor(el) {
      if (overrides) return overrides.get(el) || null;
      for (var i = 0; i < overrideList.length; i++) {
        if (overrideList[i][0] === el) return overrideList[i][1];
      }
      return null;
    }

    function setOverride(el, def) {
      if (overrides) overrides.set(el, def);
      else overrideList.push([el, def]);
    }

    function defFor(el) {
      var term = el.getAttribute("data-explain") || "";
      var base = TERMS[term] || null;
      var over = overrideFor(el);
      if (!base && !over) return null;
      return {
        term: term,
        label: (over && over.label) || (base && base.label) || term.replace(/-/g, " "),
        short: (over && over.short) || (base && base.short) || "",
        long: (over && over.long) || (base && base.long) || "",
        evidence: (over && over.evidence) || null,
      };
    }

    function ensureTip() {
      if (tip && tip.isConnected) return tip;
      tip = h("div", { class: TIP_CLASS, role: "tooltip" });
      tip.setAttribute("id", TIP_DOM_ID);
      tip.addEventListener("mouseenter", cancelHide);
      tip.addEventListener("mouseleave", function () { if (!pinned) scheduleHide(); });
      document.body.appendChild(tip);
      return tip;
    }

    function buildContent(def) {
      tip.innerHTML = "";
      tip.appendChild(h("div", { class: "x-label", text: def.label }));
      if (def.short) tip.appendChild(h("div", { class: "x-short", text: def.short }));
      var hasLong = def.long && def.long !== def.short;
      if (hasLong) tip.appendChild(h("div", { class: "x-long", text: def.long }));
      if (def.evidence) tip.appendChild(h("div", { class: "x-ev", text: def.evidence }));
      var foot = h("div", { class: "x-foot" });
      if (hasLong) {
        var more = h("button", { class: "x-more", text: "Show more", type: "button" });
        more.addEventListener("click", function (event) {
          event.stopPropagation();
          var expanded = tip.classList.toggle("expanded");
          more.textContent = expanded ? "Show less" : "Show more";
          if (current) position(current);
        });
        foot.appendChild(more);
      }
      foot.appendChild(h("span", {
        class: "x-hint",
        text: pinned ? "pinned — Esc closes" : "click to pin · Esc closes",
      }));
      tip.appendChild(foot);
    }

    function position(target) {
      if (!tip || !target || !target.getBoundingClientRect) return;
      var box = target.getBoundingClientRect();
      var vw = document.documentElement.clientWidth || global.innerWidth || 360;
      var vh = document.documentElement.clientHeight || global.innerHeight || 640;
      // Measure at origin first so a previous position cannot squash the
      // tooltip against an edge and distort its natural size.
      tip.style.left = "0px";
      tip.style.top = "0px";
      var w = tip.offsetWidth;
      var ht = tip.offsetHeight;
      var x = Math.min(Math.max(10, box.left), Math.max(10, vw - w - 10));
      var y = box.bottom + 8;
      if (y + ht > vh - 8) y = box.top - ht - 8;   // flip above
      if (y < 8) y = Math.max(8, Math.min(vh - ht - 8, box.bottom + 8));
      tip.style.left = Math.round(x) + "px";
      tip.style.top = Math.round(y) + "px";
    }

    function clearTarget() {
      if (current) {
        try { current.removeAttribute("aria-describedby"); } catch (err) {}
      }
      current = null;
    }

    function show(el, pin) {
      var def = defFor(el);
      if (!def) return false;
      ensureTip();
      cancelHide();
      if (current && current !== el) clearTarget();
      current = el;
      pinned = !!pin;
      buildContent(def);
      tip.classList.add("show");
      tip.classList.toggle("pinned", pinned);
      tip.classList.remove("expanded");
      el.setAttribute("aria-describedby", TIP_DOM_ID);
      position(el);
      return true;
    }

    function hide(force) {
      if (pinned && !force) return false;
      cancelHide();
      if (tip) {
        tip.classList.remove("show", "pinned", "expanded");
      }
      clearTarget();
      pinned = false;
      return true;
    }

    //: hide on a short delay, so the pointer can travel from the term into
    //: the tooltip (to reach "Show more") without the tooltip vanishing.
    function scheduleHide() {
      cancelHide();
      hideTimer = setTimeout(function () { hideTimer = null; hide(false); }, 140);
    }

    function cancelHide() {
      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    }

    //: true when something was open — the caller uses it to decide whether
    //: Escape has done its job or should fall through to closing panels.
    function close() {
      var wasOpen = !!(tip && tip.classList.contains("show"));
      hide(true);
      return wasOpen;
    }

    function isOpen() { return !!(tip && tip.classList.contains("show")); }

    function focusable(el) {
      var tag = (el.tagName || "").toUpperCase();
      if (tag === "BUTTON" || tag === "A" || tag === "INPUT" ||
          tag === "SELECT" || tag === "TEXTAREA") return true;
      return el.hasAttribute("tabindex");
    }

    /* Keyboard reachability. A span with data-explain is not focusable by
     * itself, and a tooltip that only hover can open is not accessible; so
     * after every render the new targets get a tabindex. */
    function sweep(root) {
      if (!root || !root.querySelectorAll) return;
      var nodes = root.querySelectorAll("[data-explain]");
      for (var i = 0; i < nodes.length; i++) {
        if (!focusable(nodes[i])) nodes[i].setAttribute("tabindex", "0");
      }
    }

    /* ctx.explain(el, {term, short, long, evidence}) — mark an element as
     * explainable. A bare {term} uses the shared glossary; short/long/
     * evidence override or extend it for this one element. */
    function attach(el, def) {
      if (!el || !el.setAttribute) return el;
      def = def || {};
      if (def.term) el.setAttribute("data-explain", def.term);
      else if (!el.getAttribute("data-explain")) el.setAttribute("data-explain", "custom");
      if (def.short || def.long || def.evidence || def.label) setOverride(el, def);
      if (!focusable(el)) el.setAttribute("tabindex", "0");
      return el;
    }

    function closestExplain(node) {
      while (node && node.getAttribute) {
        if (node.getAttribute("data-explain")) return node;
        node = node.parentNode;
      }
      return null;
    }

    function noPin(el) { return el.hasAttribute("data-explain-nopin"); }

    var wired = false;
    function wire() {
      if (wired) return;
      wired = true;
      // Delegated, so terms rendered later (every block re-render) need no
      // per-element listeners and no observer.
      document.addEventListener("mouseover", function (event) {
        var target = closestExplain(event.target);
        if (!target) return;
        cancelHide();
        if (pinned) return;   // a pinned tooltip is not stolen by a hover
        if (current !== target || !isOpen()) show(target, false);
      });
      document.addEventListener("mouseout", function (event) {
        var target = closestExplain(event.target);
        if (target && target === current && !pinned) scheduleHide();
      });
      document.addEventListener("focusin", function (event) {
        if (pinned) return;
        var target = closestExplain(event.target);
        if (target) show(target, false);
      });
      document.addEventListener("focusout", function (event) {
        if (pinned || !current) return;
        var to = event.relatedTarget;
        if (to && tip && tip.contains(to)) return;
        if (to && closestExplain(to) === current) return;
        scheduleHide();
      });
      // Click pins (and on touch, where there is no hover, this is also how
      // the tooltip opens). Clicking anywhere else closes a pinned tooltip.
      document.addEventListener("click", function (event) {
        if (tip && tip.contains(event.target)) return;
        var target = closestExplain(event.target);
        if (target && !noPin(target)) {
          if (current === target && pinned) hide(true);
          else show(target, true);
          return;
        }
        if (pinned) hide(true);
      });
      document.addEventListener("keydown", function (event) {
        if (event.key !== "Enter" && event.key !== " " && event.key !== "Spacebar") return;
        var target = closestExplain(event.target);
        if (!target || noPin(target)) return;
        var tag = (target.tagName || "").toUpperCase();
        if (tag === "BUTTON" || tag === "A") return;
        event.preventDefault();
        if (current === target && pinned) hide(true);
        else show(target, true);
      });
      // The page scrolls under a fixed tooltip; follow the target, and let
      // go of a target a re-render has removed.
      var follow = function () {
        if (!isOpen() || !current) return;
        if (!current.isConnected) { hide(true); return; }
        position(current);
      };
      global.addEventListener("scroll", follow, true);
      global.addEventListener("resize", follow);
    }

    return { attach: attach, sweep: sweep, wire: wire, close: close,
             show: show, hide: hide, isOpen: isOpen, defFor: defFor };
  })();

  // ------------------------------------------------------------------- boot

  function selectTask(id) {
    State.task = id;
    if (els.picker) els.picker.value = id;
    renderAll();
  }

  function applyTheme() {
    var theme = State.prefs.theme;
    if (theme === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
  }

  function boot() {
    Identity.id = visitorId();
    State.data = global.DEEPCOMPARE_DATA || { reports: [], aggregate: {} };

    State.prefs = Object.assign(defaultPrefs(), Store.get(key("prefs")) || {});
    State.signals = Store.get(key("signals")) || {};
    if (typeof State.signals !== "object" || State.signals === null) State.signals = {};

    var reports = State.data.reports || [];
    State.task = reports.length && reports[0].task ? reports[0].task.id : null;

    els = {
      stacks: document.getElementById("stacks"),
      hero: document.getElementById("hero-lane"),
      lead: document.getElementById("lead-lane"),
      title: document.getElementById("page-title"),
      strip: document.getElementById("task-strip"),
      story: document.getElementById("story-lane"),
      storyBtn: document.getElementById("btn-story"),
      reading: document.getElementById("reading"),
      picker: document.getElementById("task-picker"),
      drawer: document.getElementById("drawer"),
      drawerBody: document.getElementById("drawer-body"),
      you: document.getElementById("you"),
      youBody: document.getElementById("you-body"),
      scrim: document.getElementById("scrim"),
      toast: document.getElementById("toast"),
      cols: document.getElementById("btn-cols"),
    };

    applyTheme();
    measureTopbar();
    global.addEventListener("resize", measureTopbar);
    State.layout = reconcile(Store.get(key("layout")), makeCtx());

    if (els.storyBtn) {
      els.storyBtn.setAttribute("aria-pressed", State.prefs.story ? "true" : "false");
      els.storyBtn.textContent = State.prefs.story ? "Story" : "Dashboard";
      els.storyBtn.addEventListener("click", toggleStory);
    }

    // Task picker
    if (reports.length) {
      reports.forEach(function (report) {
        var id = report && report.task ? report.task.id : null;
        if (!id) return;
        var failed = report.attribution && report.attribution.failed_agent;
        els.picker.appendChild(h("option", { value: id, text: id + (failed ? "  ✗" : "") }));
      });
      els.picker.value = State.task;
      els.picker.addEventListener("change", function () { selectTask(els.picker.value); });
    } else {
      els.picker.appendChild(h("option", { text: "no reports loaded" }));
      els.picker.disabled = true;
    }

    document.getElementById("btn-drawer").addEventListener("click", function () {
      renderDrawer();
      openPanel(els.drawer);
    });
    document.getElementById("btn-you").addEventListener("click", function () {
      renderYou();
      openPanel(els.you);
    });
    document.getElementById("btn-theme").addEventListener("click", function () {
      var order = ["system", "light", "dark"];
      State.prefs.theme = order[(order.indexOf(State.prefs.theme) + 1) % order.length];
      savePrefs();
      applyTheme();
      renderAll();
      toast("Theme: " + State.prefs.theme);
    });
    els.cols.addEventListener("click", function () {
      State.layout.cols = State.layout.cols >= STACK_PLAN.length ? 1 : State.layout.cols + 1;
      saveLayout();
      renderAll();
    });
    els.scrim.addEventListener("click", closePanels);
    var closers = document.querySelectorAll("[data-close]");
    for (var i = 0; i < closers.length; i++) closers[i].addEventListener("click", closePanels);
    document.addEventListener("keydown", function (event) {
      // Escape closes the innermost thing first: an open tooltip, then the
      // panels — one keypress should never dismiss both at once.
      if (event.key === "Escape") {
        if (Explain.close()) return;
        closePanels();
      }
    });
    Explain.wire();

    // how many times this visitor has opened a report here (durable
    // storage only; a private window is always a first visit)
    try {
      State.visits = (parseInt(Store.get(key("visits")), 10) || 0) + 1;
      Store.set(key("visits"), String(State.visits));
    } catch (err) { State.visits = 1; }

    renderAll();

    // A first visit opens on the report, not on a toast about identity:
    // the You panel already states what is stored and why.
    if (!Identity.minted && !Store.durable) {
      toast("Storage is unavailable here; your layout lasts only this tab");
    }
  }

  /* Panels open below the bar rather than over it, so the bar's other
     buttons stay reachable while one is open. The height is measured
     because it follows the font size rather than a fixed number. */
  function measureTopbar() {
    var bar = document.querySelector(".topbar");
    if (!bar) return;
    document.documentElement.style.setProperty("--topbar-h", bar.offsetHeight + "px");
  }

  function openPanel(panel) {
    closePanels();
    panel.classList.add("open");
    els.scrim.classList.add("open");
  }

  function closePanels() {
    els.drawer.classList.remove("open");
    els.you.classList.remove("open");
    els.scrim.classList.remove("open");
  }

  global.AgentDiff = {
    block: block,
    boot: boot,
    /* Look a glossary term up by id — {term, label, short, long} or null.
     * For blocks that want the text inline (or tests that check it exists)
     * rather than the tooltip behaviour. */
    explainTerm: function (id) {
      var entry = TERMS[id];
      if (!entry) return null;
      return { term: id, label: entry.label, short: entry.short, long: entry.long };
    },
    // exposed for the smoke test, not for block modules
    _internals: {
      rank: rank, reconcile: reconcile, defaultLayout: defaultLayout,
      resolveHero: resolveHero, promoteHero: promoteHero, demoteHero: demoteHero,
      DEFAULT_HERO: DEFAULT_HERO,
      State: State, REGISTRY: REGISTRY, BY_ID: BY_ID, fmt: fmt, uuid: uuid,
      decay: decay, Store: Store, STACK_PLAN: STACK_PLAN,
      TERMS: TERMS, Explain: Explain,
    },
  };
})(typeof window !== "undefined" ? window : this);

</script>

<script>
/* AgentDiff blocks — the verdict card.
 *
 * Five lines, first on the page: who won and who failed; why, in the
 * trace's own words when the decisive step carries a note; what the
 * outcome cost; what to do next; how sure the engine is. Every line is
 * computed once by the engine (`report.verdict_card`) and quoted here
 * verbatim — the block never composes a sentence of its own, so the page
 * can never say something the report does not. Lines that carry a step
 * are chips: clicking one moves the shared cursor the trajectory map,
 * step detail and run lens already follow.
 */
(function (global) {
  "use strict";

  var AgentDiff = global.AgentDiff;
  if (!AgentDiff || typeof AgentDiff.block !== "function") return;

  var STYLE_ID = "agentdiff-verdict-css";
  var styled = false;

  function ensureStyle() {
    if (styled) return;
    styled = true;
    try {
      if (document.getElementById(STYLE_ID)) return;
      var node = document.createElement("style");
      node.id = STYLE_ID;
      node.textContent = [
        ".vc{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;",
        "font-size:13.5px;line-height:1.5;color:var(--ink)}",
        ".vc .k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;",
        "font-weight:700;color:var(--ink-3);padding-top:3px}",
        ".vc .v{margin:0}",
        ".vc .v.verdict{font-size:15px;font-weight:600}",
        ".vc .v.cause{border-left:3px solid var(--accent);padding-left:8px}",
        ".vc .v.confidence{color:var(--ink-2);font-size:12.5px}",
        ".vc-chip{display:inline-block;margin-right:6px;padding:0 7px;border-radius:999px;",
        "border:1px solid var(--rule);background:var(--surface-2);font:600 11px/18px ",
        "ui-monospace,monospace;color:var(--accent);cursor:pointer}",
        ".vc-chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}",
        ".vc-src{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}"
      ].join("");
      document.head.appendChild(node);
    } catch (err) { /* styling is optional */ }
  }

  var LABELS = { verdict: "Verdict", cause: "Cause", cost: "Cost",
                 fix: "Fix", confidence: "Confidence" };

  function rowFor(report, side, step) {
    var rows = report && Array.isArray(report.alignment) ? report.alignment : [];
    var key = side + "_index";
    for (var i = 0; i < rows.length; i++) {
      if (rows[i] && rows[i][key] === step) return i;
    }
    return -1;
  }

  function stepChip(ctx, report, line) {
    var side = line.side, step = line.step;
    var label = (side === "a" || side === "b" ? side.toUpperCase() + " " : "") + "step " + step;
    return ctx.h("button", {
      class: "vc-chip", type: "button", text: label,
      title: "show this step in the map, step detail and run lens",
      "data-step": String(step), "data-side": side || "",
      onclick: function () {
        var row = rowFor(report, side, step);
        try { ctx.signal("inspect"); } catch (e) { /* optional */ }
        if (row < 0) return;
        try {
          document.dispatchEvent(new CustomEvent("agentdiff:select-step",
            { detail: { row: row, side: side } }));
        } catch (e) { /* no CustomEvent: the chip is inert */ }
      }
    });
  }

  AgentDiff.block({
    id: "verdict-card",
    title: "Verdict",
    question: "Who won, why, at what cost, what next, how sure?",
    group: "outcome",
    size: "wide",
    lead: true,
    relevance: function (ctx) {
      var card = ctx.report && ctx.report.verdict_card;
      return card && Array.isArray(card.lines) && card.lines.length ? 1 : 0;
    },
    render: function (el, ctx) {
      ensureStyle();
      var report = ctx.report;
      var card = report && report.verdict_card;
      if (!card || !Array.isArray(card.lines) || !card.lines.length) {
        ctx.empty(el, "This report predates the verdict card; re-run compare to get one.");
        return;
      }
      var grid = ctx.h("div", { class: "vc", role: "list" });
      card.lines.forEach(function (line) {
        grid.appendChild(ctx.h("div", { class: "k", text: LABELS[line.key] || line.key }));
        var kids = [];
        if (typeof line.step === "number") kids.push(stepChip(ctx, report, line));
        kids.push(ctx.h("span", { text: line.text }));
        if (line.source) kids.push(ctx.h("span", { class: "vc-src", text: "from " + line.source }));
        grid.appendChild(ctx.h("p", { class: "v " + line.key, role: "listitem" }, kids));
      });
      el.appendChild(grid);
    }
  });
})(typeof window !== "undefined" ? window : this);

</script>

<script>
/* AgentDiff blocks — the guided walkthrough.
 *
 * One block that tells the comparison as a story: the verdict, where the
 * runs parted, what the detour cost, whether the process was clean, what
 * would have happened otherwise, and what to do about it. Every step of the
 * story is assembled from the report's own fields — the narratives the
 * engine already writes are reused verbatim, with connective tissue around
 * them — and every claim carries an evidence chip that jumps to the step or
 * block that backs it.
 *
 * Evidence chips prefer the trajectory module's own selection machinery:
 * the Tracks block exposes one hit target per (row, side), so dispatching a
 * real click on the right target drives the same pub/sub a hand click would
 * — Tracks highlights the column and Step detail opens the row. When that
 * path is unavailable (tracks collapsed, hidden, or absent), the chip
 * announces the selection as a DOM CustomEvent `agentdiff:select-step`
 * with {row, side} for any listener, and degrades to scrolling to the most
 * relevant block. Nothing here reaches into another module's code.
 *
 * A section whose data is missing is skipped, never faked: the story only
 * says what the report can back.
 */
(function (global) {
  "use strict";

  var AgentDiff = global.AgentDiff;
  if (!AgentDiff || typeof AgentDiff.block !== "function") return;

  // ------------------------------------------------------------------ style

  var STYLE_ID = "agentdiff-walkthrough-css";
  var styled = false;

  function ensureStyle() {
    if (styled) return;
    styled = true;
    try {
      if (document.getElementById(STYLE_ID)) return;
      var node = document.createElement("style");
      node.id = STYLE_ID;
      node.textContent = [
        ".wt-lede{font-size:12px;color:var(--ink-2);margin:0 0 12px;line-height:1.55}",
        ".wt-story{margin:0;padding:0;list-style:none;counter-reset:wt}",
        ".wt-story>li{counter-increment:wt;position:relative;padding:0 0 16px 34px;margin:0;min-width:0}",
        ".wt-story>li::before{content:counter(wt);position:absolute;left:0;top:0;",
        "width:22px;height:22px;border-radius:999px;display:flex;align-items:center;",
        "justify-content:center;background:var(--surface-2);border:1px solid var(--rule-2);",
        "color:var(--ink-2);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}",
        ".wt-story>li:not(:last-child)::after{content:\"\";position:absolute;left:10.5px;",
        "top:27px;bottom:3px;width:1px;background:var(--rule)}",
        ".wt-k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;",
        "color:var(--ink-3);font-weight:700;margin:2px 0 4px}",
        ".wt-p{font-size:12.8px;line-height:1.62;color:var(--ink);margin:0}",
        ".wt-p+.wt-p{margin-top:7px}",
        ".wt-p .said{color:var(--ink-2)}",
        ".wt-quote{font-family:var(--mono);font-size:11px;background:var(--surface-2);",
        "border:1px solid var(--rule);border-radius:5px;padding:0 4px;word-break:break-word}",
        ".wt-ev{display:inline-flex;align-items:center;gap:4px;vertical-align:baseline;",
        "margin-left:6px;border:1px solid var(--rule-2);background:var(--surface);",
        "color:var(--accent);border-radius:999px;padding:0 8px 0 6px;font-size:11px;",
        "line-height:1.7;cursor:pointer;white-space:nowrap;font-family:var(--sans)}",
        ".wt-ev::before{content:\"⌖\";font-size:11px;line-height:1}",
        ".wt-ev:hover{border-color:var(--accent);",
        "background:color-mix(in srgb, var(--accent) 8%, var(--surface))}",
        ".wt-note{font-size:11px;color:var(--ink-3);margin-top:4px;line-height:1.5}",
        ".wt-flash{outline:2px solid var(--accent);outline-offset:3px;border-radius:11px}",
      ].join("");
      document.head.appendChild(node);
    } catch (err) { /* styling is a nicety; the story still reads */ }
  }

  // ------------------------------------------------------------ data access

  function nameOf(report, side) {
    var box = report && report[side];
    return (box && box.agent && box.agent.name) || side.toUpperCase();
  }

  function rowsOf(report) {
    return report && Array.isArray(report.alignment) ? report.alignment : [];
  }

  function stepOf(report, side, index) {
    if (index === null || index === undefined) return null;
    var box = report && report[side];
    var steps = box && Array.isArray(box.steps) ? box.steps : [];
    for (var i = 0; i < steps.length; i++) {
      if (steps[i] && steps[i].index === index) return steps[i];
    }
    return steps[index] || null;
  }

  function rowForStep(report, side, index) {
    if (index === null || index === undefined) return -1;
    var rows = rowsOf(report);
    for (var i = 0; i < rows.length; i++) {
      if (rows[i][side + "_index"] === index) return i;
    }
    return -1;
  }

  //: a divergence's indices may fall in different rows when the region is
  //: one-sided; the earliest row matching either side is the anchor.
  function rowForDivergence(report, divergence) {
    var rows = rowsOf(report);
    for (var i = 0; i < rows.length; i++) {
      if (divergence.a_index !== null && divergence.a_index !== undefined &&
          rows[i].a_index === divergence.a_index) return i;
      if (divergence.b_index !== null && divergence.b_index !== undefined &&
          rows[i].b_index === divergence.b_index) return i;
    }
    return -1;
  }

  function isNum(value) { return typeof value === "number" && isFinite(value); }

  function other(side) { return side === "a" ? "b" : "a"; }

  // --------------------------------------------------- evidence navigation

  function flash(node) {
    if (!node) return;
    var bar = document.querySelector(".topbar");
    var offset = (bar ? bar.offsetHeight : 48) + 12;
    var top = node.getBoundingClientRect().top + (global.pageYOffset || 0) - offset;
    try { global.scrollTo({ top: Math.max(0, top), behavior: "smooth" }); }
    catch (err) { global.scrollTo(0, Math.max(0, top)); }
    node.classList.add("wt-flash");
    setTimeout(function () { node.classList.remove("wt-flash"); }, 1300);
  }

  /* Select an alignment row in the trajectory blocks.
   *
   * Preferred path: Tracks draws one hit rect per (row, side) in row order
   * — a real click on the right one drives the trajectory module's own
   * selection pub/sub, so Tracks and Step detail react exactly as they
   * would to a hand click. Fallbacks: a CustomEvent any module may listen
   * for, then a plain scroll to whatever step-ward block exists. */
  function gotoRow(row, side, rowCount) {
    if (row === null || row === undefined || row < 0) return;
    var tracks = document.querySelector('.block[data-block="tracks"]');
    if (tracks) {
      var hits = tracks.querySelectorAll("svg.tj .tj-hit");
      // Two targets per row (A above, B below), appended in row order —
      // verified against the alignment's own row count, so any other
      // layout the tracks block might be drawing (a different view mode,
      // a future change) degrades to the announce-and-scroll path instead
      // of clicking the wrong target.
      var index = row * 2 + (side === "b" ? 1 : 0);
      if (hits.length && hits.length === rowCount * 2 && index < hits.length) {
        try {
          hits[index].dispatchEvent(new MouseEvent("click", {
            bubbles: true, cancelable: true, view: global,
          }));
          flash(tracks);
          return;
        } catch (err) { /* fall through to the announce + scroll path */ }
      }
    }
    try {
      document.dispatchEvent(new CustomEvent("agentdiff:select-step", {
        detail: { row: row, side: side || null },
      }));
    } catch (err) { /* CustomEvent unavailable: scrolling still works */ }
    flash(tracks || document.querySelector('.block[data-block="step-detail"]'));
  }

  //: scroll to the first of the named blocks that is actually on the page.
  function gotoBlock(ids) {
    for (var i = 0; i < ids.length; i++) {
      var node = document.querySelector('.block[data-block="' + ids[i] + '"]');
      if (node) { flash(node); return true; }
    }
    return false;
  }

  // ----------------------------------------------------------- composition

  function chip(ctx, label, title, onclick) {
    return ctx.h("button", {
      class: "wt-ev", type: "button", text: label, title: title,
      onclick: function () {
        if (ctx.signal) ctx.signal("inspect");
        onclick();
      },
    });
  }

  function rowChip(ctx, report, row, side, title) {
    var label = "row " + row + (side ? " · " + side.toUpperCase() : "");
    var rowCount = rowsOf(report).length;
    return chip(ctx, label, title || "Highlight this step in Tracks and open it in Step detail",
                function () { gotoRow(row, side, rowCount); });
  }

  function blockChip(ctx, label, ids, title) {
    return chip(ctx, label, title || "Scroll to the block that carries this evidence",
                function () {
                  if (!gotoBlock(ids)) {
                    // The block is hidden from this layout; the drawer can
                    // restore it, which is where the flash points.
                    var drawer = document.getElementById("btn-drawer");
                    if (drawer) flash(drawer.closest(".topbar") || drawer);
                  }
                });
  }

  //: a term of art, wired to the shared glossary tooltip.
  function term(ctx, text, key) {
    if (typeof ctx.explain === "function") {
      return ctx.explain(ctx.h("span", { text: text }), { term: key });
    }
    return ctx.h("span", { text: text, "data-explain": key });
  }

  //: a verbatim quote from a step's recorded text, kept short.
  function snip(ctx, text, max) {
    var clean = String(text === null || text === undefined ? "" : text).replace(/\s+/g, " ").trim();
    return ctx.h("q", { class: "wt-quote", text: ctx.fmt.truncate(clean, max || 140) });
  }

  function paragraph(ctx, kids) { return ctx.h("p", { class: "wt-p" }, kids); }

  function section(ctx, kicker, kids) {
    return ctx.h("li", null, [ctx.h("div", { class: "wt-k", text: kicker })].concat(kids));
  }

  // ============================================================ the block

  AgentDiff.block({
    id: "walkthrough",
    title: "What happened here",
    question: "The story of this comparison, step by step, with the evidence.",
    group: "outcome",
    size: "normal",

    relevance: function (ctx) {
      var report = ctx.report;
      // The narrative leads whenever there is a paired report to narrate.
      return report && report.a && report.b ? 1 : 0;
    },

    render: function (el, ctx) {
      ensureStyle();
      var report = ctx.report;
      if (!report || !report.a || !report.b) {
        return ctx.empty(el, "No paired run loaded — there is no story to tell yet.");
      }

      el.appendChild(ctx.h("p", {
        class: "wt-lede",
        text: "Assembled from this report's own findings — nothing below is " +
              "invented, and a section the report cannot back is skipped. " +
              "The ⌖ chips jump to the step or block that carries each claim; " +
              "dotted terms explain themselves on hover, focus, or tap.",
      }));

      var story = ctx.h("ol", { class: "wt-story" });
      var sections = [
        verdictSection(ctx, report),
        diagnosisSection(ctx, report),
        partingSection(ctx, report),
        costSection(ctx, report),
        processSection(ctx, report),
        counterfactualSection(ctx, report),
        triageSection(ctx, report),
      ];
      var told = 0;
      sections.forEach(function (node) {
        if (node) { story.appendChild(node); told++; }
      });
      if (!told) {
        return ctx.empty(el, "This report carries none of the sections the story is built from.");
      }
      el.appendChild(story);
      el.appendChild(ctx.h("p", {
        class: "wt-note",
        text: "Sections not shown are analyses this report does not carry.",
      }));
    },
  });

  // ------------------------------------------------------- 1. the verdict

  function verdictSection(ctx, report) {
    var oa = report.a.outcome || {};
    var ob = report.b.outcome || {};
    if (oa.success === undefined && ob.success === undefined) return null;

    var analysis = report.success_analysis || {};
    var winner = analysis.winner === "a" || analysis.winner === "b" ? analysis.winner : null;
    var nameA = nameOf(report, "a"), nameB = nameOf(report, "b");
    var kids = [];

    var lead;
    if (winner && analysis.basis === "outcome") {
      lead = nameOf(report, winner) + " solved the task and " +
             nameOf(report, other(winner)) + " did not, so the verdict goes to " +
             nameOf(report, winner) + " on outcome.";
    } else if (winner) {
      lead = "Both agents got there; " + nameOf(report, winner) +
             " takes the verdict on efficiency — same destination, less spent on the way.";
    } else if (oa.success === false && ob.success === false) {
      lead = "Neither " + nameA + " nor " + nameB +
             " solved this task, so there is no winner to declare — what follows is the story of how each one failed.";
    } else if (oa.success && ob.success) {
      lead = nameA + " and " + nameB +
             " both solved the task and neither clearly outspent the other; on outcome the runs are equivalent.";
    } else {
      lead = "One side's outcome is undeclared, so the verdict rests on what the trace itself shows.";
    }

    var first = [lead];
    var decision = Array.isArray(analysis.winning_decisions) ? analysis.winning_decisions[0] : null;
    if (decision && winner) {
      var row = rowForStep(report, winner, decision.step_index);
      if (row >= 0) {
        first.push(" The decision that settled it sits at step " + decision.step_index + ".");
        var rowCount = rowsOf(report).length;
        first.push(chip(ctx, "step " + winner.toUpperCase() + "·" + decision.step_index,
                        "The winning decision, in Tracks and Step detail",
                        function () { gotoRow(row, winner, rowCount); }));
      }
    }
    kids.push(paragraph(ctx, first));

    // The engine's own words — its narrative is the best prose in the file.
    if (analysis.narrative) {
      kids.push(paragraph(ctx, [
        ctx.h("span", { class: "said", text: "In the report's own words: " + analysis.narrative }),
      ]));
    }

    // The basis, when an expected answer exists to grade against.
    var evaluation = report.answer_eval || {};
    var va = evaluation.a_vs_expected && evaluation.a_vs_expected.verdict;
    var vb = evaluation.b_vs_expected && evaluation.b_vs_expected.verdict;
    if (evaluation.expected && va && vb && va !== "unknown") {
      kids.push(paragraph(ctx, [
        "Graded against the expected answer, " + nameA + "'s answer is a " + va +
        " and " + nameB + "'s a " + vb + ".",
        blockChip(ctx, "answer diff", ["answer-diff"], "The two answers, token by token"),
      ]));
    }
    return section(ctx, "The verdict", kids);
  }

  // ---------------------------------- 1b. what actually caused it

  function diagnosisSection(ctx, report) {
    var diagnosis = report.diagnosis || {};
    var hypotheses = Array.isArray(diagnosis.hypotheses) ? diagnosis.hypotheses : [];
    if (!hypotheses.length) return null;

    var kids = [];
    var leading = null;
    for (var i = 0; i < hypotheses.length; i++) {
      if (hypotheses[i].id === diagnosis.leading) { leading = hypotheses[i]; }
    }

    // The adjudicated verdict, verbatim — it already hedges exactly as much
    // as the margin warrants, so no prose is added around the claim itself.
    var first = [];
    if (leading) {
      first.push("Every signal in this report was made to argue its own cause, and one account won: ");
      first.push(ctx.h("span", { class: "said", text: diagnosis.verdict }));
    } else {
      first.push("Every signal in this report was made to argue its own cause, and none won: ");
      first.push(ctx.h("span", { class: "said", text: diagnosis.verdict }));
    }
    first.push(blockChip(ctx, "diagnosis", ["diagnosis"],
                         "The full hypothesis ranking, with its evidence"));
    kids.push(paragraph(ctx, first));

    // When the winner points away from the agent, the reader must know
    // before they reach the divergence story below.
    if (leading && leading.kind === "grader_or_label") {
      kids.push(paragraph(ctx, [
        "Read the parting-of-ways below with that in mind: the divergence " +
        "story is still told, but the ranked evidence says the cheaper " +
        "explanation is the grader, and the discriminating check is " +
        "human, not code — " + (leading.discriminator || "re-grade by hand") + ".",
      ]));
    } else if (!leading) {
      kids.push(paragraph(ctx, [
        "Until one of the discriminating checks is run, fixing anything " +
        "is a coin flip between the tied causes.",
      ]));
    }

    // The report arguing with itself is a finding, not a blemish.
    if (Array.isArray(diagnosis.contradictions) && diagnosis.contradictions.length) {
      var tension = ["The report argues with itself, and the diagnosis keeps the argument visible: "];
      tension.push(ctx.h("span", { class: "said", text: diagnosis.contradictions.join(" — and ") }));
      kids.push(paragraph(ctx, tension));
    }

    if (diagnosis.confidence && diagnosis.confidence.basis) {
      kids.push(paragraph(ctx, [
        "How sure: " + (diagnosis.confidence.level || "unstated") + " — " +
        diagnosis.confidence.basis + ".",
      ]));
    }
    return section(ctx, "What actually caused it", kids);
  }

  // ------------------------------------------- 2. where the runs parted

  function partingSection(ctx, report) {
    var divergence = Array.isArray(report.divergences) ? report.divergences[0] : null;
    var attribution = report.attribution || {};
    if (!divergence && !attribution.failed_agent) return null;

    var kids = [];
    var rows = rowsOf(report);
    var anchorRow = divergence ? rowForDivergence(report, divergence) : -1;
    if (anchorRow < 0 && attribution.failed_agent) {
      anchorRow = rowForStep(report, attribution.failed_agent, attribution.root_cause_step);
    }

    if (divergence) {
      var drifted = 0;
      for (var i = 0; i < rows.length && (anchorRow < 0 || i < anchorRow); i++) {
        if (rows[i].op === "drift") drifted++;
      }
      var opening = [
        "The two runs moved in step until ",
        anchorRow >= 0
          ? term(ctx, "alignment row " + anchorRow, "alignment-row")
          : term(ctx, "the first divergence", "divergence"),
        ", where the first ",
        term(ctx, "divergence", "divergence"),
        " opens: " + (divergence.summary || "the paired steps stop corresponding."),
      ];
      if (anchorRow >= 0) opening.push(rowChip(ctx, report, anchorRow, null, "The fork, in Tracks and Step detail"));
      if (drifted > 0) {
        opening.push(" Before the split, " + drifted + " row" + (drifted === 1 ? " had" : "s had") + " already ");
        opening.push(term(ctx, "drifted", "drift"));
        opening.push(" — the same kind of move, different content.");
      }
      kids.push(paragraph(ctx, opening));
    }

    if (attribution.failed_agent && attribution.explanation) {
      kids.push(paragraph(ctx, [
        "The engine's ",
        term(ctx, "root-cause", "root-cause"),
        " read, verbatim: ",
        ctx.h("span", { class: "said", text: attribution.explanation }),
        Array.isArray(attribution.chain) && attribution.chain.length > 1
          ? " The chain shows the mistake "
          : null,
        Array.isArray(attribution.chain) && attribution.chain.length > 1
          ? term(ctx, "propagating", "propagation")
          : null,
        Array.isArray(attribution.chain) && attribution.chain.length > 1
          ? " through " + (attribution.chain.length - 1) + " later step" +
            (attribution.chain.length === 2 ? "" : "s") + "."
          : null,
      ]));
    }

    // The actual texts, quoted — the evidence is the step, not the summary.
    var failed = attribution.failed_agent === "a" || attribution.failed_agent === "b"
      ? attribution.failed_agent : null;
    if (failed && isNum(attribution.root_cause_step)) {
      var rootStep = stepOf(report, failed, attribution.root_cause_step);
      var rootRow = rowForStep(report, failed, attribution.root_cause_step);
      if (rootStep && (rootStep.input || rootStep.output)) {
        var quoteBits = ["At the pivotal step, " + nameOf(report, failed) + "'s input read "];
        quoteBits.push(snip(ctx, rootStep.input || "(empty)"));
        if (rootStep.output) {
          quoteBits.push(" and it came back with ");
          quoteBits.push(snip(ctx, rootStep.output));
        }
        quoteBits.push(".");
        var counterpartIndex = rootRow >= 0 ? rows[rootRow][other(failed) + "_index"] : null;
        var counterpart = stepOf(report, other(failed), counterpartIndex);
        if (counterpart && counterpart.output) {
          quoteBits.push(" " + nameOf(report, other(failed)) + "'s counterpart in the same row produced ");
          quoteBits.push(snip(ctx, counterpart.output));
          quoteBits.push(".");
        }
        if (rootRow >= 0) quoteBits.push(rowChip(ctx, report, rootRow, failed, "The root-cause step itself"));
        kids.push(paragraph(ctx, quoteBits));
      }
    }
    if (!kids.length) return null;
    return section(ctx, "Where the runs parted", kids);
  }

  // ------------------------------------------------------ 3. what it cost

  function costSection(ctx, report) {
    var delta = report.metrics_delta;
    if (!delta || !delta.tokens || !isNum(delta.tokens.a) || !isNum(delta.tokens.b)) return null;

    var F = ctx.fmt;
    var heavy = delta.tokens.b > delta.tokens.a ? "b"
              : delta.tokens.a > delta.tokens.b ? "a" : null;
    var kids = [];
    if (!heavy) {
      kids.push(paragraph(ctx, [
        "On resources the runs are even: both spent " + F.tokens(delta.tokens.a) +
        (delta.latency_s ? ", around " + F.sec(delta.latency_s.a) + " apiece" : "") + ".",
        blockChip(ctx, "the numbers", ["deltas"], "Every metric, side by side"),
      ]));
    } else {
      var light = other(heavy);
      var pieces = [
        nameOf(report, heavy) + " paid for its path: " +
        F.tokens(delta.tokens[heavy]) + " against " + F.tokens(delta.tokens[light]) +
        " (" + F.delta(delta.tokens[heavy] - delta.tokens[light], "tokens") + ")",
      ];
      if (delta.latency_s && isNum(delta.latency_s[heavy]) && isNum(delta.latency_s[light])) {
        pieces.push(", " + F.sec(delta.latency_s[heavy]) + " of latency against " +
                    F.sec(delta.latency_s[light]));
      }
      if (delta.cost_usd && isNum(delta.cost_usd[heavy]) && isNum(delta.cost_usd[light])) {
        pieces.push(", and " + F.usd(delta.cost_usd[heavy]) + " against " +
                    F.usd(delta.cost_usd[light]));
      }
      if (delta.steps && isNum(delta.steps[heavy]) && isNum(delta.steps[light])) {
        var extra = delta.steps[heavy] - delta.steps[light];
        pieces.push(" — " + (extra > 0 ? extra + " extra step" + (extra === 1 ? "" : "s")
                                       : "in " + delta.steps[heavy] + " steps") + ".");
      } else {
        pieces.push(".");
      }
      pieces.push(blockChip(ctx, "the numbers", ["deltas"], "Every metric, side by side"));
      kids.push(paragraph(ctx, pieces));
    }

    // Say when the counts are estimates, with the glossary carrying why it matters.
    var bases = [];
    ["a", "b"].forEach(function (side) {
      var accounting = report[side] && report[side].token_accounting;
      if (accounting && accounting.basis && accounting.basis !== "measured") {
        bases.push(nameOf(report, side));
      }
    });
    if (bases.length) {
      kids.push(paragraph(ctx, [
        "Token counts for " + bases.join(" and ") + " are partly ",
        term(ctx, "estimated rather than measured", "tokens-basis"),
        ", so read the token comparison as approximate.",
      ]));
    }
    return section(ctx, "What it cost", kids);
  }

  // ------------------------------------------- 4. was the process clean?

  function processSection(ctx, report) {
    var process = report.process;
    var gapA = process && process.a && process.a.gap;
    var gapB = process && process.b && process.b.gap;
    if (!gapA && !gapB) return null;

    var kids = [];
    var opener = [];
    if (gapA && gapA.verdict) opener.push(nameOf(report, "a") + " " + gapA.verdict);
    if (gapB && gapB.verdict) opener.push(nameOf(report, "b") + " " + gapB.verdict);
    var openerKids = ["Held against its own trace, " + opener.join("; ") + "."];
    if (process.narrative) {
      openerKids.push(ctx.h("span", { class: "said", text: " " + process.narrative }));
    }
    openerKids.push(blockChip(ctx, "process evidence", ["gap", "integrity-flags"],
                              "The gap verdicts and every raised flag"));
    kids.push(paragraph(ctx, openerKids));

    ["a", "b"].forEach(function (side) {
      var gap = side === "a" ? gapA : gapB;
      if (!gap || !gap.verdict) return;
      if (gap.verdict === "passed but pathological") {
        var flagBits = flagPhrases(ctx, gap.raised || []);
        var bits = [
          nameOf(report, side) + "'s pass is the outcome-process gap in person — ",
          term(ctx, "passed but pathological", "passed-but-pathological"),
          ": on the way to its accepted answer it ",
        ];
        bits = bits.concat(flagBits);
        bits.push(". An outcome-only scoreboard gives this run the same mark as a clean one.");
        kids.push(paragraph(ctx, bits));
      } else if (gap.verdict === "failed but clean") {
        kids.push(paragraph(ctx, [
          nameOf(report, side) + " is the mirror case — ",
          term(ctx, "failed but clean", "failed-but-clean"),
          ": it failed the check with nothing visibly wrong in its trace, which is evidence " +
          "about the grader as much as the agent. Read the grading before blaming the run.",
        ]));
      }
    });
    return section(ctx, "Was the process clean?", kids);
  }

  //: raised flag keys → readable phrases, with glossary terms where one exists.
  function flagPhrases(ctx, raised) {
    var wording = {
      looped: "looped",
      loop_block: "cycled through the same block of calls",
      repeated_calls: "repeated the same call",
      swallowed_error: "hit an error and pressed on as if it had not",
      budget_pressure: "finished on the edge of its step budget",
      undeclared_tools: "called a tool it was never offered",
      invented_arguments: "used argument values with no source in the trace",
      schema_violation: "called a tool with arguments that do not typecheck",
    };
    var nodes = raised.map(function (flag) {
      if (flag === "blind_write") return term(ctx, "wrote blind", "blind-write");
      if (flag === "false_success") return term(ctx, "claimed a false success", "false-success");
      if (flag === "no_information_steps") return term(ctx, "took no-information steps", "no-information-step");
      return wording[flag] || flag.replace(/_/g, " ");
    });
    if (!nodes.length) return ["raised no individual flags"];
    var out = [];
    nodes.forEach(function (node, index) {
      if (index > 0) out.push(index === nodes.length - 1 ? " and " : ", ");
      out.push(node);
    });
    return out;
  }

  // ------------------------------------- 5. what would have happened

  function counterfactualSection(ctx, report) {
    var cf = report.counterfactual;
    if (!cf || (!cf.narrative && !cf.estimate)) return null;

    var kids = [];
    var lead = [];
    if (cf.narrative) {
      lead.push(cf.narrative);
    } else if (cf.estimate) {
      lead.push((cf.premise ? cf.premise.charAt(0).toUpperCase() + cf.premise.slice(1) : "In the counterfactual") +
                ", the estimated run ends in " + (cf.estimate.outcome || "an unknown outcome") + ".");
    }
    if (cf.confidence) lead.push(" Confidence: " + cf.confidence + ".");
    lead.push(blockChip(ctx, "the what-if", ["counterfactual"], "The full counterfactual estimate"));
    kids.push(paragraph(ctx, lead));

    kids.push(paragraph(ctx, [
      "That estimate is a ",
      term(ctx, "splice of observed steps", "splice-counterfactual"),
      " — the winner's recorded suffix grafted onto the loser's recorded prefix, costed at " +
      "what those steps actually spent — not a simulation of what the agent would really have done.",
    ]));

    // Only when there is a positive gap to divide — a negative "saving"
    // (the winner actually spent more) would read as nonsense here, and the
    // Shapley block itself carries that nuance.
    var shapley = report.shapley;
    if (shapley && shapley.available && Array.isArray(shapley.allocations) &&
        shapley.allocations.length && isNum(shapley.total_saving) && shapley.total_saving > 0) {
      var top = shapley.allocations[0];
      shapley.allocations.forEach(function (allocation) {
        if (isNum(allocation.shapley) && Math.abs(allocation.shapley) > Math.abs(top.shapley || 0)) {
          top = allocation;
        }
      });
      var unit = shapley.metric === "tokens" ? "token" : (shapley.metric || "token");
      kids.push(paragraph(ctx, [
        "Dividing the " + ctx.fmt.int(shapley.total_saving) + "-" + unit +
        " gap fairly across " + shapley.regions + " divergence region" +
        (shapley.regions === 1 ? "" : "s") + ", the " + (top.kind || "top") +
        " decision carries a ",
        term(ctx, "Shapley share", "shapley-share"),
        " of " + ctx.fmt.pct(top.share, 0) + ".",
        blockChip(ctx, "the split", ["shapley"], "The full Shapley allocation"),
      ]));
    }
    return section(ctx, "What would have happened otherwise", kids);
  }

  // -------------------------------------------------- 6. what to do next

  function triageSection(ctx, report) {
    var triage = (ctx.aggregate || {}).triage;
    var actions = triage && Array.isArray(triage.actions) ? triage.actions : [];
    if (!actions.length) return null;

    var kids = [];
    var mastKnown = !!(ctx.aggregate && ctx.aggregate.taxonomy);
    actions.slice(0, 2).forEach(function (action, index) {
      var bits = [(index === 0 ? "Across the whole batch, triage puts this first: " : "Second: ") +
                  action.action + "."];
      var evidence = action.evidence || {};
      var rate = evidence.occurrence_rate;
      if (rate && isNum(rate.rate) && Array.isArray(rate.interval)) {
        bits.push(" Seen on " + (evidence.task_count || rate.k) + " of " +
                  (evidence.of_tasks || rate.n) + " tasks (");
        bits.push(term(ctx, "Wilson 95%", "wilson-interval"));
        bits.push(" interval " + ctx.fmt.pct(rate.interval[0], 0) + "–" +
                  ctx.fmt.pct(rate.interval[1], 0) + ").");
      } else if (evidence.task_count && evidence.of_tasks) {
        bits.push(" Seen on " + evidence.task_count + " of " + evidence.of_tasks + " tasks.");
      }
      if (index === 0) {
        bits.push(blockChip(ctx, "triage detail", ["recommendations", "issues"],
                            "The ranked actions with their evidence"));
      }
      // The verification contract makes the action a testable hypothesis:
      // say how the fixer will know it worked, and be honest when the
      // success rate cannot confirm it at this suite size.
      var verification = action.verification || {};
      var checks = Array.isArray(verification.checks) ? verification.checks : [];
      var fingerprintCheck = null, rateCheck = null;
      checks.forEach(function (check) {
        if (check.kind === "fingerprint" && !fingerprintCheck) fingerprintCheck = check;
        if (check.kind === "success_rate") rateCheck = check;
      });
      if (fingerprintCheck || rateCheck) {
        var how = ["How you will know the fix worked: "];
        if (fingerprintCheck) {
          how.push("the fingerprint" +
                   (fingerprintCheck.fingerprints.length > 1 ? "s" : "") +
                   " behind this finding should stop appearing in the next batch" +
                   " — a binary, deterministic check");
        }
        if (rateCheck) {
          how.push((fingerprintCheck ? ". " : "") +
                   (rateCheck.single_rerun_can_confirm
                    ? "The success rate can also confirm it: an unchanged agent " +
                      "reaches " + rateCheck.hoped + " only " +
                      ctx.fmt.pct(rateCheck.chance_of_hoped_result_without_a_fix, 1) +
                      " of the time by luck"
                    : "The success rate alone cannot confirm it here: an " +
                      "unchanged agent reaches " + rateCheck.hoped + " " +
                      ctx.fmt.pct(rateCheck.chance_of_hoped_result_without_a_fix, 0) +
                      " of the time by pure luck, so rely on the fingerprint " +
                      "check or add runs"));
        }
        how.push(". Re-run the same tasks, then compare with the progress command.");
      }
      kids.push(paragraph(ctx, bits));
      if (fingerprintCheck || rateCheck) {
        kids.push(paragraph(ctx, [ctx.h("span", { class: "wt-note" }, null)].map(function (span) {
          span.textContent = how.join("");
          return span;
        })));
      }
    });
    if (mastKnown) {
      kids.push(paragraph(ctx, [
        "The failure categories behind these actions are also mapped onto the ",
        term(ctx, "MAST and TRAIL", "mast-trail"),
        " taxonomies, so the findings can be discussed in a shared vocabulary.",
        blockChip(ctx, "taxonomy", ["taxonomy", "taxonomy-coverage"], "The MAST and TRAIL labels"),
      ]));
    }
    kids.push(paragraph(ctx, [
      ctx.h("span", { class: "wt-note", text: "These actions are batch-level: they rank what recurs across every task, not this task alone." }),
    ]));
    return section(ctx, "What to do", kids);
  }

})(typeof window !== "undefined" ? window : this);

</script>
