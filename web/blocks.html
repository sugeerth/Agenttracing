<script>
/* AgentDiff blocks — reliability over repeats, and the failure taxonomies.
 *
 * Six blocks over two engine modules that had no interface: deepcompare
 * .reliability (pass^k, consistency, ICC, the runs advisory) and
 * deepcompare.taxonomy (MAST and TRAIL).
 *
 * Both modules exist because a number can be true and still mislead, so both
 * ship their qualifiers as data rather than as prose someone may not read.
 * These blocks are built the same way round: the qualifier is not a footnote
 * under the figure, it is the frame the figure is drawn inside. Concretely —
 *
 *   · the pass^k curve is never drawn without pass@k beside it, because the
 *     divergence between "can it ever" and "can it every time" is the finding
 *     and either line alone is the wrong half of it;
 *   · the runs advisory is rendered above every reliability figure it
 *     qualifies, and on a three-run demo the loudest thing on the card is
 *     that nothing here can rank two agents;
 *   · a value of null with a stated reason renders as the reason, never as 0
 *     and never as a blank cell;
 *   · a taxonomy category that is 0 by construction says *by construction*,
 *     because "AgentDiff found no inter-agent misalignment" and "AgentDiff
 *     cannot see inter-agent misalignment" are opposite claims;
 *   · coverage is reported mass-weighted as well as by mode count, since the
 *     modes this tool cannot reach are not the rare ones.
 *
 * Relevance is 0 when the aggregate key is absent: reliability exists only in
 * `deepcompare runs` output and taxonomy in batch output, so on any one
 * report half of these blocks hide themselves. That is the contract.
 */
(function (global) {
  "use strict";

  var AgentDiff = global.AgentDiff;
  if (!AgentDiff || typeof AgentDiff.block !== "function") return;

  // ------------------------------------------------------------------ style

  var styleInjected = false;
  function ensureStyle() {
    if (styleInjected) return;
    styleInjected = true;
    try {
      if (document.getElementById("agentdiff-science-style")) return;
      var node = document.createElement("style");
      node.id = "agentdiff-science-style";
      node.textContent = [
        ".sc-note{border:1px solid var(--rule);border-left-width:3px;border-radius:7px;",
        "padding:7px 9px;font-size:12px;line-height:1.45;margin:0 0 9px;",
        "background:var(--surface-2);color:var(--ink-2)}",
        ".sc-note strong{color:var(--ink)}",
        ".sc-note.bad{border-left-color:var(--bad)}",
        ".sc-note.warn{border-left-color:var(--warn)}",
        ".sc-note.good{border-left-color:var(--good)}",
        ".sc-note.info{border-left-color:var(--rule-2)}",
        ".sc-verdict{border:1px solid var(--rule-2);border-left-width:4px;",
        "border-radius:8px;padding:10px 11px;margin:0 0 11px;background:var(--surface-2)}",
        ".sc-verdict.bad{border-left-color:var(--bad)}",
        ".sc-verdict.warn{border-left-color:var(--warn)}",
        ".sc-verdict.good{border-left-color:var(--good)}",
        ".sc-verdict-head{display:flex;flex-wrap:wrap;gap:7px;align-items:baseline;",
        "margin-bottom:5px}",
        ".sc-verdict-lead{font-size:13.5px;font-weight:650;color:var(--ink);",
        "line-height:1.35}",
        ".sc-verdict-body{font-size:12px;color:var(--ink-2);line-height:1.5}",
        ".sc-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;",
        "color:var(--ink-3);margin:12px 0 6px}",
        ".sc-h:first-child{margin-top:0}",
        ".sc-sub{font-size:11.5px;color:var(--ink-3);line-height:1.45}",
        ".sc-line{font-size:12.5px;color:var(--ink);line-height:1.5}",
        ".sc-chips{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 0;align-items:center}",
        ".sc-panel{border-top:1px solid var(--rule);padding-top:10px;margin-top:12px}",
        ".sc-panel:first-child{border-top:none;padding-top:0;margin-top:0}",
        ".sc-agent{display:flex;flex-wrap:wrap;gap:7px;align-items:baseline;margin-bottom:6px}",
        ".sc-agent b{font-size:13px;color:var(--ink)}",
        ".sc-claims{list-style:none;margin:6px 0 0;padding:0;font-size:12px;line-height:1.5}",
        ".sc-claims li{display:flex;gap:7px;padding:2px 0;color:var(--ink-2)}",
        ".sc-claims li i{font-style:normal;flex:0 0 auto;width:12px;text-align:center}",
        ".sc-claims li.yes i{color:var(--good)}",
        ".sc-claims li.no i{color:var(--bad)}",
        ".sc-claims li.no{color:var(--ink)}",
        ".sc-bars{display:grid;gap:5px;margin-top:4px;max-width:640px}",
        ".sc-bar{display:grid;grid-template-columns:minmax(88px,0.9fr) minmax(60px,1.6fr) auto;",
        "gap:9px;align-items:center;font-size:12px}",
        ".sc-meter{max-width:320px}",
        ".sc-bar-l{color:var(--ink-2);overflow-wrap:anywhere}",
        ".sc-bar-t{height:9px;border-radius:3px;background:var(--rule);overflow:hidden}",
        ".sc-bar-t>i{display:block;height:100%;border-radius:3px}",
        ".sc-bar-v{font-variant-numeric:tabular-nums;color:var(--ink);font-size:11.5px;",
        "white-space:nowrap}",
        ".sc-bar.zero .sc-bar-t{background:repeating-linear-gradient(135deg,",
        "var(--rule) 0 4px,transparent 4px 8px);border:1px solid var(--rule)}",
        ".sc-hero{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin:2px 0 4px}",
        ".sc-hero-n{font-size:26px;font-weight:640;line-height:1;color:var(--ink);",
        "font-variant-numeric:tabular-nums}",
        ".sc-hero-c{font-size:11.5px;color:var(--ink-3);line-height:1.4;max-width:34ch}",
        ".sc-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;",
        "color:var(--ink-3);margin:6px 0 2px;align-items:center}",
        ".sc-dot{display:inline-block;width:16px;height:0;vertical-align:2px;",
        "margin-right:5px;border-top-width:2.4px;border-top-style:solid}",
        ".sc-swatch{display:inline-block;width:12px;height:9px;vertical-align:-1px;",
        "margin-right:5px;border-radius:2px}",
        ".sc-flag{color:var(--bad);font-weight:600}",
        ".sc-mono-b{font-family:var(--mono);font-size:11px;color:var(--ink-2)}",
        "table.grid td.sc-num{font-variant-numeric:tabular-nums;white-space:nowrap}",
      ].join("");
      document.head.appendChild(node);
    } catch (err) { /* styling is a nicety; the blocks still read without it */ }
  }

  // ------------------------------------------------------------------ utils

  function isNum(v) { return typeof v === "number" && !isNaN(v); }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function obj(v) { return v && typeof v === "object" && !Array.isArray(v) ? v : null; }
  function str(v) { return typeof v === "string" && v ? v : ""; }

  function reliabilityOf(ctx) {
    var block = obj(ctx && ctx.aggregate && ctx.aggregate.reliability);
    if (!block) return null;
    return obj(block.per_agent) ? block : null;
  }

  function taxonomyOf(ctx) {
    return obj(ctx && ctx.aggregate && ctx.aggregate.taxonomy);
  }

  /* Sides in a stable order, each with its side key so the agent's own colour
   * token follows it into every chart and chip. */
  function sides(rel) {
    var per = obj(rel && rel.per_agent) || {};
    return Object.keys(per).sort().map(function (side) {
      var row = obj(per[side]) || {};
      return {
        side: side,
        row: row,
        name: str(row.agent) || str((obj(rel.agents) || {})[side]) || side,
      };
    });
  }

  function sideColor(ctx, side) {
    return side === "b" ? ctx.color.b : ctx.color.a;
  }

  function note(ctx, kind, kids) {
    return ctx.h("div", { class: "sc-note " + kind }, kids);
  }

  function tag(ctx, cls, text) {
    return ctx.h("span", { class: cls ? "tag " + cls : "tag", text: text });
  }

  function head(ctx, text) {
    return ctx.h("div", { class: "sc-h", text: text });
  }

  function caveat(ctx, text) {
    return ctx.h("div", { class: "caveat", text: text });
  }

  function pct(ctx, value, places) {
    return isNum(value) ? ctx.fmt.pct(value, places === undefined ? 1 : places) : "—";
  }

  /* A value that could not be computed renders as its reason.
   *
   * The engine returns None with a `reason` precisely so that nobody has to
   * guess whether a blank cell means zero, means missing, or means nobody
   * looked. Reproducing that distinction is the whole job of this helper. */
  function valueOrReason(ctx, value, reason, render) {
    if (isNum(value)) {
      return ctx.h("span", { text: (render || function (v) { return pct(ctx, v); })(value) });
    }
    return ctx.h("span", {
      class: "sc-sub",
      text: "not computed — " + (str(reason) || "no reason given"),
    });
  }

  function bar(ctx, label, fraction, valueText, fill, isZero) {
    var width = Math.max(0, Math.min(1, isNum(fraction) ? fraction : 0)) * 100;
    return ctx.h("div", { class: "sc-bar" + (isZero ? " zero" : "") }, [
      ctx.h("div", { class: "sc-bar-l", text: label }),
      ctx.h("div", { class: "sc-bar-t" }, [
        ctx.h("i", { style: { width: width.toFixed(1) + "%", background: fill } }),
      ]),
      ctx.h("div", { class: "sc-bar-v", text: valueText }),
    ]);
  }

  function svgText(ctx, x, y, text, fill, size, anchor, weight) {
    return ctx.svg("text", {
      x: x, y: y, fill: fill, "font-size": size || 9,
      "text-anchor": anchor || "start",
      "font-family": "var(--sans)",
      "font-weight": weight || null,
    }, [text]);
  }

  /* An SVG that fills its card but stops growing — same reasoning as the
   * other modules: these cards live in a 1-to-5 column layout, so an
   * uncapped viewBox would render the axis labels at headline size in a
   * one-column reading. */
  function chart(ctx, width, height) {
    return ctx.svg("svg", {
      viewBox: "0 0 " + width + " " + height,
      preserveAspectRatio: "xMinYMin meet",
      style: "width:100%;max-width:" + Math.round(width * 1.5) +
             "px;height:auto;display:block;overflow:visible",
      role: "img",
    });
  }

  function scale(lo, hi, from, to) {
    var span = hi - lo;
    if (!span) span = 1;
    return function (value) { return from + ((value - lo) / span) * (to - from); };
  }

  function curveAt(curve, k) {
    var rows = arr(curve);
    for (var i = 0; i < rows.length; i++) {
      var row = obj(rows[i]);
      if (row && row.k === k) return isNum(row.value) ? row.value : null;
    }
    return null;
  }

  function points(delta) {
    return (Math.abs(delta) * 100).toFixed(1) + " points";
  }

  // ============================================================ 1. pass^k

  /* The two curves, on one pair of axes.
   *
   * They share a unit (a probability over the same k) so they share an axis;
   * what separates them is the question they answer, which is carried by line
   * style, by the endpoint labels, and by the shaded band between them. The
   * band is the point of the chart: it is the distance between "this agent
   * can do the task" and "this agent can be relied on to do the task".
   */
  function passCurveChart(ctx, entry) {
    var row = entry.row;
    var hat = obj(row.pass_hat_k) || {};
    var cov = obj(row.pass_at_k) || {};
    var maxK = isNum(row.max_k) ? row.max_k : 0;
    var color = ctx.color;
    var accent = sideColor(ctx, entry.side);

    var W = 372, H = 140;
    // Right padding holds the direct end labels ("pass@3 88%"), which are
    // drawn outside the plot area — too little and they clip at the card edge.
    var pad = { l: 30, r: 74, t: 11, b: 24 };
    var x = scale(1, Math.max(2, maxK), pad.l, W - pad.r);
    if (maxK <= 1) x = function () { return pad.l + (W - pad.r - pad.l) / 2; };
    var y = scale(0, 1, H - pad.b, pad.t);
    var plot = chart(ctx, W, H);

    [0, 0.25, 0.5, 0.75, 1].forEach(function (value) {
      plot.appendChild(ctx.svg("line", {
        x1: pad.l, x2: W - pad.r, y1: y(value), y2: y(value),
        stroke: color.grid, "stroke-width": 1,
      }));
      if (value === 0 || value === 0.5 || value === 1) {
        plot.appendChild(svgText(ctx, pad.l - 5, y(value) + 3,
          ctx.fmt.pct(value, 0), color.muted, 8.5, "end"));
      }
    });

    var both = [];
    for (var k = 1; k <= maxK; k++) {
      var h = curveAt(hat.curve, k);
      var c = curveAt(cov.curve, k);
      plot.appendChild(svgText(ctx, x(k), H - pad.b + 12, String(k), color.muted, 8.5, "middle"));
      if (h !== null && c !== null) both.push({ k: k, hat: h, cov: c });
    }
    plot.appendChild(svgText(ctx, (pad.l + W - pad.r) / 2, H - 3,
      "k — runs asked for", color.muted, 8.5, "middle"));

    // The gap, as an area. Drawn first so the lines sit on top of it.
    if (both.length >= 2) {
      var top = both.map(function (p) { return x(p.k) + "," + y(p.cov); });
      var bottom = both.slice().reverse().map(function (p) { return x(p.k) + "," + y(p.hat); });
      plot.appendChild(ctx.svg("polygon", {
        points: top.concat(bottom).join(" "),
        fill: color.warn, "fill-opacity": 0.22, stroke: "none",
      }));
    }

    function draw(key, stroke, dash) {
      var run = [];
      for (var i = 0; i < both.length; i++) {
        run.push(x(both[i].k) + "," + y(both[i][key]));
      }
      if (run.length > 1) {
        plot.appendChild(ctx.svg("polyline", {
          points: run.join(" "), fill: "none", stroke: stroke,
          "stroke-width": key === "hat" ? 2.2 : 1.8,
          "stroke-dasharray": dash, "stroke-linejoin": "round",
          "stroke-linecap": "round",
        }));
      }
      both.forEach(function (p) {
        plot.appendChild(ctx.svg("circle", {
          cx: x(p.k), cy: y(p[key]), r: key === "hat" ? 3.1 : 2.8,
          fill: key === "hat" ? stroke : color.surface,
          stroke: stroke, "stroke-width": key === "hat" ? 1.6 : 1.6,
        }));
      });
    }
    draw("cov", color.ink, "4 3");
    draw("hat", accent, null);

    // Direct labels at the right-hand end: with two series and an endpoint
    // apiece, a legend alone would make the reader count dashes.
    if (both.length) {
      var last = both[both.length - 1];
      var lx = x(last.k) + 6;
      var hy = y(last.hat);
      var cy = y(last.cov);
      if (Math.abs(hy - cy) < 9) { hy += 4; cy -= 4; }
      plot.appendChild(svgText(ctx, lx, cy + 3,
        "pass@" + last.k + " " + ctx.fmt.pct(last.cov, 0), color.ink, 8.5, "start", 600));
      plot.appendChild(svgText(ctx, lx, hy + 3,
        "pass^" + last.k + " " + ctx.fmt.pct(last.hat, 0), accent, 8.5, "start", 600));

      var gap = last.cov - last.hat;
      // Only annotate the band in place when there is room to read the label
      // inside it; below that the label sits on the lines and the sentence
      // under the chart carries the number instead.
      if (gap >= 0.02 && Math.abs(y(last.hat) - y(last.cov)) >= 17) {
        var mid = (y(last.cov) + y(last.hat)) / 2;
        plot.appendChild(ctx.svg("line", {
          x1: x(last.k) - 9, x2: x(last.k) - 9, y1: y(last.cov), y2: y(last.hat),
          stroke: color.warn, "stroke-width": 1.4,
        }));
        plot.appendChild(svgText(ctx, x(last.k) - 12, mid + 3,
          "gap " + (gap * 100).toFixed(0), color.warn, 8.5, "end", 600));
      }
    }
    return plot;
  }

  AgentDiff.block({
    id: "passk",
    title: "pass^k — reliability curve",
    question: "Does it work every time, or just once?",
    group: "signal",
    size: "wide",

    relevance: function (ctx) {
      var rel = reliabilityOf(ctx);
      if (!rel) return 0;
      var list = sides(rel);
      if (!list.length) return 0;
      var maxK = 0, gap = 0;
      list.forEach(function (entry) {
        var k = isNum(entry.row.max_k) ? entry.row.max_k : 0;
        if (k > maxK) maxK = k;
        var h = obj(entry.row.pass_hat_k), c = obj(entry.row.pass_at_k);
        if (h && c && isNum(h.value_at_max_k) && isNum(c.value_at_max_k)) {
          gap = Math.max(gap, c.value_at_max_k - h.value_at_max_k);
        }
      });
      if (maxK <= 0) return 0.3;
      if (maxK === 1) return 0.5;
      return gap >= 0.02 ? 0.97 : 0.82;
    },

    render: function (el, ctx) {
      ensureStyle();
      var rel = reliabilityOf(ctx);
      if (!rel) {
        return ctx.empty(el, "No reliability analysis in this report — pass^k needs " +
          "repeated runs of the same task, which only `deepcompare runs` produces.");
      }
      var list = sides(rel);
      if (!list.length) return ctx.empty(el, "The reliability block carries no agents.");

      el.appendChild(note(ctx, "info", [
        ctx.h("strong", { text: "Two questions, one axis. " }),
        ctx.h("span", {
          text: "pass@k rises with k and asks can it ever — the chance at least one " +
            "of k runs passes. pass^k falls with k and asks can it every time — the " +
            "chance all k pass. The shaded gap between them is the part of the " +
            "success rate that does not survive being asked twice.",
        }),
      ]));

      list.forEach(function (entry) {
        var row = entry.row;
        var maxK = isNum(row.max_k) ? row.max_k : 0;
        var hat = obj(row.pass_hat_k) || {};
        var cov = obj(row.pass_at_k) || {};
        var accent = sideColor(ctx, entry.side);
        var panel = ctx.h("div", { class: "sc-panel" });

        panel.appendChild(ctx.h("div", { class: "sc-agent" }, [
          ctx.h("b", { text: entry.name }),
          tag(ctx, entry.side, entry.side.toUpperCase()),
          ctx.h("span", {
            class: "sc-sub",
            text: (isNum(row.successes) ? row.successes : "—") + " of " +
              (isNum(row.runs_used) ? row.runs_used : "—") + " eligible run(s) passed" +
              (isNum(row.mean_success_rate)
                ? " (" + ctx.fmt.pct(row.mean_success_rate, 1) + ")" : "") +
              " across " + (isNum(row.tasks_scored) ? row.tasks_scored : "—") + " task(s)",
          }),
        ]));

        if (!maxK || str(hat.reason)) {
          panel.appendChild(note(ctx, "warn", [
            ctx.h("strong", { text: "No curve for this agent. " }),
            ctx.h("span", { text: str(hat.reason) || "max_k is 0, so no k can be reported." }),
          ]));
          el.appendChild(panel);
          return;
        }

        panel.appendChild(ctx.h("div", { class: "scroll-x" }, [passCurveChart(ctx, entry)]));

        panel.appendChild(ctx.h("div", { class: "sc-legend" }, [
          ctx.h("span", null, [
            ctx.h("i", { class: "sc-dot", style: { borderTopColor: accent } }),
            "pass^k — all k runs pass (reliability)",
          ]),
          ctx.h("span", null, [
            ctx.h("i", {
              class: "sc-dot",
              style: { borderTopColor: ctx.color.ink, borderTopStyle: "dashed" },
            }),
            "pass@k — at least one of k passes (coverage)",
          ]),
          ctx.h("span", null, [
            ctx.h("i", {
              class: "sc-swatch",
              style: { background: ctx.color.warn, opacity: "0.45" },
            }),
            "the gap",
          ]),
        ]));

        var h = isNum(hat.value_at_max_k) ? hat.value_at_max_k : null;
        var c = isNum(cov.value_at_max_k) ? cov.value_at_max_k : null;
        if (h !== null && c !== null && maxK >= 2) {
          var gap = c - h;
          panel.appendChild(ctx.h("div", { class: "sc-line", style: { marginTop: "7px" } }, [
            gap >= 0.005
              ? ctx.h("span", {
                  text: "Asked to do it " + maxK + " times running it holds up " +
                    ctx.fmt.pct(h, 0) + " of the time; its chance of getting there at " +
                    "least once in " + maxK + " tries is " + ctx.fmt.pct(c, 0) + ". That " +
                    points(gap) + " is the distance between “can it ever” and “can it " +
                    "every time”.",
                })
              : ctx.h("span", {
                  text: "The two curves agree at k=" + maxK + " (" + ctx.fmt.pct(h, 0) +
                    "): on this suite, whatever this agent can do at all it does every " +
                    "time. The gap is a finding when it opens, and its absence is a " +
                    "finding too.",
                }),
          ]));
        } else if (maxK === 1) {
          panel.appendChild(ctx.h("div", { class: "sc-line", style: { marginTop: "7px" } }, [
            ctx.h("span", {
              text: "With one eligible run per task the curve stops at k=1, where both " +
                "measures collapse to the success rate. Nothing here speaks to " +
                "repeatability.",
            }),
          ]));
        }

        var dl = ctx.h("dl", { class: "kv", style: { marginTop: "8px" } }, [
          ctx.h("dt", { text: "max_k" }),
          ctx.h("dd", { text: String(maxK) }),
          ctx.h("dt", { text: "basis" }),
          ctx.h("dd", { class: "sc-sub", text: str(row.max_k_basis) || "—" }),
          ctx.h("dt", { text: "pass^k" }),
          ctx.h("dd", { class: "sc-sub", text: str(hat.basis) + (str(hat.source) ? " · " + hat.source : "") }),
          ctx.h("dt", { text: "pass@k" }),
          ctx.h("dd", { class: "sc-sub", text: str(cov.basis) + (str(cov.source) ? " · " + cov.source : "") }),
        ]);
        panel.appendChild(dl);
        el.appendChild(panel);
      });

      var advisory = null;
      list.forEach(function (entry) {
        var a = obj(entry.row.runs_advisory);
        if (a && (advisory === null || (isNum(a.n_min) && isNum(advisory.n_min) && a.n_min < advisory.n_min))) {
          advisory = a;
        }
      });
      if (advisory && advisory.tier === "insufficient") {
        el.appendChild(caveat(ctx,
          "These curves are capped at k=" + (isNum(advisory.n_min) ? advisory.n_min : "?") +
          " and describe these runs only — at this run count they do not support " +
          "ranking one agent against the other. See “What the runs support”."));
      }
    },
  });

  // =================================================== 2. reliability-guards

  var TIER_STYLE = {
    "insufficient": { kind: "bad", word: "insufficient" },
    "below-floor": { kind: "warn", word: "below floor" },
    "structured-ok": { kind: "good", word: "structured-ok" },
    "open-ended-ok": { kind: "good", word: "open-ended-ok" },
    "none": { kind: "bad", word: "no eligible runs" },
  };

  AgentDiff.block({
    id: "reliability-guards",
    title: "What the runs support",
    question: "What was excluded, and does this even support a claim?",
    group: "signal",
    size: "normal",

    relevance: function (ctx) {
      var rel = reliabilityOf(ctx);
      if (!rel) return 0;
      var list = sides(rel);
      if (!list.length) return 0;
      var loud = false;
      list.forEach(function (entry) {
        var a = obj(entry.row.runs_advisory) || {};
        var ex = obj(entry.row.excluded_runs) || {};
        var un = obj(entry.row.unequal_trials) || {};
        if (a.tier === "insufficient" || a.tier === "none" || a.tier === "below-floor") loud = true;
        if (isNum(ex.count) && ex.count > 0) loud = true;
        if (un.flagged) loud = true;
      });
      return loud ? 1 : 0.75;
    },

    render: function (el, ctx) {
      ensureStyle();
      var rel = reliabilityOf(ctx);
      if (!rel) {
        return ctx.empty(el, "No reliability analysis in this report — the run-count " +
          "advisory and the harness-failure exclusions come with it.");
      }
      var list = sides(rel);
      if (!list.length) return ctx.empty(el, "The reliability block carries no agents.");

      /* The advisory goes first, above every figure it qualifies. Anything
       * else is a footnote under a number that has already been read. */
      list.forEach(function (entry) {
        var row = entry.row;
        var advisory = obj(row.runs_advisory) || {};
        var style = TIER_STYLE[advisory.tier] || { kind: "warn", word: str(advisory.tier) || "unknown" };

        var card = ctx.h("div", { class: "sc-verdict " + style.kind });
        card.appendChild(ctx.h("div", { class: "sc-verdict-head" }, [
          ctx.h("span", { class: "sc-verdict-lead", text: entry.name }),
          tag(ctx, style.kind, style.word),
          isNum(advisory.n_min)
            ? ctx.h("span", {
                class: "sc-sub",
                text: advisory.n_min + " run(s) at the thinnest of " +
                  (isNum(advisory.tasks) ? advisory.tasks : "—") + " task(s)",
              })
            : null,
        ]));
        card.appendChild(ctx.h("div", {
          class: "sc-verdict-body",
          text: str(advisory.message) || str(advisory.reason) ||
            "No advisory was produced for this agent.",
        }));

        var supports = arr(advisory.supports);
        var refuses = arr(advisory.does_not_support);
        if (supports.length || refuses.length) {
          var claims = ctx.h("ul", { class: "sc-claims" });
          supports.forEach(function (text) {
            claims.appendChild(ctx.h("li", { class: "yes" }, [
              ctx.h("i", { text: "✓" }), ctx.h("span", { text: "Supports " + text }),
            ]));
          });
          refuses.forEach(function (text) {
            claims.appendChild(ctx.h("li", { class: "no" }, [
              ctx.h("i", { text: "✗" }), ctx.h("span", { text: "Does not support " + text }),
            ]));
          });
          card.appendChild(claims);
        }

        var thresholds = obj(advisory.thresholds);
        if (thresholds) {
          card.appendChild(caveat(ctx,
            "Thresholds: no comparison below " + thresholds.no_comparison_below +
            " runs/task · " + thresholds.structured_floor + "–" +
            thresholds.structured_comfortable + " is the floor for structured tool-use · " +
            thresholds.open_ended_floor + "+ for open-ended reasoning."));
        }
        el.appendChild(card);
      });

      // ---- what was removed before anything was computed -----------------
      el.appendChild(head(ctx, "Excluded before any statistic"));
      el.appendChild(ctx.h("div", {
        class: "sc-sub",
        text: "Counting a rate-limited run as an agent failure makes the agent look " +
          "worse and the harness look fine — which is backwards for whoever has to " +
          "fix it. Harness failures are removed first, and counted here so the " +
          "removal is visible rather than silent.",
      }));

      list.forEach(function (entry) {
        var ex = obj(entry.row.excluded_runs) || {};
        var count = isNum(ex.count) ? ex.count : 0;
        var of = isNum(ex.of_runs) ? ex.of_runs : null;
        var wrap = ctx.h("div", { class: "sc-panel" });

        wrap.appendChild(ctx.h("div", { class: "sc-agent" }, [
          ctx.h("b", { text: entry.name }),
          tag(ctx, count ? "warn" : "", count + " excluded" + (of !== null ? " of " + of : "")),
          count === 0
            ? ctx.h("span", { class: "sc-sub", text: "checked, none found — not unchecked" })
            : null,
        ]));

        var byTermination = obj(ex.by_termination) || {};
        var reasons = Object.keys(byTermination).sort();
        if (reasons.length) {
          var chips = ctx.h("div", { class: "sc-chips" });
          reasons.forEach(function (reason) {
            chips.appendChild(tag(ctx, "bad", reason + " ×" + byTermination[reason]));
          });
          wrap.appendChild(chips);
        }

        var rows = arr(ex.runs);
        if (rows.length) {
          var table = ctx.h("table", { class: "grid" }, [
            ctx.h("tr", null, [
              ctx.h("th", { text: "Task" }),
              ctx.h("th", { text: "Run" }),
              ctx.h("th", { text: "Termination" }),
            ]),
          ]);
          rows.forEach(function (item) {
            var r = obj(item) || {};
            table.appendChild(ctx.h("tr", null, [
              ctx.h("td", { class: "mono", text: str(r.task) || "—" }),
              ctx.h("td", { class: "mono", text: str(r.run_id) || "—" }),
              ctx.h("td", null, [tag(ctx, "bad", str(r.termination) || "unknown")]),
            ]));
          });
          wrap.appendChild(ctx.h("div", {
            class: "scroll-x", style: { marginTop: "6px" },
          }, [table]));
        }

        var empties = arr(ex.tasks_left_empty);
        if (empties.length) {
          wrap.appendChild(note(ctx, "bad", [
            ctx.h("strong", { text: empties.length + " task(s) left with no eligible run: " }),
            ctx.h("span", { class: "mono", text: empties.join(", ") }),
            ctx.h("span", { text: " — these tasks contribute nothing to any figure above." }),
          ]));
        }
        if (str(ex.basis)) wrap.appendChild(caveat(ctx, ex.basis));

        // ---- unequal trials ---------------------------------------------
        var un = obj(entry.row.unequal_trials) || {};
        wrap.appendChild(ctx.h("div", { class: "sc-chips", style: { marginTop: "7px" } }, [
          tag(ctx, un.flagged ? "warn" : "good",
            un.flagged ? "unequal trials" : "equal trials"),
          ctx.h("span", {
            class: "sc-sub",
            text: (isNum(un.min) && isNum(un.max)
              ? un.min + "–" + un.max + " eligible runs per task. " : "") + (str(un.note) || ""),
          }),
        ]));
        el.appendChild(wrap);
      });
    },
  });

  // ============================================================ 3. consistency

  function consistencyRow(ctx, label, block, extra) {
    var b = obj(block) || {};
    var wrap = ctx.h("div", { style: { marginTop: "8px" } });
    wrap.appendChild(ctx.h("div", { class: "sc-line" }, [
      ctx.h("strong", { text: label + ": " }),
      valueOrReason(ctx, b.value, b.reason, function (v) { return ctx.fmt.num(v, 3); }),
      isNum(b.value) && isNum(b.tasks_scored)
        ? ctx.h("span", {
            class: "sc-sub",
            text: "  over " + b.tasks_scored + " of " +
              (isNum(b.of_tasks) ? b.of_tasks : "—") + " task(s)",
          })
        : null,
    ]));
    if (isNum(b.value)) {
      wrap.appendChild(ctx.h("div", { class: "sc-bar-t sc-meter", style: { marginTop: "4px" } }, [
        ctx.h("i", {
          style: {
            width: (Math.max(0, Math.min(1, b.value)) * 100).toFixed(1) + "%",
            background: ctx.color.a,
          },
        }),
      ]));
    }
    if (extra) wrap.appendChild(extra);
    if (str(b.basis)) wrap.appendChild(caveat(ctx, "Basis: " + b.basis));

  var RESOURCES = ["tokens", "cost_usd", "latency_s", "steps"];

  AgentDiff.block({
    id: "consistency",

    question: "Is the variance the task or the agent?",

  // ==================================================== 4. per-task-reliability

  function taskCurve(rows, k) {
    for (var i = 0; i < arr(rows).length; i++) {
      var r = obj(rows[i]);
      if (r && r.k === k) return isNum(r.value) ? r.value : null;
    }
    return null;
  }

  /* The smallest k at which a task that *does* sometimes pass never passes k
   * times running. This is the number the success rate hides. */
  function collapseK(task) {
    var rate = isNum(task.success_rate) ? task.success_rate : 0;
    if (rate <= 0) return null;
    var curve = arr(task.pass_hat_k);
    for (var i = 0; i < curve.length; i++) {
      var row = obj(curve[i]);
      if (row && isNum(row.value) && row.value === 0) return row.k;
    }
    return null;
  }

  function taskRank(task, maxK) {
    var last = taskCurve(task.pass_hat_k, maxK);
    return [
      isNum(last) ? last : -1,
      isNum(task.success_rate) ? task.success_rate : -1,
    ];
  }

  AgentDiff.block({
    id: "per-task-reliability",
    title: "Flaky tasks",
    question: "Which tasks are flaky?",
    group: "signal",
    size: "wide",

    relevance: function (ctx) {
      var rel = reliabilityOf(ctx);
      if (!rel) return 0;
      var list = sides(rel);
      var rows = 0, collapses = 0;
      list.forEach(function (entry) {
        arr(entry.row.per_task).forEach(function (task) {
          var t = obj(task);
          if (!t) return;
          rows++;
          if (collapseK(t) !== null) collapses++;
        });
      });
      if (!rows) return 0;
      return collapses ? 0.96 : 0.7;
    },

    render: function (el, ctx) {
      ensureStyle();
      var rel = reliabilityOf(ctx);
      if (!rel) {
        return ctx.empty(el, "No reliability analysis in this report — per-task " +
          "flakiness needs repeated runs of each task.");
      }
      var list = sides(rel);
      if (!list.length) return ctx.empty(el, "The reliability block carries no agents.");

      var anyRows = false;
      list.forEach(function (entry) { if (arr(entry.row.per_task).length) anyRows = true; });
      if (!anyRows) return ctx.empty(el, "No task carries a per-task reliability row.");

      // The whole argument for the metric, stated with the actual case that
      // makes it, if this report contains one.
      var example = null;
      list.forEach(function (entry) {
        var maxK = isNum(entry.row.max_k) ? entry.row.max_k : 0;
        arr(entry.row.per_task).forEach(function (task) {
          var t = obj(task);
          if (!t) return;
          var k = collapseK(t);
          if (k === null || example) return;
          example = { entry: entry, task: t, k: k, maxK: maxK };
        });
      });

      if (example) {
        var t = example.task;
        var atK = taskCurve(t.pass_at_k, example.k);
        el.appendChild(note(ctx, "bad", [
          ctx.h("strong", { text: "A success rate can be non-zero while pass^k is exactly 0. " }),
          ctx.h("span", {
            text: example.entry.name + " on " + str(t.task) + " passed " +
              t.successes + " of " + t.runs + " runs — a success rate of " +
              pct(ctx, t.success_rate, 1) + ". Its pass^" + example.k + " is 0" +
              (isNum(atK) ? ", against a pass@" + example.k + " of " + ctx.fmt.pct(atK, 0) : "") +
              ". It has never once demonstrated it can do this task " + example.k +
              " times running, and the mean says nothing about that.",
          }),
        ]));
      } else {
        el.appendChild(note(ctx, "info", [
          ctx.h("strong", { text: "No task collapses. " }),
          ctx.h("span", {
            text: "Every task that passes at all passes every eligible run, so pass^k " +
              "never falls to 0 within the reported k. Sorted least reliable first.",
          }),
        ]));
      }

      list.forEach(function (entry) {
        var row = entry.row;
        var maxK = isNum(row.max_k) ? row.max_k : 0;
        var tasks = arr(row.per_task).map(obj).filter(Boolean).slice();
        if (!tasks.length) return;
        tasks.sort(function (x, y) {
          var rx = taskRank(x, maxK), ry = taskRank(y, maxK);
          if (rx[0] !== ry[0]) return rx[0] - ry[0];
          if (rx[1] !== ry[1]) return rx[1] - ry[1];
          return String(x.task).localeCompare(String(y.task));
        });

        var panel = ctx.h("div", { class: "sc-panel" });
        panel.appendChild(ctx.h("div", { class: "sc-agent" }, [
          ctx.h("b", { text: entry.name }),
          tag(ctx, entry.side, entry.side.toUpperCase()),
          ctx.h("span", { class: "sc-sub", text: "least reliable first" }),
        ]));

        var headRow = ctx.h("tr", null, [
          ctx.h("th", { text: "Task" }),
          ctx.h("th", { class: "num", text: "Runs" }),
          ctx.h("th", { class: "num", text: "Passed" }),
          ctx.h("th", { class: "num", text: "Rate" }),
        ]);
        for (var k = 1; k <= maxK; k++) {
          headRow.appendChild(ctx.h("th", { class: "num", text: "pass^" + k }));
        }
        headRow.appendChild(ctx.h("th", { text: "" }));
        var table = ctx.h("table", { class: "grid" }, [headRow]);

        tasks.forEach(function (task) {
          var collapse = collapseK(task);
          var cells = [
            ctx.h("td", { class: "mono", text: str(task.task) || "—" }),
            ctx.h("td", { class: "num sc-num", text: isNum(task.runs) ? String(task.runs) : "—" }),
            ctx.h("td", { class: "num sc-num", text: isNum(task.successes) ? String(task.successes) : "—" }),
            ctx.h("td", { class: "num sc-num", text: pct(ctx, task.success_rate, 1) }),
          ];
          for (var kk = 1; kk <= maxK; kk++) {
            var value = taskCurve(task.pass_hat_k, kk);
            cells.push(ctx.h("td", {
              class: "num sc-num" + (value === 0 && isNum(task.success_rate) && task.success_rate > 0 ? " " : ""),
            }, [
              value === null
                ? ctx.h("span", { class: "sc-sub", text: "—" })
                : ctx.h("span", {
                    class: value === 0 && isNum(task.success_rate) && task.success_rate > 0 ? "sc-flag" : "",
                    text: ctx.fmt.num(value, 2),
                  }),
            ]));
          }
          var flags = ctx.h("td");
          if (collapse !== null) {
            flags.appendChild(tag(ctx, "bad", "never " + collapse + "× running"));
          } else if (isNum(task.success_rate) && task.success_rate === 0) {
            flags.appendChild(tag(ctx, "bad", "never passes"));
          } else if (isNum(task.success_rate) && task.success_rate === 1) {
            flags.appendChild(tag(ctx, "good", "every run"));
          }
          if (isNum(task.runs_excluded) && task.runs_excluded > 0) {
            flags.appendChild(tag(ctx, "warn", task.runs_excluded + " excluded"));
          }
          var tc = obj(task.trajectory_consistency) || {};
          if (!isNum(tc.value) && str(tc.reason)) {
            flags.appendChild(ctx.h("div", {
              class: "sc-sub",
              text: "path consistency: " + tc.reason,
            }));
          }
          cells.push(flags);
          table.appendChild(ctx.h("tr", null, cells));
        });

        panel.appendChild(ctx.h("div", { class: "scroll-x" }, [table]));
        panel.appendChild(caveat(ctx,
          "pass^k is C(c,k)/C(n,k) for that task alone — the chance all k sampled runs " +
          "pass. Rate is c/n. A rate above 0 with pass^k at 0 means the task works and " +
          "does not keep working. Curves stop at k=" + maxK + ": " +
          (str(row.max_k_basis) || "the thinnest task's eligible trial count.")));
        el.appendChild(panel);
      });
    },
  });

  // ============================================================== 5. taxonomy

  var MAST_INTER = "Inter-Agent Misalignment";

  function distribution(ctx, counts, order, total, fill, zeroNote) {

        n + (total ? " · " + ctx.fmt.pct(n / total, 0) : ""),
        fill, n === 0));
    });
    if (zeroNote) wrap.appendChild(zeroNote);
    return wrap;
  }

  AgentDiff.block({
    id: "taxonomy",

      // ---- what fired at all --------------------------------------------
      el.appendChild(head(ctx, "AgentDiff signals over " +

        codes.forEach(function (code) {

  // ==================================================== 6. taxonomy-coverage

  var BLOCKER_ORDER = ["multi_agent", "judge", "label_vocabulary", "outside_trace"];

<script>
/* AgentDiff blocks — variance attribution.
 *
 * Four blocks over `deepcompare.variance`, the module that asks where the
 * variation in an outcome actually comes from: the model underneath, the
 * harness around it, the task being hard, or the run simply coming out
 * differently this time. Those four answers call for four different
 * responses, so getting the attribution wrong is expensive.
 *
 * The engine is unusually careful about the two ways this goes wrong, and
 * these blocks exist to make sure the care survives contact with a chart:
 *
 *   · a factor's share is a *range* whenever the design cannot identify it,
 *     and the width of that range is variance the factors hold in common.
 *     Drawing the midpoint — or the maximum, or whichever end flatters the
 *     story — would turn an arbitrary attribution order into a finding, so
 *     an unidentified factor is never drawn as a point. The solid part of
 *     its bar is what it owns outright; the hatched tail is contested;
 *     the pooled contested share is a segment of its own in the headline
 *     bar, labelled as unattributable rather than silently handed out;
 *   · raw explained variance is not comparable across factors with
 *     different level counts. A 33-level harness explains 12% of a
 *     264-run corpus *by chance alone* before any real effect exists, so
 *     the corrected block draws that chance floor as a zone on the same
 *     axis as the raw range and the bias-corrected omega squared. Where
 *     omega squared is at or below zero the block prints "at chance" and
 *     draws nothing — a one-pixel positive bar would be a lie about sign;
 *   · the residual is only noise when there are repeats. With one run per
 *     cell it is interaction *and* stochasticity inseparably, so the
 *     residual block renders the two cases with different marks: a solid
 *     bar for measured run-to-run variation, an undivided hatched bar with
 *     a moving boundary for the case where the split is unknowable;
 *   · the design block runs first in reading order for a confounded corpus,
 *     because when model and harness are the same partition of the data
 *     every model-versus-harness number below it is an artefact.
 *

 * command from the `batch`/`runs` that render this page. So the data is

        ".vz-lead.warn{border-left-color:var(--warn)}",
        ".vz-lead.good{border-left-color:var(--good)}",
        ".vz-lead-top{display:flex;flex-wrap:wrap;gap:7px;align-items:baseline;margin-bottom:4px}",

    var keys = Object.keys(metrics).filter(function (k) { return !!obj(metrics[k]); });

      if (iy < 0) iy = METRIC_ORDER.length + 1;

   * The engine returns neither when there was nothing to split — one run,

   * which is what gets rendered instead. */

        }));

          plot.appendChild(txt(ctx, x(cursor) + w / 2, top + barH / 2 + 3.2,
            seg.name, ctx.color.surface, 8.5, "middle", 600));
        }
      }
      cursor += seg.width;
    });

    if (stack.pool > 0.0005) {
      var pw = x(cursor + stack.pool) - x(cursor);
      plot.appendChild(ctx.svg("rect", {
        x: x(cursor), y: top, width: pw, height: barH,
        fill: "url(#" + hatch.id + ")", stroke: ctx.color.axis, "stroke-width": 1,
      }));
      cursor += stack.pool;
    }

    if (stack.residual > 0.0005) {
      var rw = x(cursor + stack.residual) - x(cursor);
      plot.appendChild(ctx.svg("rect", {
        x: x(cursor), y: top, width: rw, height: barH,
        fill: ctx.color.muted, opacity: 0.17,
        stroke: ctx.color.axis, "stroke-width": 1,
      }));
      if (rw >= 46) {
        plot.appendChild(txt(ctx, x(cursor) + rw / 2, top + barH / 2 + 3.2,
          "residual " + ctx.fmt.pct(stack.residual, 0), ctx.color.ink, 8.5, "middle", 600));
      }
    }
    plot.appendChild(ctx.svg("rect", {
      x: LG, y: top, width: (W - RG) - LG, height: barH,
      fill: "none", stroke: ctx.color.axis, "stroke-width": 1,
    }));

    // --- one range row per factor, on the same scale as the bar above
    var y = top + barH + 12;
    axis(ctx, plot, x, y - 5, y + rows.length * rowH - 4, [0, 0.25, 0.5, 0.75, 1],
      y + rows.length * rowH + 6);

    rows.forEach(function (row, i) {
      var c = row.c;
      var lo = clamp01(num(c.min_share) || 0);
      var hi = clamp01(isNum(c.max_share) ? c.max_share : lo);
      var cy = y + i * rowH + rowH / 2 - 2;
      var fill = colorFor(ctx, row.name);

      plot.appendChild(txt(ctx, LG - 6, cy + 3, row.name, fill, 8.5, "end", 600));

      // Owned outright under every attribution order.
      if (x(lo) - x(0) > 0.4) {
        plot.appendChild(ctx.svg("rect", {
          x: x(0), y: cy - 3.5, width: x(lo) - x(0), height: 7,
          fill: fill, opacity: 0.9, rx: 1,
        }));
      }
      if (hi > lo + 0.0005) {
        // The contested tail. Hatched, capped at both ends, never filled in
        // as if the factor had earned it.
        plot.appendChild(ctx.svg("rect", {
          x: x(lo), y: cy - 3.5, width: x(hi) - x(lo), height: 7,
          fill: "url(#" + hatch.id + ")", stroke: fill, "stroke-width": 1,
          "stroke-dasharray": "2 2", opacity: 0.95, rx: 1,
        }));
        [lo, hi].forEach(function (v) {
          plot.appendChild(ctx.svg("line", {
            x1: x(v), x2: x(v), y1: cy - 6, y2: cy + 6,
            stroke: fill, "stroke-width": 1.4,
          }));
        });
      } else {
        // Identified: a point, and marked as one, so the eye can tell a
        // measured value from a range that happens to be narrow.
        plot.appendChild(ctx.svg("line", {
          x1: x(lo), x2: x(lo), y1: cy - 6, y2: cy + 6,
          stroke: fill, "stroke-width": 1.6,
        }));
      }
      plot.appendChild(txt(ctx, W - RG + 5, cy + 3, rangeText(ctx, c),
        ctx.color.ink, 8.5, "start"));
    });

    return { node: plot, stack: stack };
  }

  AgentDiff.block({
    id: "variance",
    title: "Where the variation comes from",
    question: "What explains the variation in outcomes?",
    group: "signal",
    size: "wide",

  // =============================================== 2. variance-corrected

  /* Raw share against the chance floor against omega squared, on one axis.
   *
   * This is the honesty point of the whole module: a factor with many
   * levels explains variance for having levels. Drawing the chance floor as
   * a zone rather than a footnote means the reader sees a 17% raw share
   * standing barely clear of a 12% floor without having to do arithmetic,
   * and sees the corrected bar land where it actually lands. */
  function drawCorrected(ctx, m) {
    var rows = componentsOf(m);
    var maxValue = 0.05;
    rows.forEach(function (row) {
      [row.c.max_share, row.c.expected_by_chance, row.c.omega_squared_max,
       row.c.omega_squared_min].forEach(function (value) {
        if (isNum(value) && value > maxValue) maxValue = value;
      });
    });
    var top = Math.min(1, Math.ceil((maxValue * 1.12) * 20) / 20);

    var W = 380, LG = 60, RG = 76;
    var rowH = 34, headH = 11;
    var H = headH + rows.length * rowH + 16;
    var plot = chart(ctx, W, H);
    var x = scale(0, top, LG, W - RG);
    var hatch = hatchDefs(ctx, ctx.color.muted);
    plot.appendChild(hatch.node);

    var ticks = [0, top / 2, top];
    axis(ctx, plot, x, headH, headH + rows.length * rowH - 6,
      ticks, headH + rows.length * rowH + 6);

    rows.forEach(function (row, i) {
      var c = row.c;
      var y0 = headH + i * rowH;
      var fill = colorFor(ctx, row.name);
      var lo = Math.max(0, num(c.min_share) || 0);
      var hi = Math.max(lo, isNum(c.max_share) ? c.max_share : lo);
      var chance = Math.max(0, num(c.expected_by_chance) || 0);
      var omega = num(c.omega_squared_min);

      plot.appendChild(txt(ctx, LG - 6, y0 + 12, row.name, fill, 8.5, "end", 600));
      plot.appendChild(txt(ctx, LG - 6, y0 + 22,
        (isNum(c.levels) ? c.levels : "?") + " levels", ctx.color.muted, 7.5, "end"));

      /* The zone every factor gets for free, before any real effect.
       *
       * It is drawn behind the *raw* bar only. Extending it across the
       * corrected bar would read as "this ω² is below chance", which is
       * backwards: omega squared has already had the floor subtracted, so
       * a corrected bar shorter than the floor is the correction working. */
      if (chance > 0) {
        plot.appendChild(ctx.svg("rect", {
          x: x(0), y: y0 + 2, width: Math.max(0, x(chance) - x(0)), height: 13,
          fill: ctx.color.muted, opacity: 0.16,
        }));
      }

      // Raw: a range where the design leaves one, a capped point where not.
      var yRaw = y0 + 6;
      if (x(lo) - x(0) > 0.4) {
        plot.appendChild(ctx.svg("rect", {
          x: x(0), y: yRaw, width: x(lo) - x(0), height: 7,
          fill: fill, opacity: 0.85, rx: 1,
        }));
      }
      if (hi > lo + 0.0005) {
        plot.appendChild(ctx.svg("rect", {
          x: x(lo), y: yRaw, width: x(hi) - x(lo), height: 7,
          fill: "url(#" + hatch.id + ")", stroke: fill, "stroke-width": 1,
          "stroke-dasharray": "2 2", rx: 1,
        }));
        [lo, hi].forEach(function (value) {
          plot.appendChild(ctx.svg("line", {
            x1: x(value), x2: x(value), y1: yRaw - 2, y2: yRaw + 9,
            stroke: fill, "stroke-width": 1.3,
          }));
        });
      } else {
        plot.appendChild(ctx.svg("line", {
          x1: x(lo), x2: x(lo), y1: yRaw - 2, y2: yRaw + 9,
          stroke: fill, "stroke-width": 1.5,
        }));
      }
      plot.appendChild(txt(ctx, W - RG + 5, yRaw + 7, "raw " + rangeText(ctx, c),
        ctx.color.ink, 8, "start"));

      /* The floor is ruled *over* the raw bar, not behind it: the whole
       * comparison is how far the bar clears the line, and a line hidden
       * under the bar it qualifies is a line nobody reads. */
      if (chance > 0) {
        plot.appendChild(ctx.svg("line", {
          x1: x(chance), x2: x(chance), y1: y0 + 2, y2: y0 + 16,
          stroke: ctx.color.ink, "stroke-width": 1.1, "stroke-dasharray": "3 2",
          opacity: 0.75,
        }));
        if (i === 0) {
          plot.appendChild(txt(ctx, x(chance) + 2, y0 - 1,
            "chance floor", ctx.color.muted, 7.5, "start"));
        }
      }

      // Corrected: drawn only where it is positive. At or below chance the
      // row says so in words — a hairline bar would imply a small effect
      // where the finding is "no more than its level count predicts".
      var yCor = y0 + 17;
      if (omega !== null && omega > 0) {
        plot.appendChild(ctx.svg("rect", {
          x: x(0), y: yCor, width: Math.max(1, x(omega) - x(0)), height: 7,
          fill: fill, opacity: 1, rx: 1,
        }));
        plot.appendChild(txt(ctx, W - RG + 5, yCor + 7, "ω² " + ctx.fmt.pct(omega, 0),
          ctx.color.ink, 8, "start", 600));
      } else {
        plot.appendChild(ctx.svg("line", {
          x1: x(0), x2: x(0), y1: yCor, y2: yCor + 7,
          stroke: ctx.color.warn, "stroke-width": 2,
        }));
        plot.appendChild(txt(ctx, x(0) + 4, yCor + 7,
          omega === null
            ? "ω² not correctable — no residual degrees of freedom"
            : "ω² at chance",
          ctx.color.warn, 8, "start", 600));
      }
    });

    return plot;
  }

  AgentDiff.block({
    id: "variance-corrected",
    title: "Raw share vs. chance",
    question: "Is that share real, or just a lot of levels?",
    group: "signal",
    size: "wide",

    relevance: function (ctx) {
      var v = payloadOf(ctx);
      if (!v) return 0;
      var list = drawable(v);
      if (!list.length) return 0;
      var loud = false;
      list.forEach(function (entry) {
        componentsOf(entry.m).forEach(function (row) {
          var omega = num(row.c.omega_squared_min);
          var chance = num(row.c.expected_by_chance) || 0;
          if (omega !== null && omega <= 0 && (num(row.c.max_share) || 0) > 0.02) loud = true;
          if (chance > 0.05) loud = true;
        });
      });
      return loud ? 0.98 : 0.7;
    },

    render: function (el, ctx) {
      ensureStyle();
      var v = payloadOf(ctx);
      if (!v) {
        return ctx.empty(el, "No variance decomposition in this report — the bias " +
          "correction comes with `deepcompare variance`.");
      }
      var list = drawable(v);
      if (!list.length) {
        return ctx.empty(el, "No metric in this corpus had variance to attribute, so " +
          "there is nothing to correct.");
      }

      /* The lead sentence is arithmetic the reader should not have to do:
       * the factor with the most levels, and what that alone buys it. */
      var worst = null;
      componentsOf(list[0].m).forEach(function (row) {
        var chance = num(row.c.expected_by_chance);
        if (chance === null) return;
        if (!worst || chance > worst.chance) worst = { name: row.name, chance: chance, c: row.c };
      });
      if (worst) {
        el.appendChild(note(ctx, "warn", [
          ctx.h("strong", { text: worst.name + " has " +
            (isNum(worst.c.levels) ? worst.c.levels : "several") + " levels. " }),
          ctx.h("span", { text: "Across " + ctx.fmt.int(list[0].m.runs) + " runs that alone " +
            "explains " + ctx.fmt.pct(worst.chance, 0) + " of the variance, before any real " +
            "effect exists. The shaded zone and dashed rule on each row are that floor: a raw " +
            "bar that barely clears it has barely done anything. The solid ω² bar is what " +
            "survives subtracting it." }),
        ]));
      }

      el.appendChild(chipRow(ctx, [
        chip(ctx, swatch(ctx, { background: ctx.color.a, opacity: "0.45", borderStyle: "dashed" }),
          "raw share — hatched and capped where contested"),
        chip(ctx, swatch(ctx, { background: ctx.color.a }), "ω² corrected (solid, only where positive)"),
        chip(ctx, swatch(ctx, { background: ctx.color.muted, opacity: "0.35" }), "expected by chance"),
      ]));

      /* Three metrics at four factors is twelve rows; tabs keep one
       * comparison on screen at a time, which is the comparison this card
       * exists to make. */
      var state = { key: list[0].key };
      var tabs = ctx.h("div", { class: "vz-tabs" });
      var body = ctx.h("div", null, null);

      function paint() {
        var entry = null;
        for (var i = 0; i < list.length; i++) if (list[i].key === state.key) entry = list[i];
        if (!entry) entry = list[0];
        body.innerHTML = "";
        Array.prototype.forEach.call(tabs.childNodes, function (node) {
          if (node.setAttribute) {
            node.setAttribute("aria-pressed", node.getAttribute("data-key") === entry.key ? "true" : "false");
          }
        });
        body.appendChild(ctx.h("div", { class: "vz-svg-wrap" }, [drawCorrected(ctx, entry.m)]));

        var atChance = componentsOf(entry.m).filter(function (row) {
          var omega = num(row.c.omega_squared_min);
          return omega !== null && omega <= 0;
        }).map(function (row) { return row.name; });
        if (atChance.length) {
          body.appendChild(ctx.h("div", { class: "vz-sub", style: { marginTop: "7px" },
            text: atChance.join(", ") + (atChance.length === 1 ? " explains" : " explain") +
              " no more of " + entry.label + " than its level count predicts by chance — the raw " +
              "share above it is an artefact of how many levels it has." }));
        }
        var cav = caveatNode(ctx, entry.m.caveat, "Caveat:");
        if (cav) body.appendChild(cav);
      }

      list.forEach(function (entry) {
        tabs.appendChild(ctx.h("button", {
          class: "vz-tab", type: "button", "data-key": entry.key,
          "aria-pressed": entry.key === state.key ? "true" : "false",
          text: entry.label,
          onclick: function () {
            state.key = entry.key;
            ctx.signal("inspect");
            paint();
          },
        }));
      });

      if (list.length > 1) el.appendChild(tabs);
      el.appendChild(body);
      paint();
    },
  });

  // ================================================== 3. variance-design

  var SHAPE_STYLE = {
    crossed: { kind: "good", word: "crossed", lead: "Model and harness vary independently — the split below is identifiable." },
    nested: { kind: "warn", word: "nested", lead: "Partly separable: harnesses that share a model carry harness variance." },
    confounded: { kind: "bad", word: "confounded", lead: "Model and harness are the same partition of the data." },
  };

  /* The partition picture: one row per model, one cell per harness on it.
   *
   * A confounded corpus draws as a column of single cells — every model
   * carries exactly one harness, so the two factors cut the runs the same
   * way and no method can tell them apart. A nested corpus draws as ragged
   * rows, and the raggedness is exactly the variance that is separable. */
  function drawPartition(ctx, plan) {
    var names = obj(plan.level_names) || {};
    var models = arr(names.model).slice(0);
    var shared = obj(plan.harnesses_sharing_a_model) || {};
    var levels = obj(plan.levels) || {};
    if (!models.length) return null;

    var W = 372, LG = 108, cellW = 15, cellH = 11, rowH = 16;
    var shownModels = models.slice(0, 10);
    var H = 14 + shownModels.length * rowH + 6;
    var plot = chart(ctx, W, H);

    plot.appendChild(txt(ctx, LG - 6, 9, "model", ctx.color.muted, 7.5, "end", 600));
    plot.appendChild(txt(ctx, LG, 9, "harnesses on it", ctx.color.muted, 7.5, "start", 600));

    shownModels.forEach(function (model, i) {
      var y = 14 + i * rowH;
      var list = arr(shared[model]);
      // A model absent from `harnesses_sharing_a_model` carries exactly one
      // harness. Which one is not in the payload, so it is drawn unnamed
      // rather than guessed at.
      var count = list.length || 1;
      plot.appendChild(txt(ctx, LG - 6, y + 8, ctx.fmt.truncate(model, 18),
        ctx.color.ink, 8, "end"));
      var maxCells = Math.floor((W - LG - 34) / cellW);
      var drawnCells = Math.min(count, maxCells);
      for (var k = 0; k < drawnCells; k++) {
        plot.appendChild(ctx.svg("rect", {
          x: LG + k * cellW, y: y + 1, width: cellW - 3, height: cellH,
          rx: 2, fill: colorFor(ctx, "harness"),
          opacity: count > 1 ? 0.85 : 0.4,
          stroke: count > 1 ? "none" : ctx.color.bad,
          "stroke-width": count > 1 ? 0 : 1,
          "stroke-dasharray": count > 1 ? null : "2 2",
        }));
      }
      var label = count > 1 ? count + " harnesses" : "1 harness";
      if (count > drawnCells) label = count + " harnesses (" + drawnCells + " shown)";
      plot.appendChild(txt(ctx, LG + drawnCells * cellW + 3, y + 9, label,
        count > 1 ? ctx.color.muted : ctx.color.bad, 7.5, "start"));
    });

    if (models.length < (isNum(levels.model) ? levels.model : 0) ||
        shownModels.length < models.length) {
      var more = (isNum(levels.model) ? levels.model : models.length) - shownModels.length;
      if (more > 0) {
        plot.appendChild(txt(ctx, LG, 14 + shownModels.length * rowH + 2,
          "+" + more + " more model(s)", ctx.color.muted, 7.5, "start"));
      }
    }
    return plot;
  }

  AgentDiff.block({
    id: "variance-design",
    title: "What this design can identify",
    question: "Can this data even answer the question?",
    group: "signal",
    size: "normal",

    relevance: function (ctx) {
      var v = payloadOf(ctx);
      var plan = designOf(v);
      if (!plan) return 0;
      if (plan.shape === "confounded") return 1;
      if (plan.shape === "nested") return 0.85;
      return 0.6;
    },

    render: function (el, ctx) {
      ensureStyle();
      var v = payloadOf(ctx);
      var plan = designOf(v);
      if (!plan) {
        return ctx.empty(el, "No variance decomposition in this report — the design " +
          "audit comes with `deepcompare variance`.");
      }
      var shape = str(plan.shape);
      var style = SHAPE_STYLE[shape] || { kind: "info", word: shape || "unknown", lead: "" };

      /* Loudest first for the case that invalidates everything under it. */
      var lead = ctx.h("div", { class: "vz-lead " + style.kind });
      lead.appendChild(ctx.h("div", { class: "vz-lead-top" }, [
        ctx.h("span", { class: "vz-lead-t", text: "Design is " + style.word }),
        isNum(plan.runs) ? tag(ctx, "", ctx.fmt.int(plan.runs) + (plan.runs === 1 ? " run" : " runs")) : null,
        shape === "confounded" ? tag(ctx, "bad", "model ≡ harness") : null,
      ]));
      if (style.lead) lead.appendChild(ctx.h("div", { class: "vz-lead-b", text: style.lead }));
      // The engine's note, word for word — it carries the fix.
      if (str(plan.note)) {
        lead.appendChild(ctx.h("div", { class: "vz-lead-b", style: { marginTop: "5px" },
          text: plan.note }));
      }
      el.appendChild(lead);

      if (shape === "confounded") {
        el.appendChild(note(ctx, "bad", [
          ctx.h("strong", { text: "Any model-versus-harness split below is an artefact of " +
            "attribution order, not a finding. " }),
          ctx.h("span", { text: "The two factors cut these runs identically, so whichever is " +
            "fitted first takes the variance and the other takes none." }),
        ]));

        /* Evidence, not assertion: if the two factors really are the same
         * partition, every metric gives them byte-identical ranges. */
        var rowsOut = [];
        drawable(v).forEach(function (entry) {
          var comps = obj(entry.m.components) || {};
          var mo = obj(comps.model), ha = obj(comps.harness);
          if (!mo || !ha) return;
          var same = num(mo.min_share) === num(ha.min_share) &&
                     num(mo.max_share) === num(ha.max_share);
          rowsOut.push(ctx.h("tr", null, [
            ctx.h("td", { text: entry.label }),
            ctx.h("td", { class: "num", text: rangeText(ctx, mo) }),
            ctx.h("td", { class: "num", text: rangeText(ctx, ha) }),
            ctx.h("td", { class: "num" }, [tag(ctx, same ? "bad" : "", same ? "identical" : "differs")]),
          ]));
        });
        if (rowsOut.length) {
          el.appendChild(head(ctx, "the same numbers, twice"));
          el.appendChild(ctx.h("div", { class: "scroll-x" }, [
            ctx.h("table", { class: "grid" }, [
              ctx.h("thead", null, [ctx.h("tr", null, [
                ctx.h("th", { text: "metric" }),
                ctx.h("th", { class: "num", text: "model" }),
                ctx.h("th", { class: "num", text: "harness" }),
                ctx.h("th", { class: "num", text: "" }),
              ])]),
              ctx.h("tbody", null, rowsOut),
            ]),
          ]));
        }
      }

      // --- levels per factor
      el.appendChild(head(ctx, "levels per factor"));
      var levels = obj(plan.levels) || {};
      var names = obj(plan.level_names) || {};
      var constant = arr(plan.constant);
      var factorRows = FACTORS.filter(function (f) { return isNum(levels[f]); }).map(function (f) {
        var shown = arr(names[f]);
        var isConstant = constant.indexOf(f) >= 0;
        var sample = shown.slice(0, 3).join(", ");
        if (shown.length && levels[f] > shown.length) sample += ", +" + (levels[f] - shown.length) + " more";
        else if (shown.length > 3) sample += ", +" + (shown.length - 3) + " more";
        return ctx.h("tr", null, [
          ctx.h("td", null, [
            ctx.h("span", { style: { color: colorFor(ctx, f), fontWeight: "600" }, text: f }),
          ]),
          ctx.h("td", { class: "num", text: ctx.fmt.int(levels[f]) }),
          ctx.h("td", null, [
            isConstant
              ? tag(ctx, "warn", "constant — not attributable")
              : ctx.h("span", { class: "vz-names", text: sample || "—" }),
          ]),
        ]);
      });
      el.appendChild(ctx.h("div", { class: "scroll-x" }, [
        ctx.h("table", { class: "grid" }, [
          ctx.h("thead", null, [ctx.h("tr", null, [
            ctx.h("th", { text: "factor" }),
            ctx.h("th", { class: "num", text: "levels" }),
            ctx.h("th", { text: "values" }),
          ])]),
          ctx.h("tbody", null, factorRows),
        ]),
      ]));

      // --- repeats: the fact that decides whether a residual is noise
      var repeats = obj(plan.repeats_per_cell) || {};
      var repeatText = isNum(repeats.min) && isNum(repeats.max)
        ? (repeats.min === repeats.max ? repeats.min + " per cell" : repeats.min + "–" + repeats.max + " per cell")
        : "unrecorded";
      el.appendChild(head(ctx, "repeats"));
      el.appendChild(ctx.h("dl", { class: "kv vz-kv" }, [
        ctx.h("dt", { text: "runs per cell" }),
        ctx.h("dd", null, [
          ctx.h("span", { text: repeatText }),
          isNum(repeats.cells) ? ctx.h("span", { class: "vz-sub", text: " · " + ctx.fmt.int(repeats.cells) + " cells" }) : null,
        ]),
        ctx.h("dt", { text: "residual is noise" }),
        ctx.h("dd", null, [
          plan.residual_is_noise === true
            ? tag(ctx, "good", "yes — repeats measure it")
            : tag(ctx, "warn", "no — interaction and noise together"),
        ]),
        ctx.h("dt", { text: "identifiable" }),
        ctx.h("dd", { text: arr(plan.identifiable).join(", ") || "none" }),
      ]));

      // --- the partition picture
      var picture = drawPartition(ctx, plan);
      if (picture) {
        el.appendChild(head(ctx, shape === "confounded"
          ? "one harness per model — the partitions coincide"
          : "harnesses per model"));
        el.appendChild(ctx.h("div", { class: "vz-svg-wrap" }, [picture]));
      }

      /* What would fix it, in the engine's words rather than mine. */
      var fixAt = str(plan.note).indexOf("Run one harness");
      if (fixAt >= 0) {
        el.appendChild(ctx.h("div", { class: "vz-fix" }, [
          ctx.h("b", { text: "what would fix it" }),
          ctx.h("span", { text: plan.note.slice(fixAt) }),
        ]));
      }
    },
  });

  // ================================================ 4. variance-residual

  /* The residual bar, drawn two ways because it means two things.
   *
   * With repeats it is measured run-to-run variation and gets a solid mark.
   * With one run per cell it is interaction *and* noise with no way to say
   * how much of each, so it gets a hatched bar whose internal boundary is a
   * double-headed arrow: the split can sit anywhere along it. Calling that
   * flakiness would invite someone to dismiss a real interaction as luck. */
  function drawResidual(ctx, m, plan) {
    var residual = clamp01(num(m.residual) || 0);
    var noise = plan && plan.residual_is_noise === true;
    var W = 372, H = 46, LG = 2, RG = 2;
    var plot = chart(ctx, W, H);
    var x = scale(0, 1, LG, W - RG);
    var barY = 4, barH = 20;
    var hatch = hatchDefs(ctx, noise ? ctx.color.warn : ctx.color.muted);
    plot.appendChild(hatch.node);

    var explained = 1 - residual;
    if (explained > 0.0005) {
      plot.appendChild(ctx.svg("rect", {
        x: x(0), y: barY, width: x(explained) - x(0), height: barH,
        fill: ctx.color.a, opacity: 0.3,
      }));
      if (x(explained) - x(0) > 66) {
        plot.appendChild(txt(ctx, x(0) + 5, barY + barH / 2 + 3.2,
          "explained " + ctx.fmt.pct(explained, 0), ctx.color.ink, 8.5, "start", 600));
      }
    }

    var rx = x(explained), rw = x(1) - x(explained);
    plot.appendChild(ctx.svg("rect", {
      x: rx, y: barY, width: rw, height: barH,
      fill: noise ? ctx.color.warn : "url(#" + hatch.id + ")",
      opacity: noise ? 0.55 : 1,
      stroke: ctx.color.axis, "stroke-width": 1,
    }));
    if (rw > 78) {
      plot.appendChild(txt(ctx, rx + rw / 2, barY + barH / 2 + 3.2,
        "residual " + ctx.fmt.pct(residual, 0),
        ctx.color.ink, 9, "middle", 660));
    }
    plot.appendChild(ctx.svg("rect", {
      x: x(0), y: barY, width: x(1) - x(0), height: barH,
      fill: "none", stroke: ctx.color.axis, "stroke-width": 1,
    }));

    if (noise) {
      plot.appendChild(txt(ctx, rx + rw / 2, barY + barH + 13,
        "measured: the same cell, run again", ctx.color.muted, 8, "middle"));
    } else if (rw > 40) {
      // The unknowable boundary, drawn as a boundary that will not sit still.
      var mid = rx + rw / 2, span = Math.min(rw / 2 - 6, 46);
      plot.appendChild(ctx.svg("line", {
        x1: mid - span, x2: mid + span, y1: barY + barH + 8, y2: barY + barH + 8,
        stroke: ctx.color.muted, "stroke-width": 1,
      }));
      [[mid - span, 1], [mid + span, -1]].forEach(function (end) {
        plot.appendChild(ctx.svg("path", {
          d: "M " + end[0] + " " + (barY + barH + 8) +
             " l " + (4 * end[1]) + " -3 l 0 6 z",
          fill: ctx.color.muted,
        }));
      });
      plot.appendChild(ctx.svg("line", {
        x1: mid, x2: mid, y1: barY + 2, y2: barY + barH + 8,
        stroke: ctx.color.muted, "stroke-width": 1.2, "stroke-dasharray": "3 2",
      }));
      plot.appendChild(txt(ctx, mid - span - 3, barY + barH + 11, "interaction",
        ctx.color.muted, 8, "end"));
      plot.appendChild(txt(ctx, mid + span + 3, barY + barH + 11, "noise",
        ctx.color.muted, 8, "start"));
      plot.appendChild(txt(ctx, mid, barY + barH + 21, "boundary unknown",
        ctx.color.muted, 7.5, "middle"));
    }
    return plot;
  }

  AgentDiff.block({
    id: "variance-residual",
    title: "What is left over",
    question: "What is left over, and is it noise?",
    group: "signal",
    size: "normal",

    relevance: function (ctx) {
      var v = payloadOf(ctx);
      if (!v) return 0;
      var list = drawable(v);
      if (!list.length) return 0;
      var plan = designOf(v) || {};
      var worst = 0;
      list.forEach(function (entry) {
        var r = num(entry.m.residual);
        if (r !== null && r > worst) worst = r;
      });
      if (worst > 0.5) return plan.residual_is_noise ? 0.9 : 1;
      return Math.min(0.95, 0.45 + worst);
    },

    render: function (el, ctx) {
      ensureStyle();
      var v = payloadOf(ctx);
      if (!v) {
        return ctx.empty(el, "No variance decomposition in this report — the residual " +
          "comes with `deepcompare variance`.");
      }
      var list = drawable(v);
      if (!list.length) {
        return ctx.empty(el, "No metric in this corpus had variance to attribute, so there " +
          "is no residual to interpret.");
      }
      var plan = designOf(v) || {};
      var noise = plan.residual_is_noise === true;

      /* Headline: the single loudest number in the analysis. Most of what
       * happens is not explained by anything the corpus recorded. */
      var lead = list[0];
      var residual = num(lead.m.residual) || 0;
      var factors = arr(lead.m.factors);
      var leadCard = ctx.h("div", { class: "vz-lead " + (residual > 0.5 ? "bad" : "warn") });
      leadCard.appendChild(ctx.h("div", { class: "vz-lead-top" }, [
        ctx.h("span", { class: "vz-lead-n", text: ctx.fmt.pct(residual, 0) }),
        ctx.h("span", { class: "vz-lead-t", text: "of the variation in " + lead.label +
          " is unexplained" }),
      ]));
      leadCard.appendChild(ctx.h("div", { class: "vz-lead-b",
        text: factors.length
          ? "Nothing in " + factors.join(", ") + " accounts for it."
          : "No recorded factor accounts for it." }));
      leadCard.appendChild(ctx.h("div", { class: "vz-lead-b", style: { marginTop: "4px" } }, [
        noise
          ? tag(ctx, "good", "repeats present — this is run-to-run variation")
          : tag(ctx, "bad", "one run per cell — this is NOT flakiness"),
      ]));
      el.appendChild(leadCard);

      el.appendChild(note(ctx, noise ? "info" : "warn", [
        ctx.h("strong", { text: noise
          ? "The same cell was run more than once, so the residual is measured noise. "
          : "There is one run per cell, so interaction and noise cannot be separated. " }),
        ctx.h("span", { text: noise
          ? "Repeats hold every factor fixed and let the outcome move, which is exactly what " +
            "run-to-run variation means."
          : "A factor pairing that behaves unusually and a run that simply came out differently " +
            "land in the same number here. Reading it as flakiness would dismiss a real " +
            "interaction as luck." }),
      ]));

      var seen = {};
      list.forEach(function (entry) {
        var m = entry.m;
        var section = ctx.h("div", { class: "vz-metric" });
        section.appendChild(ctx.h("div", { class: "vz-metric-head" }, [
          ctx.h("b", { text: entry.label }),
          ctx.h("span", { class: "vz-sub", text: ctx.fmt.pct(num(m.residual), 0) + " residual" }),
          isNum(m.df_residual)
            ? ctx.h("span", { class: "vz-sub mono", text: "df " + ctx.fmt.int(m.df_residual) })
            : null,
        ]));
        section.appendChild(ctx.h("div", { class: "vz-svg-wrap" }, [drawResidual(ctx, m, plan)]));
        // The engine names what the residual can contain; that name is the
        // whole interpretation, so it is printed verbatim beside the bar.
        if (str(m.residual_meaning)) {
          section.appendChild(ctx.h("div", { class: "vz-sub", style: { marginTop: "5px" },
            text: "Residual here means: " + m.residual_meaning }));
        }
        if (str(m.caveat)) seen[m.caveat] = arr(seen[m.caveat]).concat([entry.label]);
        el.appendChild(section);
      });

      if (isNum(plan.runs)) {
        var repeats = obj(plan.repeats_per_cell) || {};
        el.appendChild(ctx.h("div", { class: "vz-sub", style: { marginTop: "10px" },
          text: ctx.fmt.int(plan.runs) + " runs over " +
            (isNum(repeats.cells) ? ctx.fmt.int(repeats.cells) + " cells" : "an unrecorded number of cells") +
            (isNum(repeats.min) && isNum(repeats.max)
              ? ", " + (repeats.min === repeats.max
                  ? repeats.min + (repeats.min === 1 ? " run" : " runs")
                  : repeats.min + "–" + repeats.max + " runs") + " per cell."
              : ".") }));
      }

      Object.keys(seen).forEach(function (text) {
        var cav = caveatNode(ctx, text, "Caveat (" + seen[text].join(", ") + "):");
        if (cav) el.appendChild(cav);
      });
    },
  });

})(typeof window !== "undefined" ? window : this);

</script>
