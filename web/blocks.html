<script>
/* AgentDiff blocks — the outcome group.
 *
 * Six cards that answer, in order: who won, where the two runs parted, what
 * caused the failure, what a different choice would have cost, how the credit
 * splits, and how the two answers actually read.
 *
 * The honesty rules from SCHEMA.md are load-bearing here, not decoration:
 *   - `attribution.failed_agent === null` means nobody failed. The object is
 *     always present, so presence is not the test.
 *   - `counterfactual` is a splice of steps that were really recorded on one
 *     side or the other — never a simulation. The card says so and shows
 *     `confidence` next to the estimate, not buried under it.
 *   - `shapley.outcome_attributable === false` means the binary outcome is
 *     NOT pinned to one divergence. The card states that in words.
 */
(function (global) {
  "use strict";

  var AgentDiff = global.AgentDiff;
  if (!AgentDiff || typeof AgentDiff.block !== "function") return;

  // ------------------------------------------------------------------ styles

  var STYLE_ID = "agentdiff-outcome-css";
  var CSS = [
    ".oc-lead{font-size:13.5px;line-height:1.5;margin:0 0 9px;color:var(--ink)}",
    ".oc-lead b{font-weight:650}",
    ".oc-sub{font-size:11.5px;color:var(--ink-3);margin:0 0 8px;line-height:1.45}",
    ".oc-sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}",
    ".oc-side{border:1px solid var(--rule);border-radius:9px;padding:8px 9px;min-width:0}",
    ".oc-side.sa{border-left:3px solid var(--a)}",
    ".oc-side.sb{border-left:3px solid var(--b)}",
    ".oc-name{font-weight:620;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}",
    ".oc-model{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}",
    ".oc-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:6px}",
    ".oc-item{border:1px solid var(--rule);border-radius:9px;padding:8px 9px;margin-bottom:7px;",
    "background:transparent;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;display:block}",
    ".oc-item:hover{border-color:var(--accent)}",
    ".oc-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}",
    ".oc-item.causal{border-left:3px solid var(--bad)}",
    ".oc-sum{font-size:12px;line-height:1.45;color:var(--ink-2);margin:5px 0 0}",
    ".oc-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}",
    ".oc-chip{font-size:10.5px;font-family:var(--mono);color:var(--ink-3);",
    "background:var(--surface-2);border-radius:5px;padding:1px 5px;white-space:nowrap}",
    ".oc-bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:5px}",
    ".oc-bar>i{display:block;height:100%;border-radius:3px}",
    ".oc-alloc{padding:7px 0;border-bottom:1px solid var(--rule)}",
    ".oc-alloc:last-child{border-bottom:0}",
    ".oc-allochead{display:flex;gap:6px;align-items:baseline;justify-content:space-between}",
    ".oc-num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11.5px;white-space:nowrap}",
    ".oc-diff{font-size:12.5px;line-height:1.75;max-height:300px;overflow:auto;",
    "border:1px solid var(--rule);border-radius:8px;padding:8px 9px;word-break:break-word}",
    ".oc-diff del,.oc-diff ins{text-decoration:none;border-radius:3px;padding:0 2px;",
    "box-decoration-break:clone;-webkit-box-decoration-break:clone}",
    ".oc-diff del{background:color-mix(in srgb,var(--a) 20%,transparent);",
    "color:var(--ink);border-bottom:1px solid color-mix(in srgb,var(--a) 55%,transparent)}",
    ".oc-diff ins{background:color-mix(in srgb,var(--b) 20%,transparent);",
    "color:var(--ink);border-bottom:1px solid color-mix(in srgb,var(--b) 55%,transparent)}",
    ".oc-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--ink-3);margin:7px 0 0}",
    ".oc-swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}",
    ".oc-panel{border:1px solid var(--rule);border-radius:9px;padding:8px 9px;margin-top:8px}",
    ".oc-panel.bad{border-left:3px solid var(--bad)}",
    ".oc-panel.warn{border-left:3px solid var(--warn)}",
    ".oc-quote{font-size:12.5px;line-height:1.5;color:var(--ink);margin:0}",
    ".oc-svgwrap{margin:8px 0 2px}",
    ".oc-svgwrap svg{width:100%;max-width:360px;height:auto;display:block}",
    ".oc-hr{height:1px;background:var(--rule);margin:9px 0}",
    ".oc-mini{font-size:11px;color:var(--ink-3);line-height:1.45;margin:5px 0 0}",
  ].join("");

  function ensureStyles() {
    try {
      if (document.getElementById(STYLE_ID)) return;
      var node = document.createElement("style");
      node.id = STYLE_ID;
      node.textContent = CSS;
      (document.head || document.documentElement).appendChild(node);
    } catch (err) { /* styling is a nicety; the markup still reads */ }
  }

  // ------------------------------------------------------------------ shared

  function side(report, which) {
    return (report && report[which]) || null;
  }

  function agentName(report, which) {
    var s = side(report, which);
    var name = s && s.agent && s.agent.name;
    return name || (which === "a" ? "Agent A" : "Agent B");
  }

  function otherSide(which) { return which === "a" ? "b" : "a"; }

  function sideClass(which) { return which === "a" ? "a" : "b"; }

  function num(value) {
    return typeof value === "number" && !isNaN(value) ? value : null;
  }

  /* Downstream keys carry the suffix of the side that spent more, which is
   * not always the side that failed — resolve by looking for the suffix that
   * is actually present rather than assuming `_b`. */
  function downstreamOf(divergence) {
    var ds = (divergence && divergence.downstream) || {};
    var has = function (which) {
      return ds["extra_steps_" + which] !== undefined ||
             ds["extra_tokens_" + which] !== undefined ||
             ds["extra_latency_s_" + which] !== undefined;
    };
    var heavier = has("a") ? "a" : (has("b") ? "b" : null);
    return {
      heavier: heavier,
      steps: heavier ? num(ds["extra_steps_" + heavier]) : null,
      tokens: heavier ? num(ds["extra_tokens_" + heavier]) : null,
      latency: heavier ? num(ds["extra_latency_s_" + heavier]) : null,
      caused: !!ds.caused_failure,
      failed: ds.failed_agent === "a" || ds.failed_agent === "b" ? ds.failed_agent : null,
    };
  }

  /* Divergences carry step indices; the alignment row holding them is what a
   * reader can actually navigate to. One-sided regions only resolve on one
   * of the two columns, so match either. */
  function alignmentRowFor(report, divergence) {
    var rows = (report && report.alignment) || [];
    if (!divergence) return null;
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i] || {};
      if (divergence.a_index !== null && divergence.a_index !== undefined &&
          row.a_index === divergence.a_index) return i;
      if (divergence.b_index !== null && divergence.b_index !== undefined &&
          row.b_index === divergence.b_index) return i;
    }
    return null;
  }

  function stepAt(report, which, index) {
    var s = side(report, which);
    var steps = (s && s.steps) || [];
    for (var i = 0; i < steps.length; i++) {
      if (steps[i] && steps[i].index === index) return steps[i];
    }
    return steps[index] || null;
  }

  function stepLabel(step) {
    if (!step) return "step";
    var type = step.type || "step";
    var name = step.name && step.name !== type ? step.name : "";
    return name ? type + " · " + name : type;
  }

  function ranges(list) {
    if (!Array.isArray(list) || !list.length) return "—";
    var sorted = list.filter(function (n) { return typeof n === "number"; })
                     .slice().sort(function (x, y) { return x - y; });
    if (!sorted.length) return "—";
    var out = [];
    var start = sorted[0];
    var prev = sorted[0];
    for (var i = 1; i <= sorted.length; i++) {
      var value = sorted[i];
      if (value === prev + 1) { prev = value; continue; }
      out.push(start === prev ? String(start) : start + "–" + prev);
      start = value; prev = value;
    }
    return out.join(", ");
  }

  function signed(value, unit, places) {
    if (value === null || value === undefined || isNaN(value)) return "—";
    var sign = value > 0 ? "+" : (value < 0 ? "−" : "±");
    var magnitude = Math.abs(value);
    var body = places === undefined
      ? Math.round(magnitude).toLocaleString()
      : magnitude.toFixed(places);
    return sign + body + (unit ? " " + unit : "");
  }

  function signedUsd(value) {
    if (value === null || value === undefined || isNaN(value)) return "—";
    var sign = value > 0 ? "+" : (value < 0 ? "−" : "±");
    var magnitude = Math.abs(value);
    return sign + "$" + magnitude.toFixed(magnitude < 0.01 ? 4 : 2);
  }

  /* For steps / tokens / latency / cost, less is better. */
  function deltaColor(ctx, value) {
    if (value === null || value === undefined || isNaN(value) || value === 0) return ctx.color.muted;
    return value < 0 ? ctx.color.good : ctx.color.bad;
  }

  function verdictClass(verdict) {
    if (verdict === "match") return "tag good";
    if (verdict === "partial") return "tag warn";
    if (verdict === "mismatch") return "tag bad";
    return "tag";
  }

  function chips(ctx, entries) {
    var wrap = ctx.h("div", { class: "oc-chips" });
    entries.forEach(function (entry) {
      if (!entry) return;
      wrap.appendChild(ctx.h("span", { class: "oc-chip", text: entry }));
    });
    return wrap;
  }

  function bar(ctx, fraction, fill) {
    var pct = Math.max(0, Math.min(1, num(fraction) || 0)) * 100;
    return ctx.h("div", { class: "oc-bar" }, [
      ctx.h("i", { style: { width: pct.toFixed(1) + "%", background: fill } }),
    ]);
  }

  // ----------------------------------------------------------- 1. verdict

  AgentDiff.block({
    id: "verdict",
    title: "Verdict",
    question: "Who won, and was it decisive?",
    group: "outcome",
    size: "normal",

    relevance: function (ctx) {
      var report = ctx.report;
      if (!report || !report.a || !report.b) return 0;
      var oa = report.a.outcome || {};
      var ob = report.b.outcome || {};
      if (oa.success === undefined && ob.success === undefined) return 0.4;
      // A split outcome is the sharpest thing this report can say.
      if (oa.success !== ob.success) return 1;
      var winner = (report.success_analysis || {}).winner;
      return winner ? 0.8 : 0.65;
    },

    render: function (el, ctx) {
      ensureStyles();
      var report = ctx.report;
      if (!report || !report.a || !report.b) {
        ctx.empty(el, "No paired run loaded.");
        return;
      }
      var oa = report.a.outcome || {};
      var ob = report.b.outcome || {};
      var analysis = report.success_analysis || {};
      var evaluation = report.answer_eval || {};
      var nameA = agentName(report, "a");
      var nameB = agentName(report, "b");

      // The plain-language call comes first; the table is corroboration.
      var lead;
      var winner = analysis.winner === "a" || analysis.winner === "b" ? analysis.winner : null;
      if (winner) {
        var winnerName = agentName(report, winner);
        var loserName = agentName(report, otherSide(winner));
        lead = analysis.basis === "outcome"
          ? winnerName + " won outright — " + loserName + " failed this task."
          : winnerName + " won on efficiency; both agents got there.";
      } else if (oa.success === true && ob.success === true) {
        lead = "Both agents succeeded — no winner called.";
      } else if (oa.success === false && ob.success === false) {
        lead = "Both agents failed this task.";
      } else if (oa.success !== ob.success) {
        lead = (oa.success ? nameA : nameB) + " succeeded; " +
               (oa.success ? nameB : nameA) + " did not.";
      } else {
        lead = "No winner recorded for this run.";
      }

      el.appendChild(ctx.h("p", { class: "oc-lead" }, [ctx.h("b", { text: lead })]));

      if (analysis.basis) {
        el.appendChild(ctx.h("p", {
          class: "oc-sub",
          text: analysis.basis === "outcome"
            ? "Basis: outcome — exactly one agent failed."
            : "Basis: efficiency — both succeeded, so the call is about what it cost.",
        }));
      }

      var sides = ctx.h("div", { class: "oc-sides" });
      [["a", nameA, oa], ["b", nameB, ob]].forEach(function (row) {
        var which = row[0];
        var outcome = row[2];
        var against = evaluation[which + "_vs_expected"] || {};
        var card = ctx.h("div", { class: "oc-side s" + which });
        card.appendChild(ctx.h("div", { class: "oc-name", text: row[1] }));
        var model = side(report, which).agent || {};
        card.appendChild(ctx.h("div", {
          class: "oc-model",
          text: (model.model || "model n/a") + (model.version ? " · " + model.version : ""),
        }));
        var tags = ctx.h("div", { class: "oc-row" });
        if (outcome.success === true) tags.appendChild(ctx.h("span", { class: "tag good", text: "✓ success" }));
        else if (outcome.success === false) tags.appendChild(ctx.h("span", { class: "tag bad", text: "✗ failed" }));
        else tags.appendChild(ctx.h("span", { class: "tag", text: "outcome unknown" }));
        if (num(outcome.score) !== null) {
          tags.appendChild(ctx.h("span", { class: "tag " + sideClass(which), text: "score " + ctx.fmt.num(outcome.score, 2) }));
        }
        card.appendChild(tags);

        var answerRow = ctx.h("div", { class: "oc-row" });
        if (against.verdict) {
          answerRow.appendChild(ctx.h("span", {
            class: verdictClass(against.verdict),
            text: "answer " + against.verdict,
          }));
        }
        if (num(against.coverage) !== null) {
          answerRow.appendChild(ctx.h("span", {
            class: "oc-num",
            style: { color: ctx.color.muted },
            text: ctx.fmt.pct(against.coverage) + " of expected",
          }));
        }
        if (answerRow.childNodes.length) card.appendChild(answerRow);
        sides.appendChild(card);
      });
      el.appendChild(sides);

      if (!evaluation.expected) {
        el.appendChild(ctx.h("p", {
          class: "caveat",
          text: "No expected answer recorded for this task, so the answer verdict is unavailable — success is the trace's own label.",
        }));
      }
      if (analysis.narrative) {
        el.appendChild(ctx.h("p", { class: "caveat", text: analysis.narrative }));
      } else if (!winner && report.attribution && report.attribution.explanation) {
        // Nobody failed, so the attribution object carries the comparison
        // instead of a cause — it is the only prose this run has.
        el.appendChild(ctx.h("p", { class: "caveat", text: report.attribution.explanation }));
      }
    },
  });

  // ------------------------------------------------------- 2. divergences

  AgentDiff.block({
    id: "divergences",
    title: "Divergences",
    question: "Where did they first part?",
    group: "outcome",
    size: "normal",

    relevance: function (ctx) {
      var list = (ctx.report && ctx.report.divergences) || [];
      if (!list.length) return 0;
      var causal = list.some(function (d) { return (d.downstream || {}).caused_failure; });
      return causal ? 1 : Math.min(0.85, 0.55 + 0.1 * list.length);
    },

    render: function (el, ctx) {
      ensureStyles();
      var report = ctx.report;
      var list = (report && report.divergences) || [];
      if (!list.length) {
        ctx.empty(el, "The two trajectories never parted — no divergence regions in this run.");
        return;
      }

      el.appendChild(ctx.h("p", {
        class: "oc-sub",
        text: list.length + " divergence region" + (list.length === 1 ? "" : "s") +
              ", ranked by downstream cost. Select one to mark it as inspected.",
      }));

      list.forEach(function (divergence) {
        var ds = downstreamOf(divergence);
        var row = alignmentRowFor(report, divergence);
        var item = ctx.h("button", {
          type: "button",
          class: "oc-item" + (ds.caused ? " causal" : ""),
          onclick: function () { ctx.signal("inspect"); },
        });

        var head = ctx.h("div", { class: "oc-row", style: { marginTop: "0" } }, [
          ctx.h("span", { class: "tag", text: "#" + (divergence.rank === undefined ? "?" : divergence.rank) }),
          ctx.h("span", { class: "tag", text: divergence.kind || "unclassified" }),
        ]);
        if (ds.caused) {
          head.appendChild(ctx.h("span", {
            class: "tag bad",
            text: ds.failed ? "caused " + agentName(report, ds.failed) + "'s failure" : "caused the failure",
          }));
        }
        item.appendChild(head);

        item.appendChild(ctx.h("p", { class: "oc-sum", text: divergence.summary || "No summary recorded." }));

        var position = [];
        position.push(row === null ? "alignment row —" : "alignment row " + row);
        position.push("A step " + (divergence.a_index === null || divergence.a_index === undefined ? "—" : divergence.a_index));
        position.push("B step " + (divergence.b_index === null || divergence.b_index === undefined ? "—" : divergence.b_index));
        item.appendChild(chips(ctx, position));

        if (ds.heavier) {
          var who = agentName(report, ds.heavier);
          item.appendChild(ctx.h("div", { class: "oc-chips" }, [
            ctx.h("span", { class: "oc-chip", style: { color: ctx.color[sideClass(ds.heavier)] }, text: who + " spent more downstream:" }),
            ds.steps === null ? null : ctx.h("span", { class: "oc-chip", text: signed(ds.steps, "steps") }),
            ds.tokens === null ? null : ctx.h("span", { class: "oc-chip", text: signed(ds.tokens, "tok") }),
            ds.latency === null ? null : ctx.h("span", { class: "oc-chip", text: signed(ds.latency, "s", 2) }),
          ].filter(Boolean)));
        } else {
          item.appendChild(ctx.h("p", { class: "oc-mini", text: "No downstream cost recorded for this region." }));
        }

        el.appendChild(item);
      });
    },
  });

  // -------------------------------------------------------- 3. attribution

  function chainNodes(report, failed, attribution) {
    var chain = Array.isArray(attribution.chain) ? attribution.chain.slice() : [];
    var root = num(attribution.root_cause_step);
    if (!chain.length && root !== null) chain = [root];
    var steps = (side(report, failed) || {}).steps || [];
    var lastStepIndex = steps.length ? (num(steps[steps.length - 1].index) !== null
      ? steps[steps.length - 1].index : steps.length - 1) : null;

    var nodes = chain.map(function (index, position) {
      var step = stepAt(report, failed, index);
      return {
        index: index,
        label: stepLabel(step),
        quality: step && step.quality ? step.quality : null,
        role: position === 0 ? "root" : "link",
      };
    });
    // If the chain already ends on the run's final step, that node IS the
    // outcome; otherwise say so explicitly rather than implying the chain
    // stopped mid-run.
    if (nodes.length && lastStepIndex !== null && nodes[nodes.length - 1].index === lastStepIndex) {
      nodes[nodes.length - 1].role = nodes.length === 1 ? "root" : "outcome";
    }
    if (!nodes.length || nodes[nodes.length - 1].role !== "outcome") {
      nodes.push({ index: null, label: "task failed", quality: null, role: "outcome" });
    }
    return nodes;
  }

  function drawChain(ctx, nodes) {
    var W = 300;
    var NH = 32;
    var GAP = 16;
    var TOP = 4;
    var height = TOP + nodes.length * NH + Math.max(0, nodes.length - 1) * GAP + TOP;
    var root = ctx.svg("svg", {
      viewBox: "0 0 " + W + " " + height,
      role: "img",
      "aria-label": "Causal chain from the root cause step to the failed outcome",
    });

    nodes.forEach(function (node, i) {
      var y = TOP + i * (NH + GAP);
      var accent = node.role === "link" ? ctx.color.axis : ctx.color.bad;
      var strong = node.role !== "link";

      root.appendChild(ctx.svg("rect", {
        x: 6, y: y, width: W - 12, height: NH, rx: 8,
        fill: accent, "fill-opacity": strong ? 0.12 : 0.04,
        stroke: accent, "stroke-width": strong ? 1.4 : 1,
      }));
      root.appendChild(ctx.svg("text", {
        x: 16, y: y + NH / 2 + 4, "font-size": 11.5,
        "font-family": "ui-monospace, Menlo, Consolas, monospace",
        fill: strong ? ctx.color.bad : ctx.color.muted,
        text: node.index === null ? "✗" : "#" + node.index,
      }));
      root.appendChild(ctx.svg("text", {
        x: node.index === null ? 34 : 48, y: y + NH / 2 + 4, "font-size": 11.5,
        fill: ctx.color.ink,
        text: ctx.fmt.truncate(node.label, node.role === "link" ? 30 : 26),
      }));
      if (node.role !== "link") {
        root.appendChild(ctx.svg("text", {
          x: W - 14, y: y + NH / 2 + 4, "font-size": 9, "text-anchor": "end",
          fill: ctx.color.bad,
          text: node.role === "root" ? "root cause" : "outcome",
        }));
      }
      if (node.quality === "bad" || node.quality === "weak") {
        root.appendChild(ctx.svg("circle", {
          cx: W - 20, cy: y + NH - 8, r: 2.5,
          fill: node.quality === "bad" ? ctx.color.bad : ctx.color.warn,
        }));
      }

      if (i < nodes.length - 1) {
        var top = y + NH;
        var bottom = top + GAP;
        root.appendChild(ctx.svg("line", {
          x1: W / 2, y1: top + 1, x2: W / 2, y2: bottom - 5,
          stroke: ctx.color.axis, "stroke-width": 1.2,
        }));
        root.appendChild(ctx.svg("polygon", {
          points: (W / 2 - 4) + "," + (bottom - 6) + " " + (W / 2 + 4) + "," + (bottom - 6) +
                  " " + (W / 2) + "," + bottom,
          fill: ctx.color.axis,
        }));
      }
    });
    return ctx.h("div", { class: "oc-svgwrap" }, [root]);
  }

  AgentDiff.block({
    id: "attribution",
    title: "Attribution",
    question: "What caused the failure?",
    group: "outcome",
    size: "wide",

    relevance: function (ctx) {
      var attribution = (ctx.report && ctx.report.attribution) || null;
      if (!attribution) return 0;
      // The object is always emitted; a null failed_agent means nobody failed.
      if (attribution.failed_agent !== "a" && attribution.failed_agent !== "b") return 0;
      return 1;
    },

    render: function (el, ctx) {
      ensureStyles();
      var report = ctx.report;
      var attribution = (report && report.attribution) || null;
      var failed = attribution && (attribution.failed_agent === "a" || attribution.failed_agent === "b")
        ? attribution.failed_agent : null;

      if (!failed) {
        ctx.empty(el, attribution && attribution.explanation
          ? attribution.explanation
          : "Nothing failed on this task, so there is no failure to attribute.");
        return;
      }

      var failedName = agentName(report, failed);
      var root = num(attribution.root_cause_step);

      el.appendChild(ctx.h("p", { class: "oc-lead" }, [
        ctx.h("b", { text: failedName + " failed." }),
        document.createTextNode(root === null
          ? " No root-cause step was isolated."
          : " Root cause: " + (attribution.category || "unclassified") + " at step " + root + "."),
      ]));

      var tags = ctx.h("div", { class: "oc-row", style: { marginTop: "0" } }, [
        ctx.h("span", { class: "tag " + sideClass(failed), text: failed.toUpperCase() + " · " + failedName }),
        attribution.category ? ctx.h("span", { class: "tag bad", text: attribution.category }) : null,
        ctx.h("span", {
          class: "tag",
          text: (Array.isArray(attribution.chain) ? attribution.chain.length : 0) + " step chain",
        }),
      ].filter(Boolean));
      el.appendChild(tags);

      el.appendChild(drawChain(ctx, chainNodes(report, failed, attribution)));

      if (attribution.explanation) {
        el.appendChild(ctx.h("div", { class: "oc-panel bad" }, [
          ctx.h("p", { class: "oc-quote", text: attribution.explanation }),
        ]));
      }
      el.appendChild(ctx.h("p", {
        class: "caveat",
        text: "The chain is the propagation path through " + failedName +
              "'s own steps: the root divergence, every step that carried its content forward, and the answer that came out. " +
              "A dot marks a step the trace itself annotated — red for bad, amber for weak.",
      }));
    },
  });

  // ------------------------------------------------------ 4. counterfactual

  AgentDiff.block({
    id: "counterfactual",
    title: "Counterfactual",
    question: "What if it had chosen differently?",
    group: "outcome",
    size: "normal",

    relevance: function (ctx) {
      var cf = (ctx.report && ctx.report.counterfactual) || null;
      if (!cf || !cf.estimate) return 0;
      if (cf.confidence === "high") return 0.95;
      if (cf.confidence === "medium") return 0.8;
      return 0.65;
    },

    render: function (el, ctx) {
      ensureStyles();
      var report = ctx.report;
      var cf = (report && report.counterfactual) || null;
      if (!cf || !cf.estimate) {
        ctx.empty(el, "No counterfactual: the engine only splices one when a failure was attributed.");
        return;
      }

      var estimate = cf.estimate || {};
      var splice = cf.splice || {};
      var confidence = cf.confidence || "unknown";
      var confidenceClass = confidence === "high" ? "tag good"
        : (confidence === "medium" ? "tag warn" : "tag bad");

      el.appendChild(ctx.h("div", { class: "oc-row", style: { marginTop: "0" } }, [
        ctx.h("span", { class: "tag", text: "splice of observed steps" }),
        ctx.h("span", { class: confidenceClass, text: "confidence: " + confidence }),
        estimate.outcome ? ctx.h("span", {
          class: estimate.outcome === "success" ? "tag good" : "tag bad",
          text: "estimated outcome: " + estimate.outcome,
        }) : null,
      ].filter(Boolean)));

      if (cf.premise) {
        el.appendChild(ctx.h("div", { class: "oc-panel" }, [
          ctx.h("p", { class: "oc-quote", text: "Premise: " + cf.premise }),
        ]));
      }

      var adopted = splice.adopted_from === "a" || splice.adopted_from === "b" ? splice.adopted_from : null;
      el.appendChild(ctx.h("dl", { class: "kv", style: { marginTop: "9px" } }, [
        ctx.h("dt", { text: "Kept prefix" }),
        ctx.h("dd", { class: "mono", text: "steps " + ranges(splice.prefix_steps) }),
        ctx.h("dt", { text: "Adopted" }),
        ctx.h("dd", { class: "mono", text: "steps " + ranges(splice.adopted_steps) +
          (adopted ? " from " + agentName(report, adopted) : "") }),
      ]));

      var deltas = [
        { label: "Steps", value: num(estimate.steps), delta: num(estimate.steps_delta), text: ctx.fmt.int(estimate.steps), d: signed(estimate.steps_delta) },
        { label: "Tokens", value: num(estimate.tokens), delta: num(estimate.tokens_delta), text: ctx.fmt.tokens(estimate.tokens), d: signed(estimate.tokens_delta, "tok") },
        { label: "Latency", value: num(estimate.latency_s), delta: num(estimate.latency_delta_s), text: ctx.fmt.sec(estimate.latency_s), d: signed(estimate.latency_delta_s, "s", 2) },
        { label: "Cost", value: num(estimate.cost_usd), delta: num(estimate.cost_delta_usd), text: ctx.fmt.usd(estimate.cost_usd), d: signedUsd(estimate.cost_delta_usd) },
      ];
      var table = ctx.h("table", { class: "grid", style: { marginTop: "9px" } }, [
        ctx.h("tr", null, [
          ctx.h("th", { text: "Estimate" }),
          ctx.h("th", { class: "num", text: "Spliced" }),
          ctx.h("th", { class: "num", text: "vs actual" }),
        ]),
      ]);
      deltas.forEach(function (row) {
        if (row.value === null && row.delta === null) return;
        table.appendChild(ctx.h("tr", null, [
          ctx.h("td", { text: row.label }),
          ctx.h("td", { class: "num", text: row.value === null ? "—" : row.text }),
          ctx.h("td", { class: "num", style: { color: deltaColor(ctx, row.delta) }, text: row.delta === null ? "—" : row.d }),
        ]));
      });
      el.appendChild(ctx.h("div", { class: "scroll-x" }, [table]));

      if (cf.narrative) {
        el.appendChild(ctx.h("p", { class: "oc-mini", text: cf.narrative }));
      }

      el.appendChild(ctx.h("p", {
        class: "caveat",
        text: "Not a simulation and not a prediction. The engine never re-runs an agent: this trajectory is assembled from steps that were really recorded — " +
              (adopted ? agentName(report, adopted) + "'s" : "the reference") +
              " suffix pasted onto the failing run's own prefix — and costed at the observed per-step rates. Confidence is \"" +
              confidence + "\", which describes how clean that splice was, not how likely the outcome is.",
      }));
    },
  });

  // ------------------------------------------------------------- 5. shapley

  AgentDiff.block({
    id: "shapley",
    title: "Credit split",
    question: "How is the credit split?",
    group: "outcome",
    size: "normal",

    relevance: function (ctx) {
      var shapley = (ctx.report && ctx.report.shapley) || null;
      if (!shapley || shapley.available === false) return 0;
      var allocations = shapley.allocations || [];
      if (!allocations.length) return 0;
      // Splitting credit only earns its space once there is more than one
      // region to split it between.
      return allocations.length > 1 ? 0.9 : 0.55;
    },

    render: function (el, ctx) {
      ensureStyles();
      var report = ctx.report;
      var shapley = (report && report.shapley) || null;
      if (!shapley) {
        ctx.empty(el, "No credit split: this run has no divergence regions to allocate between.");
        return;
      }
      if (shapley.available === false) {
        ctx.empty(el, shapley.reason || shapley._note ||
          "Credit allocation is marked unavailable for this run.");
        return;
      }
      var allocations = shapley.allocations || [];
      if (!allocations.length) {
        ctx.empty(el, "No allocations recorded for this run.");
        return;
      }

      var metric = shapley.metric || "tokens";
      var total = num(shapley.total_saving);

      el.appendChild(ctx.h("div", { class: "oc-row", style: { marginTop: "0" } }, [
        ctx.h("span", { class: "tag", text: "metric: " + metric }),
        ctx.h("span", {
          class: shapley.method === "exact" ? "tag good" : "tag warn",
          text: shapley.method === "exact" ? "exact enumeration" : (shapley.method || "method n/a"),
        }),
        ctx.h("span", { class: "tag", text: allocations.length + " region" + (allocations.length === 1 ? "" : "s") }),
      ]));

      if (total !== null) {
        el.appendChild(ctx.h("p", {
          class: "oc-lead", style: { marginTop: "9px", marginBottom: "4px" },
        }, [
          ctx.h("b", { text: total >= 0
            ? "Taking the reference path at every divergence saves " + Math.round(total).toLocaleString() + " " + metric + "."
            : "Taking the reference path at every divergence costs " + Math.round(-total).toLocaleString() + " more " + metric + " — the gap runs the other way." }),
        ]));
      }
      if (shapley.loser && shapley.winner) {
        el.appendChild(ctx.h("p", {
          class: "oc-sub",
          text: shapley.loser + "'s spend measured against " + shapley.winner + "'s path.",
        }));
      }

      allocations.forEach(function (allocation) {
        var share = num(allocation.share);
        var value = num(allocation.shapley);
        var causal = !!allocation.caused_failure;
        var fill = causal ? ctx.color.bad : ctx.color.axis;
        var row = ctx.h("div", { class: "oc-alloc" });
        row.appendChild(ctx.h("div", { class: "oc-allochead" }, [
          ctx.h("span", { class: "oc-row", style: { marginTop: "0" } }, [
            ctx.h("span", { class: "tag", text: "region " + (allocation.region === undefined ? "?" : allocation.region) }),
            ctx.h("span", { class: "tag", text: allocation.kind || "unclassified" }),
            causal ? ctx.h("span", { class: "tag bad", text: "causal" }) : null,
          ].filter(Boolean)),
          ctx.h("span", {
            class: "oc-num",
            text: (share === null ? "—" : ctx.fmt.pct(share)) +
                  (value === null ? "" : "  ·  " + Math.round(value).toLocaleString()),
          }),
        ]));
        row.appendChild(bar(ctx, share === null ? 0 : Math.abs(share), fill));
        if (allocation.summary) {
          row.appendChild(ctx.h("p", { class: "oc-sum", text: ctx.fmt.truncate(allocation.summary, 190) }));
        }
        if (Array.isArray(allocation.alignment_rows) && allocation.alignment_rows.length) {
          row.appendChild(chips(ctx, [
            "alignment row" + (allocation.alignment_rows.length === 1 ? " " : "s ") +
            ranges(allocation.alignment_rows),
          ]));
        }
        el.appendChild(row);
      });

      var attributable = shapley.outcome_attributable === true;
      el.appendChild(ctx.h("div", { class: "oc-panel " + (attributable ? "" : "warn") }, [
        ctx.h("div", { class: "oc-row", style: { marginTop: "0" } }, [
          ctx.h("span", {
            class: attributable ? "tag good" : "tag warn",
            text: attributable ? "outcome attributable" : "outcome NOT attributable",
          }),
        ]),
        ctx.h("p", {
          class: "oc-mini",
          text: attributable
            ? "Exactly one divergence was causal, so the pass/fail outcome does belong to it. The shares above still describe " + metric + ", not the outcome."
            : "The shares above split " + metric + " only — the pass/fail outcome is NOT attributable to any single divergence here.",
        }),
        // The engine's own wording, kept verbatim: it is the field that says
        // why credit was declined rather than guessed.
        shapley.outcome_note
          ? ctx.h("p", { class: "oc-mini", style: { fontStyle: "italic" }, text: shapley.outcome_note })
          : null,
      ].filter(Boolean)));

      var footnotes = [];
      if (num(shapley.efficiency_check) !== null) {
        footnotes.push("Efficiency check (Σ allocations − total): " + ctx.fmt.num(shapley.efficiency_check, 2) + ".");
      }
      footnotes.push("Splice-Shapley: exact with respect to the splice surrogate — adopting the reference path yields the steps that side actually took — not with respect to the agent, which would require re-running it.");
      if (shapley._note) footnotes.push(shapley._note);
      el.appendChild(ctx.h("p", { class: "caveat", text: footnotes.join(" ") }));
    },
  });

  // --------------------------------------------------------- 6. answer diff

  var OP_EQUAL = { eq: 1, equal: 1, "=": 1 };
  var OP_DELETE = { del: 1, delete: 1, "-": 1 };
  var OP_INSERT = { ins: 1, insert: 1, "+": 1 };

  function opKind(raw) {
    var op = String(raw);
    if (OP_DELETE[op]) return "del";
    if (OP_INSERT[op]) return "ins";
    if (OP_EQUAL[op]) return "eq";
    return "eq";
  }

  /* The engine emits a token-level diff, so a rewritten clause arrives as
   * del/ins/del/ins alternating around shared spaces — legible to a diff
   * algorithm, unreadable to a person. Coalescing each run back into "what A
   * said" then "what B said" changes no text: the shared separator that is
   * consumed belongs to both sides, and it is re-emitted inside both. */
  function coalesceDiff(pairs) {
    var ops = [];
    (pairs || []).forEach(function (pair) {
      if (!Array.isArray(pair) || pair.length < 2) return;
      var text = pair[1] === null || pair[1] === undefined ? "" : String(pair[1]);
      if (!text) return;
      ops.push({ op: opKind(pair[0]), text: text });
    });

    var out = [];
    var i = 0;
    while (i < ops.length) {
      if (ops[i].op === "eq") { out.push(ops[i]); i++; continue; }
      var dels = [];
      var inss = [];
      var separator = null;
      while (i < ops.length) {
        var op = ops[i];
        if (op.op === "eq") {
          // Only swallow a shared separator once BOTH sides have text to
          // separate — then it can be re-emitted into both and no character
          // of either answer is lost. Anything else ends the run.
          var joins = /^\s+$/.test(op.text) && dels.length && inss.length &&
                      i + 1 < ops.length && ops[i + 1].op !== "eq";
          if (!joins) break;
          separator = op.text;
          i++;
          continue;
        }
        if (separator !== null) {
          dels.push(separator);
          inss.push(separator);
          separator = null;
        }
        (op.op === "del" ? dels : inss).push(op.text);
        i++;
      }
      if (dels.length) out.push({ op: "del", text: dels.join("") });
      if (inss.length) out.push({ op: "ins", text: inss.join("") });
    }
    return out;
  }

  AgentDiff.block({
    id: "answer-diff",
    title: "Answer diff",
    question: "How do the two answers differ?",
    group: "outcome",
    size: "normal",

    relevance: function (ctx) {
      var evaluation = (ctx.report && ctx.report.answer_eval) || null;
      if (!evaluation) return 0;
      var diff = evaluation.diff_ab || [];
      if (!diff.length) return 0;
      var differs = diff.some(function (pair) {
        return pair && !OP_EQUAL[String(pair[0])];
      });
      return differs ? 0.85 : 0.3;
    },

    render: function (el, ctx) {
      ensureStyles();
      var report = ctx.report;
      var evaluation = (report && report.answer_eval) || null;
      if (!evaluation) {
        ctx.empty(el, "This run carries no answer evaluation.");
        return;
      }
      var diff = evaluation.diff_ab || [];
      if (!diff.length) {
        ctx.empty(el, "No answer diff recorded — at least one side emitted no final answer.");
        return;
      }

      var nameA = agentName(report, "a");
      var nameB = agentName(report, "b");

      var body = ctx.h("div", { class: "oc-diff" });
      var identical = true;
      coalesceDiff(diff).forEach(function (segment) {
        if (segment.op === "del") { identical = false; body.appendChild(ctx.h("del", { text: segment.text })); }
        else if (segment.op === "ins") { identical = false; body.appendChild(ctx.h("ins", { text: segment.text })); }
        else { body.appendChild(document.createTextNode(segment.text)); }
      });
      el.appendChild(body);

      el.appendChild(ctx.h("div", { class: "oc-legend" }, [
        ctx.h("span", null, [
          ctx.h("i", { class: "oc-swatch", style: { background: ctx.color.a } }),
          document.createTextNode("only in A · " + nameA),
        ]),
        ctx.h("span", null, [
          ctx.h("i", { class: "oc-swatch", style: { background: ctx.color.b } }),
          document.createTextNode("only in B · " + nameB),
        ]),
        ctx.h("span", { text: "unmarked text is shared wording" }),
      ]));
      el.appendChild(ctx.h("p", {
        class: "oc-mini",
        text: "Token-level diff of A's final answer against B's; within a change A's wording is shown first, then B's.",
      }));

      if (identical) {
        el.appendChild(ctx.h("p", { class: "oc-mini", text: "The two final answers are token-identical." }));
      }

      el.appendChild(ctx.h("div", { class: "oc-hr" }));

      if (evaluation.expected) {
        el.appendChild(ctx.h("dl", { class: "kv" }, [
          ctx.h("dt", { text: "Expected" }),
          ctx.h("dd", { class: "mono", text: ctx.fmt.truncate(evaluation.expected, 240) }),
        ]));
      } else {
        el.appendChild(ctx.h("p", {
          class: "oc-mini",
          text: "No expected answer recorded for this task, so neither side can be scored for coverage.",
        }));
      }

      [["a", nameA], ["b", nameB]].forEach(function (row) {
        var which = row[0];
        var against = evaluation[which + "_vs_expected"] || {};
        if (against.coverage === undefined && !against.verdict) return;
        var block = ctx.h("div", { style: { marginTop: "8px" } });
        block.appendChild(ctx.h("div", { class: "oc-allochead" }, [
          ctx.h("span", { class: "oc-row", style: { marginTop: "0" } }, [
            ctx.h("span", { class: "tag " + sideClass(which), text: which.toUpperCase() + " · " + row[1] }),
            ctx.h("span", { class: verdictClass(against.verdict), text: against.verdict || "unknown" }),
          ]),
          ctx.h("span", {
            class: "oc-num",
            text: num(against.coverage) === null ? "—" : ctx.fmt.pct(against.coverage) + " coverage",
          }),
        ]));
        block.appendChild(bar(ctx, against.coverage, ctx.color[sideClass(which)]));
        el.appendChild(block);
      });

      el.appendChild(ctx.h("p", {
        class: "caveat",
        text: "Coverage is the fraction of expected-answer tokens present in the answer — a lexical check, not a judgement of meaning. A wrong number caps the verdict at \"partial\" even when the wording matches.",
      }));
    },
  });
})(typeof window !== "undefined" ? window : this);

</script>

<script>
/* AgentDiff blocks — trajectory.
 *
 * The trace visualization: five blocks that read the alignment as a picture
 * rather than a table. The governing idea is that a diff between two agent
 * runs is *spatial* — two tracks, one above the other, matched steps in the
 * same column — so divergence is something you see before you read.
 *
 * Everything here is hand-rolled SVG sized from the container, theme-aware
 * through ctx.color, and honest about absence: a one-sided alignment row
 * draws a gap, never a zero.
 */
(function (global) {
  "use strict";

  if (!global.AgentDiff || typeof global.AgentDiff.block !== "function") return;

  // Bound at the top of every draw; the core hands out the same helpers each
  // time, so this is a convenience, not shared state.
  var H = null, S = null, C = null, F = null;

  function bind(ctx) { H = ctx.h; S = ctx.svg; C = ctx.color; F = ctx.fmt; }

  // ------------------------------------------------------------------ style

  var STYLED = false;
  function ensureStyle() {
    if (STYLED) return;
    STYLED = true;
    var css = [
      ".tj-sides{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:11.5px;margin-bottom:6px}",
      ".tj-side{display:inline-flex;align-items:center;gap:5px;min-width:0}",
      ".tj-chip{width:9px;height:9px;border-radius:2px;flex:none}",
      ".tj-side b{font-weight:600;letter-spacing:-.01em}",
      ".tj-legend{display:flex;flex-wrap:wrap;gap:3px 11px;align-items:center;",
      "margin-top:7px;font-size:10.5px;color:var(--ink-3);line-height:1}",
      ".tj-legend .k{display:inline-flex;align-items:center;gap:4px}",
      ".tj-legend .lab{text-transform:uppercase;letter-spacing:.07em;opacity:.75}",
      ".tj-sw{width:12px;height:8px;border-radius:2px;flex:none;display:inline-block}",
      ".tj-read{margin-top:7px;min-height:15px;font-family:var(--mono);font-size:11px;",
      "color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}",
      ".tj-read i{font-style:normal;color:var(--ink-3)}",
      ".tj-cols{display:flex;flex-wrap:wrap;gap:10px}",
      ".tj-pane{flex:1 1 210px;min-width:0;border:1px solid var(--rule);border-radius:8px;padding:8px 9px}",
      ".tj-pane.absent{border-style:dashed;opacity:.72}",
      ".tj-pane h4{display:flex;align-items:center;gap:6px;font-size:11px;margin:0 0 5px;",
      "text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}",
      ".tj-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:6px 0 2px}",
      ".tj-text{font-family:var(--mono);font-size:11px;line-height:1.45;white-space:pre-wrap;",
      "word-break:break-word;background:var(--surface-2);border:1px solid var(--rule);",
      "border-radius:6px;padding:6px 7px;max-height:132px;overflow:auto}",
      ".tj-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}",
      ".tj-head .sp{flex:1}",
      ".tj-nav{display:flex;gap:4px}",
      ".tj-nav button{border:1px solid var(--rule-2);background:var(--surface);color:var(--ink-2);",
      "border-radius:6px;padding:1px 7px;font-size:11px;line-height:1.5;cursor:pointer}",
      ".tj-nav button:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}",
      ".tj-nav button[disabled]{opacity:.4;cursor:default}",
      ".tj-note{margin-top:6px;font-size:11px;color:var(--ink-2);border-left:2px solid var(--warn);padding-left:7px}",
      ".tj-seq{font-family:var(--mono);font-size:11px;color:var(--ink-2);display:flex;",
      "align-items:baseline;gap:6px;margin-top:2px}",
      ".tj-seq b{font-weight:600;font-size:10.5px;letter-spacing:.04em}",
      ".tj-seq span{letter-spacing:.14em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}",
      "svg.tj{display:block;max-width:none}",
      ".tj-hit{cursor:pointer}",
    ].join("");
    try {
      var tag = document.createElement("style");
      tag.setAttribute("data-agentdiff", "trajectory");
      tag.appendChild(document.createTextNode(css));
      document.head.appendChild(tag);
    } catch (err) { /* styling is a nicety; the blocks still read without it */ }
  }

  // ------------------------------------------------------------- responsive
  //
  // The core renders a block while its card is still detached, so clientWidth
  // is 0 at paint time. Draw once at a nominal width, then re-measure on the
  // next frame and repaint if the real width differs — layout-driven, not
  // time-driven, so the result is the same on every load.

  var painters = [];
  var resizeTimer = null;

  function measure(el) {
    var w = 0;
    try { w = el.clientWidth || 0; } catch (err) { w = 0; }
    if (!w) w = 340;
    return Math.max(220, w - 24);
  }

  function sized(el, ctx, draw) {
    var host = ctx.h("div");
    el.appendChild(host);
    var last = -1;
    function go() {
      var w = measure(el);
      if (w === last) return;
      last = w;
      host.innerHTML = "";
      draw(host, w);
    }
    go();
    if (typeof global.requestAnimationFrame === "function") {
      global.requestAnimationFrame(function () { if (el.isConnected) go(); });
    }
    painters.push({ el: el, go: go });
    if (painters.length > 64) {
      painters = painters.filter(function (p) { return p.el.isConnected; });
    }
    return host;
  }

  try {
    global.addEventListener("resize", function () {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        resizeTimer = null;
        painters = painters.filter(function (p) { return p.el.isConnected; });
        painters.forEach(function (p) {
          try { p.go(); } catch (err) { /* one stale painter must not stop the rest */ }
        });
      }, 140);
    });
  } catch (err) { /* no window: nothing to resize */ }

  // -------------------------------------------------------------- selection
  //
  // One shared cursor across the trajectory blocks: clicking a step in
  // `tracks` is what `step-detail` is looking at. Subscribers are pruned by
  // DOM connectivity, so a re-render of the page cannot leave ghosts behind.

  var Sel = { task: null, row: null, side: null, subs: [] };

  function subscribe(el, fn) { Sel.subs.push({ el: el, fn: fn }); }

  function notify() {
    Sel.subs = Sel.subs.filter(function (s) { return s.el.isConnected; });
    Sel.subs.forEach(function (s) {
      try { s.fn(); } catch (err) { console.warn("AgentDiff trajectory: subscriber failed", err); }
    });
  }

  function syncTask(ctx) {
    var task = ctx.task || (ctx.report && ctx.report.task ? ctx.report.task.id : null);
    if (Sel.task !== task) { Sel.task = task; Sel.row = null; Sel.side = null; }
  }

  function select(row, side, ctx) {
    Sel.row = row;
    Sel.side = side || null;
    if (ctx && ctx.signal) ctx.signal("inspect");
    notify();
  }

  // ------------------------------------------------------------ data access

  function rowsOf(report) {
    return report && Array.isArray(report.alignment) ? report.alignment : [];
  }

  function stepsOf(report, side) {
    var box = report && report[side];
    return box && Array.isArray(box.steps) ? box.steps : [];
  }

  function stepAt(report, side, index) {
    if (index === null || index === undefined) return null;
    var steps = stepsOf(report, side);
    for (var i = 0; i < steps.length; i++) {
      if (steps[i] && steps[i].index === index) return steps[i];
    }
    return steps[index] || null;
  }

  function agentName(report, side) {
    var box = report && report[side];
    var name = box && box.agent && box.agent.name;
    return name || side.toUpperCase();
  }

  function sideColor(side) { return side === "a" ? C.a : C.b; }

  /* Divergences carry a_index and b_index that may land in different
   * alignment rows when the region is one-sided, so a column is divergent if
   * it matches either. The rank marker goes on the earliest such column. */
  function divergenceMap(report) {
    var rows = rowsOf(report);
    var map = {};
    (report && Array.isArray(report.divergences) ? report.divergences : []).forEach(function (d) {
      var hits = [];
      rows.forEach(function (row, i) {
        var a = d.a_index !== null && d.a_index !== undefined && row.a_index === d.a_index;
        var b = d.b_index !== null && d.b_index !== undefined && row.b_index === d.b_index;
        if (a || b) hits.push(i);
      });
      hits.forEach(function (i, k) {
        var mark = { div: d, primary: k === 0 };
        if (!map[i] || (map[i].div.rank || 99) > (d.rank || 99)) map[i] = mark;
        else if (!map[i].primary && mark.primary) map[i] = mark;
      });
    });
    return map;
  }

  function rootInfo(report) {
    var at = report && report.attribution;
    if (!at || !at.failed_agent || at.root_cause_step === null || at.root_cause_step === undefined) {
      return null;
    }
    var side = at.failed_agent === "a" ? "a" : "b";
    var rows = rowsOf(report);
    var row = -1;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i][side + "_index"] === at.root_cause_step) { row = i; break; }
    }
    return { side: side, index: at.root_cause_step, row: row, category: at.category || null,
             explanation: at.explanation || "" };
  }

  function defaultSelection(report) {
    var rows = rowsOf(report);
    if (!rows.length) return { row: -1, side: null, why: "no alignment" };
    var root = rootInfo(report);
    if (root && root.row >= 0) {
      return { row: root.row, side: root.side, why: "the attributed root cause" };
    }
    var map = divergenceMap(report);
    var keys = Object.keys(map).map(Number).sort(function (x, y) { return x - y; });
    if (keys.length) return { row: keys[0], side: null, why: "the first divergence" };
    return { row: 0, side: null, why: "the first aligned step" };
  }

  function resolved(report) {
    if (Sel.row === null || Sel.row === undefined || !rowsOf(report)[Sel.row]) {
      var def = defaultSelection(report);
      return { row: def.row, side: def.side, why: def.why, pinned: false };
    }
    return { row: Sel.row, side: Sel.side, why: null, pinned: true };
  }

  function semanticOf(report) {
    var sem = report && report.semantic;
    return sem && typeof sem === "object" ? sem : null;
  }

  function semanticByRow(report) {
    var sem = semanticOf(report);
    var out = {};
    if (sem && Array.isArray(sem.rows)) {
      sem.rows.forEach(function (r) { if (r && typeof r.row === "number") out[r.row] = r; });
    }
    return out;
  }

  // ------------------------------------------------------------ svg helpers

  var TYPES = ["plan", "search", "retrieve", "read", "tool_call", "reason", "answer"];
  var TYPE_LABEL = {
    plan: "plan", search: "search", retrieve: "retrieve", read: "read",
    tool_call: "tool", reason: "reason", answer: "answer",
  };

  function pts(list) {
    return list.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  }

  /* One shape per step type. Shapes, not colours, carry type — colour is
   * already spoken for by side and by quality. */
  function glyphNode(type, cx, cy, r) {
    switch (type) {
      case "plan":
        return S("rect", { x: cx - r, y: cy - r, width: 2 * r, height: 2 * r, rx: 1.5 });
      case "search":
        return S("circle", { cx: cx, cy: cy, r: r });
      case "retrieve":
        return S("polygon", { points: pts([[cx - r, cy - r * 0.78], [cx + r, cy - r * 0.78], [cx, cy + r]]) });
      case "read": {
        var w = r * 0.82, cut = r * 0.72;
        return S("polygon", { points: pts([
          [cx - w, cy - r], [cx + w - cut, cy - r], [cx + w, cy - r + cut],
          [cx + w, cy + r], [cx - w, cy + r]]) });
      }
      case "tool_call": {
        var hex = [];
        for (var i = 0; i < 6; i++) {
          var ang = (Math.PI / 180) * (60 * i - 90);
          hex.push([cx + r * Math.cos(ang), cy + r * Math.sin(ang)]);
        }
        return S("polygon", { points: pts(hex) });
      }
      case "reason":
        return S("polygon", { points: pts([[cx, cy - r], [cx + r, cy + r * 0.78], [cx - r, cy + r * 0.78]]) });
      case "answer":
        return S("polygon", { points: pts([[cx, cy - r], [cx + r, cy], [cx, cy + r], [cx - r, cy]]) });
      default:
        return S("circle", { cx: cx, cy: cy, r: r * 0.55 });
    }
  }

  /* Quality is a fill treatment so it reads at a glance without a second
   * mark: solid = bad, tinted = weak, side-tinted outline = good, dashed
   * hairline = unannotated (not "fine" — simply not judged). */
  function qualityStyle(quality, side) {
    if (quality === "bad")  return { stroke: C.bad,  fill: C.bad,  op: 0.85, w: 1.4, dash: null };
    if (quality === "weak") return { stroke: C.warn, fill: C.warn, op: 0.3,  w: 1.3, dash: null };
    if (quality === "good") return { stroke: sideColor(side), fill: sideColor(side), op: 0.16, w: 1.4, dash: null };
    return { stroke: C.muted, fill: C.muted, op: 0, w: 1, dash: "2 2" };
  }

  function styleGlyph(node, st) {
    node.setAttribute("stroke", st.stroke);
    node.setAttribute("stroke-width", st.w);
    node.setAttribute("fill", st.fill);
    node.setAttribute("fill-opacity", st.op);
    node.setAttribute("stroke-linejoin", "round");
    if (st.dash) node.setAttribute("stroke-dasharray", st.dash);
    return node;
  }

  function tinyGlyph(type, side, quality) {
    var node = glyphNode(type, 7, 7, 4.4);
    styleGlyph(node, qualityStyle(quality === undefined ? "good" : quality, side || "a"));
    return S("svg", { width: 14, height: 14, viewBox: "0 0 14 14", "aria-hidden": "true" }, [node]);
  }

  function absentSwatch() {
    return S("svg", { width: 14, height: 12, viewBox: "0 0 14 12", "aria-hidden": "true" }, [
      S("line", { x1: 1, y1: 6, x2: 13, y2: 6, stroke: C.grid, "stroke-width": 1 }),
      S("circle", { cx: 7, cy: 6, r: 2.6, fill: C.surface, stroke: C.muted,
                    "stroke-width": 1, "stroke-dasharray": "1.6 1.4" }),
    ]);
  }

  function tick(x1, y1, x2, y2, stroke, width, dash) {
    var line = S("line", { x1: x1, y1: y1, x2: x2, y2: y2, stroke: stroke, "stroke-width": width || 1 });
    if (dash) line.setAttribute("stroke-dasharray", dash);
    return line;
  }

  function label(x, y, text, fill, size, anchor) {
    return S("text", {
      x: x, y: y, fill: fill, "font-size": size || 9,
      "text-anchor": anchor || "middle",
      "font-family": "var(--mono)", "letter-spacing": "0.02em", text: text,
    });
  }

  function legend(items) {
    var box = H("div", { class: "tj-legend" });
    items.forEach(function (item) {
      if (item.heading) {
        box.appendChild(H("span", { class: "lab", text: item.heading }));
        return;
      }
      box.appendChild(H("span", { class: "k" }, [
        item.node || H("i", {
          class: "tj-sw",
          style: {
            background: item.fill || "transparent",
            opacity: item.opacity === undefined ? "1" : String(item.opacity),
            border: item.border || "none",
            borderRadius: item.round ? "999px" : "2px",
          },
        }),
        H("span", { text: item.text }),
      ]));
    });
    return box;
  }

  function sideHeader(report) {
    var box = H("div", { class: "tj-sides" });
    ["a", "b"].forEach(function (side) {
      var out = report[side] && report[side].outcome;
      var ok = out ? out.success : null;
      box.appendChild(H("span", { class: "tj-side" }, [
        H("i", { class: "tj-chip", style: { background: sideColor(side) } }),
        H("b", { text: side.toUpperCase() + " " + agentName(report, side) }),
        ok === null || ok === undefined ? null :
          H("span", { class: "tag " + (ok ? "good" : "bad"), text: ok ? "solved" : "failed" }),
      ]));
    });
    return box;
  }

  // ================================================================ tracks

  AgentDiff.block({
    id: "tracks",
    title: "Tracks",
    question: "How did the two runs unfold?",
    group: "trajectory",
    size: "wide",
    relevance: function (ctx) {
      var report = ctx.report;
      if (!report) return 0;
      if (!rowsOf(report).length) return 0;
      if (!stepsOf(report, "a").length && !stepsOf(report, "b").length) return 0;
      var divergent = (report.divergences || []).length;
      return divergent ? 1 : 0.86;
    },
    render: function (el, ctx) {
      bind(ctx);
      ensureStyle();
      var report = ctx.report;
      if (!report) return ctx.empty(el, "No report loaded.");
      var rows = rowsOf(report);
      if (!rows.length) return ctx.empty(el, "This report carries no alignment, so there is nothing to lay side by side.");
      if (!stepsOf(report, "a").length && !stepsOf(report, "b").length) {
        return ctx.empty(el, "Neither trajectory recorded any steps.");
      }
      syncTask(ctx);

      el.appendChild(sideHeader(report));
      var readout = H("div", { class: "tj-read" });
      var host = sized(el, ctx, function (box, avail) { drawTracks(box, avail, ctx, readout); });
      el.appendChild(readout);
      subscribe(el, function () {
        host.innerHTML = "";
        drawTracks(host, measure(el), ctx, readout);
      });

      var typeItems = [{ heading: "step" }];
      TYPES.forEach(function (type) {
        typeItems.push({ node: tinyGlyph(type, "a", null), text: TYPE_LABEL[type] });
      });
      el.appendChild(legend(typeItems));
      el.appendChild(legend([
        { heading: "quality" },
        { node: tinyGlyph("search", "a", "good"), text: "good" },
        { node: tinyGlyph("search", "a", "weak"), text: "weak" },
        { node: tinyGlyph("search", "a", "bad"), text: "bad" },
        { node: tinyGlyph("search", "a", null), text: "unannotated" },
        { heading: "link" },
        { node: swatchLine(C.axis, null), text: "match" },
        { node: swatchLine(C.warn, "3 2"), text: "drift" },
        { node: swatchLine(C.bad, "2 2"), text: "divergence" },
        { node: absentSwatch(), text: "no counterpart" },
      ]));
      el.appendChild(H("p", {
        class: "caveat",
        text: "One column per alignment row: matched steps sit in the same column, so a step with " +
              "no counterpart leaves a gap on the other track. Bar length is tokens spent on that step.",
      }));
    },
  });

  function drawTracks(host, avail, ctx, readout) {
    bind(ctx);
    var report = ctx.report;
    var rows = rowsOf(report);
    var n = rows.length;
    var divs = divergenceMap(report);
    var root = rootInfo(report);
    var sel = resolved(report);

    var padL = 10, padR = 10;
    var colW = Math.max(38, Math.min(78, Math.floor((avail - padL - padR) / Math.max(n, 1))));
    var W = padL + padR + colW * n;
    var R = 7, barMax = 22;
    var yA = 46, yB = 104, H_ = 152;
    var axisY = 145;

    function colX(i) { return padL + colW * i + colW / 2; }

    var maxTokens = 0;
    ["a", "b"].forEach(function (side) {
      stepsOf(report, side).forEach(function (step) {
        var t = step && step.tokens;
        if (typeof t === "number" && isFinite(t) && t > maxTokens) maxTokens = t;
      });
    });

    var svgEl = S("svg", {
      class: "tj", width: W, height: H_, viewBox: "0 0 " + W + " " + H_,
      role: "img",
      "aria-label": "Step tracks for " + agentName(report, "a") + " and " + agentName(report, "b"),
    });

    // --- selected column wash (drawn first so marks sit on top)
    if (sel.row >= 0) {
      svgEl.appendChild(S("rect", {
        x: colX(sel.row) - colW / 2, y: 2, width: colW, height: H_ - 16,
        fill: C.ink, "fill-opacity": 0.055, rx: 4,
      }));
    }

    // --- divergence rules
    Object.keys(divs).forEach(function (key) {
      var i = Number(key);
      var mark = divs[key];
      svgEl.appendChild(tick(colX(i), 12, colX(i), H_ - 18, C.bad, mark.primary ? 1.2 : 1,
                             mark.primary ? "3 3" : "1 4"));
      if (mark.primary) {
        svgEl.appendChild(S("polygon", {
          points: pts([[colX(i) - 4.5, 4], [colX(i) + 4.5, 4], [colX(i), 11]]),
          fill: C.bad,
        }));
        if (colW >= 42) {
          svgEl.appendChild(label(colX(i) + 8, 10, "d" + (mark.div.rank || 1), C.bad, 8.5, "start"));
        }
      }
    });

    // --- track baselines
    svgEl.appendChild(tick(padL, yA, W - padR, yA, C.grid, 1));
    svgEl.appendChild(tick(padL, yB, W - padR, yB, C.grid, 1));

    // --- connectors
    rows.forEach(function (row, i) {
      var x = colX(i);
      var hasA = row.a_index !== null && row.a_index !== undefined;
      var hasB = row.b_index !== null && row.b_index !== undefined;
      if (hasA && hasB) {
        var drift = row.op !== "match";
        svgEl.appendChild(tick(x, yA + R + 2, x, yB - R - 2,
                               drift ? C.warn : C.grid, drift ? 1.2 : 1, drift ? "3 2" : null));
      } else if (hasA || hasB) {
        var from = hasA ? yA + R + 2 : yB - R - 2;
        var to = hasA ? yA + 16 : yB - 16;
        svgEl.appendChild(tick(x, from, x, to, sideColor(hasA ? "a" : "b"), 1, "2 2"));
        // A hollow dot on the baseline, smaller than any step glyph: this
        // agent has nothing at all here, which is not the same as a cheap step.
        var absentY = hasA ? yB : yA;
        svgEl.appendChild(S("circle", {
          cx: x, cy: absentY, r: 2.6, fill: C.surface, stroke: C.muted,
          "stroke-width": 1, "stroke-dasharray": "1.6 1.4",
        }));
      }
    });

    // --- steps
    rows.forEach(function (row, i) {
      var x = colX(i);
      ["a", "b"].forEach(function (side) {
        var index = row[side + "_index"];
        if (index === null || index === undefined) return;
        var step = stepAt(report, side, index);
        if (!step) return;
        var y = side === "a" ? yA : yB;
        var dir = side === "a" ? -1 : 1;

        // token bar, growing away from the middle
        if (maxTokens > 0 && typeof step.tokens === "number" && step.tokens > 0) {
          var hgt = Math.max(1.5, (step.tokens / maxTokens) * barMax);
          var bw = Math.max(3, Math.min(7, colW - 22));
          svgEl.appendChild(S("rect", {
            x: x - bw / 2, y: dir < 0 ? y - R - 3 - hgt : y + R + 3,
            width: bw, height: hgt, fill: sideColor(side), "fill-opacity": 0.42, rx: 1,
          }));
        }

        if (root && root.side === side && root.index === index) {
          svgEl.appendChild(S("circle", {
            cx: x, cy: y, r: R + 4.5, fill: "none", stroke: C.bad, "stroke-width": 1.2,
          }));
        }
        if (sel.row === i && (sel.side === side || sel.side === null)) {
          svgEl.appendChild(S("circle", {
            cx: x, cy: y, r: R + 2.5, fill: "none", stroke: C.ink,
            "stroke-width": 1, "stroke-opacity": 0.55,
          }));
        }

        svgEl.appendChild(styleGlyph(glyphNode(step.type, x, y, R),
                                     qualityStyle(step.quality, side)));
        if (colW >= 36) {
          svgEl.appendChild(label(x + R + 3.5, y + 3, String(index), C.muted, 8, "start"));
        }
      });
    });

    // --- row axis
    svgEl.appendChild(tick(padL, axisY - 9, W - padR, axisY - 9, C.grid, 1));
    rows.forEach(function (row, i) {
      svgEl.appendChild(label(colX(i), axisY, String(i), C.muted, 8.5));
    });
    svgEl.appendChild(label(padL, axisY - 13, "row", C.muted, 8, "start"));

    // --- hit targets, one per side per column
    var midY = (yA + yB) / 2;
    rows.forEach(function (row, i) {
      ["a", "b"].forEach(function (side) {
        var index = row[side + "_index"];
        var hit = S("rect", {
          class: "tj-hit",
          x: colX(i) - colW / 2, y: side === "a" ? 0 : midY,
          width: colW, height: side === "a" ? midY : H_ - midY - 12,
          fill: C.ink, "fill-opacity": 0, "pointer-events": "all",
        });
        hit.addEventListener("mouseenter", function () {
          hit.setAttribute("fill-opacity", 0.05);
          readout.innerHTML = "";
          readout.appendChild(readoutFor(report, row, i, side, index));
          if (ctx.signal) ctx.signal("hover");
        });
        hit.addEventListener("mouseleave", function () {
          hit.setAttribute("fill-opacity", 0);
          readout.innerHTML = "";
          readout.appendChild(H("i", { text: hint(report) }));
        });
        hit.addEventListener("click", function () { select(i, side, ctx); });
        svgEl.appendChild(hit);
      });
    });

    var wrap = H("div", { class: W > avail ? "scroll-x" : "" });
    wrap.appendChild(svgEl);
    host.appendChild(wrap);
    readout.innerHTML = "";
    readout.appendChild(H("i", { text: hint(report) }));
  }

  function hint(report) {
    var sel = resolved(report);
    if (sel.pinned) return "row " + sel.row + " selected — shown in Step detail";
    return "click a step to open it in Step detail" + (sel.why ? " (showing " + sel.why + ")" : "");
  }

  function readoutFor(report, row, i, side, index) {
    var frag = H("span");
    if (index === null || index === undefined) {
      frag.appendChild(H("i", {
        text: side.toUpperCase() + " · row " + i + " · no step here — " +
              agentName(report, side) + " never did this (" + row.op + ")",
      }));
      return frag;
    }
    var step = stepAt(report, side, index) || {};
    var bits = [
      side.toUpperCase() + "·" + index,
      step.type || "?",
      step.name ? "“" + step.name + "”" : null,
      F.tokens(step.tokens),
      F.sec(step.latency_s),
      step.quality || "unannotated",
    ].filter(Boolean);
    frag.appendChild(H("span", { text: bits.join("  ·  ") }));
    return frag;
  }

  // ======================================================= alignment-ribbon

  AgentDiff.block({
    id: "alignment-ribbon",
    title: "Alignment ribbon",
    question: "Where did they match, drift, and go it alone?",
    group: "trajectory",
    size: "normal",
    relevance: function (ctx) {
      var rows = rowsOf(ctx.report);
      if (!rows.length) return 0;
      var off = rows.filter(function (r) { return r.op !== "match"; }).length;
      return Math.min(1, 0.5 + 0.6 * (off / rows.length));
    },
    render: function (el, ctx) {
      bind(ctx);
      ensureStyle();
      var report = ctx.report;
      if (!report) return ctx.empty(el, "No report loaded.");
      var rows = rowsOf(report);
      if (!rows.length) return ctx.empty(el, "This report carries no alignment rows.");
      syncTask(ctx);

      var counts = { match: 0, drift: 0, a_only: 0, b_only: 0 };
      rows.forEach(function (r) { if (counts[r.op] !== undefined) counts[r.op]++; else counts[r.op] = 1; });

      var host = sized(el, ctx, function (box, avail) { drawRibbon(box, avail, ctx); });
      subscribe(el, function () { host.innerHTML = ""; drawRibbon(host, measure(el), ctx); });

      el.appendChild(legend([
        { heading: "op" },
        { node: opSwatch("match"), text: "match " + counts.match },
        { node: opSwatch("drift"), text: "drift " + counts.drift },
        { node: opSwatch("a_only"), text: "A only " + (counts.a_only || 0) },
        { node: opSwatch("b_only"), text: "B only " + (counts.b_only || 0) },
      ]));
      var sem = semanticOf(report);
      el.appendChild(H("p", {
        class: "caveat",
        text: "Similarity is the aligner's lexical score for the paired steps. One-sided rows have " +
              "nothing to compare, so the line breaks rather than dropping to zero." +
              (sem && sem.first_semantic_break !== null && sem.first_semantic_break !== undefined
                ? " The dashed red rule is row " + sem.first_semantic_break +
                  ", where meaning first parted from wording."
                : ""),
      }));
    },
  });

  /* Op is encoded by two channels at once, because the side colours and the
   * drift colour are close cousins in this palette: full-height means both
   * agents were present (outlined when they drifted), half-height means one
   * side acted alone, and it sits on that side's half of the band. */
  function opMarks(op, x, y, w, h) {
    if (op === "drift") {
      return [S("rect", { x: x, y: y, width: w, height: h, rx: 1.5,
                          fill: C.warn, "fill-opacity": 0.26,
                          stroke: C.warn, "stroke-width": 1 })];
    }
    if (op === "a_only" || op === "b_only") {
      var side = op === "a_only" ? "a" : "b";
      return [S("rect", {
        x: x, y: op === "a_only" ? y : y + h / 2, width: w, height: h / 2, rx: 1.5,
        fill: sideColor(side), "fill-opacity": 0.75,
      })];
    }
    return [S("rect", { x: x, y: y, width: w, height: h, rx: 1.5,
                        fill: C.ink, "fill-opacity": 0.13 })];
  }

  function opSwatch(op) {
    return S("svg", { width: 14, height: 12, viewBox: "0 0 14 12", "aria-hidden": "true" },
             opMarks(op, 1, 1, 12, 10));
  }

  function drawRibbon(host, avail, ctx) {
    bind(ctx);
    var report = ctx.report;
    var rows = rowsOf(report);
    var n = rows.length;
    var sem = semanticOf(report);
    var brk = sem && typeof sem.first_semantic_break === "number" ? sem.first_semantic_break : null;
    var sel = resolved(report);

    var gut = 22, padR = 8;
    var colW = Math.max(20, Math.min(64, Math.floor((avail - gut - padR) / Math.max(n, 1))));
    var W = gut + padR + colW * n;
    var top = 14, plotH = 54;
    var bandY = top + plotH + 8, bandH = 18;
    var axisY = bandY + bandH + 13;
    var H_ = axisY + 5;

    function colX(i) { return gut + colW * i + colW / 2; }
    function y(v) { return top + plotH - Math.max(0, Math.min(1, v)) * plotH; }

    var svgEl = S("svg", {
      class: "tj", width: W, height: H_, viewBox: "0 0 " + W + " " + H_,
      role: "img", "aria-label": "Alignment similarity and operation per row",
    });

    // gridlines
    [0, 0.5, 1].forEach(function (v) {
      svgEl.appendChild(tick(gut, y(v), W - padR, y(v), C.grid, 1, v === 0.5 ? "2 3" : null));
      svgEl.appendChild(label(gut - 3, y(v) + 3, v === 0.5 ? ".5" : String(v), C.muted, 8, "end"));
    });

    if (sel.row >= 0) {
      svgEl.appendChild(S("rect", {
        x: colX(sel.row) - colW / 2, y: top - 6, width: colW, height: (axisY - 8) - (top - 6),
        fill: C.ink, "fill-opacity": 0.055, rx: 3,
      }));
    }

    // step chart, broken across one-sided rows
    var run = [];
    function flush() {
      if (run.length) {
        var d = "";
        run.forEach(function (p, k) {
          d += (k ? "L" : "M") + (p.x0).toFixed(1) + " " + p.y.toFixed(1) +
               "L" + (p.x1).toFixed(1) + " " + p.y.toFixed(1);
          if (k < run.length - 1) d += "L" + (p.x1).toFixed(1) + " " + run[k + 1].y.toFixed(1);
        });
        svgEl.appendChild(S("path", { d: d, fill: "none", stroke: C.ink, "stroke-width": 1.3,
                                      "stroke-opacity": 0.8, "stroke-linejoin": "round" }));
      }
      run = [];
    }
    rows.forEach(function (row, i) {
      var both = row.a_index !== null && row.a_index !== undefined &&
                 row.b_index !== null && row.b_index !== undefined;
      if (!both) { flush(); return; }
      var v = typeof row.similarity === "number" ? row.similarity : 0;
      run.push({ x0: colX(i) - colW * 0.4, x1: colX(i) + colW * 0.4, y: y(v) });
    });
    flush();

    rows.forEach(function (row, i) {
      var both = row.a_index !== null && row.a_index !== undefined &&
                 row.b_index !== null && row.b_index !== undefined;
      if (!both) return;
      var v = typeof row.similarity === "number" ? row.similarity : 0;
      svgEl.appendChild(S("circle", {
        cx: colX(i), cy: y(v), r: 2.4,
        fill: row.op === "match" ? C.ink : C.warn,
        stroke: C.surface, "stroke-width": 0.8,
      }));
      if (colW >= 40) {
        svgEl.appendChild(label(colX(i), y(v) - 6, F.num(v, 2).replace(/^0/, "."), C.muted, 8));
      }
    });

    // op band — A-only sits high, B-only low, echoing the tracks
    rows.forEach(function (row, i) {
      opMarks(row.op, colX(i) - colW * 0.42, bandY, colW * 0.84, bandH).forEach(function (node) {
        svgEl.appendChild(node);
      });
      svgEl.appendChild(label(colX(i), axisY, String(i), C.muted, 8.5));
    });
    svgEl.appendChild(label(gut - 3, bandY + bandH - 3, "op", C.muted, 8, "end"));

    if (brk !== null && brk >= 0 && brk < n) {
      svgEl.appendChild(tick(colX(brk), top - 8, colX(brk), axisY - 9, C.bad, 1.2, "3 3"));
      svgEl.appendChild(S("polygon", {
        points: pts([[colX(brk) - 4, top - 12], [colX(brk) + 4, top - 12], [colX(brk), top - 6]]),
        fill: C.bad,
      }));
    }

    rows.forEach(function (row, i) {
      var hit = S("rect", {
        class: "tj-hit", x: colX(i) - colW / 2, y: 0, width: colW, height: H_,
        fill: C.ink, "fill-opacity": 0, "pointer-events": "all",
      });
      hit.addEventListener("mouseenter", function () {
        hit.setAttribute("fill-opacity", 0.05);
        if (ctx.signal) ctx.signal("hover");
      });
      hit.addEventListener("mouseleave", function () { hit.setAttribute("fill-opacity", 0); });
      hit.addEventListener("click", function () {
        select(i, row.op === "a_only" ? "a" : row.op === "b_only" ? "b" : null, ctx);
      });
      var title = S("title", {
        text: "row " + i + " · " + row.op + " · similarity " + F.num(row.similarity, 2),
      });
      hit.appendChild(title);
      svgEl.appendChild(hit);
    });

    var wrap = H("div", { class: W > avail ? "scroll-x" : "" });
    wrap.appendChild(svgEl);
    host.appendChild(wrap);
  }

  // =========================================================== step-detail

  AgentDiff.block({
    id: "step-detail",
    title: "Step detail",
    question: "What exactly happened at this step?",
    group: "trajectory",
    size: "normal",
    relevance: function (ctx) {
      var report = ctx.report;
      if (!report || !rowsOf(report).length) return 0;
      // With a failure attributed, the text of the step that caused it is the
      // next thing worth reading after the tracks themselves.
      return rootInfo(report) ? 0.94 : 0.62;
    },
    render: function (el, ctx) {
      bind(ctx);
      ensureStyle();
      var report = ctx.report;
      if (!report) return ctx.empty(el, "No report loaded.");
      if (!rowsOf(report).length) return ctx.empty(el, "No alignment rows to open.");
      syncTask(ctx);

      var host = ctx.h("div");
      el.appendChild(host);
      function paint() {
        host.innerHTML = "";
        drawDetail(host, ctx);
      }
      paint();
      subscribe(el, paint);
    },
  });

  function drawDetail(host, ctx) {
    bind(ctx);
    var report = ctx.report;
    var rows = rowsOf(report);
    var sel = resolved(report);
    var row = rows[sel.row];
    if (!row) return ctx.empty(host, "That alignment row is gone.");
    var semRow = semanticByRow(report)[sel.row];
    var root = rootInfo(report);
    var divs = divergenceMap(report);

    var head = H("div", { class: "tj-head" }, [
      H("span", { class: "tag mono", text: "row " + sel.row }),
      H("span", { class: "tag " + (row.op === "match" ? "good" : row.op === "drift" ? "warn" : row.op === "a_only" ? "a" : "b"),
                  text: row.op }),
      row.a_index !== null && row.a_index !== undefined && row.b_index !== null && row.b_index !== undefined
        ? H("span", { class: "mono", style: { color: "var(--ink-3)" },
                      text: "lexical " + F.num(row.similarity, 2) +
                            (semRow ? " · semantic " + F.num(semRow.semantic, 2) : "") })
        : null,
      divs[sel.row] ? H("span", { class: "tag bad", text: "divergence " + (divs[sel.row].div.rank || 1) }) : null,
      H("span", { class: "sp" }),
      H("div", { class: "tj-nav" }, [
        navButton("‹", sel.row > 0, function () { select(sel.row - 1, null, ctx); }),
        navButton("›", sel.row < rows.length - 1, function () { select(sel.row + 1, null, ctx); }),
      ]),
    ]);
    host.appendChild(head);

    var cols = H("div", { class: "tj-cols" });
    ["a", "b"].forEach(function (side) {
      cols.appendChild(detailPane(report, side, row, root, ctx));
    });
    host.appendChild(cols);

    if (divs[sel.row] && divs[sel.row].div.summary) {
      host.appendChild(H("div", { class: "tj-note", text: divs[sel.row].div.summary }));
    }
    if (root && root.row === sel.row && root.explanation) {
      host.appendChild(H("p", {
        class: "caveat",
        text: "Attributed root cause (" + (root.category || "uncategorised") + "): " + root.explanation,
      }));
    }
    host.appendChild(H("p", {
      class: "caveat",
      text: sel.pinned
        ? "Showing the step you selected in Tracks or the ribbon."
        : "Nothing selected yet, so this is " + (sel.why || "the first row") +
          ". Click any step in Tracks to change it.",
    }));
  }

  function navButton(text, enabled, onclick) {
    var attrs = { text: text, onclick: function () { if (enabled) onclick(); } };
    var btn = H("button", attrs);
    if (!enabled) btn.setAttribute("disabled", "disabled");
    return btn;
  }

  function detailPane(report, side, row, root, ctx) {
    var index = row[side + "_index"];
    var step = stepAt(report, side, index);
    var pane = H("div", { class: "tj-pane" + (step ? "" : " absent") });
    pane.appendChild(H("h4", null, [
      H("i", { class: "tj-chip", style: { background: sideColor(side) } }),
      H("span", { text: side.toUpperCase() + " · " + agentName(report, side) }),
      step ? H("span", { class: "mono", style: { marginLeft: "auto", color: "var(--ink-3)" },
                         text: "step " + index }) : null,
    ]));

    if (!step) {
      pane.appendChild(H("div", {
        class: "empty",
        text: agentName(report, side) + " has no step in this row — the other agent did this alone.",
      }));
      return pane;
    }

    var isRoot = root && root.side === side && root.index === index;
    pane.appendChild(H("div", { class: "tj-head", style: { marginBottom: "4px" } }, [
      H("span", { class: "tag", text: step.type || "step" }),
      step.name ? H("span", { class: "mono", text: step.name }) : null,
      H("span", {
        class: "tag " + (step.quality === "good" ? "good" : step.quality === "bad" ? "bad" :
                         step.quality === "weak" ? "warn" : ""),
        text: step.quality || "unannotated",
      }),
      isRoot ? H("span", { class: "tag bad", text: "root cause" }) : null,
    ]));
