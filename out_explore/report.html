<style>
/* ------------------------------------------------------------------ tokens */
:root {
  --paper:   #fcfcfb;
  --ink:     #17171a;
  --ink-2:   #4b4b47;
  --muted:   #7c7b74;
  --faint-t: #a5a49c;
  --rule:    #d7d6cf;
  --faint:   #eae9e3;
  --hollow:  #bcbbb3;
  --accent:  #35607c;
  --alert:   #98452a;
  --good:    #3f6b46;
  --hi:      rgba(53, 96, 124, 0.10);

  --t2:      #d6d5cd;
  --t3:      #bbbab1;
  --t4:      #9e9d94;
  --t5:      #78776f;
  --t6:      #46453f;

}

  :root:not([data-theme="light"]) {
    --paper:   #131312;
    --ink:     #eceae3;
    --ink-2:   #b4b3aa;
    --muted:   #8a8981;
    --faint-t: #6a6962;
    --rule:    #33322e;
    --faint:   #22221f;
    --hollow:  #55544e;
    --accent:  #7fb0cf;
    --alert:   #d0805a;
    --good:    #6ba173;
    --hi:      rgba(127, 176, 207, 0.13);
    --t1:      #2a2926;
    --t2:      #383730;
    --t3:      #464540;
    --t4:      #605f58;
    --t5:      #87867c;
    --t6:      #c9c7bd;
  }
}
:root[data-theme="dark"] {
  --paper:   #131312;
  --ink:     #eceae3;
  --ink-2:   #b4b3aa;
  --muted:   #8a8981;
  --faint-t: #6a6962;
  --rule:    #33322e;
  --faint:   #22221f;
  --hollow:  #55544e;
  --accent:  #7fb0cf;
  --alert:   #d0805a;
  --good:    #6ba173;
  --hi:      rgba(127, 176, 207, 0.13);
  --t1:      #2a2926;
  --t2:      #383730;
  --t3:      #464540;
  --t4:      #605f58;

}

/* ------------------------------------------------------------------- reset */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 74rem; margin: 0 auto; padding: 2.25rem 1.5rem 4rem; }
@media (max-width: 640px) { main { padding: 1.25rem 0.9rem 3rem; } }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }

/* --------------------------------------------------------------- typography */
h1 { font-size: 0.9375rem; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.0625rem; font-weight: 500; margin: 0; letter-spacing: -0.015em; }
p  { margin: 0; }
.num  { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.mut  { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.xs   { font-size: 0.75rem; }
.xxs  { font-size: 0.6875rem; }
.sm   { font-size: 0.8125rem; }
.cap {
  font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.11em;
  color: var(--faint-t); font-weight: 600;
}
.rule   { height: 1px; background: var(--rule); }
.rule-f { height: 1px; background: var(--faint); }
.alert  { color: var(--alert); }

/* ------------------------------------------------------------------ header */
header .top { display: flex; align-items: baseline; gap: 0.5rem 1rem; flex-wrap: wrap; }
header .top .sp { margin-left: auto; }
button.pl { color: var(--muted); font-size: 0.75rem; }
button.pl:hover { color: var(--ink); }
button.pl[disabled] { opacity: 0.35; cursor: default; }

/* ------------------------------------------------------------------ picker */
.picker { margin-top: 0.9rem; }
.pk-row {
  display: grid; grid-template-columns: minmax(8rem, 11.5rem) 1fr;
  gap: 0.1rem 1.25rem; align-items: baseline;
  padding: 0.26rem 0; border-top: 1px solid var(--faint);
}
.pk-row:first-child { border-top: 0; }
.pk-task { font-family: var(--mono); font-size: 0.6875rem; color: var(--muted); letter-spacing: 0.01em; }
.pk-runs { display: flex; flex-wrap: wrap; gap: 0.15rem 1.35rem; }
button.pk {
  font-size: 0.8125rem; color: var(--ink-2); display: inline-flex;
  align-items: baseline; gap: 0.4rem; padding: 0.05rem 0; white-space: nowrap;
}
button.pk:hover { color: var(--ink); }
button.pk .mk { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint-t); }
button.pk .mk.bad { color: var(--alert); }
button.pk.on { color: var(--ink); font-weight: 500; box-shadow: inset 0 -1px 0 var(--accent); }
@media (max-width: 560px) {
  .pk-row { grid-template-columns: 1fr; padding: 0.3rem 0; line-height: 1.35; }
  .pk-task { font-size: 0.625rem; }
  button.pk { font-size: 0.75rem; }
}

/* ------------------------------------------------------------------ subject */
.subject { margin-top: 1.8rem; }
.prompt {
  font-size: clamp(1.0625rem, 2.4vw, 1.3125rem); line-height: 1.42; letter-spacing: -0.015em;
  max-width: 46rem; font-weight: 400; text-wrap: balance;
}
.ident { display: flex; flex-wrap: wrap; gap: 0.2rem 1.4rem; margin-top: 0.8rem; align-items: baseline; }
.ident .who { font-weight: 500; }
.ident span { font-size: 0.75rem; color: var(--muted); }
.verdict-mark {
  font-family: var(--mono); font-size: 0.6875rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-2);
  border-bottom: 1.5px solid var(--hollow); padding-bottom: 1px;
}
.verdict-mark.bad { color: var(--alert); border-bottom-color: var(--alert); }
.figures {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr));
  gap: 1.3rem 2rem; margin-top: 1.6rem;
}
.fig .v {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 1.375rem; line-height: 1.1; letter-spacing: -0.02em; display: block;
}
.fig .k { display: block; color: var(--muted); font-size: 0.6875rem; margin-top: 0.35rem; }
.fig .k b { font-weight: 500; color: var(--ink-2); }

/* ----------------------------------------------------------------- sections */
section { margin-top: 3rem; }
.sechead { display: flex; align-items: baseline; gap: 0.4rem 1.1rem; flex-wrap: wrap; }
.sechead .note { color: var(--muted); font-size: 0.75rem; max-width: 46rem; }
.sechead .sp { margin-left: auto; }
.sechead + .rule { margin-top: 0.4rem; }
.lede { color: var(--ink-2); font-size: 0.8125rem; max-width: 44rem; margin-top: 0.7rem; line-height: 1.6; }

/* -------------------------------------------------------------------- svg  */
.scroll { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding-bottom: 0.2rem; }
.scroll svg, figure svg { display: block; }
figure { margin: 0; }
figcaption { color: var(--muted); font-size: 0.6875rem; margin-top: 0.45rem; max-width: 40rem; line-height: 1.55; }
svg text { fill: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 10px; }
svg text.lbl { fill: var(--ink-2); font-family: var(--sans); font-size: 11px; }
svg text.ink { fill: var(--ink); }
svg text.acc { fill: var(--accent); }
svg text.al  { fill: var(--alert); }
.grid { stroke: var(--faint); stroke-width: 1; }
.axis { stroke: var(--rule); stroke-width: 1; }
.tone-plan      { fill: var(--t1); }
.tone-reason    { fill: var(--t2); }
.tone-search    { fill: var(--t3); }
.tone-retrieve  { fill: var(--t3); }
.tone-read      { fill: var(--t4); }
.tone-tool_call { fill: var(--t5); }
.tone-answer    { fill: var(--t6); }
.tone-other     { fill: var(--t2); }
.barout { fill: none; stroke: var(--hollow); stroke-width: 0.6; }
.hatchline { stroke: var(--paper); stroke-width: 1.1; opacity: 0.75; }
.tok  { fill: var(--ink); opacity: 0.38; }
.tok.inv { fill: var(--paper); opacity: 0.6; }
.uq   { stroke: var(--hollow); stroke-width: 1.6; }
.uq.bad { stroke: var(--alert); }
.ctick { stroke: var(--ink); stroke-width: 1; opacity: 0.7; }
.ctick.inv { stroke: var(--paper); opacity: 0.85; }
.halo { fill: none; }
.line { fill: none; stroke: var(--ink); stroke-width: 1.35; stroke-linejoin: round; }
.line.soft { stroke: var(--hollow); }
.area { fill: var(--ink); opacity: 0.045; }
.dot  { fill: var(--paper); stroke: var(--ink); stroke-width: 1.1; }
.dot.on { fill: var(--ink); }
.ref  { stroke: var(--hollow); stroke-width: 1; stroke-dasharray: 3 3; }
.hit  { fill: transparent; cursor: pointer; }
.lane { stroke: var(--faint); stroke-width: 1; }
.walk { fill: none; stroke: var(--hollow); stroke-width: 1; }
.imark { fill: var(--ink); }
.aline { stroke: var(--alert); stroke-width: 1; }
.acirc { fill: none; stroke: var(--accent); stroke-width: 1; }

/* highlight (cross-component) */
.wrow .halo { fill: none; }
.wrow.hl .halo { fill: var(--hi); }
.wrow.hl .barout { stroke: var(--accent); }
.wrow.hl text.lbl { fill: var(--ink); }
g.pt.hl .dot { fill: var(--accent); stroke: var(--accent); }
g.pt.hl .ring { stroke: var(--accent); }
g.im.hl .imark { fill: var(--accent); }

/* ------------------------------------------------------------------ legend */
.legend { display: flex; flex-wrap: wrap; gap: 0.3rem 1.15rem; margin-top: 0.6rem; align-items: center; }
.lg { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--muted); font-size: 0.6875rem; }
.lg svg { display: block; }

/* ------------------------------------------------------------------ ledger */
.ledger { margin-top: 0.3rem; }
.led { border-top: 1px solid var(--faint); }
.led:first-child { border-top: 0; }
.ledhd {
  display: grid; width: 100%; text-align: left;
  grid-template-columns: 1.9rem 5.2rem minmax(6rem, 1fr) 4.6rem 3.6rem 3.6rem 3.4rem 0.9rem;
  gap: 0 0.75rem; align-items: baseline; padding: 0.42rem 0.35rem 0.42rem 0.4rem;
  margin-left: -0.4rem; border-left: 2px solid transparent;
}
.led.hl > .ledhd { background: var(--hi); }
.led.open > .ledhd { border-left-color: var(--accent); }
.ledhd:hover { background: var(--faint); }
.led.hl > .ledhd:hover { background: var(--hi); }
.ledhd .ix { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint-t); }
.led.open .ledhd .ix, .led.hl .ledhd .ix { color: var(--ink); }
.ledhd .ty { font-size: 0.6875rem; color: var(--muted); letter-spacing: 0.02em; }
.ledhd .nm { font-size: 0.8125rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ledhd .n  { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.75rem; color: var(--ink-2); text-align: right; }
.ledhd .n.dim { color: var(--faint-t); }
.chip {
  font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); border: 1px solid var(--faint); padding: 0.05rem 0.28rem; white-space: nowrap;
}
.chip.bad  { color: var(--alert); border-color: var(--alert); }
.chip.weak { color: var(--ink-2); border-color: var(--hollow); }
.chip.good { color: var(--faint-t); border-color: var(--faint); }
.lednote { grid-column: 2 / -1; color: var(--muted); font-size: 0.75rem; line-height: 1.5; padding-top: 0.1rem; }
.ledhd .car { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint-t); text-align: right; }
.ledhd .car::after { content: "+"; }
.led.open .ledhd .car::after { content: "\2212"; }
.led.open .ledhd .car { color: var(--accent); }
.ledhd:hover .car { color: var(--ink-2); }
.led.rc > .ledhd .nm::after {
  content: "root cause"; font-family: var(--mono); font-size: 0.5625rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--alert); margin-left: 0.5rem;
}
.leddet { padding: 0.35rem 0 1rem 2.6rem; display: none; }
.led.open .leddet { display: block; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem 1.75rem; }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
.txt {
  font-family: var(--mono); font-size: 0.71rem; line-height: 1.6; color: var(--ink-2);
  white-space: pre-wrap; overflow-wrap: anywhere; margin: 0.25rem 0 0;
  border-left: 1px solid var(--faint); padding: 0 0 0 0.65rem;
  max-height: 20rem; overflow-y: auto;
}
.args { margin-top: 0.3rem; display: grid; grid-template-columns: auto 1fr; gap: 0.1rem 0.8rem; }
.args dt { font-family: var(--mono); font-size: 0.6875rem; color: var(--muted); }
.args dd { margin: 0; font-family: var(--mono); font-size: 0.6875rem; color: var(--ink); overflow-wrap: anywhere; }
.callname { font-family: var(--mono); font-size: 0.75rem; color: var(--ink); }
.stclaims { margin-top: 0.55rem; display: flex; flex-direction: column; gap: 0.15rem; }
.stclaims .c { font-size: 0.75rem; color: var(--ink-2); }
.stclaims .c .v { font-family: var(--mono); color: var(--ink); }
@media (max-width: 700px) {
  .ledhd {
    grid-template-columns: 1.7rem auto auto auto 1fr;
    gap: 0.1rem 0.7rem; padding-top: 0.5rem; padding-bottom: 0.5rem;
  }
  .ledhd .ix { grid-area: 1 / 1 / 2 / 2; }
  .ledhd .nm { grid-area: 1 / 2 / 2 / 5; }
  .ledhd .q  { grid-area: 1 / 5 / 2 / 6; text-align: right; }
  .ledhd .ty { grid-area: 2 / 2 / 3 / 3; }
  .ledhd .tk { grid-area: 2 / 3 / 3 / 4; }
  .ledhd .lt { grid-area: 2 / 4 / 3 / 5; }
  .ledhd .cf { grid-area: 2 / 5 / 3 / 6; }
  .ledhd .car { display: none; }
  .lednote { grid-column: 1 / -1; }
  .leddet { padding-left: 0.2rem; }
}

/* ------------------------------------------------------------------ claims */
.claims { margin-top: 0.3rem; }
.clhd, .clrow {
  display: grid; grid-template-columns: 4.6rem minmax(7rem, 1.35fr) 11rem minmax(6rem, 1fr) 5.6rem;
  gap: 0 1rem; align-items: baseline; padding: 0.4rem 0.35rem 0.4rem 0.4rem; margin-left: -0.4rem;
}
.clhd span { white-space: nowrap; }
.clhd { border-bottom: 1px solid var(--rule); padding-bottom: 0.35rem; }
.clrow { border-top: 1px solid var(--faint); }
.clrow.hl { background: var(--hi); }
.clrow .val { font-family: var(--mono); font-size: 0.8125rem; color: var(--ink); overflow-wrap: anywhere; }
.clrow .src, .clrow .carry { font-size: 0.75rem; color: var(--muted); }
.clrow .reach { font-family: var(--mono); font-size: 0.6875rem; text-align: right; color: var(--faint-t); }
.clrow .reach.yes { color: var(--ink); }
.clflag { grid-column: 2 / -1; font-size: 0.75rem; color: var(--alert); line-height: 1.5; padding-top: 0.15rem; }
.clflag q { color: var(--ink-2); }
.stepref {
  font-family: var(--mono); font-size: 0.6875rem; color: var(--ink-2);
  border-bottom: 1px solid var(--faint); padding-bottom: 1px;
}
.stepref:hover { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 820px) {
  .clhd { display: none; }
  .clrow { grid-template-columns: 4.6rem 1fr; gap: 0.1rem 0.9rem; }
  .clrow .src, .clrow .carry, .clrow .reach { grid-column: 2; text-align: left; }
  .clrow .src::before   { content: "first seen "; color: var(--faint-t); }
  .clrow .carry::before { content: "carried by "; color: var(--faint-t); font-family: var(--sans); }
  .clrow .reach::before { content: "in answer "; color: var(--faint-t); font-family: var(--sans); }
}
.meter { display: flex; align-items: center; gap: 0.45rem; margin-top: 0.7rem; }
.meter .sq { width: 9px; height: 9px; border: 1px solid var(--hollow); }
.meter .sq.on { background: var(--ink); border-color: var(--ink); }
.meter .lb { font-size: 0.75rem; color: var(--muted); }

/* -------------------------------------------------------------- two-column */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6rem 2.5rem; margin-top: 0.9rem; }
@media (max-width: 860px) { .duo { grid-template-columns: 1fr; gap: 1.6rem; } }

/* ----------------------------------------------------------------- outcome */
.answer {
  font-size: 0.9375rem; line-height: 1.62; color: var(--ink); max-width: 44rem;
  margin-top: 0.75rem;
}
.expected { margin-top: 1.1rem; max-width: 44rem; }
.expected .t { font-family: var(--mono); font-size: 0.8125rem; color: var(--ink-2); margin-top: 0.2rem; }
.cov { display: flex; flex-wrap: wrap; gap: 0.2rem 1.6rem; margin-top: 0.9rem; align-items: baseline; }
.attr { margin-top: 1.5rem; border-left: 2px solid var(--alert); padding-left: 0.85rem; max-width: 46rem; }
.attr p { font-size: 0.8125rem; line-height: 1.62; color: var(--ink-2); margin-top: 0.3rem; }
.chain { display: flex; flex-wrap: wrap; gap: 0.3rem 0.45rem; margin-top: 0.6rem; align-items: center; }

/* ---------------------------------------------------------------- tooltip */
#tip {
  position: fixed; z-index: 20; pointer-events: none; display: none;
  background: var(--paper); border: 1px solid var(--rule); padding: 0.4rem 0.55rem;
  font-size: 0.6875rem; line-height: 1.55; max-width: 17rem;
}
#tip .n { color: var(--ink); margin-bottom: 0.1rem; }
#tip .t { font-family: var(--mono); color: var(--muted); }
#tip .t b { color: var(--ink); font-weight: 500; }

footer { margin-top: 3.5rem; border-top: 1px solid var(--rule); padding-top: 0.7rem; color: var(--muted); font-size: 0.6875rem; line-height: 1.7; max-width: 46rem; }
.empty { margin-top: 2.5rem; max-width: 40rem; color: var(--ink-2); font-size: 0.8125rem; line-height: 1.65; }
.empty code { font-family: var(--mono); font-size: 0.75rem; color: var(--ink); }
.empty p + p { margin-top: 0.6rem; }

@media (prefers-reduced-motion: no-preference) {
  button.pk, .ledhd, .stepref { transition: color 90ms linear, background-color 90ms linear; }
}
</style>

    if (end < 0) return null;

    var trail = s.slice(end + 1).trim();
    var parts = splitTop(inner);
    if (!parts.length && !trail) return null;
    var args = parts.map(function (p) {
      var eq = -1, dq = null, d = 0, j, ch;
      for (j = 0; j < p.length; j++) {
        ch = p[j];
        if (dq) { if (ch === dq && p[j - 1] !== "\\") dq = null; continue; }
        if (ch === '"' || ch === "'") { dq = ch; continue; }
        if (ch === "(" || ch === "[") d++;
        else if (ch === ")" || ch === "]") d--;
        else if (ch === "=" && d === 0 && p[j + 1] !== "=") { eq = j; break; }
      }
      if (eq > 0 && /^[A-Za-z_][\w]*$/.test(p.slice(0, eq).trim())) {
        return [p.slice(0, eq).trim(), unquote(p.slice(eq + 1).trim())];
      }
      return [null, unquote(p.trim())];
    });
    return { name: m[1], args: args, trail: trail };
  }
  function splitTop(s) {
    var out = [], cur = "", d = 0, q = null, i, c;
    for (i = 0; i < s.length; i++) {
      c = s[i];
      if (q) { cur += c; if (c === q && s[i - 1] !== "\\") q = null; continue; }
      if (c === '"' || c === "'") { q = c; cur += c; continue; }
      if (c === "(" || c === "[" || c === "{") d++;
      if (c === ")" || c === "]" || c === "}") d--;
      if (c === "," && d === 0) { if (cur.trim()) out.push(cur); cur = ""; continue; }
      cur += c;
    }
    if (cur.trim()) out.push(cur);
    return out;
  }
  function unquote(s) {
    if (s.length > 1 && ((s[0] === '"' && s[s.length - 1] === '"') || (s[0] === "'" && s[s.length - 1] === "'"))) {
      return s.slice(1, -1);
    }
    return s;
  }

  /* -------------------------------------------------------------- svg bits */
  function niceStep(raw) {
    if (!(raw > 0)) return 1;
    var pow = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var n = raw / pow;
    var m = n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10;
    return m * pow;
  }
  function ticks(max, count) {
    var st = niceStep(max / (count || 5)), out = [], v = 0;
    while (v <= max + st * 0.001) { out.push(v); v += st; }
    return out;
  }
  function toneClass(t) { return TYPES.indexOf(t) >= 0 ? "tone-" + t : "tone-other"; }
  function hatched(t) { return t === "search" || t === "tool_call"; }
  function path(pts) {
    return pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
  }

  /* ------------------------------------------------------- cross-highlight */
  var hi = null;
  function setHi(v) {
    if (hi === v) return;
    hi = v;
    qsa("[data-step]").forEach(function (el) {
      var on = v != null && Number(el.getAttribute("data-step")) === v;
      el.classList.toggle("hl", on);
    });
  }
  document.addEventListener("mouseover", function (e) {
    var el = e.target.closest ? e.target.closest("[data-step]") : null;
    if (el) setHi(Number(el.getAttribute("data-step")));
  });
  document.addEventListener("mouseout", function (e) {
    var el = e.target.closest ? e.target.closest("[data-step]") : null;
    if (el && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-step]"))) {
      setHi(null); hideTip();
    }
  });

  function showTip(html, ev) {
    tip.innerHTML = html;
    tip.style.display = "block";
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = clamp(ev.clientX + 14, 6, window.innerWidth - w - 6);
    var y = clamp(ev.clientY - h - 12, 6, window.innerHeight - h - 6);
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }
  function hideTip() { tip.style.display = "none"; }

  /* ------------------------------------------------------------- selection */
  var cur = 0;

  function keyFromHash() {
    var h = decodeURIComponent(String(location.hash || "").replace(/^#/, ""));
    if (!h) return null;
    var m = /^run=(.*)$/.exec(h);
    return m ? m[1] : h;
  }
  function indexOfKey(k) {
    for (var i = 0; i < RUNS.length; i++) if (RUNS[i].key === k) return i;
    return -1;
  }
  var startIdx = indexOfKey(keyFromHash());
  if (startIdx >= 0) cur = startIdx;

  function select(i, push) {
    cur = (i + RUNS.length) % RUNS.length;
    if (push !== false) {
      var h = "#run=" + encodeURIComponent(RUNS[cur].key);
      if (location.hash !== h) history.replaceState(null, "", h);
    }
    renderPicker();
    renderBody();
  }

  window.addEventListener("hashchange", function () {
    var i = indexOfKey(keyFromHash());
    if (i >= 0 && i !== cur) select(i, false);
  });

  document.addEventListener("keydown", function (e) {
    var t = e.target || {};
    var tag = (t.tagName || "").toUpperCase();
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight") { e.preventDefault(); select(cur + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); select(cur - 1); }
  });

  /* ---------------------------------------------------------------- picker */
  function renderPicker() {
    var groups = [], seen = {};
    RUNS.forEach(function (r, i) {
      if (!(r.taskId in seen)) { seen[r.taskId] = groups.length; groups.push({ id: r.taskId, runs: [] }); }
      groups[seen[r.taskId]].runs.push({ run: r, i: i });
    });
    var html = '<div class="picker">';
    groups.forEach(function (g) {
      html += '<div class="pk-row"><span class="pk-task">' + esc(g.id) + "</span><span class=\"pk-runs\">";
      g.runs.forEach(function (e) {
        var ok = !!(e.run.outcome && e.run.outcome.success);
        html += '<button class="pk' + (e.i === cur ? " on" : "") + '" type="button" data-run="' + e.i + '"' +
          (e.i === cur ? ' aria-current="true"' : "") + ">" +
          "<span>" + esc(e.run.agent.name || e.run.side) + "</span>" +
          '<span class="mk' + (ok ? "" : " bad") + '">' + (ok ? "solved" : "failed") + "</span></button>";
      });
      html += "</span></div>";
    });
    html += "</div>";
    html += '<p class="xxs mut" style="margin-top:0.55rem">' + RUNS.length + " runs · " + groups.length +
      " tasks · <span class=\"num\">&larr;</span> / <span class=\"num\">&rarr;</span> steps between runs</p>";
    picker.innerHTML = html;
    qsa("button.pk", picker).forEach(function (b) {
      b.addEventListener("click", function () { select(Number(b.getAttribute("data-run"))); });
    });
  }

  /* ------------------------------------------------------------------ body */
  function renderBody() {
    var run = RUNS[cur];
    var o = run.outcome || {}, tt = run.totals || {};
    var tok = (Number(tt.input_tokens) || 0) + (Number(tt.output_tokens) || 0);
    if (!tok) tok = run.tokSum;
    var ok = !!o.success;
    // the other side of this report — the run every comparative reading refers to
    var sib = -1;
    for (var si = 0; si < RUNS.length; si++) {
      if (RUNS[si].rep === run.rep && RUNS[si].side !== run.side) { sib = si; break; }
    }
    var html = "";

    /* ---- 1. subject ---- */
    html += '<div class="subject">';
    html += '<p class="prompt">' + esc((run.task || {}).prompt || run.taskId) + "</p>";
    html += '<div class="ident">' +
      '<span class="who" style="font-size:0.875rem;color:var(--ink)">' + esc(run.agent.name || run.side) + "</span>" +
      "<span>" + esc(run.agent.model || "model unknown") +
      (run.agent.version ? " · " + esc(run.agent.version) : "") + "</span>" +
      "<span>" + esc(run.taskId) + "</span>" +
      '<span class="verdict-mark' + (ok ? "" : " bad") + '">' + (ok ? "solved" : "failed") + "</span>" +
      (typeof o.score === "number" ? '<span>score <span class="num">' + o.score.toFixed(2).replace(/^0\./, ".") + "</span></span>" : "") +
      (sib >= 0 ? '<span>compared against <button class="pl sibling" type="button" data-run="' + sib +
        '" style="color:var(--accent)">' + esc(RUNS[sib].agent.name || RUNS[sib].side) + "</button></span>" : "") +
      "</div>";

    html += '<div class="figures">' +
      fig(int(run.rows.length), "steps", run.rows.length ? typeMix(run) : "") +
      fig(int(tok), "tokens", (tt.input_tokens != null ? int(tt.input_tokens) + " in · " + int(tt.output_tokens) + " out" : "")) +
      fig(usd(tt.cost_usd), "cost", "") +
      fig(sec(tt.latency_s || run.span), "latency", run.topLat ? "longest step " + sec(run.topLat.lat) : "") +
      (run.hasConf ? fig(dec2(run.meanConf), "mean confidence", "low " + dec2(run.minConf)) :
        fig("—", "confidence", "no model telemetry")) +
      "</div></div>";

    /* ---- 2. waterfall ---- */
    var dom = run.topLat;
    html += "<section>" + sechead("Where the time went",
      dom ? "Bars sit on real elapsed time. Step " + dom.i + " — " + esc(dom.s.name || dom.s.type) +
        " — took " + sec(dom.lat) + ", " + pct(dom.lat / (run.span || 1)) + " of the run." :
        "Bars sit on real elapsed time.") +
      '<div class="scroll" id="wf"></div>' + wfLegend(run) + "</section>";

    /* ---- 3. ledger ---- */
    html += "<section>" + sechead("The step ledger",
      "Every step as recorded — open one for its full input and output, parsed call arguments, and the claims it introduced.",
      '<button class="pl" id="expall" type="button">expand all</button>') +
      '<div class="ledger" id="ledger">' + run.rows.map(function (r) { return ledgerRow(run, r); }).join("") +
      "</div></section>";

    /* ---- 4. evidence & claims ---- */
    html += "<section>" + sechead("Evidence this run carried",
      "Typed facts found in the step texts, traced from where they entered to whether they reached the answer.") +
      claimsBlock(run) + "</section>";

    /* ---- 5. confidence & process ---- */
    html += "<section>" + sechead("How sure it was, and what it was doing",
      run.hasConf ? "Mean per-token probability of the text each step generated, beside what each step did for the process."
        : "This run carries no model telemetry — the process ribbon stands alone.") +
      '<div class="duo"><div id="confbox"></div><div id="intentbox"></div></div>' +
      signalNote(run) + "</section>";

    /* ---- 6. cost accumulation ---- */
    html += "<section>" + sechead("What it cost to get there",
      "Cumulative spend over the run — where the tokens and the seconds actually accrued.") +
      '<div class="duo"><div id="cumtok"></div><div id="cumlat"></div></div></section>';

    /* ---- 7. outcome ---- */
    html += "<section>" + sechead("What it answered") + outcomeBlock(run) + "</section>";

    body.innerHTML = html;

    renderWaterfall();
    renderConfidence();
    renderIntents();
    renderCumulative();
    wireLedger();
    wireStepRefs();
    qsa("button.sibling", body).forEach(function (b) {
      b.addEventListener("click", function () { select(Number(b.getAttribute("data-run"))); });
    });

    foot.innerHTML = "Every figure on this page is read from this run's own trace — steps, tokens, latency and " +
      "per-token confidence as logged; claims, intents and grounding as derived by the engine. " +
      "Deterministic: same trace in, same numbers out.";
  }

  function fig(v, k, sub) {
    return '<div class="fig"><span class="v">' + esc(v) + '</span><span class="k">' + esc(k) +
      (sub ? " <b>·</b> " + esc(sub) : "") + "</span></div>";
  }
  function typeMix(run) {
    var c = {};
    run.rows.forEach(function (r) { c[r.s.type] = (c[r.s.type] || 0) + 1; });
    var keys = Object.keys(c).sort(function (a, b) { return c[b] - c[a]; }).slice(0, 3);
    return keys.map(function (k) { return c[k] + " " + k; }).join(", ");
  }
  function sechead(title, note, right) {
    return '<div class="sechead"><h2>' + esc(title) + "</h2>" +
      (note ? '<p class="note">' + note + "</p>" : "") +
      (right ? '<span class="sp"></span>' + right : "") +
      '</div><div class="rule"></div>';
  }

  /* -------------------------------------------------------- 2. waterfall  */
  function renderWaterfall() {
    var host = document.getElementById("wf");
    if (!host) return;
    var run = RUNS[cur];
    var avail = host.clientWidth || 760;
    var W = Math.max(avail, 620);
    var narrow = W < 720;
    var GUT = narrow ? 116 : 178;
    var PADR = 54;
    var rowH = 26, barH = 12, top = 30, botPad = 6;
    var H = top + run.rows.length * rowH + botPad;
    var span = run.span || 1;
    var x0 = GUT, x1 = W - PADR;
    function X(t) { return x0 + (t / span) * (x1 - x0); }

    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img" ' +
      'aria-label="Waterfall of ' + run.rows.length + ' steps on elapsed time, longest ' + sec(run.maxLat) + '">';
    s += '<defs><pattern id="hx" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<line class="hatchline" x1="0" y1="0" x2="0" y2="5"></line></pattern></defs>';

    // axis + gridlines
    var tk = ticks(span, W < 760 ? 4 : 7);
    tk.forEach(function (v) {
      var x = X(v);
      s += '<line class="grid" x1="' + x.toFixed(1) + '" y1="' + (top - 8) + '" x2="' + x.toFixed(1) +
        '" y2="' + (H - botPad) + '"></line>';
      s += '<text x="' + x.toFixed(1) + '" y="' + (top - 13) + '" text-anchor="middle">' +
        (v === 0 ? "0s" : (span < 12 ? v.toFixed(1) : String(Math.round(v)))) + "</text>";
    });
    s += '<line class="axis" x1="' + x0 + '" y1="' + (top - 8) + '" x2="' + x1 + '" y2="' + (top - 8) + '"></line>';

    var lo = null, hiC = null;
    run.conf.forEach(function (c) {
      if (c == null) return;
      if (lo == null || c < lo) lo = c;
      if (hiC == null || c > hiC) hiC = c;
    });
    var cspan = (hiC != null && lo != null && hiC - lo > 1e-6) ? (hiC - lo) : null;

    run.rows.forEach(function (r, k) {
      var y = top + k * rowH;
      var by = y + (rowH - barH) / 2 - 1;
      var bx = X(r.t0), bw = Math.max(X(r.t1) - X(r.t0), 1.5);
      var st = r.s;
      s += '<g class="wrow" data-step="' + r.i + '">';
      s += '<rect class="halo" x="0" y="' + y + '" width="' + W + '" height="' + rowH + '"></rect>';
      // left gutter label — index and name always; the type column only when it fits
      if (!narrow) {
        s += '<text class="num" x="' + (GUT - 8) + '" y="' + (y + rowH / 2 + 3.5) + '" text-anchor="end">' +
          esc(st.type || "") + "</text>";
      }
      s += '<text class="lbl" x="4" y="' + (y + rowH / 2 + 3.5) + '">' +
        '<tspan class="num" style="fill:var(--faint-t)">' + pad2(r.i) + "</tspan>  " +
        esc(trunc(st.name || st.type || "", narrow ? 13 : 18)) + "</text>";
      // bar
      s += '<rect class="' + toneClass(st.type) + '" x="' + bx.toFixed(1) + '" y="' + by + '" width="' +
        bw.toFixed(1) + '" height="' + barH + '"></rect>';
      if (hatched(st.type)) {
        s += '<rect fill="url(#hx)" x="' + bx.toFixed(1) + '" y="' + by + '" width="' + bw.toFixed(1) +
          '" height="' + barH + '"></rect>';
      }
      s += '<rect class="barout" x="' + bx.toFixed(1) + '" y="' + by + '" width="' + bw.toFixed(1) +
        '" height="' + barH + '"></rect>';
      // token share: inner rule along the bar's foot
      var inv = (st.type === "answer" || st.type === "tool_call") ? " inv" : "";
      if (run.maxTok > 0) {
        var tw = Math.max((Number(st.tokens) || 0) / run.maxTok * bw, 0.8);
        s += '<rect class="tok' + inv + '" x="' + bx.toFixed(1) + '" y="' + (by + barH - 2.6) + '" width="' +
          tw.toFixed(1) + '" height="2.6"></rect>';
      }
      // quality under-rule
      if (st.quality === "weak" || st.quality === "bad") {
        s += '<line class="uq' + (st.quality === "bad" ? " bad" : "") + '" x1="' + bx.toFixed(1) +
          '" y1="' + (by + barH + 3) + '" x2="' + (bx + bw).toFixed(1) + '" y2="' + (by + barH + 3) + '"></line>';
      }
      // confidence tick
      var c = run.conf[k];
      if (c != null && cspan) {
        var cx = bx + clamp((c - lo) / cspan, 0.02, 0.98) * bw;
        s += '<line class="ctick' + inv + '" x1="' + cx.toFixed(1) + '" y1="' + (by - 3) + '" x2="' + cx.toFixed(1) +
          '" y2="' + (by + barH + 3) + '"></line>';
      }
      // trailing latency label
      s += '<text x="' + (bx + bw + 6).toFixed(1) + '" y="' + (y + rowH / 2 + 3.5) + '">' + sec(r.lat) + "</text>";
      s += '<rect class="hit" x="0" y="' + y + '" width="' + W + '" height="' + rowH + '" data-tipstep="' + r.i + '"></rect>';
      s += "</g>";
    });
    s += "</svg>";
    host.innerHTML = s;

    qsa("[data-tipstep]", host).forEach(function (el) {
      var idx = Number(el.getAttribute("data-tipstep"));
      el.addEventListener("mousemove", function (ev) {
        var r = run.byIndex[idx];
        if (!r) return;
        var c = run.conf[r.pos];
        showTip('<div class="n">' + esc(r.s.name || r.s.type) + "</div>" +
          '<div class="t">' + esc(r.s.type) + " · <b>" + sec(r.lat) + "</b> at " + sec(r.t0) + "<br>" +
          "<b>" + int(r.s.tokens) + "</b> tokens" +
          (c != null ? " · confidence <b>" + dec2(c) + "</b>" : "") +
          (r.s.quality ? "<br>quality <b>" + esc(r.s.quality) + "</b>" : "") + "</div>", ev);
      });
      el.addEventListener("click", function () { openStep(idx, true); });
    });
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function trunc(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }

  function wfLegend(run) {
    var seen = {};
    run.rows.forEach(function (r) { seen[r.s.type] = 1; });
    var order = TYPES.filter(function (t) { return seen[t]; })
      .concat(Object.keys(seen).filter(function (t) { return TYPES.indexOf(t) < 0; }));
    var h = '<div class="legend">';
    order.forEach(function (t) {
      h += '<span class="lg"><svg width="16" height="9" aria-hidden="true">' +
        '<defs><pattern id="lh' + t + '" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
        '<line class="hatchline" x1="0" y1="0" x2="0" y2="5"></line></pattern></defs>' +
        '<rect class="' + toneClass(t) + '" x="0" y="0" width="16" height="9"></rect>' +
        (hatched(t) ? '<rect fill="url(#lh' + t + ')" x="0" y="0" width="16" height="9"></rect>' : "") +
        '<rect class="barout" x="0" y="0" width="16" height="9"></rect></svg>' + esc(t) + "</span>";
    });
    h += '<span class="lg"><svg width="16" height="9" aria-hidden="true"><rect class="tone-read" x="0" y="0" width="16" height="9"></rect>' +
      '<rect class="tok" x="0" y="6.4" width="11" height="2.6"></rect></svg>token share of the run’s biggest step</span>';
    if (run.hasConf) {
      h += '<span class="lg"><svg width="16" height="13" aria-hidden="true"><rect class="tone-read" x="0" y="2" width="16" height="9"></rect>' +
        '<line class="ctick" x1="11" y1="0" x2="11" y2="13"></line></svg>confidence, low (left) to high (right) within the bar</span>';
    }
    var anyQ = run.rows.some(function (r) { return r.s.quality === "weak" || r.s.quality === "bad"; });
    if (anyQ) {
      h += '<span class="lg"><svg width="16" height="9" aria-hidden="true"><line class="uq bad" x1="0" y1="7" x2="16" y2="7"></line>' +
        '<line class="uq" x1="0" y1="2" x2="16" y2="2"></line></svg>under-rule: weak (grey) / bad (rust)</span>';
    }
    h += "</div>";
    return h;
  }

  /* ----------------------------------------------------------- 3. ledger  */
  function ledgerRow(run, r) {
    var st = r.s;
    var c = run.conf[r.pos];
    var q = st.quality;
    var isRC = run.attr && run.attr.root_cause_step === r.i;
    var intent = run.intentOf[r.i];
    var h = '<div class="led' + (isRC ? " rc" : "") + '" data-step="' + r.i + '" id="step-' + r.i + '">';
    h += '<div class="ledhd" role="button" tabindex="0" aria-expanded="false" data-toggle="' + r.i + '">' +
      '<span class="ix">' + pad2(r.i) + "</span>" +
      '<span class="ty">' + esc(st.type || "") + "</span>" +
      '<span class="nm">' + esc(st.name || st.type || "") +
      (intent ? ' <span class="mut xxs">' + esc(intent) + "</span>" : "") + "</span>" +
      '<span class="n tk">' + int(st.tokens) + " tok</span>" +
      '<span class="n lt">' + sec(st.latency_s) + "</span>" +
      '<span class="n cf' + (c == null ? " dim" : "") + '">' + (c == null ? "—" : dec2(c)) + "</span>" +
      '<span class="q">' + (q ? '<span class="chip ' + esc(q) + '">' + esc(q) + "</span>" : "") + "</span>" +
      '<span class="car" aria-hidden="true"></span>' +
      (st.note ? '<span class="lednote">' + esc(st.note) + "</span>" : "") +
      "</div>";

    var call = parseCall(st.input);
    var introduced = run.claims.filter(function (cl) { return cl.first === r.i; });
    var carried = run.claims.filter(function (cl) { return cl.first !== r.i && cl.steps.indexOf(r.i) >= 0; });

    h += '<div class="leddet">';
    if (call) {
      h += '<p class="cap">call</p><p class="callname">' + esc(call.name) + "()</p>";
      if (call.args.length) {
        h += '<dl class="args">';
        call.args.forEach(function (a) {
          h += "<dt>" + esc(a[0] == null ? "·" : a[0]) + "</dt><dd>" + esc(a[1]) + "</dd>";
        });
        h += "</dl>";
      }
      if (call.trail) h += '<p class="xxs mut" style="margin-top:0.3rem">' + esc(call.trail) + "</p>";
      h += '<div class="rule-f" style="margin:0.8rem 0"></div>';
    }
    h += '<div class="cols">' +
      '<div><p class="cap">input</p><pre class="txt">' + esc(st.input || "—") + "</pre></div>" +
      '<div><p class="cap">output</p><pre class="txt">' + esc(st.output || "—") + "</pre></div>" +
      "</div>";
    if (introduced.length || carried.length) {
      h += '<div class="stclaims"><p class="cap">claims</p>';
      introduced.forEach(function (cl) {
        h += '<p class="c"><span class="v">' + esc(cl.c.value) + '</span> <span class="mut">' + esc(cl.c.kind) +
          " · introduced here" + (cl.src ? " from " + esc(cl.src) : "") + "</span></p>";
      });
      carried.forEach(function (cl) {
        h += '<p class="c"><span class="v">' + esc(cl.c.value) + '</span> <span class="mut">' + esc(cl.c.kind) +
          " · carried forward from step " + cl.first + "</span></p>";
      });
      h += "</div>";
    }
    if (st.model) {
      var m = st.model;
      h += '<p class="xxs mut" style="margin-top:0.7rem">telemetry · ' +
        (m.confidence != null ? "mean token confidence <span class=\"num\">" + dec2(m.confidence) + "</span>" : "") +
        (m.min_token_confidence != null ? " · weakest token <span class=\"num\">" + dec2(m.min_token_confidence) + "</span>" : "") +
        (m.entropy != null ? " · entropy <span class=\"num\">" + Number(m.entropy).toFixed(2) + "</span> nats" : "") +
        (m.temperature != null ? " · temperature <span class=\"num\">" + Number(m.temperature).toFixed(1) + "</span>" : "") +
        (m.source ? " · " + esc(m.source) : "") + "</p>";
    }
    h += "</div></div>";
    return h;
  }

  function wireLedger() {
    var ledger = document.getElementById("ledger");
    if (!ledger) return;
    qsa("[data-toggle]", ledger).forEach(function (hd) {
      function toggle() {
        var led = hd.parentNode;
        var open = led.classList.toggle("open");
        hd.setAttribute("aria-expanded", open ? "true" : "false");
        syncExpandAll();
      }
      hd.addEventListener("click", toggle);
      hd.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); toggle(); }
      });
    });
    var btn = document.getElementById("expall");
    if (btn) {
      btn.addEventListener("click", function () {
        var expand = btn.getAttribute("data-state") !== "open";
        qsa(".led", ledger).forEach(function (led) {
          led.classList.toggle("open", expand);
          var hd = led.querySelector(".ledhd");
          if (hd) hd.setAttribute("aria-expanded", expand ? "true" : "false");
        });
        syncExpandAll();
      });
    }
    syncExpandAll();
  }
  function syncExpandAll() {
    var btn = document.getElementById("expall");
    var ledger = document.getElementById("ledger");
    if (!btn || !ledger) return;
    var all = qsa(".led", ledger);
    var open = all.filter(function (l) { return l.classList.contains("open"); }).length;
    var allOpen = open === all.length && all.length > 0;
    btn.setAttribute("data-state", allOpen ? "open" : "closed");
    btn.textContent = allOpen ? "collapse all" : "expand all";
  }
  function openStep(idx, scroll) {
    var led = document.getElementById("step-" + idx);
    if (!led) return;
    led.classList.add("open");
    var hd = led.querySelector(".ledhd");
    if (hd) hd.setAttribute("aria-expanded", "true");
    syncExpandAll();
    if (scroll) {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      led.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
      if (hd) hd.focus({ preventScroll: true });
    }
    setHi(idx);
  }
  function wireStepRefs() {
    qsa("[data-goto]").forEach(function (el) {
      el.addEventListener("click", function () { openStep(Number(el.getAttribute("data-goto")), true); });
    });
  }
  function stepRef(i, label) {
    return '<button class="stepref" type="button" data-goto="' + i + '" data-step="' + i + '">' +
      esc(label == null ? "step " + i : label) + "</button>";
  }

  /* ----------------------------------------------------------- 4. claims  */
  function claimsBlock(run) {
    if (!run.claims.length) {
      return '<p class="lede">The engine extracted no typed claims from this run’s steps — ' +
        "nothing here carried a figure, date, version or source it could trace.</p>";
    }
    var order = run.claims.slice().sort(function (x, y) {
      if (x.inAnswer !== y.inAnswer) return x.inAnswer ? -1 : 1;
      return x.first - y.first;
    });
    var h = '<div class="claims"><div class="clhd cap"><span>kind</span><span>value</span>' +
      "<span>first seen</span><span>carried by</span><span>in answer</span></div>";
    order.forEach(function (cl) {
      var indep = run.independence.filter(function (e) { return e.claim === cl.c.id; });
      h += '<div class="clrow" data-step="' + cl.first + '">' +
        '<span class="xxs mut">' + esc(cl.c.kind) + "</span>" +
        '<span class="val">' + esc(cl.c.value) +
        (cl.c.matches_expected === true ? ' <span class="xxs" style="color:var(--good)">matches expected</span>' : "") +
        (cl.c.matches_expected === false ? ' <span class="xxs alert">differs from expected</span>' : "") +
        "</span>" +
        '<span class="src">' + stepRef(cl.first, "step " + cl.first) +
        (cl.src ? ' <span class="mut">' + esc(cl.src) + "</span>" : "") + "</span>" +
        '<span class="carry">' + (cl.steps.length > 1
          ? cl.steps.slice(1).map(function (i) { return stepRef(i, String(i)); }).join(" ")
          : '<span class="mut">—</span>') + "</span>" +
        '<span class="reach' + (cl.inAnswer ? " yes" : "") + '">' + (cl.inAnswer ? "yes" : "no") + "</span>";
      if (cl.conflict) {
        h += '<span class="clflag">conflicts with the other run: ' + esc(cl.conflict.summary) + "</span>";
      }
      indep.forEach(function (e) {
        if (!e.circular) return;
        h += '<span class="clflag">circular corroboration across ' + esc((e.sources || []).join(" and ")) +
          " — " + esc(e.evidence || "the second source traces back to the first") + "</span>";
      });
      h += "</div>";
    });
    h += "</div>";

    run.contradictions.forEach(function (c) {
      h += '<p class="lede alert" style="margin-top:1rem">Internal contradiction — ' + esc(c.summary || "") +
        " (steps " + (c.steps || []).join(", ") + ")</p>";
    });

    var g = run.grounding;
    if (g && g.claims_total) {
      var sq = "";
      for (var i = 0; i < g.claims_total; i++) {
        sq += '<span class="sq' + (i < g.claims_grounded ? " on" : "") + '"></span>';
      }
      h += '<div class="meter">' + sq + '<span class="lb">' + g.claims_grounded + " of " + g.claims_total +
        " answer claims trace back to a step output — grounding " + dec2(g.score) + "</span></div>";
      if (g.ungrounded && g.ungrounded.length) {
        h += '<p class="lede alert" style="margin-top:0.5rem">Ungrounded in the answer: ' +
          g.ungrounded.map(function (u) { return esc(u.value || u.claim); }).join(", ") +
          " — no step output supports these.</p>";
      }
    } else if (g) {
      h += '<p class="lede">The answer carried no traceable claims, so grounding is undefined for this run.</p>';
    }
    return h;
  }

  /* ------------------------------------------------- 5. confidence/process */
  function renderConfidence() {
    var host = document.getElementById("confbox");
    if (!host) return;
    var run = RUNS[cur];
    if (!run.hasConf) {
      host.innerHTML = '<p class="cap">model confidence</p>' +
        '<p class="lede">No per-token telemetry was logged for this run. Confidence, entropy and the ' +
        "flagged/silent reading are unavailable — the trace records what the agent did, not how sure it was.</p>";
      return;
    }
    var W = Math.max(host.clientWidth || 420, 280);
    var H = 168, L = 34, R = 66, T = 16, B = 26;
    var n = run.rows.length;
    var vals = run.conf.filter(function (v) { return v != null; });
    var lo = Math.min.apply(null, vals), hiV = Math.max.apply(null, vals);
    var padv = Math.max((hiV - lo) * 0.35, 0.01);
    var y0 = Math.max(0, lo - padv), y1 = Math.min(1, hiV + padv);
    function X(i) { return L + (n <= 1 ? 0 : (i / (n - 1)) * (W - L - R)); }
    function Y(v) { return T + (1 - (v - y0) / (y1 - y0)) * (H - T - B); }

    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
      'Model confidence per step, mean ' + dec2(run.meanConf) + '">';
    [y0, (y0 + y1) / 2, y1].forEach(function (v) {
      s += '<line class="grid" x1="' + L + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W - R) + '" y2="' + Y(v).toFixed(1) + '"></line>';
    });
    s += '<text x="' + (L - 6) + '" y="' + (Y(y1) + 3) + '" text-anchor="end">' + dec2(y1) + "</text>";
    s += '<text x="' + (L - 6) + '" y="' + (Y(y0) + 3) + '" text-anchor="end">' + dec2(y0) + "</text>";

    // mean reference
    if (run.meanConf != null) {
      var my = Y(run.meanConf);
      s += '<line class="ref" x1="' + L + '" y1="' + my.toFixed(1) + '" x2="' + (W - R + 4) + '" y2="' + my.toFixed(1) + '"></line>';
      s += '<text x="' + (W - R + 7) + '" y="' + (my + 3).toFixed(1) + '">mean ' + dec2(run.meanConf) + "</text>";
    }
    // line segments (breaks across null steps)
    var segs = [], curSeg = [];
    run.conf.forEach(function (v, i) {
      if (v == null) { if (curSeg.length) segs.push(curSeg); curSeg = []; return; }
      curSeg.push([X(i), Y(v)]);
    });
    if (curSeg.length) segs.push(curSeg);
    segs.forEach(function (sg) {
      if (sg.length > 1) s += '<path class="line" d="' + path(sg) + '"></path>';
    });
    // root-cause marker
    if (run.attr && run.byIndex[run.attr.root_cause_step]) {
      var rp = run.byIndex[run.attr.root_cause_step].pos;
      if (run.conf[rp] != null) {
        s += '<line class="aline" x1="' + X(rp).toFixed(1) + '" y1="' + T + '" x2="' + X(rp).toFixed(1) +
          '" y2="' + (H - B) + '"></line>';
        s += '<text class="al" x="' + (X(rp) + 4).toFixed(1) + '" y="' + (T + 8) + '">root cause</text>';
      }
    }
    run.rows.forEach(function (r, i) {
      var v = run.conf[i];
      s += '<g class="pt" data-step="' + r.i + '">';
      if (v != null) {
        s += '<circle class="dot" cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="2.6"></circle>';
      }
      s += '<rect class="hit" x="' + (X(i) - (W - L - R) / (2 * Math.max(n - 1, 1))).toFixed(1) + '" y="' + T +
        '" width="' + ((W - L - R) / Math.max(n - 1, 1)).toFixed(1) + '" height="' + (H - T - B) + '"></rect></g>';
    });
    // x axis
    s += '<line class="axis" x1="' + L + '" y1="' + (H - B + 6) + '" x2="' + (W - R) + '" y2="' + (H - B + 6) + '"></line>';
    run.rows.forEach(function (r, i) {
      if (n > 12 && i % 2) return;
      s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - B + 18) + '" text-anchor="middle">' + r.i + "</text>";
    });
    s += "</svg>";

    host.innerHTML = '<p class="cap">model confidence per step</p>' + s +
      '<p class="xxs mut" style="margin-top:0.4rem">Mean per-token probability of the text each step generated' +
      (run.unc && run.unc.mean_entropy != null ? "; mean entropy " + Number(run.unc.mean_entropy).toFixed(2) + " nats" : "") +
      (run.minConf != null ? "; weakest step " + dec2(run.minConf) : "") + ".</p>";
  }

  function renderIntents() {
    var host = document.getElementById("intentbox");
    if (!host) return;
    var run = RUNS[cur];
    var seq = run.rows.map(function (r) { return run.intentOf[r.i] || null; });
    var any = seq.some(function (v) { return v; });
    if (!any) {
      host.innerHTML = '<p class="cap">process</p><p class="lede">No intent classification is available for this run.</p>';
      return;
    }
    var W = Math.max(host.clientWidth || 420, 280);
    var L = 74, R = 44, T = 14, laneH = 21, B = 24;
    var H = T + INTENTS.length * laneH + B;
    var n = run.rows.length;
    function X(i) { return L + (n <= 1 ? 0 : (i / (n - 1)) * (W - L - R)); }
    function laneY(name) { return T + INTENTS.indexOf(name) * laneH + laneH / 2; }

    var used = {};
    seq.forEach(function (v) { if (v) used[v] = (used[v] || 0) + 1; });

    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H +
      '" role="img" aria-label="Intent of each step across frame, acquire, verify, transform, decide and commit">';
    INTENTS.forEach(function (name) {
      var y = laneY(name);
      s += '<line class="lane" x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '"></line>';
      var on = !!used[name];
      s += '<text class="' + (on ? "ink" : "") + '" x="' + (L - 8) + '" y="' + (y + 3.5) + '" text-anchor="end" ' +
        'style="font-family:var(--sans);' + (on ? "" : "fill:var(--faint-t)") + '">' + name + "</text>";
      if (!on) {
        s += '<text class="' + (run.intentMissing.indexOf(name) >= 0 ? "al" : "") + '" x="' + (W - R + 7) +
          '" y="' + (y + 3.5) + '">never</text>';
      } else {
        s += '<text x="' + (W - R + 7) + '" y="' + (y + 3.5) + '">' + used[name] + "×</text>";
      }
    });
    // the walk
    var pts = [];
    seq.forEach(function (v, i) { if (v && INTENTS.indexOf(v) >= 0) pts.push([X(i), laneY(v)]); });
    if (pts.length > 1) s += '<path class="walk" d="' + path(pts) + '"></path>';
    run.rows.forEach(function (r, i) {
      var v = seq[i];
      if (!v || INTENTS.indexOf(v) < 0) return;
      s += '<g class="im" data-step="' + r.i + '">' +
        '<rect class="imark" x="' + (X(i) - 3).toFixed(1) + '" y="' + (laneY(v) - 3) + '" width="6" height="6"></rect>' +
        '<rect class="hit" x="' + (X(i) - 7).toFixed(1) + '" y="' + T + '" width="14" height="' + (H - T - B) + '"></rect></g>';
    });
    s += '<line class="axis" x1="' + L + '" y1="' + (H - B + 4) + '" x2="' + (W - R) + '" y2="' + (H - B + 4) + '"></line>';
    run.rows.forEach(function (r, i) {
      if (n > 12 && i % 2) return;
      s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - B + 16) + '" text-anchor="middle">' + r.i + "</text>";
    });
    s += "</svg>";

    var missing = run.intentMissing.filter(function (m) { return !used[m]; });
    var note;
    if (missing.length) {
      note = "This run never " + missing.map(function (m) {
        return m === "verify" ? "verified" : m === "frame" ? "framed a plan" :
          m === "decide" ? "made an explicit selection" : m === "transform" ? "computed anything" :
          m === "acquire" ? "acquired evidence" : "committed an answer";
      }).join(", nor ") + " — the other run on this task did.";
    } else {
      note = "No intent the other run used is missing from this one.";
    }
    note += " verify = " + INTENT_GLOSS.verify + (used.verify ? ", counted " + used.verify + "×" : ", never done") + ".";
    host.innerHTML = '<p class="cap">what each step did for the process</p>' + s +
      '<p class="xxs mut" style="margin-top:0.4rem">' + esc(note) + "</p>";
  }

  function signalNote(run) {
    if (!run.signal) {
      if (run.attr && run.hasConf) {
        return '<p class="lede">This run failed, but the engine attributed no confidence reading to the failing step.</p>';
      }
      return "";
    }
    var sg = run.signal;
    var flagged = sg.verdict === "flagged";
    var h = '<div class="attr" style="border-left-color:' + (flagged ? "var(--hollow)" : "var(--alert)") + '">';
    h += '<p><span class="verdict-mark' + (flagged ? "" : " bad") + '">' + esc(sg.verdict) + "</span></p>";
    h += "<p>At " + stepRef(sg.root_cause_step, "step " + sg.root_cause_step) + " — the step that caused the failure — " +
      "the model was <span class=\"num\">" + dec2(sg.confidence_at_root) + "</span> confident against its own baseline of " +
      "<span class=\"num\">" + dec2(sg.baseline_confidence) + "</span>" +
      (typeof sg.drop === "number"
        ? ", a " + (sg.drop > 0 ? "fall of " : "rise of ") + "<span class=\"num\">" + Math.abs(sg.drop).toFixed(3).replace(/^0\./, ".") + "</span>"
        : "") + ". " + esc(sentence(sg.mitigation)) + "</p>";
    if (run.calib && run.calib.confident_when_wrong) {
      h += '<p class="mut">Calibration: confident when wrong — <span class="num">' +
        dec2(run.calib.confidence_at_wrong_step) + "</span> at the wrong step.</p>";
    }
    h += "</div>";
    return h;
  }

  /* -------------------------------------------------------- 6. cumulative */
  function renderCumulative() {
    var run = RUNS[cur];
    smallLine(document.getElementById("cumtok"), run, run.cumTok, {
      cap: "cumulative tokens",
      fmt: function (v) { return int(v) + " tok"; },
      annotate: run.topTok ? { pos: run.topTok.pos, label: "step " + run.topTok.i + " · " + int(run.topTok.s.tokens) + " tokens" } : null,
      foot: "Total " + int(run.cumTok.length ? run.cumTok[run.cumTok.length - 1] : 0) +
        " tokens" + (run.topTok ? "; the single heaviest step is " + (run.topTok.s.name || run.topTok.s.type) +
        " at " + pct(run.topTok.s.tokens / (run.tokSum || 1)) + " of the run." : ".")
    });
    smallLine(document.getElementById("cumlat"), run, run.cumLat, {
      cap: "cumulative latency",
      fmt: function (v) { return sec(v); },
      annotate: run.topLat ? { pos: run.topLat.pos, label: "step " + run.topLat.i + " · " + sec(run.topLat.lat) } : null,
      soft: true,
      foot: "Elapsed " + sec(run.span) + (run.topLat ? "; the longest step is " + (run.topLat.s.name || run.topLat.s.type) +
        " at " + pct(run.topLat.lat / (run.span || 1)) + " of the wall clock." : ".")
    });
  }

  function smallLine(host, run, series, opt) {
    if (!host) return;
    var W = Math.max(host.clientWidth || 420, 280);
    var H = 156, L = 8, R = 78, T = 30, B = 24;
    var n = series.length;
    if (!n) { host.innerHTML = '<p class="cap">' + esc(opt.cap) + '</p><p class="lede">No steps.</p>'; return; }
    var maxv = Math.max.apply(null, series) || 1;
    function X(i) { return L + (n <= 1 ? 0 : (i / (n - 1)) * (W - L - R)); }
    function Y(v) { return T + (1 - v / maxv) * (H - T - B); }

    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
      esc(opt.cap) + ' over ' + n + ' steps, ending at ' + esc(opt.fmt(series[n - 1])) + '">';
    s += '<line class="grid" x1="' + L + '" y1="' + Y(maxv).toFixed(1) + '" x2="' + (W - R) + '" y2="' + Y(maxv).toFixed(1) + '"></line>';
    var pts = series.map(function (v, i) { return [X(i), Y(v)]; });
    s += '<path class="area" d="' + path(pts) + " L" + X(n - 1).toFixed(1) + " " + Y(0).toFixed(1) +
      " L" + X(0).toFixed(1) + " " + Y(0).toFixed(1) + ' Z"></path>';
    s += '<path class="line' + (opt.soft ? " soft" : "") + '" d="' + path(pts) + '"></path>';
    run.rows.forEach(function (r, i) {
      s += '<g class="pt" data-step="' + r.i + '">' +
        '<circle class="dot" cx="' + X(i).toFixed(1) + '" cy="' + Y(series[i]).toFixed(1) + '" r="2.1"></circle>' +
        '<rect class="hit" x="' + (X(i) - (W - L - R) / (2 * Math.max(n - 1, 1))).toFixed(1) + '" y="' + T +
        '" width="' + ((W - L - R) / Math.max(n - 1, 1)).toFixed(1) + '" height="' + (H - T - B) + '"></rect></g>';
    });
    if (opt.annotate) {
      var ax = X(opt.annotate.pos), ay = Y(series[opt.annotate.pos]);
      s += '<line class="ref" x1="' + ax.toFixed(1) + '" y1="15" x2="' + ax.toFixed(1) +
        '" y2="' + (ay - 5).toFixed(1) + '"></line>';
      s += '<circle class="acirc" cx="' + ax.toFixed(1) + '" cy="' + ay.toFixed(1) + '" r="4"></circle>';
      var lx = ax + 5, anchor = "start";
      if (lx > (W - R) * 0.62) { lx = ax - 5; anchor = "end"; }
      s += '<text class="acc" x="' + lx.toFixed(1) + '" y="11" text-anchor="' + anchor + '">' +
        esc(opt.annotate.label) + "</text>";
    }
    s += '<text class="ink" x="' + (X(n - 1) + 8).toFixed(1) + '" y="' + (Y(series[n - 1]) + 3.5).toFixed(1) + '">' +
      esc(opt.fmt(series[n - 1])) + "</text>";
    s += '<line class="axis" x1="' + L + '" y1="' + (H - B + 6) + '" x2="' + (W - R) + '" y2="' + (H - B + 6) + '"></line>';
    run.rows.forEach(function (r, i) {
      if (n > 12 && i % 2) return;
      s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - B + 18) + '" text-anchor="middle">' + r.i + "</text>";
    });
    s += "</svg>";
    host.innerHTML = '<p class="cap">' + esc(opt.cap) + "</p>" + s +
      '<p class="xxs mut" style="margin-top:0.4rem">' + esc(opt.foot) + "</p>";
  }

  /* ---------------------------------------------------------- 7. outcome  */
  function outcomeBlock(run) {
    var o = run.outcome || {};
    var h = '<p class="answer">' + esc(o.answer || "—") + "</p>";
    if (run.expected) {
      h += '<div class="expected"><p class="cap">expected</p><p class="t">' + esc(run.expected) + "</p></div>";
    }
    var ae = run.answerEval;
    if (ae) {
      h += '<div class="cov">' +
        '<span class="verdict-mark' + (ae.verdict === "mismatch" ? " bad" : "") + '">' + esc(ae.verdict || "unknown") + "</span>" +
        '<span class="xs mut">coverage of the expected answer <span class="num" style="color:var(--ink)">' +
        pct(ae.coverage, ae.coverage != null && ae.coverage * 100 % 1 ? 1 : 0) + "</span></span>" +
        "</div>";
    }
    if (run.attr) {
      var a = run.attr;
      h += '<div class="attr"><p class="cap alert">why this run failed · ' + esc(a.category || "") + "</p>" +
        "<p>" + esc(a.explanation || "") + "</p>";
      if (a.root_cause_step != null) {
        h += '<div class="chain"><span class="xxs mut">root cause</span>' + stepRef(a.root_cause_step) +
          (a.chain && a.chain.length > 1 ? '<span class="xxs mut" style="margin-left:0.5rem">carried through</span>' +
            a.chain.filter(function (i) { return i !== a.root_cause_step; })
              .map(function (i) { return stepRef(i, String(i)); }).join(" ") : "") + "</div>";
      }
      h += "</div>";
    } else if (!o.success) {
      h += '<p class="lede">This run did not succeed, and the engine attributed no single divergence as the cause.</p>';
    }
    return h;
  }

  /* ------------------------------------------------------------- resizing */
  var rt = null;
  window.addEventListener("resize", function () {
    if (rt) clearTimeout(rt);
    rt = setTimeout(function () {
      if (!RUNS.length) return;
      renderWaterfall(); renderConfidence(); renderIntents(); renderCumulative(); wireStepRefs();
    }, 130);
  });

  /* ---------------------------------------------------------------- theme */
  function wireTheme() {
    var btn = document.getElementById("theme");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var root = document.documentElement;
      var explicit = root.getAttribute("data-theme");
      var dark = explicit ? explicit === "dark"
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      root.setAttribute("data-theme", dark ? "light" : "dark");
    });
  }

  wireTheme();
  select(cur, startIdx >= 0);
})();
</script>
</body>
</html>
