[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdiff"
version = "0.10.0"
description = "Git diff for AI agents — behavioral comparison and failure attribution"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []
keywords = ["agents", "tracing", "evaluation", "observability", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Source = "https://github.com/sugeerth/agentdiff"
Documentation = "https://github.com/sugeerth/agentdiff/blob/main/docs/HOW_IT_WORKS.md"

[project.scripts]
agentdiff = "agentdiff.cli:main"

# Every subpackage ships: `agentdiff.commands` holds every command the CLI
# dispatches to and `agentdiff.harness` the only modules allowed a socket.
# A bare `packages = ["agentdiff"]` installed neither, so the installed
# console script died on `from .commands import (...)` before parsing a flag.
[tool.setuptools.packages.find]
include = ["agentdiff*", "deepcompare"]

[tool.setuptools.package-data]
agentdiff = ["page/*.html", "hub/static/*.js"]
